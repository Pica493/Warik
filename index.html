<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}

#cmdpanel{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:7px;display:none;padding:4px;gap:4px;pointer-events:auto;flex-wrap:wrap;max-height:170px}

#portrait-wrap{width:96px;flex-shrink:0;background:#0d1420;border:1px solid #3d4c68;border-radius:4px;overflow:hidden}

#portrait-info{padding:2px 4px;font-size:9px;max-height:150px;overflow-y:auto}

#unit-bar{position:absolute;bottom:180px;left:4px;display:none;gap:3px;pointer-events:auto;overflow-x:auto;overflow-y:hidden;padding:3px;background:rgba(10,16,28,.9);border:2px solid #557096;border-radius:5px;max-width:min(96vw,720px);height:58px;z-index:6}
#unit-bar.show{display:flex}

#unit-bar .ubtn.active{border-color:#ffe9a8;box-shadow:0 0 8px #e6c67a99 inset}
#unit-bar .ubtn img{width:100%;height:100%;display:block;object-fit:cover}
#unit-bar .ubtn .hp-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#000}
#unit-bar .ubtn .hp-fill{height:100%;background:#3aa03a}
#unit-bar .ubtn .count{position:absolute;top:1px;right:2px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
#actions{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px;align-content:start;overflow-y:auto;max-height:170px;min-width:0}
.act-btn{background:linear-gradient(180deg,#2a3a55,#16202f);border:2px solid #4d6180;border-radius:5px;color:#e8e8e8;font-size:9px;cursor:pointer;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-weight:700;min-height:76px;overflow:hidden;min-width:0;position:relative}
.act-btn:hover{background:linear-gradient(180deg,#3a5078,#1a2438);border-color:#e6c67a}
.act-btn.active{border-color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010);box-shadow:0 0 8px #e6c67a88 inset}
.act-btn:disabled{opacity:.55;cursor:not-allowed}
.act-btn.ability{border-color:#7a5fbf;background:linear-gradient(180deg,#3a2f60,#1a1430)}
.act-btn .ico{font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;min-height:32px;gap:2px;flex-shrink:0;position:relative;z-index:1}
.act-btn .ico img{width:28px;height:32px;display:block;image-rendering:auto}
.act-btn .lbl{font-size:7.5px;text-align:center;margin:1px 0;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.1;flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:0 1px;min-height:14px;width:100%;position:relative;z-index:1}
.act-btn .price{font-size:7.5px;color:#e6c67a;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;line-height:1;max-width:100%;flex-shrink:0;padding:1px 0 0;position:relative;z-index:1}
.act-btn .price>div{display:flex;align-items:center;gap:1px;background:rgba(0,0,0,.35);border-radius:3px;padding:0 2px}
.act-btn .price img{width:9px;height:9px;vertical-align:-2px;flex-shrink:0}
.section-sep{grid-column:1/-1;color:#e6c67a;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 6px 2px;border-top:1px solid #3d4c68;margin-top:4px;text-transform:uppercase}
#queue-panel{position:absolute;bottom:246px;left:6px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:6px;padding:6px;display:none;max-width:260px;pointer-events:auto;z-index:6}
#queue-panel.show{display:block}
#queue-panel .qtitle{color:#e6c67a;font-size:11px;font-weight:800;margin-bottom:4px}
.q-item{display:flex;gap:6px;align-items:center;margin-bottom:4px;background:#0d1420;padding:3px 5px;border-radius:4px}
.q-name{font-size:10px;color:#e8e8e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-name img{width:18px;height:18px;display:block;flex-shrink:0}
.q-bar-bg{height:5px;background:#000;border-radius:2px;margin-top:2px;overflow:hidden}
.q-bar-fill{height:100%;background:linear-gradient(90deg,#8a6a1a,#ffe9a8);border-radius:2px}
.q-time{font-size:9px;color:#9ab}
#controls{position:absolute;right:6px;top:190px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
#controls button{width:38px;height:38px;background:rgba(20,30,45,.95);border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;font-size:17px;font-weight:800;cursor:pointer}
#hud-menu{position:absolute;top:142px;right:6px;padding:6px 10px;background:#243250;border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;cursor:pointer;pointer-events:auto;font-size:16px;font-weight:800}
#notifications{position:absolute;bottom:320px;left:6px;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none;overflow:hidden}
.notif{background:rgba(10,16,28,.94);border-left:3px solid #e6c67a;padding:8px 12px;font-size:12px;border-radius:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:13px;color:#ffe9a8;display:none;max-width:min(90vw,600px);text-align:center;font-weight:700}
#hint.show{display:block}
#order-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(120,30,30,.95);border:2px solid #ff6060;border-radius:8px;padding:10px 18px;font-size:14px;color:#ffd0d0;display:none;font-weight:700;pointer-events:auto;text-align:center}
#order-bar.show{display:block}
#placement-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:14px;color:#ffe9a8;display:none;font-weight:700;gap:10px;align-items:center;pointer-events:auto}
#placement-bar.show{display:flex}
#world-tip{position:absolute;pointer-events:none;background:rgba(10,16,28,.96);border:2px solid #557096;border-radius:6px;padding:8px 12px;font-size:12px;color:#e8e8e8;display:none;max-width:280px;z-index:20;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#world-tip.show{display:block}
#world-tip .tt-name{color:#e6c67a;font-weight:800;font-size:13px;margin-bottom:4px}
#world-tip .tt-row{display:flex;justify-content:space-between;gap:12px}
#world-tip .tt-row span:last-child{color:#ffe9a8}
#world-tip .tt-desc{margin-top:6px;padding-top:6px;border-top:1px solid #3d4c68;color:#c8d5e8;font-size:11px;line-height:1.35}
#mobile-tip{position:fixed;pointer-events:none;background:rgba(10,16,28,0.98);border:2px solid #e6c67a;border-radius:8px;padding:10px 14px;font-size:12px;color:#e8e8e8;display:none;z-index:200;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,0.8);white-space:pre-line;line-height:1.4;font-weight:600}
#mobile-tip.show{display:block}
#wc3-tooltip{position:fixed;z-index:400;min-width:240px;max-width:340px;padding:10px 14px 12px;background:linear-gradient(180deg,rgba(24,32,48,0.985),rgba(8,12,20,0.985));border:2px solid #c8a040;border-radius:6px;box-shadow:0 0 0 1px #000 inset,0 0 0 2px #4a3a10 inset,0 10px 36px rgba(0,0,0,0.85),0 0 28px rgba(200,160,64,0.28);color:#e8e8e8;font-size:12px;line-height:1.45;pointer-events:none;display:none;font-family:system-ui,Arial,sans-serif;text-shadow:0 1px 1px #000}
#wc3-tooltip.show{display:block}
#wc3-tooltip .tt-title{color:#ffe9a8;font-size:14px;font-weight:800;margin:0 0 6px;padding-bottom:5px;border-bottom:1px solid rgba(200,160,64,0.35);letter-spacing:0.5px;text-shadow:0 0 8px rgba(255,233,168,0.4),0 1px 2px #000}
#wc3-tooltip .tt-stat{color:#c8d5e8;font-size:11.5px;margin:1px 0;display:flex;justify-content:space-between;gap:14px}
#wc3-tooltip .tt-stat .k{color:#9ab}
#wc3-tooltip .tt-stat .v{color:#ffe9a8;font-weight:700;text-align:right}
#wc3-tooltip .tt-desc{color:#a8b5c8;font-size:11px;font-style:italic;margin-top:7px;padding-top:7px;border-top:1px solid rgba(200,160,64,0.3);white-space:pre-line;line-height:1.4}
#wc3-tooltip .tt-key{display:inline-block;min-width:16px;padding:0 4px;margin-right:4px;background:#1a2a1a;border:1px solid #3a5a3a;border-radius:3px;color:#80ff80;font-weight:800;font-size:10px;text-align:center;line-height:14px}
@keyframes plusPulse{0%,100%{transform:scale(1);opacity:0.85}50%{transform:scale(1.15);opacity:1;box-shadow:0 0 8px #5aff5a,0 0 16px rgba(90,255,90,0.6)}}
.act-btn.ability.can-level::after{content:'+';position:absolute;top:1px;right:2px;width:17px;height:17px;border-radius:50%;background:linear-gradient(180deg,#5aff5a,#1a9a1a);color:#fff;font-weight:900;font-size:13px;line-height:17px;text-align:center;border:1px solid #0a5a0a;box-shadow:0 0 6px #5aff5a,0 0 12px rgba(90,255,90,0.5);animation:plusPulse 1s ease-in-out infinite;z-index:5;font-family:Arial,sans-serif}
.key-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;padding:5px 8px;background:#0d1420;border:1px solid #3d4c68;border-radius:5px;font-size:12px}
.key-row label{flex:1;color:#b8c5d6}
.key-btn{min-width:80px;padding:5px 10px;background:#1a2437;border:2px solid #557096;border-radius:4px;color:#e6c67a;font-weight:800;cursor:pointer;font-family:monospace;font-size:12px;text-align:center}
.key-btn:hover{border-color:#e6c67a}
.key-btn.listening{border-color:#ffe9a8;background:#3a2f18;color:#ffe9a8;animation:keyPulse 0.8s infinite}
@keyframes keyPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,233,168,0.5)}50%{box-shadow:0 0 8px 2px rgba(255,233,168,0.7)}}
#pausemenu{z-index:60}
#saves{z-index:70}
#settings{z-index:72}
#alert{z-index:75}
#gameover{z-index:80}
#pausemenu,#settings,#gameover,#alert,#saves{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);pointer-events:auto;padding:16px;overflow-y:auto;touch-action:pan-y}
#pausemenu.active,#settings.active,#gameover.active,#alert.active,#saves.active{display:flex}
.save-slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin:6px 0;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;font-size:13px;flex-wrap:wrap}
.save-slot .meta{flex:1;color:#9ab;font-size:12px;min-width:120px}
.save-slot .title{color:#e6c67a;font-weight:800;font-size:14px}
.save-slot .actions{display:flex;gap:4px}
#error-box{position:fixed;top:10px;left:10px;right:10px;background:#3a0000;border:2px solid #ff4040;color:#fff;padding:10px;font-size:12px;font-family:monospace;z-index:9999;display:none;max-height:200px;overflow:auto;white-space:pre-wrap}
.go-tab.active{background:linear-gradient(180deg,#5a4a2a,#2a2010);border-color:#e6c67a;color:#ffe9a8}
#go-stats table{width:100%;border-collapse:collapse}
#go-stats th,#go-stats td{padding:4px 5px;border-bottom:1px solid #2a3a52;text-align:left;white-space:nowrap;font-size:11px}
#go-stats th{color:#e6c67a;font-size:10px;text-transform:uppercase}
#go-stats tr:last-child td{border-bottom:none}
#go-stats>div>div>div{word-break:break-word}
.aura-badge img{display:block}
@media (max-width:600px){#keys-block{display:none!important}}
@media (max-width:600px){#minimap{width:80px;height:80px}#hud-menu{top:96px}#controls{top:134px}#topbar{font-size:11px;padding:5px 8px;gap:8px;max-width:calc(100vw - 160px)}#portrait-wrap{width:76px}#portrait-canvas{height:56px}.slot-row .num{width:24px;height:24px;line-height:24px;font-size:11px}.slot-row .team-sel{flex:0 0 58px}#actions{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}#unit-bar{bottom:190px;height:50px}#unit-bar .ubtn{width:42px;height:42px}}
</style>

  <body>
<div id="error-box"></div>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="ui">
<div id="menu" class="screen active">
  <h1>Эхо Трёх Корон</h1>
  <h2>ECHO OF THREE CROWNS · v52.2.0</h2>
  <button class="btn primary" id="m-play">Новая игра</button>
  <button class="btn" id="m-load">Загрузить</button>
  <button class="btn" id="m-settings">Настройки</button>
</div>
<div id="setup" class="screen"><div class="panel">
  <h3 id="setup-title">Настройка матча</h3>
  <div class="row"><label id="lbl-map">Карта</label></div>
  <div class="map-list" id="map-list"></div>
  <div class="row"><label id="lbl-diff">Сложность ботов</label><select id="diff-sel">
    <option value="easy">Лёгкая</option><option value="normal" selected>Обычная</option><option value="hard">Сложная</option>
  </select></div>
  <div class="row">
    <label id="lbl-players">Участники</label>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn small" id="slot-minus">−</button>
      <span id="slot-count" style="color:#e6c67a;font-weight:800;min-width:20px;text-align:center">2</span>
      <button class="btn small" id="slot-plus">+</button>
    </div>
  </div>
  <div id="slot-list"></div>
  <div class="row" style="justify-content:center;margin-top:12px">
    <button class="btn small" id="setup-back">Назад</button>
    <button class="btn small primary" id="setup-start">Начать</button>
  </div>
</div></div>
<div id="settings"><div class="panel">
  <h3 id="settings-title">Настройки</h3>
  <div class="row"><label>Язык</label><select id="q-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <div class="row"><label>Громкость</label><input type="range" id="q-vol" min="0" max="1" step="0.05" value="0.4"><span id="v-vol">40%</span></div>
  <div class="row"><label>Музыка</label><input type="range" id="q-mus" min="0" max="1" step="0.05" value="0.25"><span id="v-mus">25%</span></div>

  if(!b||b.dead||!b.completed||b.kind!=='tower') return false;

  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];
    if(u.team===b.team||u.dying) continue;
    if(Math.hypot(u.x-b.x,u.y-b.y)>900) continue;
    if(ec[u.role]!==undefined) ec[u.role]++;
    ec.total++;
  }
  if(race==='luminite') return ec.total>=5?'holy_cannon':'holy_arrows';
  if(race==='gromborn') return ec.total>=5?'fire_totem':'blood_totem';

(function applyRaceBalance(){
  for(var raceId in RACE_BALANCE){
    if(!RACES[raceId]) continue;
    var bal=RACE_BALANCE[raceId];
    var units=RACES[raceId].units;
    var roleStats=ROLE_STATS[raceId]||{};
    for(var role in units){
      var u=units[role];
      if(!u||!u.role) continue;
      var isCombat=(role!=='worker');
      if(isCombat){
        u.hp=Math.round(u.hp*bal.hpMul);
        u.dmg=Math.round(u.dmg*bal.dmgMul);
        u.spd=Math.round(u.spd*bal.spdMul);
        if(u.range>80) u.range=Math.round(u.range*bal.rangeMul);
        u.cd=u.cd*bal.atkSpdMul;
        u.gold=Math.round((u.gold||0)*bal.costGoldMul);
      }
      var rs=roleStats[role];
      u.armor = rs ? rs.armor : (bal.armor||1.0);
      u.raceRegen = rs ? rs.regen : (isCombat ? (bal.regenOutCombat||1.0) : 0.3);
    }
  }
})();

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){

  for(var ri0=this.resources.length-1;ri0>=0;ri0--){

    if(r0.falling) continue;
    if(Math.hypot(r0.x-x,r0.y-y) < th.radius+320){this.resources.splice(ri0,1);}
  }
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);
  var gx=x+Math.cos(toCenter)*360,gy=y+Math.sin(toCenter)*360;
  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);
  var attempts=0;
  while(attempts<12){
    var tooClose=false;
    for(var rr=0;rr<this.resources.length;rr++){
      var r0b=this.resources[rr];
      if(r0b.kind!=='gold') continue;
      if(Math.hypot(r0b.x-gx,r0b.y-gy)<450){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;
    gx=cl(gx+Math.cos(wa)*160,80,this.W-80);
    gy=cl(gy+Math.sin(wa)*160,80,this.H-80);
    attempts++;
  }
  var anyMineNear=false;
  for(var rr2=0;rr2<this.resources.length;rr2++){
    var r02=this.resources[rr2];
    if(r02.kind!=='gold') continue;
    if(Math.hypot(r02.x-gx,r02.y-gy)<280){anyMineNear=true;break;}
  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=580+((i%2)*80);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);
    this._tryPlaceTree(tx,ty);

  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j],r2=660;
    var tx2=x+Math.cos(a2)*r2,ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);
    this._tryPlaceTree(tx2,ty2);
  }
  for(var wi=0;wi<3;wi++){
    var aw=(wi/3)*TAU+0.5;
    var wx=x+Math.cos(aw)*200, wy=y+Math.sin(aw)*200;
    var tries=0;
    while(tries<14){
      var hit=false;
      for(var bi=0;bi<this.buildings.length;bi++){var bb=this.buildings[bi];if(Math.hypot(bb.x-wx,bb.y-wy)<bb.radius+56){hit=true;break;}}
      if(!hit) for(var ri2=0;ri2<this.resources.length;ri2++){var rr3=this.resources[ri2];if(Math.hypot(rr3.x-wx,rr3.y-wy)<rr3.radius+56){hit=true;break;}}
      if(!hit) break;
      aw+=0.55;tries++;wx=x+Math.cos(aw)*220;wy=y+Math.sin(aw)*220;
    }
    var u=new Unit(wx,wy,team,race.units.worker,race.id);
    u.owner=owner;u.pid=pid;u.spawnT=0;this.units.push(u);
  }
};

Game.prototype.findPath=function(sx,sy,tx,ty){

      for(var ddx2=-r2;ddx2<=r2&&!f2;ddx2++) for(var ddy2=-r2;ddy2<=r2&&!f2;ddy2++){
        var ncx2=startCx+ddx2,ncy2=startCy+ddy2;
        if(ncx2<0||ncy2<0||ncx2>=cols||ncy2>=rows) continue;

// ПАТЧ I-10: оптимизация hasClearPath — больший шаг и проверка углов через шаг на дальних дистанциях
Game.prototype._hasClearPath=function(x1,y1,x2,y2,radius){
  radius=radius||14;
  var dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);
  if(d<1) return true;
  var stepLen=(d>400)?30:20;
  var steps=Math.ceil(d/stepLen);
  if(steps<1) steps=1;
  var sx=dx/steps,sy=dy/steps;
  var ux=dx/d,uy=dy/d;
  var perpX=-uy*radius,perpY=ux*radius;
  var cx=x1,cy=y1;
  var checkCornersEvery=(d>400)?2:1;
  for(var i=0;i<steps;i++){
    cx+=sx;cy+=sy;
    if(this._wouldHitBuilding(cx,cy,radius,null,false,-1)) return false;
    if(this._wouldHitResource(cx,cy,radius,null)) return false;
    if((i%checkCornersEvery)===0){
      if(this._wouldHitBuilding(cx+perpX,cy+perpY,radius,null,false,-1)) return false;
      if(this._wouldHitBuilding(cx-perpX,cy-perpY,radius,null,false,-1)) return false;
      if(this._wouldHitResource(cx+perpX,cy+perpY,radius,null)) return false;
      if(this._wouldHitResource(cx-perpX,cy-perpY,radius,null)) return false;
    }
  }
  return true;
};
Game.prototype._straightenPath=function(path,radius){
  if(!path||path.length<=2) return path;
  radius=radius||16;
  var out=[path[0]];
  var i=0;
  var guard=0;
  while(i<path.length-1 && guard<200){
    guard++;
    var best=i+1;
    for(var j=path.length-1;j>i;j--){
      if(this._hasClearPath(path[i].x,path[i].y,path[j].x,path[j].y,radius)){
        best=j;break;
      }
    }
    out.push(path[best]);
    i=best;
    if(i>=path.length-1) break;
  }
  return out;
};

        r.fallAngle=(Math.PI/2)*fDir;
        if(Math.random()<0.3){
          this.particles.spawn(r.x+(Math.random()-0.5)*80,r.y-15-Math.random()*20,(Math.random()-0.5)*15,-5-Math.random()*15,1.5,'#6a4a2a',1.5);
        }
        r._fallAlpha=Math.max(0,1-(ft-1.9)/1.0);
      } else {
        r.fallAngle=(Math.PI/2)*fDir;
        r.dead=true;this.navDirty=true;
      }
    }
  }
  for(i=0;i<this.projectiles.length;i++){var p=this.projectiles[i];if(p.dead) continue;
    p._prevX=p.x;p._prevY=p.y;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;p.age+=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  // ПАТЧ 6: проверка победы раз в 0.5с
  this._victoryCheckTimer=(this._victoryCheckTimer||0)-dt;
  if(this._victoryCheckTimer<=0){
    this._victoryCheckTimer=0.5;
    this.checkVictory();
  }
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.14;
    var baseCnt=wx==='snow'?2:wx==='sand'?2:1;
    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200,h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};
Game.prototype.ejectFromBuildings=function(u){
  if(u._insideMine||u._isSummon||u._waitingForMine) return;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.dead||b.dying) continue;
    var dx=u.x-b.x,dy=u.y-b.y;
    var minD=u.radius+b.radius*1.02;
    var d2=dx*dx+dy*dy;
    if(d2<minD*minD){
      var d=Math.sqrt(d2);
      if(d<0.01){dx=1;dy=0;d=1;}
      u.x=this.clampX(b.x+dx/d*(minD+2));
      u.y=this.clampY(b.y+dy/d*(minD+2));
      u._path=null;u._pathIdx=0;
    }
  }
};
Game.prototype._smartMove=function(u,dx,dy,spd){
  var d=Math.hypot(dx,dy);if(d<0.01) return false;
  var _mw=(u.role==='worker'&&u.gatherTarget);
  var _wpid=u.pid;
  var _bh=function(x,y,ig){return this._wouldHitBuilding(x,y,u.radius,ig,_mw,_wpid);}.bind(this);
  var nx=u.x+dx/d*spd,ny=u.y+dy/d*spd;
  var blockedB=_bh(nx,ny,null);
  var blockedR=this._wouldHitResource(nx,ny,u.radius,u.gatherTarget);
  if(!blockedB&&!blockedR){
    u.x=this.clampX(nx);u.y=this.clampY(ny);return true;
  }
  var slideTarget=blockedB||blockedR;
  if(slideTarget){
    var bb=slideTarget;
    var bdx=u.x-bb.x,bdy=u.y-bb.y,bd=Math.hypot(bdx,bdy);
    var minD=(bb.radius||24)+u.radius+8;
    if(bd<minD+6){
      var tan=Math.atan2(bdy,bdx)+Math.PI/2;
      var s1=(u.id%2)?1:-1;
      var tx=u.x+Math.cos(tan)*s1*spd, ty=u.y+Math.sin(tan)*s1*spd;
      if(!_bh(tx,ty,null)&&!this._wouldHitResource(tx,ty,u.radius,u.gatherTarget)){
        u.x=this.clampX(tx);u.y=this.clampY(ty);return true;
      }
      var tx2=u.x+Math.cos(tan)*-s1*spd, ty2=u.y+Math.sin(tan)*-s1*spd;
      if(!_bh(tx2,ty2,null)&&!this._wouldHitResource(tx2,ty2,u.radius,u.gatherTarget)){
        u.x=this.clampX(tx2);u.y=this.clampY(ty2);return true;
      }
    }
  }
  var nx1=u.x+dx/d*spd,ny1=u.y;
  if(!_bh(nx1,ny1,null)&&!this._wouldHitResource(nx1,ny1,u.radius,u.gatherTarget)){u.x=this.clampX(nx1);return true;}
  var nx2=u.x,ny2=u.y+dy/d*spd;
  if(!_bh(nx2,ny2,null)&&!this._wouldHitResource(nx2,ny2,u.radius,u.gatherTarget)){u.y=this.clampY(ny2);return true;}
  var perp=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
  var sx=u.x+Math.cos(perp)*side*spd,sy=u.y+Math.sin(perp)*side*spd;
  if(!_bh(sx,sy,null)&&!this._wouldHitResource(sx,sy,u.radius,u.gatherTarget)){u.x=this.clampX(sx);u.y=this.clampY(sy);return true;}
  var baseAng=Math.atan2(dy,dx);
  for(var step=0.18;step<Math.PI;step+=0.18){
    var a1=baseAng+step;
    var sx1=u.x+Math.cos(a1)*spd,sy1=u.y+Math.sin(a1)*spd;
    if(!_bh(sx1,sy1,null)&&!this._wouldHitResource(sx1,sy1,u.radius,u.gatherTarget)){u.x=this.clampX(sx1);u.y=this.clampY(sy1);return true;}
    var a2=baseAng-step;
    var sx2=u.x+Math.cos(a2)*spd,sy2=u.y+Math.sin(a2)*spd;
    if(!_bh(sx2,sy2,null)&&!this._wouldHitResource(sx2,sy2,u.radius,u.gatherTarget)){u.x=this.clampX(sx2);u.y=this.clampY(sy2);return true;}
  }
  return false;
};

      Game.prototype.updateUnit=function(u,dt){
  u._prevX=u.x;u._prevY=u.y;
  if(u._isTotem){
    if(u._summonT<=0){u.hp=0;}
    u._healTimer=(u._healTimer||0)-dt;
    if(u._healTimer<=0){
      u._healTimer=1;
      for(var _thi=0;_thi<this.units.length;_thi++){
        var _thu=this.units[_thi];
        if(_thu.team!==u.team||_thu.dying||_thu===u) continue;
        if(Math.hypot(_thu.x-u.x,_thu.y-u.y)>u._healRadius) continue;
        if(_thu.hp<_thu.maxHp){
          _thu.hp=Math.min(_thu.maxHp,_thu.hp+u._healAmt);
          this.floaters.push(new Floater(_thu.x,_thu.y-25,'+'+u._healAmt,'#a0ff80'));
        }
      }
      for(var _tpi=0;_tpi<10;_tpi++){
        var _tpa=Math.random()*TAU,_tpr=40+Math.random()*200;
        this.particles.spawn(u.x+Math.cos(_tpa)*_tpr,u.y+Math.sin(_tpa)*_tpr,-Math.cos(_tpa)*30,-Math.sin(_tpa)*30-20,1.0,'#80ff60',2.5);
      }
    }
    u.moving=false;
    if(u.hp<=0){u.dying=true;u.deathT=0;u.deathDir=1;}
    if(u.dying){u.deathT+=dt;if(u.deathT>1.6)u.dead=true;}
    return;
  }
  if(u._insideMine && (!u.gatherTarget || u.gatherTarget.dead || u.gatherTarget.amount<=0 || u.gatherTarget.falling)){
    u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
    if(u.role==='worker'){
      u.gatherTarget=null;
      if(u._assignedMine && (u._assignedMine.dead || u._assignedMine.amount<=0)) u._assignedMine=null;
    }
  }
  if(!u.dying) this.ejectFromBuildings(u);
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdA3>0) u.cdA3-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2; else u.castT=0;
  if(u.chopT>0) u.chopT-=dt*1.5; else u.chopT=0;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){u.holyStrikeT-=dt;if(u.holyStrikeT<=0&&u.holyStrikeBuff){u.holyStrikeBuff=false;}}
  if(u.slowT>0){u.slowT-=dt;if(u.slowT<=0){u.slowMul=1;u.slowStacks=0;}}
  if(u.markedT>0){u.markedT-=dt;if(u.markedT<=0){u.markedBonus=1;}}
  if(u.bleedT>0){u.bleedT-=dt;u.hp-=(u.bleedDmg||0)*dt;if(u.bleedT<=0){u.bleedDmg=0;u._poisonStacks=0;}}
  if(u._retreating && u.hp/u.maxHp >= 0.7) u._retreating = false;
  if(u.retreating && u.hp/u.maxHp >= 0.7) u.retreating = false;
  if(!u.dying && u.hp<u.maxHp && u.stunT<=0){
    if(!u.target || u.target.dead){
      var regen=u.raceRegen||0;
      if(regen>0) u.hp=Math.min(u.maxHp,u.hp+regen*dt);
    }
    if(u.isHero && u.regenPassive>0){

    u.mana=Math.min(u.maxMana,u.mana+manaRate*dt);
  }
  if(u.role==='siege'&&u.moving) u.wheelRot+=dt*(6+(u.walkPhase%1));
  if(u.moving && !u.dying && !u._insideMine){
    u._stuckCheckTimer=(u._stuckCheckTimer||0)+dt;
    if(u._stuckCheckTimer>=1.2){
      var mdx=u.x-(u._lastStuckX||u.x),mdy=u.y-(u._lastStuckY||u.y);
      if(mdx*mdx+mdy*mdy<9){

        var escAng=Math.random()*TAU;

      }

    }
  }
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;if(!u._isSummon)this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;

    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(this.stats[u.pid]) this.stats[u.pid].unitsLost++;

        // ПАТЧ J-8: XP за убийство героя

          if(la2.isHero) this.grantXP(la2,150);
          else{
            for(var _xpi=0;_xpi<this.units.length;_xpi++){

  }
  u.animT+=dt;
  if(u.hitFlash>0) u.hitFlash-=dt;
  if(u.atkCd>0) u.atkCd-=dt;
  if(u.attackT>0){u.attackT-=dt*3;if(u.attackT<0)u.attackT=0;}

  // ПАТЧ I-5: раненые в отступлении огрызаются, если враг в упор
  if(u._retreating && u.hp/u.maxHp>0.15 && !u.target){

  }
  /* PATCH E: leash */
  if(u._autoAcquired && u._autoOrigin && u.target && !u.target.dead){
    var _dLeashE=Math.hypot(u.x-u._autoOrigin.x, u.y-u._autoOrigin.y);

  }
  if(!u.target && u._autoAcquired){
    u._autoAcquired=false;
    if(u._savedAttackMoveTo){
      u.attackMoveTo=u._savedAttackMoveTo;u._savedAttackMoveTo=null;u._savedMoveTo=null;u._savedPatrolRoute=null;
      u._path=null;u._pathIdx=0;
    } else if(u._savedPatrolRoute){
      u.patrolRoute=u._savedPatrolRoute;u.patrolIdx=u._savedPatrolRoute.idx||0;u._savedPatrolRoute=null;u._savedMoveTo=null;

  if(u.stance!=='hold'&&!u.target && !u.attackMoveTo && !u.patrolRoute && !u._retreating){
    if(u.lastAttacker && !u.lastAttacker.dead && !u.lastAttacker.dying){
      var _laDist=Math.hypot(u.lastAttacker.x-u.x,u.lastAttacker.y-u.y);
      if(!u.stationed || _laDist < u.range+(u.lastAttacker.radius||20)+30){

  }
  if(!u.target && !u.moveTo && !u.attackMoveTo && !u.patrolRoute && u.stance!=='hold' && u.role!=='worker' && !u._retreating && !u.stationed){
    var nearBase=this.findEnemyBaseNear(u,900);

  if(u.stance!=='hold'&&!u.target&&!u._retreating){

    var isIdleCombat=u.role!=='worker'&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder&&!u.stationed;
    if(isIdleCombat){
      if(u.role==='heal'){
        if((u.mana||0)>=HEALER_SPELL_COST){
          var low=null,ratio=0.92;

            if(hu.team!==u.team||hu.dying) continue;

    } else if(isIdleWorker){

      if(!ew) ew=this.findNearestCreep(u,u.vision||220);
      if(ew){ this._markAutoAcquire(u); u.target=ew; }

  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){

  if(!u.target && !u.moveTo && !u.attackMoveTo && !u.patrolRoute && !u.gatherTarget && !u.buildTarget && !u.repairTarget && !u.demolishTarget && !u.carrying){
    if(u.attackT>0) u.attackT=Math.max(0,u.attackT-dt*6);

  u.moving=false;

Game.prototype.applyProj=function(p){
  var self=this;
  function _findHit(px,py,team){
    var best=null,bd=40*40;
    for(var i=0;i<self.units.length;i++){var u=self.units[i];if(u.dead||u.dying||u.team===team) continue;var d2=(u.x-px)*(u.x-px)+(u.y-py)*(u.y-py);if(d2<bd){bd=d2;best=u;}}
    if(!best) for(var ci=0;ci<self.creeps.length;ci++){var c=self.creeps[ci];if(c.dead) continue;var d2c=(c.x-px)*(c.x-px)+(c.y-py)*(c.y-py);if(d2c<bd){bd=d2c;best=c;}}
    if(!best) for(var bi=0;bi<self.buildings.length;bi++){var b=self.buildings[bi];if(b.dead||b.team===team) continue;var d2b=(b.x-px)*(b.x-px)+(b.y-py)*(b.y-py),r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
    return best;
  }
  var best=_findHit(p.x,p.y,p.team);
  if(!best) return;
  if(best.invulT>0) return;
  var shooter=null,bestShooterD=Infinity;
  if(typeof p.pid!=='undefined'){
    for(var si2=0;si2<this.units.length;si2++){
      var su2=this.units[si2];
      if(su2.pid!==p.pid||su2.dying) continue;
      var ds=(su2.x-p.startX)*(su2.x-p.startX)+(su2.y-p.startY)*(su2.y-p.startY);
      if(ds<bestShooterD){bestShooterD=ds;shooter=su2;}
    }
    if(!shooter){
      for(var bi3=0;bi3<this.buildings.length;bi3++){
        var bb3=this.buildings[bi3];
        if(bb3.pid!==p.pid||bb3.dead) continue;
        if(Math.hypot(bb3.x-p.startX,bb3.y-p.startY)<300){shooter=bb3;break;}
      }
    }
  }
  var _applyDmg=function(target,dmg){
    if(!target||target.dead) return;
    if(target.invulT>0) return;
    var d=dmg;
    if(target.isBuilding&&!target.completed) d*=3;
    var ignoreArmor=p.effects&&p.effects.ignoreArmor;
    if(!ignoreArmor && target.isUnit&&target.armor) d/=target.armor;
    if(target.markedT>0&&target.markedBonus>1) d*=target.markedBonus;
    if(target.isUnit&&this.auraCache.blessing[target.id]) d*=0.9;
    d=Math.round(d);
    target.hp-=d;target.hitFlash=0.2;
    if(shooter) target.lastAttacker=shooter;
    if(target.hp<=0 && !target._isSummon){
      if(shooter&&shooter.isHero){
        if(target.isCreep) this.grantXP(shooter,target.xpReward||20);
        else if(target.isUnit) this.grantXP(shooter,20);
      } else if(shooter&&shooter.isBuilding&&shooter.pid===p.pid){
        var xpGain=target.isCreep?(target.xpReward||20):(target.isUnit?20:0);
        if(xpGain>0){
          for(var _hi=0;_hi<this.units.length;_hi++){
            var _h=this.units[_hi];
            if(!_h.isHero||_h.pid!==shooter.pid||_h.dying) continue;
            if(Math.hypot(_h.x-target.x,_h.y-target.y)<450){this.grantXP(_h,xpGain);break;}
          }
        }
      }
    }
  }.bind(this);
  var eff=p.effects||{};
  if(eff.splash){
    var rad=eff.splash.radius,edge=eff.splash.edge||0.4;
    _applyDmg(best,p.dmg);
    for(var i=0;i<this.units.length;i++){
      var u=this.units[i];
      if(u===best||u.team===p.team||u.dying) continue;
      var d=Math.hypot(u.x-best.x,u.y-best.y);
      if(d<rad){var mul=1-(1-edge)*(d/rad);_applyDmg(u,p.dmg*mul);}
    }
    for(var ci2=0;ci2<this.creeps.length;ci2++){
      var c2=this.creeps[ci2];
      if(c2===best||c2.dying) continue;
      var d2=Math.hypot(c2.x-best.x,c2.y-best.y);
      if(d2<rad){var mul2=1-(1-edge)*(d2/rad);c2.hp-=p.dmg*mul2;c2.hitFlash=0.2;if(shooter)c2.lastAttacker=shooter;}
    }
    for(var bi4=0;bi4<this.buildings.length;bi4++){
      var b4=this.buildings[bi4];
      if(b4===best||b4.team===p.team||b4.dead) continue;
      var d4=Math.hypot(b4.x-best.x,b4.y-best.y);
      if(d4<rad+b4.radius){var mul4=1-(1-edge)*(d4/rad);if(mul4<0)mul4=0;var dm4=p.dmg*mul4;if(!b4.completed)dm4*=3;b4.hp-=dm4;b4.hitFlash=0.2;if(shooter)b4.lastAttacker=shooter;}
    }
    for(var spl=0;spl<16;spl++){var sa=Math.random()*TAU,ss=80+Math.random()*120;this.particles.spawn(best.x,best.y-15,Math.cos(sa)*ss,Math.sin(sa)*ss-40,0.7,'#ffe080',3.5);}
    Audio.sfx('building_hit',best.x,best.y);
  } else {
    _applyDmg(best,p.dmg);
  }
  if(eff.burn&&best&&!best.dead){
    best.bleedT=Math.max(best.bleedT||0,eff.burn.dur);
    best.bleedDmg=Math.max(best.bleedDmg||0,eff.burn.dmg);
  }
  if(eff.poison&&best&&!best.dead&&best.isUnit){
    var ps=best._poisonStacks||0;
    var maxS=eff.poison.maxStacks||1;
    if(ps<maxS) ps++;
    best._poisonStacks=ps;
    best.bleedT=Math.max(best.bleedT||0,eff.poison.dur);
    best.bleedDmg=Math.max(best.bleedDmg||0,ps*eff.poison.dmg);
  }
  if(eff.healAlly){
    var weakest=null,wr=2;
    for(var hi=0;hi<this.units.length;hi++){
      var hu=this.units[hi];
      if(hu.team!==p.team||hu.dying) continue;
      if(Math.hypot(hu.x-p.startX,hu.y-p.startY)>eff.healAlly.radius) continue;
      var r=hu.hp/hu.maxHp;
      if(r<wr&&r<0.99){wr=r;weakest=hu;}
    }
    if(weakest){
      weakest.hp=Math.min(weakest.maxHp,weakest.hp+eff.healAlly.amt);
      this.floaters.push(new Floater(weakest.x,weakest.y-25,'+'+eff.healAlly.amt,'#ff6060'));
      for(var hk=0;hk<6;hk++){var ha=Math.random()*TAU,hs=30+Math.random()*40;
        this.particles.spawn(weakest.x,weakest.y-15,Math.cos(ha)*hs,Math.sin(ha)*hs-20,0.6,'#ff4040',2.5);}
    }
  }
  if(p.race==='luminite'){
    for(var lp=0;lp<8;lp++){var la=Math.random()*TAU,ls=40+Math.random()*80;this.particles.spawn(p.x,p.y,Math.cos(la)*ls,Math.sin(la)*ls,0.5,'#ffe9a8',3);}
  } else if(p.race==='gromborn'){
    for(var gp=0;gp<10;gp++){var ga=Math.random()*TAU,gs=50+Math.random()*100;this.particles.spawn(p.x,p.y,Math.cos(ga)*gs,Math.sin(ga)*gs,0.6,'#ff8040',3);}
  } else {
    for(var sp=0;sp<9;sp++){var sa2=Math.random()*TAU,ss2=40+Math.random()*70;this.particles.spawn(p.x,p.y,Math.cos(sa2)*ss2,Math.sin(sa2)*ss2,0.7,'#5ac040',3);}
  }
  if(p.race==='sylvanid'&&p.kind==='stone'&&best.isUnit){
    best.slowT=3;best.slowMul=0.98;
  }
  if(best.isUnit&&(best.role==='melee'||best.role==='spear'||best.role==='elite'||best.role==='cav')){
    Audio.sfx('arrow_hit_shield',p.x,p.y);
  }
};
Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){
    u.gatherTarget=null;u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
    if(u.carrying) this.returnRes(u,dt);
    return;
  }
  if(u._waitingForMine){
    var usedW={};
    for(var mw=0;mw<this.units.length;mw++){
      var muw=this.units[mw];
      if(muw===u||muw.dead||muw.dying) continue;
      if(muw.gatherTarget!==g) continue;
      if(muw._mineSlot>=0&&muw._mineSlot<MAX_GATHER_PER_MINE) usedW[muw._mineSlot]=true;
    }
    var freeW=-1;
    for(var sw=0;sw<MAX_GATHER_PER_MINE;sw++){if(!usedW[sw]){freeW=sw;break;}}
    if(freeW>=0){u._waitingForMine=false;u._mineSlot=freeW;u.gatherProgress=0;}
    else return;
  }
  if(u.carrying&&u.carryAmt>=10){u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;this.returnRes(u,dt);return;}
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
    u._path=null;u._pathIdx=0;
    var step=Math.min(u.spd*(u.slowMul||1)*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){
      var ang2=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
      if(!this._smartMove(u,Math.cos(ang2)*side,Math.sin(ang2)*side,step)){
        u._stuckTimer=(u._stuckTimer||0)+dt;
        // ПАТЧ J-17: застрял >2с — переназначить на другой ресурс того же типа
        if(u._stuckTimer>2){
          u._stuckTimer=0;
          var _alt=g.kind==='gold'?this.findVisibleResourceForWorker(u,'gold',1200):this.findVisibleResourceForWorker(u,'tree',1200);
          if(_alt && _alt!==g){
            u.gatherTarget=_alt;
            if(_alt.kind==='gold') u._assignedMine=_alt;
            u._path=null;u._pathIdx=0;
          } else {
            u.gatherTarget=null;
          }
          return;
        }
      } else u._stuckTimer=0;
    } else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
  } else {
    u.moving=false;
    if(g.kind==='gold'){
      u._insideMine=true;u._waitingForMine=false;
      if(u._mineSlot<0 || u._mineSlot>=MAX_GATHER_PER_MINE){
        var used={};
        for(var mi=0;mi<this.units.length;mi++){
          var mu=this.units[mi];
          if(mu===u||mu.dead||mu.dying) continue;
          if(mu.gatherTarget!==g) continue;
          if(mu._mineSlot>=0 && mu._mineSlot<MAX_GATHER_PER_MINE) used[mu._mineSlot]=true;
        }
        var freeSlot=-1;
        for(var s=0;s<MAX_GATHER_PER_MINE;s++){ if(!used[s]){freeSlot=s;break;} }
        if(freeSlot<0){
          u._mineSlot=-1;
          u._insideMine=false;u._waitingForMine=true;u._stuckTimer=0;u._stuckCheckTimer=0;u.moving=false;
          var waitAng=(u.id*0.71)%TAU;
          u.x=g.x+Math.cos(waitAng)*78;
          u.y=g.y+Math.sin(waitAng)*78;
          u.gatherProgress=0;u.chopT=0;
          return;
        }
        u._mineSlot=freeSlot;
      }
      var usedNow={};
      for(var mi2=0;mi2<this.units.length;mi2++){
        var mu2=this.units[mi2];
        if(mu2===u||mu2.dead||mu2.dying) continue;
        if(mu2.gatherTarget!==g||!mu2._insideMine) continue;
        if(mu2._mineSlot>=0&&mu2._mineSlot<MAX_GATHER_PER_MINE) usedNow[mu2._mineSlot]=true;
      }
      var _slotFree=-1;
      if(!usedNow[u._mineSlot]&&u._mineSlot>=0&&u._mineSlot<MAX_GATHER_PER_MINE){
        _slotFree=u._mineSlot;
      } else {
        for(var s3=0;s3<MAX_GATHER_PER_MINE;s3++){if(!usedNow[s3]){_slotFree=s3;break;}}
      }
      if(_slotFree<0){
        u._mineSlot=-1;
        u._insideMine=false;u._waitingForMine=true;u._stuckTimer=0;u._stuckCheckTimer=0;u.moving=false;
        var waitAng3=(u.id*0.71)%TAU;
        u.x=g.x+Math.cos(waitAng3)*78;
        u.y=g.y+Math.sin(waitAng3)*78;
        u.gatherProgress=0;u.chopT=0;
        return;
      }
      u._mineSlot=_slotFree;
      var positions=[[-50,-6],[-25,-20],[0,-26],[25,-20],[50,-6]];
      var pos=positions[u._mineSlot]||positions[0];
      u.x=g.x+pos[0];
      u.y=g.y+pos[1];
      u.dir=DIR.UP;
    } else {
      u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
      if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    }
    u.gatherProgress+=dt;u._stuckTimer=0;
    var cycle=(g.kind==='gold')?2.5:5.0;
    u.chopT=Math.sin(Math.PI*(u.gatherProgress/cycle));
    if(u.gatherProgress>=cycle){
      u.gatherProgress=0;
      var baseAmt=10;
      if(g.kind==='tree'){
        for(var li2=0;li2<this.buildings.length;li2++){
          var lb2=this.buildings[li2];
          if(lb2.dead||!lb2.completed||lb2.kind!=='lumber'||lb2.pid!==u.pid) continue;
          baseAmt = 12 + (Math.random()<0.5?0:1);
          break;
        }
      }
      var amt=Math.min(baseAmt,g.amount);g.amount-=amt;
      if(g.amount<=0){
        if(g.kind==='tree'&&!g.falling){g.falling=true;g.fallT=0;g.fallDir=(u.x>=g.x)?-1:1;this.navDirty=true;Audio.sfx('treefall',g.x,g.y);}
        else if(g.kind==='gold'){g.dead=true;this.navDirty=true;}
      }
      u.carrying=g.kind;u.carryAmt=amt;
      Audio.sfx(g.kind==='gold'?'gold':'wood',u.x,u.y);
      if(g.kind==='gold'){u.x=g.x;u.y=g.y+10;}
      u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
      this.returnRes(u,dt);
      return;
    }
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.7;if(g.kind==='tree') Audio.sfx('chop',u.x,u.y);else if(g.kind==='gold') Audio.sfx('mine',u.x,u.y);if(g.kind!=='gold'){var ipx=g.x+(u.x-g.x)*0.4,ipy=g.y-20;this.spawnParticles(ipx,ipy,'#a08050',3);}}
  }
};
Game.prototype.returnRes=function(u,dt){
  u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
  var th=null,bd=Infinity;
  var caryKind=u.carrying;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.pid!==u.pid||b.dead) continue;
    var canDrop=(b.kind==='townhall')||(caryKind==='tree'&&b.kind==='lumber'&&b.completed);
    if(!canDrop) continue;
    var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);
    if(d<bd){bd=d;th=b;}
  }
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    u._path=null;u._pathIdx=0;
    var step=Math.min(u.spd*(u.slowMul||1)*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){u._stuckTimer=(u._stuckTimer||0)+dt;if(u._stuckTimer>4){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}} else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;
  } else {
    var cary=u.carrying;
    if(cary==='gold'){
      this.addRes(u.pid,u.carryAmt,0);
      if(this.stats[u.pid]) this.stats[u.pid].goldMined+=u.carryAmt;
      if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));
    } else if(cary==='tree'){
      this.addRes(u.pid,0,u.carryAmt);
      if(this.stats[u.pid]) this.stats[u.pid].woodMined+=u.carryAmt;
      if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));
    }
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    if(cary==='gold'){
      var am=u._assignedMine;
      if(am&&!am.dead&&am.amount>0&&!am.falling) u.gatherTarget=am;
      else u.gatherTarget=null;
    } else {
      var nr=this.findNearestResource(u.x,u.y,'tree',u.pid);
      u.gatherTarget=nr||null;
    }
  }
};
Game.prototype.doBuild=function(u,dt){

Game.prototype.doDemolish=function(u,dt){

AIController.prototype.tryTrain=function(){
  var g=this.g,res=g.getRes(this.pid),reserved=g.getReservedPop(this.pid);
  // Q11.22: лимит 290
  var _nonSummon=0;
  for(var _nsi=0;_nsi<g.units.length;_nsi++) if(!g.units[_nsi]._isSummon) _nonSummon++;
  if(_nonSummon>=290) return;
  var buildings=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.pid!==this.pid||!b.completed||b.dead) continue;if(b.upgrading) continue;if(b.techUpgrading) continue;buildings.push(b);}
  if((res.food+reserved)>=res.maxFood) return;
  // Герои
  var _aliveByType={};
  for(var hi=0;hi<g.units.length;hi++){
    var hu=g.units[hi];
    if(hu.isHero&&hu.pid===this.pid&&!hu.dying&&hu.heroType) _aliveByType[hu.heroType]=true;
  }
  var _heroesToTry=getHeroTypes(this.raceId);
  for(var _hti=0;_hti<_heroesToTry.length;_hti++){
    var _ht=_heroesToTry[_hti];
    var _hv=getHeroVariant(this.raceId,_ht);
    if(!_hv) continue;
    if(_aliveByType[_ht]) continue;
    var _deadKey=this.pid+'_'+_ht;
    var _deadH=g.deadHeroes?g.deadHeroes[_deadKey]:null;
    for(var _bi=0;_bi<buildings.length;_bi++){
      var _altar=buildings[_bi];
      if(_altar.kind!=='altar'||_altar.dead||!_altar.completed) continue;
      if(_altar.queue.length>0) continue;
      if(_altar.reviveQueue&&_altar.reviveQueue.length>0) continue;
      if(res.gold<_hv.gold||res.wood<_hv.wood) continue;
      g.subRes(this.pid,_hv.gold,_hv.wood);
      if(_deadH){
        var _time=25+2*(_deadH.level||1);
        _altar.reviveQueue.push({role:'hero',heroType:_ht,race:_deadH.race,timeLeft:_time,timeTotal:_time,reviveData:_deadH});
      } else {
        _altar.queue.push({role:'hero',heroType:_ht,race:this.raceId,timeLeft:_hv.time,timeTotal:_hv.time});
      }
      return;
    }
  }
  var thLvl=g.getTHLevel(this.pid);
  var workerCount=0;
  for(var wci=0;wci<g.units.length;wci++){var wcu=g.units[wci];if(wcu.pid===this.pid&&wcu.role==='worker'&&!wcu.dying) workerCount++;}
  // Production ratio
  var curCount={melee:0,ranged:0,spear:0,cav:0,elite:0,heal:0,fly:0,siege:0};
  var totalCombat=0;
  for(var pi=0;pi<g.units.length;pi++){
    var pu=g.units[pi];
    if(pu.pid!==this.pid||pu.dying||pu.role==='worker'||pu._isTotem) continue;
    if(pu.isHero) continue;
    if(curCount[pu.role]!==undefined){curCount[pu.role]++;totalCombat++;}
  }
  var desired={melee:0.30,ranged:0.22,spear:0.15,cav:0.10,elite:0.05,heal:0.08,fly:0.05,siege:0.05};
  var ec=this.getEnemyComposition();
  if(ec.cav>2){ desired.spear+=0.10; desired.cav-=0.05; }
  if(ec.fly>=3){ desired.ranged+=0.20; desired.melee-=0.05; }
  if(ec.fly>=6){ desired.ranged+=0.25; desired.melee-=0.05; desired.spear-=0.05; }
  if(ec.melee>3){ desired.ranged+=0.05; desired.elite+=0.05; desired.melee-=0.05; }
  if(ec.ranged>2){ desired.cav+=0.08; desired.melee-=0.04; }
  if(ec.elite>1){ desired.siege+=0.05; desired.spear+=0.03; }
  if(ec.siege>0){ desired.cav+=0.05; }
  if(thLvl<2){ desired.cav=0; desired.siege=0; }
  if(thLvl<3){ desired.elite=0; desired.heal=0; desired.fly=0; }
  var roles=[];
  if(workerCount<14) roles.push('worker','worker');
  else if(workerCount<18) roles.push('worker');
  var combatTotal=totalCombat;
  var bestRole=null,bestDeficit=0;
  for(var rr in desired){
    if(desired[rr]<=0) continue;
    var want=(combatTotal>=5)?desired[rr]*combatTotal:1;
    var deficit=want-curCount[rr];
    if(deficit>bestDeficit){bestDeficit=deficit;bestRole=rr;}
  }
  if(bestRole) roles.push(bestRole);
  if(!bestRole) roles.push('melee');
  if(ec.cav>3) roles.push('spear');
  for(var ri=0;ri<roles.length;ri++){
    var role=roles[ri],cfg=UNIT_UNLOCK[role];if(!cfg||cfg.th>thLvl) continue;
    var blds=[];
    for(var bj=0;bj<buildings.length;bj++){if(buildings[bj].kind===cfg.b&&buildings[bj].queue.length<2) blds.push(buildings[bj]);}
    if(blds.length===0) continue;
    var bld=blds[Math.floor(Math.random()*blds.length)];
    if(bld.kind==='forge'&&bld.techUpgrading) continue;
    var def=this.race.units[role];if(!def) continue;
    if(res.gold<def.gold||res.wood<def.wood) continue;
    if(Math.random()<this.trainRate){g.subRes(this.pid,def.gold,def.wood);bld.queue.push({role:role,race:this.raceId,timeLeft:def.time,timeTotal:def.time});return;}
  }
};

  AIController.prototype.tryRepair=function(){
  var g=this.g;
  var priority={townhall:10,barracks:8,forge:7,tower:6,lumber:5,magic:4,altar:4,house:3};
  var damaged=[];

  }
  if(!damaged.length) return;
  damaged.sort(function(a,b){return b.pri-a.pri;});
  var target=damaged[0].b;
  var w=null,bd=Infinity;

};
AIController.prototype.useHeroAbilities=function(){
  var g=this.g;
  var _castChance = (this.difficulty==='hard')?1.0:(this.difficulty==='easy')?0.55:0.8;
  var _ULT_IDS={divine_shield:1,spirits:1,forest_wrath:1,inq_wrath:1,sha_quake:1,hun_moonarrow:1};
  function _cdFor(h,id,idx){return _ULT_IDS[id]?h.cdUlt:(idx===0?h.cdA1:idx===1?h.cdA2:idx===2?h.cdA3:0);}

  for(var i=0;i<g.units.length;i++){
    var h=g.units[i];
    if(!h.isHero||h.pid!==this.pid||h.dying) continue;
    if(h.stunT>0||h.rootT>0) continue;

    // ПАТЧ 10.9/Q2: прокачка способностей — ульт в приоритете, остальное по ситуации
    if(h.skillPoints>0){
      var _priorities=[];

      if(h.ultUnlocked){
        var _ultIdx=-1;
        for(var _ui=0;_ui<h.heroAbilities.length;_ui++){

        }
        if(_ultIdx>=0){
          var _ultLvl=h.abilityLevels[h.heroAbilities[_ultIdx].id]||0;
          if(_ultLvl<3 && h.level>=(6+_ultLvl*2)) _priorities.push(_ultIdx);
        }
      }
      // 2. Хил — если у кого-то <50% HP
      var _alliesHurt=false;
      for(var _hui=0;_hui<g.units.length;_hui++){
        var _hut=g.units[_hui];
        if(_hut.team!==h.team||_hut.dying||_hut===h) continue;
        if(Math.hypot(_hut.x-h.x,_hut.y-h.y)>450) continue;
        if(_hut.hp/_hut.maxHp<0.5){_alliesHurt=true;break;}
      }
      if(_alliesHurt){
        for(var _hi2=0;_hi2<h.heroAbilities.length;_hi2++){
          var _abH=h.heroAbilities[_hi2];
          if(_abH.type==='passive') continue;
          var _idH=_abH.id;
          if(_idH==='heal'||_idH==='hun_heal'||_idH==='sha_harvest'){
            var _lvlH=h.abilityLevels[_idH]||0;
            if(_lvlH<3 && _priorities.indexOf(_hi2)<0) _priorities.push(_hi2);
          }
        }
      }
      // 3. Атакующие активные
      for(var _ai2=0;_ai2<h.heroAbilities.length;_ai2++){
        var _abA=h.heroAbilities[_ai2];
        if(_abA.type!=='active') continue;
        var _lvlA=h.abilityLevels[_abA.id]||0;
        if(_lvlA<3 && _priorities.indexOf(_ai2)<0) _priorities.push(_ai2);
      }
      // 4. Пассивки в конце
      for(var _pi=0;_pi<h.heroAbilities.length;_pi++){
        var _abP=h.heroAbilities[_pi];
        if(_abP.type!=='passive') continue;
        var _lvlP=h.abilityLevels[_abP.id]||0;
        if(_lvlP<3 && _priorities.indexOf(_pi)<0) _priorities.push(_pi);
      }
      if(_priorities.length>0){
        var _castIdx=_priorities[0];
        var _castAb=h.heroAbilities[_castIdx];
        if(h.skillPoints>0 && (h.abilityLevels[_castAb.id]||0)<3){
          h.abilityLevels[_castAb.id]=(h.abilityLevels[_castAb.id]||0)+1;
          h.skillPoints--;

        }
      }
    }

    var enemies=[];
    for(var ei=0;ei<g.units.length;ei++){
      var eu=g.units[ei];
      if(eu.team===h.team||eu.dying||eu._isTotem) continue;
      var d=Math.hypot(eu.x-h.x,eu.y-h.y);

    var alliesLow=null,allyRatio=1;
    for(var ali=0;ali<g.units.length;ali++){

    function canCast(id,idx){return h.abilityLevels[id]>0 && _cdFor(h,id,idx)<=0;}
    function rollCast(chance){return Math.random()<=(chance||_castChance);}

        var _wc=false;
        for(var _wi=0;_wi<enemies.length;_wi++) if(enemies[_wi].dist<180){_wc=true;break;}
        if(_wc && rollCast(0.95)){g.castAbility(h,'warcry');continue;}
      }
      if(canCast('sha_chain',0) && manaOK(35)){
        if(rollCast(0.9)){g.castAbility(h,'sha_chain',enemies[0].u);continue;}
      }
      if(canCast('hun_volley',1) && manaOK(35)){
        if(rollCast(0.9)){g.castAbility(h,'hun_volley');continue;}
      }
    }
    if(enemies.length>=3 && h.ultUnlocked && manaOK(80)){
      if(canCast('inq_wrath',3)){if(rollCast(0.9)){g.castAbility(h,'inq_wrath',enemies[0].u);continue;}}
      if(canCast('sha_quake',3)){
        var _qc=false;

      }
      if(canCast('spirits',3)){if(rollCast(0.9)){g.castAbility(h,'spirits');continue;}}

      }

      }
    }
    if(enemies.length>=1 && enemies[0].dist<400){

      if(canCast('hun_mark',0) && manaOK(30) && tgt.markedT<=0){

      }

        if(rollCast(0.6)){g.castAbility(h,'moonfire',tgt);continue;}
      }
      if(canCast('sha_harvest',2) && manaOK(35) && hpRatio<0.6){
        if(rollCast(0.7)){g.castAbility(h,'sha_harvest',tgt);continue;}
      }
      if(canCast('entangle',1) && manaOK(35) && (tgt.role==='cav'||tgt.isHero)){
        if(rollCast(0.6)){g.castAbility(h,'entangle',tgt);continue;}
      }
    }
    if(enemies.length>=1 && h.ultUnlocked && manaOK(80) && enemies[0].dist>200){
      if(canCast('hun_moonarrow',3)){if(rollCast(0.8)){g.castAbility(h,'hun_moonarrow',enemies[0].u);continue;}}
    }
    if(canCast('sha_totem',1) && manaOK(40)){
      var _wnd=0;
      for(var _wi3=0;_wi3<g.units.length;_wi3++){
        var _wu=g.units[_wi3];
        if(_wu.team!==h.team||_wu.dying||_wu===h) continue;
        if(Math.hypot(_wu.x-h.x,_wu.y-h.y)>250) continue;

    for(var sm=0;sm<sawmills.length;sm++){var lvl=sawmills[sm].sawmillLevel||0;if(lvl<3&&lvl<targetLvl){targetLvl=lvl;targetSm=sawmills[sm];}}

UISys.prototype.startGame=function(){

    if(!map){alert('Карта не найдена');return;}

    for(var k=0;k<this.slotConfig.length;k++){
      var cfg=this.slotConfig[k];
      slots.push({
        type: cfg.type==='player'?'player':(cfg.type==='empty'?'empty':'bot'),
        race: cfg.race||'luminite',
        team: (cfg.team!=null?cfg.team:0)

    }
    var hasPlayer=false;for(var pi=0;pi<slots.length;pi++) if(slots[pi].type==='player'){hasPlayer=true;break;}
    if(!hasPlayer){alert('Нужен игрок в первом слоте');return;}
    if(slots.length<2){alert('Нужно 2+ участника');return;}
    var teamsSet={};for(var ti=0;ti<slots.length;ti++){
      if(slots[ti].type==='empty') continue;
      teamsSet[slots[ti].team]=true;
    }
    var teamCount=0;for(var tk in teamsSet) teamCount++;
    if(teamCount<2){alert('Все в одной команде');return;}
    Audio.stopMusic();Input.keys={};Input.pendingOrder=null;Input.pendingTargetedAbility=null;Input.pendingRallyPoint=null;this.hideOrderBar();Input.groups={};Input._activeUnitId=null;
    if(Renderer_) Renderer_.destroy();
    clearAllCaches();
    Game_=new Game(map,{slots:slots});
    Renderer_=new Renderer(this.$('game'),Game_);
    for(var si=0;si<slots.length;si++){
      if(slots[si].type==='empty') continue;

    }
    this.showScreen(null);

UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;
  var g=Game_,size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  for(var i=0;i<g.buildings.length;i++){var ob=g.buildings[i],dx=ob.x-x,dy=ob.y-y,rr=ob.radius+size+40;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead) continue;var dx2=r.x-x,dy2=r.y-y,rr2=r.radius+size-6;if(dx2*dx2+dy2*dy2<rr2*rr2) return false;}
  if(def.kind==='townhall'){
    var thCount=0;
    for(var ti=0;ti<g.buildings.length;ti++){
      var tb=g.buildings[ti];
      if(tb.pid===g.playerPid&&tb.kind==='townhall'&&!tb.dead&&tb.completed) thCount++;
    }
    if(thCount>=MAX_TH_PER_PLAYER) return false;
    return true;
  }
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.pid!==g.playerPid) continue;if(Math.hypot(b.x-x,b.y-y)<700) return true;}
  return false;
};
UISys.prototype.tryPlaceAt=function(x,y){
  if(!this._placingKind||!Game_) return;
  var g=Game_,kind=this._placingKind,race=this._placingRace;
  if(!race){this.cancelPlacement();return;}
  var def=RACES[race].buildings[kind];if(!def){this.cancelPlacement();return;}
  if(!this.canPlaceAt(x,y,def)){g.notify(t_('cantBuild'));return;}
  var res=g.getRes(g.playerPid);
  if(res.gold<def.gold){g.notify(t_('nGold'));this.cancelPlacement();return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.pid===g.playerPid&&u2.role==='worker'&&!u2.dying){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.pid===g.playerPid&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t_('noWorker'));this.cancelPlacement();return;}
  var newRad=(def.size||3)*22+24;
  for(var mv=0;mv<g.units.length;mv++){
    var mu=g.units[mv];
    if(mu.pid!==g.playerPid||mu.dying) continue;
    var mdx=mu.x-x,mdy=mu.y-y,md=Math.hypot(mdx,mdy);
    if(md<newRad){
      var mvAng=md>0.01?Math.atan2(mdy,mdx):Math.random()*TAU;
      mu.moveTo={x:g.clampX(x+Math.cos(mvAng)*(newRad+50)),y:g.clampY(y+Math.sin(mvAng)*(newRad+50))};
      mu._path=null;mu._pathIdx=0;
    }
  }
  g.subRes(g.playerPid,def.gold,def.wood);
  var b=new Building(x,y,g.playerTeam,def,race);
  b.completed=false;b.buildProgress=0;b.owner='player';b.pid=g.playerPid;
  g.buildings.push(b);g.navDirty=true;
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.demolishTarget=null;w.carrying=null;w.carryAmt=0;w.target=null;w.lockedTarget=null;w.gatherAnimT=0;w.attackMoveTo=null;w.patrolRoute=null;w._stuckTimer=0;w._insideMine=false;w._mineSlot=-1;w._waitingForMine=false;w._path=null;w._pathIdx=0;
  w.stationed=false;
  for(var _clr=0;_clr<g.units.length;_clr++){
    var _cu=g.units[_clr];
    if(_cu.pid!==g.playerPid||_cu.dying||_cu===w) continue;
    var _cuInB=false;
    if(_cu.moveTo&&Math.hypot(_cu.moveTo.x-x,_cu.moveTo.y-y)<newRad*1.1) _cuInB=true;
    if(_cu.attackMoveTo&&Math.hypot(_cu.attackMoveTo.x-x,_cu.attackMoveTo.y-y)<newRad*1.1) _cuInB=true;
    if(_cuInB){
      _cu.moveTo=null;_cu.attackMoveTo=null;_cu.patrolRoute=null;_cu._path=null;_cu._pathIdx=0;
    }
  }
  Audio.sfx('build');this.cancelPlacement();
};

    else if(abIdx===2) cd=hero.cdA3;
    else if(ab.type==='ultimate') cd=hero.cdUlt;
    var isPassive=(ab.type==='passive');
    var canLvlUp=false;
    if(hero.skillPoints>0&&lvl<3){
      if(ab.type==='ultimate'){var _needLvl=6+lvl*2;canLvlUp=(hero.level>=_needLvl);}
      else canLvlUp=true;
    }
    var hasMana=(hero.mana||0)>=(ab.mana||0);
    var canUse=!isPassive&&lvl>0&&cd<=0&&(ab.type!=='ultimate'||hero.ultUnlocked)&&hasMana&&!_stunnedHero;
    if(canLvlUp) _btn.classList.add('can-level'); else _btn.classList.remove('can-level');
    var lblEl=_btn.querySelector('.lbl');
    if(lblEl){
      var key=abIdx===0?'[Q] ':abIdx===1?'[W] ':ab.type==='ultimate'?'[R] ':'[E] ';
      var newLbl=key+t_(ab.k)+(lvl>0?' '+lvl+'/3':'');
      if(ab.type==='ultimate'){
        if(!hero.ultUnlocked) newLbl+=' (X)';
        else if(lvl<3&&!canLvlUp){newLbl+=' (ур.'+(6+lvl*2)+')';}
      }
      if(canLvlUp) newLbl+=' +';
      if(lblEl.textContent!==newLbl) lblEl.textContent=newLbl;
    }
    var priceEl=_btn.querySelector('.price');
    if(priceEl){
      var newPrice='';
      if(cd>0) newPrice+=Math.ceil(cd)+'с';
      if(!isPassive) newPrice+=(newPrice?' ':'')+(ab.mana||35)+'маны';
      if(priceEl.textContent!==newPrice) priceEl.textContent=newPrice;
    }
    var wantDis=(!(canLvlUp||canUse))||(_stunnedHero&&!isPassive&&lvl>0);
    if(wantDis!==_btn.disabled){_btn.disabled=wantDis;}
  }
};
UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerPid);
    this.$('h-gold').textContent=Math.floor(res.gold);
    this.$('h-wood').textContent=Math.floor(res.wood);
    var popText=res.food+'/'+res.maxFood;
    if(res.maxFood>=MAX_FOOD) popText+=' (макс)';
    this.$('h-pop').textContent=popText;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
      else this._updateAbilityButtons();
    }
    this.updateQueuePanel();
    this._mmTimer=(this._mmTimer||0)+1;
    if(this._mmTimer>=2){this._mmTimer=0;this.drawMinimap();}
    this._infoTimer=(this._infoTimer||0)+1;
    if(this._infoTimer>=3){this._infoTimer=0;this.refreshInfoOnly();this._refreshPortraitBars();}
    if(!Settings._isMobile && Input.mouseInside) this._showUnitHoverTip();
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var self=this;
      setTimeout(function(){
        var go=self.$('gameover');
        self.$('go-title').textContent=g.result==='win'?t_('victory'):t_('defeat');
        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        self._goTab='players';
        var tabs=document.querySelectorAll('.go-tab');
        for(var _ti=0;_ti<tabs.length;_ti++){tabs[_ti].classList.toggle('active',tabs[_ti].dataset.tab==='players');}
        self.renderGameOverStats();
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
      },1200);
      g.shake=2;
    }
  }catch(e){ERR('UI.update',e);}
};

UISys.prototype.drawMinimap=function(){
  var g=Game_;if(!g||!Renderer_) return;
  var cv=this.$('minimap'),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height,sx=W/g.W,sy=H/g.H;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
  var cs=g.fogCellSize,i,j;
  for(i=0;i<g.fogCols;i++) for(j=0;j<g.fogRows;j++){var f=g.fog[i+j*g.fogCols];if(f===2) continue;ctx.fillStyle=f===1?'rgba(0,0,0,0.55)':'rgba(0,0,0,0.92)';ctx.fillRect(i*cs*sx,j*cs*sy,cs*sx+0.5,cs*sy+0.5);}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||!g.isExplored(r.x,r.y)) continue;ctx.fillStyle=r.kind==='gold'?'#ffe066':'#2d5a2d';var sz=r.kind==='gold'?5:3;ctx.fillRect(r.x*sx-sz/2,r.y*sy-sz/2,sz,sz);}
  for(i=0;i<g.creeps.length;i++){var c=g.creeps[i];if(c.dead||!g.isExplored(c.x,c.y)) continue;ctx.fillStyle=c.isBoss?'#ff6060':'#8a3030';ctx.fillRect(c.x*sx-2,c.y*sy-2,4,4);}
  for(i=0;i<g.buildings.length;i++){
    var b=g.buildings[i];if(b.dead) continue;
    var visB=(b.pid===g.playerPid)||(b.team===g.playerTeam)||g.isVisible(b.x,b.y);
    if(visB){
      ctx.fillStyle=b.completed?teamColor(b.team):'#a08040';
      ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);
    } else if(g.isExplored(b.x,b.y)){
      // ПАТЧ J-2: запомненные здания (серые)
      ctx.fillStyle='rgba(120,120,140,0.7)';
      ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);
      ctx.strokeStyle='rgba(80,80,100,0.8)';ctx.lineWidth=1;
      ctx.strokeRect(b.x*sx-3,b.y*sy-3,6,6);
    }
  }
  for(i=0;i<g.units.length;i++){var u=g.units[i];if(u.dead||u.dying||u._isTotem) continue;
    var visU=(u.pid===g.playerPid)||(u.team===g.playerTeam)||g.isVisible(u.x,u.y);
    if(!visU) continue;
    ctx.fillStyle=u.isHero?'#ffe9a8':teamColor(u.team);var s2=u.isHero?5:3;ctx.fillRect(u.x*sx-s2/2,u.y*sy-s2/2,s2,s2);}
  var cam=g.camera,vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy,vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;
  ctx.strokeStyle='#e6c67a';ctx.lineWidth=2;ctx.strokeRect(vx,vy,vw,vh);
};

UISys.prototype.renderGameOverStats=function(){

        var pick=Game_.pickScreen(tt.x0,tt.y0);
        var ownPick=(pick.unit&&pick.unit.pid===Game_.playerPid)||(pick.building&&pick.building.pid===Game_.playerPid);
        var foreignPick=(pick.unit&&pick.unit.pid!==Game_.playerPid)||(pick.building&&pick.building.pid!==Game_.playerPid)||(pick.creep);
        if(UI._placingKind){var wpt3=Renderer_.s2w(tt.x0,tt.y0);UI.tryPlaceAt(wpt3.x,wpt3.y);}
        else if(foreignPick) Game_.handleLeftClick(tt.x0,tt.y0,false);
        else if(ownPick) Game_.handleLeftClick(tt.x0,tt.y0,false);
        else{
          var hasSel=false;
          for(var i=0;i<Game_.units.length;i++) if(Game_.units[i].sel&&Game_.units[i].pid===Game_.playerPid){hasSel=true;break;}
          if(hasSel) Game_.handleRightClick(tt.x0,tt.y0);
          else Game_.handleLeftClick(tt.x0,tt.y0,false);
        }
      }
      self._ignoreMouseUntil=performance.now()+500;
      self.touchStart=null;self.pinchDist=0;
    });
  },
  updateCamera:function(dt){
    if(!Game_) return;
    var c=Game_.camera,spd=900/c.zoom*dt,dx=0,dy=0;
    var K=(typeof Settings!=='undefined'&&Settings.keys)?Settings.keys:DEFAULT_KEYS;
    if(this.keys[K.camUp]) dy-=1;
    if(this.keys[K.camDown]) dy+=1;
    if(this.keys[K.camLeft]) dx-=1;
    if(this.keys[K.camRight]) dx+=1;
    if(!this.isTouch&&!Settings._isMobile&&Settings.edgeScroll&&this.mouseInside&&Renderer_){
      var _zone=Math.max(70,Math.min(120,Renderer_.w*0.06));
      var _mx=this.mouseX,_my=this.mouseY,_w=Renderer_.w,_h=Renderer_.h;
      var _ex=0,_ey=0;
      if(_mx<_zone) _ex=-(1-_mx/_zone);
      else if(_mx>_w-_zone) _ex=(_mx-(_w-_zone))/_zone;
      if(_my<_zone) _ey=-(1-_my/_zone);
      else if(_my>_h-_zone) _ey=(_my-(_h-_zone))/_zone;
      _ex=Math.max(-1,Math.min(1,_ex));_ey=Math.max(-1,Math.min(1,_ey));
      _ex=_ex*Math.abs(_ex);_ey=_ey*Math.abs(_ey);
      if(_ex||_ey){dx+=_ex;dy+=_ey;}
    }
    if(dx||dy){
      var len=Math.hypot(dx,dy)||1;
      if(len>1){dx/=len;dy/=len;}
      c.x+=dx*spd*1.15;c.y+=dy*spd*1.15;
      clampCam();
    }
  }
};
function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  if(!isFinite(dt)||dt<0) dt=0.016;
  dt=Math.min(0.1,dt);
  lastT=now;
  try{
    if(Game_&&!Game_.paused){
      Input.updateCamera(dt);
      Game_.update(dt);
      // ПАТЧ J-15: обновлять ухо раз в 3 кадра
      if(Game_.camera){
        if(!loop._earFrame) loop._earFrame=0;
        loop._earFrame++;
        if(loop._earFrame%3===0) Audio.setEar(Game_.camera.x,Game_.camera.y,Game_.camera.zoom);
      }
    }
  }catch(e){ERR('update',e);}
  try{
    if(Renderer_&&Game_){
      if(Renderer_.setFrameAlpha) Renderer_.setFrameAlpha(0.5);
      Renderer_.draw();
    }
  }catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  requestAnimationFrame(loop);
}
function boot(){
  try{
    UI=new UISys();
    UI.applyLangUI();
    Input.init(document.getElementById('game'));
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){Audio.pauseAll();}
      else{
        Audio.resume();lastT=0;
        // ПАТЧ J-14: сбросить хеш портрета при возврате
        if(UI){UI._lastPortraitAuraHash=null;}
      }
    });
    window.addEventListener('blur',function(){Audio.pauseAll();});
    window.addEventListener('focus',function(){Audio.resume();lastT=0;});
    UI.showScreen('menu');
    requestAnimationFrame(loop);
  }catch(e){ERR('boot',e);showError('Load: '+e.message);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

      </script>
