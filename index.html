<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Эхо Трёх Корон — Release v35</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif;color:#e8e8e8;position:fixed}
canvas#game{display:block;position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1e2d45,#0a0e18);pointer-events:auto;padding:16px;overflow-y:auto;z-index:50}
.screen.active{display:flex}
h1{color:#e6c67a;font-size:clamp(28px,7vw,64px);margin-bottom:8px;letter-spacing:4px;text-align:center;text-shadow:0 0 30px #e6c67a99}
h2{color:#8aa;font-size:clamp(11px,2.2vw,15px);margin-bottom:24px;letter-spacing:3px;text-align:center}
h3{color:#e6c67a;font-size:clamp(15px,3.6vw,19px);margin-bottom:14px;text-align:center}
.btn{padding:14px 28px;margin:5px;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#2e3f5c,#1a2437);border:2px solid #6a7a9a;border-radius:8px;color:#e8e8e8;min-width:220px;max-width:100%;text-align:center;pointer-events:auto;font-weight:700}
.btn:hover,.btn:active{background:linear-gradient(180deg,#42577d,#243149);border-color:#e6c67a}
.btn.primary{border-color:#e6c67a;color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010)}
.btn.small{min-width:auto;padding:10px 16px;font-size:14px;margin:3px}
.btn.danger{border-color:#c94040;color:#ffb0b0}
.panel{background:linear-gradient(180deg,rgba(20,28,42,.98),rgba(12,18,28,.98));border:2px solid #557096;border-radius:12px;padding:20px;max-width:min(94vw,680px);max-height:92vh;overflow-y:auto;pointer-events:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;flex-wrap:wrap}
.row label{flex:1;font-size:14px;color:#b8c5d6;min-width:110px}
.row select,.row input[type=text]{flex:1;max-width:220px;padding:8px 12px;background:#0d1420;border:1px solid #3d4c68;color:#e8e8e8;border-radius:6px;font-size:14px}
.map-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.map-item{padding:8px;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:120px}
.map-item canvas{width:110px;height:110px;border-radius:4px;background:#000;display:block}
.map-item.selected{border-color:#e6c67a;background:#2a3a52;color:#ffe9a8}
.map-item .mname{font-size:11px;color:#e6c67a}
.slot-list{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.slot-row{display:flex;gap:6px;align-items:center;background:#0d1420;padding:7px;border-radius:5px;font-size:12px;flex-wrap:wrap}
.slot-row .lbl{min-width:26px;color:#e6c67a;font-weight:800}
.slot-row select{flex:1;padding:5px;background:#080d15;border:1px solid #3d4c68;color:#e8e8e8;border-radius:4px;font-size:12px;min-width:60px}
.slot-row .tc{width:24px;height:24px;border-radius:5px;border:2px solid #000;flex-shrink:0}
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5;overflow:hidden}
#hud.active{display:block}
#topbar{position:absolute;top:6px;left:6px;display:flex;gap:14px;padding:8px 14px;background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;font-size:14px;font-weight:700;max-width:calc(100vw - 300px);overflow:hidden;flex-wrap:wrap}
#topbar>div{display:flex;gap:6px;align-items:center;white-space:nowrap}
#topbar span{color:#e6c67a;font-weight:800}
#topbar .res-icon{font-size:16px;line-height:1;color:#fff;font-weight:400}
#selinfo{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;padding:6px 12px;font-size:12px;display:none;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#selinfo.show{display:block}
#minimap{position:absolute;right:6px;top:6px;width:130px;height:130px;background:#000;border:2px solid #557096;border-radius:6px;pointer-events:auto;cursor:pointer}
#cmdpanel{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:7px;display:flex;padding:4px;gap:4px;pointer-events:auto;flex-wrap:wrap;max-height:130px;overflow:hidden}
#cmdpanel.hidden{display:none}
#portrait-wrap{width:82px;flex-shrink:0;background:#0d1420;border:1px solid #3d4c68;border-radius:4px;display:flex;flex-direction:column;overflow:hidden}
#portrait-canvas{width:100%;height:64px;display:block;background:linear-gradient(180deg,#1a2438,#050810)}
#portrait-info{padding:1px 3px;font-size:9px;text-align:center;overflow:hidden}
#portrait-info .pname{color:#e6c67a;font-weight:700;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#portrait-info .pstat{color:#9ab;font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#actions{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:2px;align-content:start;overflow-y:auto;overflow-x:hidden;max-height:110px;min-width:0}
.act-btn{background:linear-gradient(180deg,#2a3a55,#16202f);border:2px solid #4d6180;border-radius:5px;color:#e8e8e8;font-size:9px;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;min-height:46px;overflow:hidden;position:relative}
.act-btn:hover,.act-btn:active{background:linear-gradient(180deg,#3a5078,#1a2438);border-color:#e6c67a}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-btn canvas,.act-btn img{width:24px;height:24px;display:block}
.act-btn .ico{font-size:16px;line-height:1}
.act-btn .lbl{font-size:8px;text-align:center;margin-top:1px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.act-btn .price{font-size:8px;color:#e6c67a;margin-top:0}
#queue-panel{position:absolute;bottom:140px;left:6px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:6px;padding:6px;display:none;max-width:280px;pointer-events:auto;z-index:6}
#queue-panel.show{display:block}
#queue-panel .qtitle{color:#e6c67a;font-size:11px;font-weight:800;margin-bottom:4px}
.q-item{display:flex;gap:6px;align-items:center;margin-bottom:4px;background:#0d1420;padding:3px 5px;border-radius:4px}
.q-item canvas{width:24px;height:24px;flex-shrink:0;border-radius:3px;background:#000}
.q-info{flex:1;min-width:0}
.q-name{font-size:10px;color:#e8e8e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-bar-bg{height:5px;background:#000;border-radius:2px;margin-top:2px;overflow:hidden}
.q-bar-fill{height:100%;background:linear-gradient(90deg,#8a6a1a,#ffe9a8);border-radius:2px}
.q-time{font-size:9px;color:#9ab;margin-left:2px}
#controls{position:absolute;right:6px;top:194px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
#controls button{width:40px;height:40px;background:rgba(20,30,45,.95);border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;font-size:18px;font-weight:800;cursor:pointer}
#hud-menu{position:absolute;top:144px;right:6px;padding:6px 10px;background:#243250;border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;cursor:pointer;pointer-events:auto;font-size:16px;font-weight:800}
#notifications{position:absolute;bottom:190px;left:6px;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none;overflow:hidden}
.notif{background:rgba(10,16,28,.94);border-left:3px solid #e6c67a;padding:8px 12px;font-size:12px;border-radius:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:13px;color:#ffe9a8;pointer-events:none;display:none;max-width:min(90vw,600px);text-align:center;font-weight:700;overflow:hidden}
#hint.show{display:block}
#placement-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:14px;color:#ffe9a8;pointer-events:auto;display:none;font-weight:700;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px)}
#placement-bar.show{display:flex}
#placement-bar .pname{color:#e6c67a}
#pausemenu,#settings,#gameover,#alert,#saves{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);pointer-events:auto;z-index:60;padding:16px;overflow-y:auto}
#pausemenu.active,#settings.active,#gameover.active,#alert.active,#saves.active{display:flex}
.save-slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin:6px 0;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;font-size:13px;overflow:hidden;flex-wrap:wrap}
.save-slot .meta{flex:1;color:#9ab;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:120px}
.save-slot .title{color:#e6c67a;font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save-slot .actions{display:flex;gap:4px;flex-shrink:0}
#keybind-section{display:none;flex-direction:column;align-items:stretch;margin-top:12px;border-top:1px solid #3d4c68;padding-top:12px}
#keybind-section.visible{display:flex}
#keybind-section>label{color:#e6c67a;font-size:14px;margin-bottom:6px;font-weight:700}
.kb-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#0d1420;padding:6px 10px;border-radius:5px;margin-bottom:4px;font-size:13px}
.kb-row .kb-name{color:#b8c5d6}
.kb-row .kb-btn{background:#1a2437;border:2px solid #3d4c68;color:#ffe9a8;padding:4px 12px;border-radius:4px;font-family:monospace;font-weight:800;cursor:pointer;min-width:80px;text-align:center;font-size:13px}
.kb-row .kb-btn.listening{border-color:#e6c67a;background:#5a4a2a}
#tooltip{position:fixed;background:linear-gradient(180deg,rgba(16,24,38,.99),rgba(8,14,24,.99));border:2px solid #e6c67a;color:#ffe9a8;padding:8px 12px;font-size:12px;border-radius:6px;pointer-events:none;z-index:200;display:none;max-width:260px;line-height:1.45;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.8)}
@media (max-width:900px){
  #minimap{width:100px;height:100px}
  #hud-menu{top:114px;font-size:14px;padding:5px 8px}
  #controls{top:160px}
  #controls button{width:34px;height:34px;font-size:15px}
  #portrait-wrap{width:72px}
  #portrait-canvas{height:56px}
  #topbar{max-width:calc(100vw - 220px);font-size:12px;padding:6px 10px;gap:10px}
  #actions{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));max-height:88px}
  .act-btn{min-height:42px}
  .act-btn canvas,.act-btn img{width:20px;height:20px}
  #queue-panel{bottom:120px;max-width:220px}
}
@media (max-width:600px){
  #topbar{padding:5px 8px;font-size:11px;gap:8px;max-width:calc(100vw - 160px)}
  #minimap{width:78px;height:78px}
  #hud-menu{top:92px;padding:4px 8px;font-size:12px}
  #controls{top:126px}
  #controls button{width:30px;height:30px;font-size:13px}
  #selinfo{font-size:10px;padding:4px 8px;max-width:55vw}
  #cmdpanel{padding:3px;gap:3px;max-height:110px;bottom:3px;left:3px;right:3px}
  #portrait-wrap{width:58px}
  #portrait-canvas{height:46px}
  #actions{grid-template-columns:repeat(auto-fill,minmax(42px,1fr));max-height:90px}
  .act-btn{min-height:38px;font-size:8px}
  .act-btn canvas,.act-btn img{width:18px;height:18px}
  #queue-panel{bottom:112px;max-width:180px;font-size:10px}
  #notifications{bottom:112px;max-width:190px;font-size:11px}
  #hint{bottom:118px;font-size:11px;padding:7px 12px}
  .btn{padding:11px 20px;font-size:14px;min-width:180px}
  .panel{padding:14px}
  h1{letter-spacing:2px}
}
@media (min-width:1400px){
  #topbar{font-size:15px;padding:10px 16px}
  #minimap{width:160px;height:160px}
  #cmdpanel{padding:6px;gap:6px;max-height:150px}
  #portrait-wrap{width:110px}
  #portrait-canvas{height:86px}
  #actions{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:140px}
  .act-btn{min-height:56px}
  .act-btn canvas,.act-btn img{width:28px;height:28px}
  #queue-panel{bottom:170px;max-width:340px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
<div id="menu" class="screen active">
  <h1 id="t-title">Эхо Трёх Корон</h1>
  <h2 id="t-subtitle">Echo of Three Crowns · Release v35</h2>
  <button class="btn primary" id="m-play" data-t="m_play">Новая игра</button>
  <button class="btn" id="m-load" data-t="m_load">Загрузить</button>
  <button class="btn" id="m-settings" data-t="m_settings">Настройки</button>
</div>
<div id="setup" class="screen"><div class="panel">
  <h3 data-t="setup_title">Настройка матча</h3>
  <div class="row"><label data-t="setup_map">Карта</label></div>
  <div class="map-list" id="map-list"></div>
  <div class="row"><label data-t="setup_diff">Сложность бота</label><select id="diff-sel">
    <option value="easy" data-t="diff_easy">Лёгкая</option><option value="normal" selected data-t="diff_normal">Обычная</option><option value="hard" data-t="diff_hard">Сложная</option>
  </select></div>
  <div class="row"><label data-t="setup_players">Расы</label></div>
  <div class="slot-list" id="slot-list"></div>
  <div class="row" style="justify-content:center;margin-top:12px">
    <button class="btn small" id="setup-back" data-t="btn_back">Назад</button>
    <button class="btn small primary" id="setup-start" data-t="btn_start">Начать</button>
  </div>
</div></div>
<div id="settings"><div class="panel">
  <h3 data-t="settings_title">Настройки</h3>
  <div class="row"><label data-t="set_lang">Язык</label><select id="q-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <div class="row"><label data-t="set_vol">Громкость</label><input type="range" id="q-vol" min="0" max="1" step="0.05" value="0.4"><span id="v-vol">40%</span></div>
  <div class="row"><label data-t="set_mus">Музыка</label><input type="range" id="q-mus" min="0" max="1" step="0.05" value="0.25"><span id="v-mus">25%</span></div>
  <div class="row"><label data-t="set_edge">Краевой скролл</label><select id="q-edge"><option value="0" data-t="set_off">Выкл</option><option value="1" selected data-t="set_on">Вкл</option></select></div>
  <div class="row"><label data-t="gfx_quality">Графика</label><select id="q-quality"><option value="low" data-t="gfx_low">Низкое</option><option value="medium" selected data-t="gfx_medium">Среднее</option><option value="high" data-t="gfx_high">Высокое</option></select></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn small primary" id="settings-close" data-t="btn_close">Закрыть</button></div>
</div></div>
<div id="saves"><div class="panel">
  <h3 id="saves-title" data-t="saves_title">Сохранения</h3>
  <div id="saves-list"></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn small" id="saves-back" data-t="btn_back">Назад</button></div>
</div></div>
<div id="hud">
  <div id="topbar">
    <div><span class="res-icon">💰</span><span id="h-gold">0</span></div>
    <div><span class="res-icon">🪵</span><span id="h-wood">0</span></div>
    <div><span class="res-icon">👥</span><span id="h-pop">0/0</span></div>
    <div><span class="res-icon">⏱</span><span id="h-time">00:00</span></div>
  </div>
  <div id="selinfo"></div>
  <div id="notifications"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="controls"><button id="zoom-in">+</button><button id="zoom-out">−</button></div>
  <button id="hud-menu">☰</button>
  <div id="cmdpanel" class="hidden">
    <div id="portrait-wrap"><canvas id="portrait-canvas" width="220" height="180"></canvas><div id="portrait-info"><div class="pname">—</div><div class="pstat"></div></div></div>
    <div id="actions"></div>
  </div>
  <div id="queue-panel"><div class="qtitle" data-t="queue_title">Очередь создания</div><div id="queue-list"></div></div>
  <div id="hint"></div>
  <div id="placement-bar"><span class="pname" data-t="placing">Размещение:</span><span id="place-name">—</span><button class="btn small danger" id="place-cancel">✖</button></div>
</div>
<div id="pausemenu"><div class="panel" style="text-align:center;max-width:400px">
  <h3 data-t="pause_title">Пауза</h3>
  <button class="btn primary" id="pause-continue" data-t="pause_resume" style="width:100%">Продолжить</button>
  <button class="btn" id="pause-save" data-t="pause_save" style="width:100%">Сохранить</button>
  <button class="btn" id="pause-load" data-t="pause_load" style="width:100%">Загрузить</button>
  <button class="btn danger" id="pause-exit" data-t="pause_exit" style="width:100%">В меню</button>
</div></div>
<div id="gameover"><div class="panel" style="text-align:center;max-width:400px">
  <h3 id="go-title" style="font-size:36px"></h3>
  <p id="go-sub" style="margin:14px 0;color:#9ab;font-size:14px"></p>
  <button class="btn primary" id="go-menu" data-t="btn_menu">В меню</button>
</div></div>
<div id="alert"><div class="panel" style="text-align:center;max-width:400px">
  <p id="alert-text" style="font-size:14px;margin-bottom:14px"></p>
  <button class="btn small primary" id="alert-close">OK</button>
</div></div>
</div>
<div id="tooltip"></div>
<script>
'use strict';
var ERR=function(){var a=arguments;try{console.error.apply(console,['[Echo]'].concat(Array.prototype.slice.call(a)));}catch(e){}};
function hashString(s){var h=2166136261>>>0;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296;};}

/* ==================== LANG ==================== */
var LANG={
  ru:{m_play:"Новая игра",m_load:"Загрузить",m_settings:"Настройки",

    gfx_quality:"Графика",gfx_low:"Низкое",gfx_medium:"Среднее",gfx_high:"Высокое",
    saves_title:"Сохранения",pause_title:"Пауза",pause_resume:"Продолжить",pause_save:"Сохранить",pause_load:"Загрузить",pause_exit:"В меню",
    queue_title:"Очередь создания",placing:"Размещение:",
    building_done:"Построено:",unit_ready:"Нанят:",
    not_enough_gold:"Мало золота",not_enough_wood:"Мало дерева",need_house:"Нужен дом!",
    hero_exists:"Герой уже есть!",hero_died:"Герой погиб!",hero_alive:"⭐ Герой уже есть",
    cancel:"Отмена",build:"Строить",line:"Линия",column:"Колонна",box:"Коробка",hold:"Держать",
    all_units:"Все войска",all_workers:"Все рабочие",deselect:"Снять",

function Projectile(x,y,tx,ty,dmg,team,color,trail){this.x=x;this.y=y;this.tx=tx;this.ty=ty;this.dmg=dmg;this.team=team;this.color=color;this.spd=650;this.ttl=2.5;this.dead=false;this.trail=trail!==false;this.prevX=x;this.prevY=y;}
function FloatingText(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color||'#fff';this.life=1.2;this.maxLife=1.2;this.dead=false;}
function BloodDecal(x,y,size){this.x=x;this.y=y;this.size=size;this.life=15;this.maxLife=15;this.dead=false;this.spots=[];for(var i=0;i<5;i++) this.spots.push({dx:(Math.random()-.5)*size,dy:(Math.random()-.5)*size*0.6,r:size*(0.15+Math.random()*0.35)});}

var GOLD_AMOUNT=12500,START_GOLD=350,START_WOOD=200;

function Game(mapDef,config,noSpawn){

  this.units=[];this.buildings=[];this.resources=[];this.projectiles=[];
  this.particles=new ParticlePool(400);this.floaters=[];this.decals=[];this.weather=[];
  this.teams={};this.time=0;this.gameOver=false;this.result=null;this.notifications=[];
  this.camera={x:0,y:0,zoom:1};this.paused=false;this.fog=[];this.vis=[];this.decor=[];this.shake=0;
  this.paths=[];
  this.fogTimer=0;this.fogInterval=0.25;this.fogCellSize=96;
  this.spatialGrid={};this.spatialCell=160;
  this.auraCache={hp:{},dmg:{}};this.auraTimer=0;this.auraInterval=1.5;
  this.unitUpgrades={};this.teamVision={};

  var ps=null;for(var si=0;si<config.slots.length;si++){if(config.slots[si].type==='player'){ps=config.slots[si];break;}}
  this.playerTeam=ps?ps.team:0;
  this.ai=[];this.unitLimit=350;this.weatherTimer=0;
  if(!noSpawn){this.generatePaths();this.spawnResources();this.spawnBases();this.spawnAI();this.generateDecor();
    var th=null;for(var bi=0;bi<this.buildings.length;bi++){if(this.buildings[bi].team===this.playerTeam&&this.buildings[bi].kind==='townhall'){th=this.buildings[bi];break;}}
    if(th){this.camera.x=th.x;this.camera.y=th.y;}}

}
Game.prototype.getTeamMemory=function(team){if(!this.teamMemory[team]){this.teamMemory[team]={enemyBuildings:{},enemyUnits:{},scoutedCells:{},attackSignal:null,allyBasePositions:{}};}return this.teamMemory[team];};
Game.prototype.getUnitUpgrades=function(team,role){if(!role) return {weapon:0,armor:0};if(!this.unitUpgrades[team]) this.unitUpgrades[team]={};if(!this.unitUpgrades[team][role]) this.unitUpgrades[team][role]={weapon:0,armor:0};return this.unitUpgrades[team][role];};
Game.prototype.addRes=function(team,gold,wood){if(!this.teams[team]) this.teams[team]={gold:0,wood:0};if(gold) this.teams[team].gold+=gold;if(wood) this.teams[team].wood+=wood;};
Game.prototype.subRes=function(team,gold,wood){if(!this.teams[team]) this.teams[team]={gold:0,wood:0};this.teams[team].gold=Math.max(0,this.teams[team].gold-gold);this.teams[team].wood=Math.max(0,this.teams[team].wood-wood);};
Game.prototype.getTownhallLevel=function(team){for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team===team&&b.kind==='townhall'&&!b.dead) return b.level||1;}return 1;};
Game.prototype.findNearestResource=function(x,y,kind){var best=null,bd=Infinity;for(var i=0;i<this.resources.length;i++){var r=this.resources[i];if(r.dead||r.amount<=0||r.falling) continue;if(kind&&r.kind!==kind) continue;var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);if(d<bd){bd=d;best=r;}}return best;};
Game.prototype.pointToSegmentDist=function(px,py,x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1;var len2=dx*dx+dy*dy;if(len2===0) return Math.hypot(px-x1,py-y1);var tt=((px-x1)*dx+(py-y1)*dy)/len2;tt=Math.max(0,Math.min(1,tt));return Math.hypot(px-(x1+tt*dx),py-(y1+tt*dy));};
Game.prototype.isOnPath=function(x,y,tol){tol=tol||70;for(var i=0;i<this.paths.length;i++){var path=this.paths[i];for(var j=0;j<path.points.length-1;j++){var a=path.points[j],b=path.points[j+1];if(this.pointToSegmentDist(x,y,a.x,a.y,b.x,b.y)<tol) return true;}}return false;};
Game.prototype.generatePaths=function(){this.paths=[];var rand=mulberry32(hashString(this.map.id+'_paths'));var ts=this.tileSize;
  var goldPts=this.map.gold.map(function(g){return {x:g.x*ts,y:g.y*ts};});
  var basePts=this.map.bases.map(function(b){return {x:b.x*ts,y:b.y*ts};});
  var i,j;
  for(i=0;i<basePts.length;i++){var bp=basePts[i];var sorted=[];
    for(j=0;j<goldPts.length;j++){var gp=goldPts[j];sorted.push({x:gp.x,y:gp.y,d:Math.hypot(gp.x-bp.x,gp.y-bp.y)});}
    sorted.sort(function(a,b){return a.d-b.d;});var count=Math.min(3,sorted.length);
    for(var k=0;k<count;k++){var g=sorted[k];if(g.d>ts*70) continue;
      var pts=[{x:bp.x,y:bp.y}];for(var s=1;s<5;s++){var tt=s/5;pts.push({x:bp.x+(g.x-bp.x)*tt+(rand()-0.5)*110,y:bp.y+(g.y-bp.y)*tt+(rand()-0.5)*110});}
      pts.push({x:g.x,y:g.y});this.paths.push({points:pts,width:70});}}
  for(i=0;i<basePts.length;i++){for(j=i+1;j<basePts.length;j++){var a=basePts[i],b=basePts[j];var dist=Math.hypot(a.x-b.x,a.y-b.y);
    if(dist<ts*80){var pts2=[{x:a.x,y:a.y}];for(var s2=1;s2<3;s2++){var t2=s2/3;pts2.push({x:a.x+(b.x-a.x)*t2+(rand()-0.5)*70,y:a.y+(b.y-a.y)*t2+(rand()-0.5)*70});}
      pts2.push({x:b.x,y:b.y});this.paths.push({points:pts2,width:55});}}}
};
Game.prototype.generateDecor=function(){var rand=mulberry32(hashString(this.map.id+'_decor'));var n=300;this.decor=[];for(var i=0;i<n;i++){var x=rand()*this.W,y=rand()*this.H;var r=rand();var kind=this.biome==='desert'?(r<.8?'rock':'grass'):this.biome==='snow'?(r<.7?'rock':'grass'):this.biome==='swamp'?(r<.6?'bush':r<.85?'rock':'flower'):(r<.7?'grass':r<.85?'flower':'rock');this.decor.push({x:x,y:y,kind:kind,size:.8+rand()*.6,seed:Math.floor(rand()*4)});}};
Game.prototype.spawnResources=function(){var i;
  for(i=0;i<this.map.gold.length;i++){var g=this.map.gold[i];this.resources.push(new Resource(g.x*this.tileSize,g.y*this.tileSize,'gold',GOLD_AMOUNT));}
  var rand=mulberry32(hashString(this.map.id+'_forest'));
  for(var fi=0;fi<this.map.forests.length;fi++){var f=this.map.forests[fi];
    for(var dx=-f.r;dx<=f.r;dx++) for(var dy=-f.r;dy<=f.r;dy++){
      if(dx*dx+dy*dy<=f.r*f.r&&rand()<.9){var jx=(rand()-.5)*20,jy=(rand()-.5)*20;var tx=(f.cx+dx)*this.tileSize+jx,ty=(f.cy+dy)*this.tileSize+jy;
        if(this.isOnPath(tx,ty,80)) continue;this.resources.push(new Resource(tx,ty,'tree',150));}}}
  var rand2=mulberry32(hashString(this.map.id+'_scatter'));var count=Math.floor(this.map.size*this.map.size/50);
  for(i=0;i<count;i++){var x=100+rand2()*(this.W-200),y=100+rand2()*(this.H-200);
    if(this.isOnPath(x,y,90)) continue;var tooClose=false;
    for(var bi=0;bi<this.map.bases.length;bi++){var bx=this.map.bases[bi].x*this.tileSize,by=this.map.bases[bi].y*this.tileSize;if(Math.hypot(bx-x,by-y)<380){tooClose=true;break;}}
    if(tooClose) continue;
    for(var gi=0;gi<this.map.gold.length;gi++){var gx=this.map.gold[gi].x*this.tileSize,gy=this.map.gold[gi].y*this.tileSize;if(Math.hypot(gx-x,gy-y)<260){tooClose=true;break;}}
    if(tooClose) continue;
    var dense=false;for(var ri=0;ri<this.resources.length;ri++){var r=this.resources[ri];if(r.kind!=='tree') continue;if(Math.hypot(r.x-x,r.y-y)<68){dense=true;break;}}
    if(dense) continue;this.resources.push(new Resource(x,y,'tree',150));}
};
Game.prototype.spawnBases=function(){
  var coords=this.map.bases;var i=0;
  for(var si=0;si<this.config.slots.length;si++){
    var slot=this.config.slots[si];if(slot.type==='empty') continue;
    if(i>=coords.length) break;
    var base=coords[i++];if(!RACES[slot.race]) continue;
    var owner=(slot.type==='player')?'player':'bot';
    this.spawnBase(base.x*this.tileSize,base.y*this.tileSize,slot.team,RACES[slot.race],owner);
  }
};
Game.prototype.spawnBase=function(x,y,team,race,owner){
  var th=new Building(x,y,team,race.buildings.townhall,race.id);th.owner=owner;this.buildings.push(th);
  var rand=mulberry32(hashString(this.map.id+'_b_'+team+'_'+Math.floor(x)+'_'+Math.floor(y)));
  var goldX=null,goldY=null;var baseAng=rand()*Math.PI*2;
  for(var attempt=0;attempt<8&&goldX===null;attempt++){var ang=baseAng+attempt*(Math.PI*2/8),dist=380+rand()*70;
    var gx=x+Math.cos(ang)*dist,gy=y+Math.sin(ang)*dist;if(gx<150||gy<150||gx>this.W-150||gy>this.H-150) continue;
    var ok=true;for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.kind==='townhall'&&b.team!==team){var ddx=b.x-gx,ddy=b.y-gy;if(ddx*ddx+ddy*ddy<400*400){ok=false;break;}}}
    if(!ok) continue;
    for(var ri=0;ri<this.resources.length;ri++){var rr=this.resources[ri];if(rr.kind==='gold'){var dx2=rr.x-gx,dy2=rr.y-gy;if(dx2*dx2+dy2*dy2<150*150){ok=false;break;}}}
    if(!ok) continue;var dxh=gx-x,dyh=gy-y;if(dxh*dxh+dyh*dyh<320*320) continue;goldX=gx;goldY=gy;}
  if(goldX===null){var ang2=baseAng;goldX=Math.max(150,Math.min(this.W-150,x+Math.cos(ang2)*420));goldY=Math.max(150,Math.min(this.H-150,y+Math.sin(ang2)*420));}
  this.resources.push(new Resource(goldX,goldY,'gold',GOLD_AMOUNT));
  for(var i2=0;i2<15;i2++){var a=rand()*Math.PI*2,r2=380+rand()*220;
    var tx=x+Math.cos(a)*r2,ty=y+Math.sin(a)*r2;if(tx<80||ty<80||tx>this.W-80||ty>this.H-80) continue;
    var dxb=tx-x,dyb=ty-y;if(dxb*dxb+dyb*dyb<280*280) continue;
    var dxg=tx-goldX,dyg=ty-goldY;if(dxg*dxg+dyg*dyg<120*120) continue;
    if(this.isOnPath(tx,ty,75)) continue;var bad=false;
    for(var bi2=0;bi2<this.buildings.length;bi2++){var b2=this.buildings[bi2];var dx3=b2.x-tx,dy3=b2.y-ty;var r3=b2.radius+30;if(dx3*dx3+dy3*dy3<r3*r3){bad=true;break;}}
    if(bad) continue;
    for(var ri2=0;ri2<this.resources.length;ri2++){var rr2=this.resources[ri2];if(rr2.dead) continue;var dx4=rr2.x-tx,dy4=rr2.y-ty;var r4=rr2.radius+50;if(dx4*dx4+dy4*dy4<r4*r4){bad=true;break;}}
    if(bad) continue;this.resources.push(new Resource(tx,ty,'tree',150));}
  for(var wi=0;wi<3;wi++){var aw=(wi/3)*Math.PI*2;var wx=x+Math.cos(aw)*180,wy=y+Math.sin(aw)*180;var u=new Unit(wx,wy,team,race.units.worker,race.id);u.owner=owner;u.spawnT=0.4+wi*0.1;this.units.push(u);}
};
Game.prototype.spawnAI=function(){
  this.ai=[];var coords=this.map.bases;var bi=0;
  for(var si=0;si<this.config.slots.length;si++){
    var s=this.config.slots[si];if(s.type==='empty') continue;
    var base=coords[bi++];if(!base) break;
    if(s.type!=='bot') continue;
    try{this.ai.push(new AIController(this,s.team,s.race,base.x*this.tileSize,base.y*this.tileSize));}catch(e){}
  }
};
Game.prototype.initFog=function(){var cs=this.fogCellSize;var cols=Math.ceil(this.W/cs),rows=Math.ceil(this.H/cs);this.fogCols=cols;this.fogRows=rows;this.fog=new Uint8Array(cols*rows);this.vis=new Uint8Array(cols*rows);};
Game.prototype.updateFog=function(){var cs=this.fogCellSize,cols=this.fogCols,rows=this.fogRows;var i;for(i=0;i<this.vis.length;i++) this.vis[i]=0;
  var reveal=function(cx,cy,r){for(var dx=-r;dx<=r;dx++){var x=cx+dx;if(x<0||x>=cols) continue;for(var dy=-r;dy<=r;dy++){var y=cy+dy;if(y<0||y>=rows) continue;if(dx*dx+dy*dy<=r*r){var idx=x+y*cols;this.vis[idx]=1;this.fog[idx]=2;}}}}.bind(this);
  for(i=0;i<this.units.length;i++){var u=this.units[i];if(u.team===this.playerTeam&&!u.dying) reveal(Math.floor(u.x/cs),Math.floor(u.y/cs),4);}
  for(i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team===this.playerTeam) reveal(Math.floor(b.x/cs),Math.floor(b.y/cs),6);}
  for(i=0;i<cols*rows;i++){if(!this.vis[i]&&this.fog[i]===2) this.fog[i]=1;}};
Game.prototype.isVisible=function(x,y){var cs=this.fogCellSize;var cx=Math.floor(x/cs),cy=Math.floor(y/cs);if(cx<0||cy<0||cx>=this.fogCols||cy>=this.fogRows) return false;return this.vis[cx+cy*this.fogCols]===1;};
Game.prototype.buildTeamVision=function(){
  for(var t in this.teamVision) this.teamVision[t].clear();
  var cs=this.fogCellSize;var i,j;
  for(i=0;i<this.units.length;i++){var u=this.units[i];if(u.dying) continue;
    if(!this.teamVision[u.team]) this.teamVision[u.team]=new Set();
    var cx=Math.floor(u.x/cs),cy=Math.floor(u.y/cs);
    for(var dx=-4;dx<=4;dx++) for(var dy=-4;dy<=4;dy++) if(dx*dx+dy*dy<=16) this.teamVision[u.team].add((cx+dx)+','+(cy+dy));
  }
  for(i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.dead) continue;
    if(!this.teamVision[b.team]) this.teamVision[b.team]=new Set();
    var cx2=Math.floor(b.x/cs),cy2=Math.floor(b.y/cs);
    for(var dx2=-6;dx2<=6;dx2++) for(var dy2=-6;dy2<=6;dy2++) if(dx2*dx2+dy2*dy2<=36) this.teamVision[b.team].add((cx2+dx2)+','+(cy2+dy2));
  }
};
Game.prototype.isVisibleToTeam=function(x,y,team){if(!this.teamVision[team]) return false;var cs=this.fogCellSize;return this.teamVision[team].has(Math.floor(x/cs)+','+Math.floor(y/cs));};
Game.prototype.isExplored=function(x,y){var cs=this.fogCellSize;var cx=Math.floor(x/cs),cy=Math.floor(y/cs);if(cx<0||cy<0||cx>=this.fogCols||cy>=this.fogRows) return false;return this.fog[cx+cy*this.fogCols]>0;};
Game.prototype.buildSpatialGrid=function(){this.spatialGrid={};var cs=this.spatialCell;for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var key=(u.x/cs|0)+','+(u.y/cs|0);if(!this.spatialGrid[key]) this.spatialGrid[key]=[];this.spatialGrid[key].push(u);}};
Game.prototype.updateAuras=function(){this.auraCache.hp={};this.auraCache.dmg={};for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(!b.completed||b.dead) continue;if(b.aura==='hp'){var r=b.radius+260;for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.dead||u.team!==b.team||u.role==='worker') continue;var dx=u.x-b.x,dy=u.y-b.y;if(dx*dx+dy*dy<r*r) this.auraCache.hp[u.id]=true;}}if(b.aura==='dmg'){var r2=b.radius+260;for(var ui2=0;ui2<this.units.length;ui2++){var u2=this.units[ui2];if(u2.dead||u2.team!==b.team||u2.role==='worker') continue;var dx2=u2.x-b.x,dy2=u2.y-b.y;if(dx2*dx2+dy2*dy2<r2*r2) this.auraCache.dmg[u2.id]=true;}}}};
Game.prototype.getAuraMul=function(u){if(u.role==='worker') return {hp:1,dmg:1,wood:1};return {hp:this.auraCache.hp[u.id]?1.15:1,dmg:this.auraCache.dmg[u.id]?1.15:1,wood:1};};
Game.prototype.getLumberBonus=function(u){for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(!b.completed||b.dead||b.kind!=='lumber') continue;if(b.owner===u.owner) return 1.25;}return 1;};
Game.prototype.updateResource=function(r,dt){if(r.dead) return;if(r.falling){r.fallT+=dt;r.fallAngle=Math.min(Math.PI/2,r.fallT*(Math.PI/2/0.6));if(r.fallT>1.5){r.dead=true;}}};

Game.prototype.update=function(dt){
  if(this.gameOver||this.paused) return;
  this.time+=dt;
  if(this.shake>0) this.shake-=dt*3;
  this.buildSpatialGrid();
  this.auraTimer-=dt;
  if(this.auraTimer<=0){this.auraTimer=this.auraInterval;this.updateAuras();}
  var i;
  for(i=0;i<this.units.length;i++) if(!this.units[i].dead) this.updateUnit(this.units[i],dt);
  for(i=0;i<this.buildings.length;i++) if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);
  for(i=0;i<this.resources.length;i++) if(!this.resources[i].dead) this.updateResource(this.resources[i],dt);
  for(i=0;i<this.projectiles.length;i++){
    var p=this.projectiles[i];if(p.dead) continue;p.prevX=p.x;p.prevY=p.y;
    var dx=p.tx-p.x,dy=p.ty-p.y;var d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=(dx/d)*p.spd*dt;p.y+=(dy/d)*p.spd*dt;p.ttl-=dt;
  }
  this.particles.update(dt);
  for(i=0;i<this.floaters.length;i++){var f2=this.floaters[i];if(f2.dead) continue;f2.y-=30*dt;f2.life-=dt;if(f2.life<=0) f2.dead=true;}
  for(i=0;i<this.decals.length;i++){var d2=this.decals[i];d2.life-=dt;if(d2.life<=0) d2.dead=true;}
  this.units=this.units.filter(function(u){return !u.dead;});
  this.buildings=this.buildings.filter(function(b){return !b.dead;});
  this.resources=this.resources.filter(function(r){return !r.dead;});
  this.projectiles=this.projectiles.filter(function(p){return !p.dead;});
  this.floaters=this.floaters.filter(function(f){return !f.dead;});
  if(this.decals.length>30) this.decals=this.decals.slice(-30);
  this.decals=this.decals.filter(function(d){return !d.dead;});
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.buildTeamVision();this.fogTimer=this.fogInterval;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){}}
  this.checkVictory();
  if(this.notifications.length){for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}}
};
Game.prototype.updateUnit=function(u,dt){
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.dying){u.deathT+=dt;if(u.deathT>1.2){u.dead=true;this.decals.push(new BloodDecal(u.x,u.y+6,u.radius*2));}return;}
  if(u.hp<=0){u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;this.spawnParticles(u.x,u.y,'#8a1010',10,true);if(u.team===this.playerTeam) Audio.sfx('death');this.decals.push(new BloodDecal(u.x,u.y+4,u.radius*1.6));if(u.isHero&&u.team===this.playerTeam) this.notify(t('hero_died'));return;}
  u.animT+=dt;if(u.hitFlash>0) u.hitFlash-=dt;if(u.atkCd>0) u.atkCd-=dt;if(u.attackT>0) u.attackT-=dt*4;
  if(Math.abs(u.hitKbX)>0.5||Math.abs(u.hitKbY)>0.5){u.x=this.clampX(u.x+u.hitKbX);u.y=this.clampY(u.y+u.hitKbY);u.hitKbX*=.85;u.hitKbY*=.85;if(Math.abs(u.hitKbX)<0.3) u.hitKbX=0;if(Math.abs(u.hitKbY)<0.3) u.hitKbY=0;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;

Game.prototype.returnRes=function(u,dt){var th=null,bd=Infinity;for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team!==u.team||b.kind!=='townhall'||b.dead) continue;var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);if(d<bd){bd=d;th=b;}}if(!th){u.carrying=null;u.carryAmount=0;u.gatherTarget=null;return;}var dx=th.x-u.x,dy=th.y-u.y;var d2=Math.sqrt(bd);var reach=th.radius+40;if(d2>reach){var spd=u.spd*dt;var step=Math.min(spd,d2-reach+2);u.x=this.clampX(u.x+(dx/d2)*step);u.y=this.clampY(u.y+(dy/d2)*step);u.dir=dirFromVec(dx,dy);u.moving=true;u._stuckTimer+=dt;if(u._stuckTimer>5){u._stuckTimer=0;u.carrying=null;u.carryAmount=0;}}else{var gained=0,icon='';if(u.carrying==='gold'){this.addRes(u.team,u.carryAmount,0);gained=u.carryAmount;icon='💰';}else if(u.carrying==='tree'){this.addRes(u.team,0,u.carryAmount);gained=u.carryAmount;icon='🪵';}if(gained>0&&u.team===this.playerTeam){this.floaters.push(new FloatingText(u.x,u.y-30,'+'+gained+icon,u.carrying==='gold'?'#ffe066':'#a08050'));}u.carrying=null;u.carryAmount=0;u._stuckTimer=0;var sameKind=icon==='💰'?'gold':'tree';var nr=this.findNearestResource(u.x,u.y,sameKind)||this.findNearestResource(u.x,u.y,null);if(nr&&Math.hypot(nr.x-u.x,nr.y-u.y)<1200) u.gatherTarget=nr;else u.gatherTarget=null;}};
Game.prototype.doBuild=function(u,dt){var b=u.buildTarget;if(!b||b.dead){u.buildTarget=null;return;}var dx=b.x-u.x,dy=b.y-u.y;var d=Math.hypot(dx,dy);var reach=b.radius+45;if(d>reach){var spd=u.spd*dt;var step=Math.min(spd,d-reach+2);u.x=this.clampX(u.x+(dx/d)*step);u.y=this.clampY(u.y+(dy/d)*step);u.dir=dirFromVec(dx,dy);u.moving=true;u._stuckTimer+=dt;if(u._stuckTimer>5){var ang=Math.atan2(u.y-b.y,u.x-b.x);u.x=this.clampX(b.x+Math.cos(ang)*(reach+5));u.y=this.clampY(b.y+Math.sin(ang)*(reach+5));u._stuckTimer=0;}}else{u.moving=false;u.dir=dirFromVec(dx,dy);u._stuckTimer=0;if(!b.completed){b.buildProgress+=dt;if(b.buildProgress>=b.buildTime){b.completed=true;b._stuckCounter=0;u.buildTarget=null;if(b.team===this.playerTeam) this.notify(t('building_done')+' '+kindName(b.kind));}}}else u.buildTarget=null;}};

Game.prototype.applyRightClickWorld=function(wx,wy,sel){
  var z=this.camera.zoom||1;
  var wi;
  var bestB=null,bestBD=1e9;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead) continue;
    var dx2=b.x-wx,dy2=b.y-wy;var d2b=dx2*dx2+dy2*dy2;
    var r=b.completed?(b.radius+20/z):(b.radius+55/z);
    if(d2b<r*r&&d2b<bestBD){bestBD=d2b;bestB=b;}
  }
  var bestU=null,bestUD=1e9;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var dx=u.x-wx,dy=u.y-wy;var d2=dx*dx+dy*dy;if(d2<bestUD){bestUD=d2;bestU=u;}}
  var pickR=Math.min(42/z,65);
  var pickUnit=(bestU&&bestUD<pickR*pickR)?bestU:null;
  var pickBuilding=bestB;
  var selTeam=(sel&&sel.length)?sel[0].team:this.playerTeam;
  var selOwner=(sel&&sel.length)?sel[0].owner:'player';

  if(pickUnit&&pickUnit.team!==selTeam){
    for(wi=0;wi<sel.length;wi++){sel[wi].target=pickUnit;sel[wi].moveTo=null;sel[wi].gatherTarget=null;}
    Audio.sfx('notify');return;
  }
  if(pickBuilding){
    var b2=pickBuilding;
    if(b2.team===selTeam&&b2.owner===selOwner){
      var workers=[];for(wi=0;wi<sel.length;wi++) if(sel[wi].role==='worker') workers.push(sel[wi]);
      if(workers.length){
        if(!b2.completed){
          for(wi=0;wi<workers.length;wi++){
            var wk=workers[wi];wk.buildTarget=b2;wk.gatherTarget=null;wk.moveTo=null;wk.repairTarget=null;
            wk.carrying=null;wk.carryAmount=0;wk.target=null;wk._stuckTimer=0;
          }
          b2._stuckCounter=0;Audio.sfx('build');return;
        }
        if(b2.hp<b2.maxHp){
          for(wi=0;wi<workers.length;wi++){
            var wk2=workers[wi];wk2.repairTarget=b2;wk2.buildTarget=null;wk2.gatherTarget=null;
            wk2.moveTo=null;wk2.target=null;wk2.repairAccum=0;
          }
          Audio.sfx('repair');return;
        }
      }
    } else {
      for(wi=0;wi<sel.length;wi++){sel[wi].target=b2;sel[wi].moveTo=null;sel[wi].gatherTarget=null;}
      Audio.sfx('notify');return;
    }
  }
  var bestR=null,bestRD=1e9;
  for(var ri=0;ri<this.resources.length;ri++){
    var r2=this.resources[ri];if(r2.dead||r2.falling) continue;
    var dxr=r2.x-wx,dyr=r2.y-wy;var d2r=dxr*dxr+dyr*dyr;
    var rr=r2.radius+Math.min(35/z,60);
    if(d2r<rr*rr&&d2r<bestRD){bestRD=d2r;bestR=r2;}
  }
  if(bestR){
    for(wi=0;wi<sel.length;wi++){
      var u2=sel[wi];
      if(u2.role==='worker'){
        u2.gatherTarget=bestR;u2.target=null;u2.moveTo=null;u2.buildTarget=null;u2.repairTarget=null;
        u2.carrying=null;u2.carryAmount=0;u2._stuckTimer=0;u2.gatherProgress=0;u2.gatherAnimT=0;
      } else u2.moveTo={x:wx,y:wy};
    }
    Audio.sfx('click');return;
  }
  var formation=Input.formation||'box';
  if(sel.length===1){
    sel[0].moveTo={x:wx,y:wy};sel[0].target=null;sel[0].gatherTarget=null;
    sel[0].buildTarget=null;sel[0].repairTarget=null;
  } else {
    var avgX=0,avgY=0;
    for(wi=0;wi<sel.length;wi++){avgX+=sel[wi].x;avgY+=sel[wi].y;}
    avgX/=sel.length;avgY/=sel.length;
    var angle=Math.atan2(wy-avgY,wx-avgX);
    var positions=this.getFormationPositions(wx,wy,sel.length,formation,angle);
    for(wi=0;wi<sel.length;wi++){
      sel[wi].moveTo=positions[wi];sel[wi].target=null;sel[wi].gatherTarget=null;
      sel[wi].buildTarget=null;sel[wi].repairTarget=null;
    }
  }
  Audio.sfx('click');
};

/* ==================== AI ==================== */
function AIController(game,team,raceId,homeX,homeY){
  this.g=game;this.team=team;this.race=RACES[raceId];this.raceId=raceId;
  this.strategy=['rush','boom','turtle','balanced'][Math.floor(Math.random()*4)];
  this.atkTimer=15;this.buildTimer=3;this.trainTimer=2;this.workerTimer=2;
  this.homeX=homeX||0;this.homeY=homeY||0;
  this.memory=game.getTeamMemory(team);
  this.myKey=team+'_'+raceId+'_'+Math.floor(this.homeX);
  this.memory.allyBasePositions[this.myKey]={x:this.homeX,y:this.homeY};
  this.underAttack=false;this.attackResponse=0;this.threatTimer=0;
}
AIController.prototype.getNearestTeamTownhall=function(x,y){var best=null,bd=Infinity;for(var i=0;i<this.g.buildings.length;i++){var b=this.g.buildings[i];if(b.team!==this.team||b.kind!=='townhall'||b.dead) continue;var d=(b.x-x)*(b.x-x)+(b.y-y)*(b.y-y);if(d<bd){bd=d;best=b;}}return best;};
AIController.prototype.update=function(dt){
  var g=this.g;if(!g||g.gameOver) return;
  this.updateMemory();
  this.threatTimer-=dt;if(this.threatTimer<=0){this.threatTimer=1;this.detectThreats();}
  if(this.underAttack&&this.attackResponse>0) this.attackResponse-=dt;else if(this.attackResponse<=0) this.underAttack=false;
  this.workerTimer-=dt;if(this.workerTimer<=0){this.workerTimer=2;this.assignWorkers();}
  this.buildTimer-=dt;if(this.buildTimer<=0){this.buildTimer=4;this.tryBuild();}
  this.trainTimer-=dt;if(this.trainTimer<=0){this.trainTimer=3;this.tryTrain();}
  if(this.underAttack) this.defend();
  this.atkTimer-=dt;if(this.atkTimer<=0){this.atkTimer=45;this.tryAttack();}
};
AIController.prototype.updateMemory=function(){var g=this.g,mem=this.memory,t=g.time;var id,m;
  for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.team===this.team||u.dying) continue;if(g.isVisibleToTeam(u.x,u.y,this.team)) mem.enemyUnits[u.id]={x:u.x,y:u.y,t:t};}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team||b.dead) continue;if(g.isVisibleToTeam(b.x,b.y,this.team)) mem.enemyBuildings[b.id]={x:b.x,y:b.y,t:t,kind:b.kind};}
  for(id in mem.enemyUnits){m=mem.enemyUnits[id];if(t-m.t>30) delete mem.enemyUnits[id];}
  for(id in mem.enemyBuildings){m=mem.enemyBuildings[id];if(t-m.t>90) delete mem.enemyBuildings[id];}};
AIController.prototype.detectThreats=function(){var threats=0;for(var i=0;i<this.g.units.length;i++){var u=this.g.units[i];if(u.team===this.team||u.dying) continue;var dx=u.x-this.homeX,dy=u.y-this.homeY;if(dx*dx+dy*dy<700*700) threats++;}if(threats>=2){this.underAttack=true;this.attackResponse=20;}};
AIController.prototype.assignWorkers=function(){var g=this.g;for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.team!==this.team||u.owner!=='bot'||u.role!=='worker'||u.dying) continue;if(u.buildTarget||u.repairTarget) continue;if(u.gatherTarget&&!u.gatherTarget.dead&&u.gatherTarget.amount>0) continue;if(u.carrying&&u.carryAmount>=10) continue;var node=this.pickRes(u);if(node) u.gatherTarget=node;}};
AIController.prototype.pickRes=function(u){var g=this.g;var best=null,bs=-1;var hx=this.homeX,hy=this.homeY;for(var i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||r.amount<=0||r.falling) continue;var dh=(r.x-hx)*(r.x-hx)+(r.y-hy)*(r.y-hy);if(dh>2000*2000) continue;var d=Math.hypot(r.x-u.x,r.y-u.y);if(d>1500) continue;var sc=1000-d;if(sc>bs){bs=sc;best=r;}}return best;};
AIController.prototype.tryBuild=function(){
  var g=this.g,res=g.getRes(this.team);var th=this.getNearestTeamTownhall(this.homeX,this.homeY);if(!th) return;
  var myBots=[];for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team&&b.owner==='bot'&&!b.dead) myBots.push(b);}
  var hasB=false,hasL=false,houses=0;
  for(var j=0;j<myBots.length;j++){var b2=myBots[j];if(b2.kind==='barracks') hasB=true;if(b2.kind==='lumber') hasL=true;if(b2.kind==='house') houses++;}
  var kind=null;if(!hasB) kind='barracks';else if(!hasL) kind='lumber';else if(houses<2) kind='house';else if(res.pop>=res.maxPop-1) kind='house';
  if(!kind) return;

  if(res.gold<def.costGold||res.wood<def.costWood) return;
  var w=null;for(var k=0;k<g.units.length;k++){var u=g.units[k];if(u.team===this.team&&u.owner==='bot'&&u.role==='worker'&&!u.buildTarget&&!u.repairTarget&&!u.dying){w=u;break;}}
  if(!w) return;
  for(var a=0;a<12;a++){
    var ang=Math.random()*Math.PI*2,r=200+Math.random()*120;
    var bx=th.x+Math.cos(ang)*r,by=th.y+Math.sin(ang)*r;
    if(bx<50||by<50||bx>g.W-50||by>g.H-50) continue;
    var ov=false;for(var ob=0;ob<g.buildings.length;ob++){var bb=g.buildings[ob];var dx=bb.x-bx,dy=bb.y-by;var rr=bb.radius+70;if(dx*dx+dy*dy<rr*rr){ov=true;break;}}

    var nb=new Building(bx,by,this.team,def,this.race.id);nb.completed=false;nb.buildProgress=0;nb.owner='bot';nb.spawnT=0.5;
    g.buildings.push(nb);g.subRes(this.team,def.costGold,def.costWood);
    w.buildTarget=nb;w.gatherTarget=null;w.moveTo=null;return;
  }
};
AIController.prototype.tryTrain=function(){
  var g=this.g,res=g.getRes(this.team);var thLvl=g.getTownhallLevel(this.team);
  var buildings=[];for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team&&b.owner==='bot'&&b.completed) buildings.push(b);}
  if(res.pop>=res.maxPop) return;
  var roles=['worker','melee','ranged','spear'];
  for(var ri=0;ri<roles.length;ri++){
    var role=roles[ri];var cfg=UNIT_UNLOCK[role];if(!cfg||cfg.thLevel>thLvl) continue;
    var bld=null;for(var bi=0;bi<buildings.length;bi++) if(buildings[bi].kind===cfg.building){bld=buildings[bi];break;}
    if(!bld||bld.queue.length>=3) continue;
    var def=this.race.units[role];if(!def) continue;
    if(res.gold<def.costGold||res.wood<def.costWood) continue;
    if(Math.random()<0.5){g.subRes(this.team,def.costGold,def.costWood);bld.queue.push({role:role,race:this.race.id,timeLeft:def.buildTime,timeTotal:def.buildTime});return;}
  }
};
AIController.prototype.defend=function(){var g=this.g;var bestE=null,bestD=800*800;for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.team===this.team||u.dying) continue;var dx=u.x-this.homeX,dy=u.y-this.homeY;var d2=dx*dx+dy*dy;if(d2<bestD){bestD=d2;bestE=u;}}if(!bestE) return;
  for(var j=0;j<g.units.length;j++){var u2=g.units[j];if(u2.team!==this.team||u2.owner!=='bot'||u2.role==='worker'||u2.dying) continue;if(u2.target&&!u2.target.dead) continue;u2.target=bestE;u2.stance='aggressive';}};
AIController.prototype.tryAttack=function(){
  var g=this.g;if(this.underAttack) return;
  var myF=[];for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.team===this.team&&u.owner==='bot'&&u.role!=='worker'&&!u.dying) myF.push(u);}
  if(myF.length<6) return;var target=null;
  for(var bi=0;bi<g.buildings.length;bi++){var b=g.buildings[bi];if(b.dead||b.team===this.team) continue;if(!g.isVisibleToTeam(b.x,b.y,this.team)) continue;target=b;break;}
  if(!target) return;for(var fi=0;fi<myF.length;fi++){myF[fi].target=target;myF[fi].stance='aggressive';}
};

/* ==================== RENDERER ==================== */
function Renderer(canvas,game){
  this.cv=canvas;this.ctx=canvas.getContext('2d');this.g=game;
  this.dpr=Math.min(window.devicePixelRatio||1,Settings.graphics.quality==='low'?1:2);

Renderer.prototype.destroy=function(){window.removeEventListener('resize',this._rh);this.g=null;};
Renderer.prototype.resize=function(){if(!this.cv) return;this.w=this.cv.clientWidth||window.innerWidth;this.h=this.cv.clientHeight||window.innerHeight;this.cv.width=Math.floor(this.w*this.dpr);this.cv.height=Math.floor(this.h*this.dpr);this._vign=null;clampCamera();};

Renderer.prototype.s2w=function(sx,sy){var c=this.g.camera;return{x:(sx-this.w/2)/c.zoom+c.x,y:(sy-this.h/2)/c.zoom+c.y};};

  for(i=0;i<g.decor.length;i++){

  for(i=0;i<g.buildings.length;i++){var b2=g.buildings[i];if(b2.dead) continue;if(b2.team!==g.playerTeam&&!g.isVisible(b2.x,b2.y)) continue;items.push({t:'b',o:b2,y:b2.y+b2.radius*.5});}

    else if(it.t==='u'){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(pp.x,pp.y+3*cam.zoom,14*cam.zoom,5*cam.zoom,0,0,Math.PI*2);ctx.fill();}
  }
  if(UI._placingKind&&Input.mouseInside){
    var w=this.s2w(Input.mouseX,Input.mouseY);var ps=null;
    for(var psi=0;psi<g.config.slots.length;psi++) if(g.config.slots[psi].type==='player'&&g.config.slots[psi].team===g.playerTeam){ps=g.config.slots[psi];break;}

  for(i=0;i<items.length;i++){var it2=items[i];if(it2.t==='r') this.drawResource(it2.o);else if(it2.t==='b') this.drawBuilding(it2.o);else this.drawUnit(it2.o);}
  for(i=0;i<g.projectiles.length;i++){

function renderMapPreview(canvas,map){
  var ctx=canvas.getContext('2d');var W=canvas.width,H=canvas.height;
  var biome=BIOMES[map.biome]||BIOMES.grassland;
  ctx.fillStyle='rgb('+biome.base[0]+','+biome.base[1]+','+biome.base[2]+')';ctx.fillRect(0,0,W,H);
  var ts=map.size;
  for(var i=0;i<ts;i+=4) for(var j=0;j<ts;j+=4){
    var seed=((i*73856093)^(j*19349663))%100/100;
    var base=(i+j)%2===0?biome.base:biome.alt;
    var r=base[0]+(seed-0.5)*12,gg=base[1]+(seed-0.5)*14,b=base[2]+(seed-0.5)*10;
    ctx.fillStyle='rgb('+(r|0)+','+(gg|0)+','+(b|0)+')';
    ctx.fillRect(i/ts*W,j/ts*H,W*4/ts+1,H*4/ts+1);
  }
  var ts2=64;var total=map.size*ts2;
  var rand=mulberry32(hashString(map.id+'_paths'));
  ctx.strokeStyle='rgba('+biome.path[0]+','+biome.path[1]+','+biome.path[2]+',0.55)';
  ctx.lineWidth=Math.max(1,W/100);ctx.lineCap='round';
  var goldPts=map.gold.map(function(g){return {x:g.x*ts2,y:g.y*ts2};});
  var basePts=map.bases.map(function(b){return {x:b.x*ts2,y:b.y*ts2};});
  for(var bi=0;bi<basePts.length;bi++){
    var bp=basePts[bi];var sorted=[];
    for(var gi=0;gi<goldPts.length;gi++){var gp=goldPts[gi];sorted.push({x:gp.x,y:gp.y,d:Math.hypot(gp.x-bp.x,gp.y-bp.y)});}
    sorted.sort(function(a,b){return a.d-b.d;});
    var cnt=Math.min(3,sorted.length);
    for(var k=0;k<cnt;k++){
      var g=sorted[k];if(g.d>ts2*70) continue;
      ctx.beginPath();ctx.moveTo(bp.x/total*W,bp.y/total*H);
      for(var s=1;s<5;s++){var t=s/5;ctx.lineTo((bp.x+(g.x-bp.x)*t+(rand()-0.5)*110)/total*W,(bp.y+(g.y-bp.y)*t+(rand()-0.5)*110)/total*H);}
      ctx.lineTo(g.x/total*W,g.y/total*H);ctx.stroke();
    }
  }
  for(var gi2=0;gi2<map.gold.length;gi2++){
    var gg=map.gold[gi2];var x=gg.x/map.size*W,y=gg.y/map.size*H;
    ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(x,y,W/36,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#5a3a10';ctx.lineWidth=1;ctx.stroke();
  }
  for(var fi=0;fi<map.forests.length;fi++){
    var f=map.forests[fi];var x2=f.cx/map.size*W,y2=f.cy/map.size*H;var r2=f.r/map.size*W;
    ctx.fillStyle='rgba(45,90,45,0.75)';ctx.beginPath();ctx.arc(x2,y2,r2,0,Math.PI*2);ctx.fill();
  }
  for(var bi2=0;bi2<map.bases.length;bi2++){
    var bx=map.bases[bi2].x/map.size*W,by=map.bases[bi2].y/map.size*H;
    ctx.fillStyle=teamColor(bi2);
    ctx.fillRect(bx-W/30,by-W/30,W/15,W/15);
    ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(bx-W/30,by-W/30,W/15,W/15);
  }
  ctx.strokeStyle='rgba(230,198,122,0.7)';ctx.lineWidth=2;ctx.strokeRect(0,0,W,H);
}

UISys.prototype.getActionsHash=function(){
  if(!Game_) return '';
  var g=Game_;var parts=[];
  for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.sel&&u.team===g.playerTeam&&u.owner==='player'&&!u.dying) parts.push('u'+u.id+'|'+u.role+'|'+Math.ceil(u.hp)+'|'+u.stance);}
  for(var bi=0;bi<g.buildings.length;bi++){var b=g.buildings[bi];if(b.sel&&b.team===g.playerTeam&&b.owner==='player'){var q='';for(var qi=0;qi<b.queue.length;qi++) q+=b.queue[qi].role.charAt(0);parts.push('b'+b.id+'|'+b.kind+'|'+Math.ceil(b.hp)+'|'+b.queue.length+'|'+q+'|'+(b.upgrading?1:0));}}
  if(parts.length===0) return '';

  if(sel.length){
    var workers=[],fighters=[];
    for(i=0;i<sel.length;i++){if(sel[i].role==='worker') workers.push(sel[i]);else fighters.push(sel[i]);}
    if(workers.length){
      var race=null;
      for(i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
      if(race){var ic=getIcon('building','house',race,g.playerTeam);this.addAction(box,ic,t('build'),null,function(){self.showBuildMenu();});}
    }
    if(fighters.length){
      this.addAction(box,'📏',t('line'),null,function(){Input.formation='line';self.showHint(t('line'),1);},Input.formation==='line');
      this.addAction(box,'📐',t('column'),null,function(){Input.formation='column';self.showHint(t('column'),1);},Input.formation==='column');
      this.addAction(box,'🔲',t('box'),null,function(){Input.formation='box';self.showHint(t('box'),1);},Input.formation==='box');
      this.addAction(box,'📍',t('hold'),null,function(){g.setStance('hold');},fighters[0].stance==='hold');
    }
    this.addAction(box,'⚔',t('all_units'),null,function(){g.selectAllCombat();});
    this.addAction(box,'⛏',t('all_workers'),null,function(){g.selectWorkers();});
    var dIcon=getIcon('deselect');this.addAction(box,dIcon,t('deselect'),null,function(){g.deselectAll();});
  }
  if(selB.length){
    var b2=selB[0];
    if(!b2.completed){
      var infoDiv=document.createElement('div');infoDiv.style.cssText='color:#a8c5d6;font-size:11px;padding:8px;text-align:center;grid-column:1/-1;background:rgba(0,0,0,.3);border-radius:4px';
      infoDiv.textContent=Math.floor((b2.buildProgress/b2.buildTime)*100)+'%';
      box.appendChild(infoDiv);
    }
    if(b2.kind!=='townhall'&&b2.completed){var di=getIcon('demolish');this.addAction(box,di,t('demolish'),null,function(){self.demolish(b2);});}
    if(b2.completed&&b2.kind==='townhall'){
      var lvl=b2.level||1;
      if(lvl<3&&!b2.upgrading){
        var cost=TH_UPGRADE_COST[lvl];var res=g.getRes(g.playerTeam);
        var can=res.gold>=cost.gold&&res.wood>=cost.wood;var ic2=getIcon('upgrade');
        this.addAction(box,ic2,t('upgrade')+' L'+(lvl+1),cost.gold+'💰 '+cost.wood+'🪵',function(){self.upgradeTownhall(b2);},false,!can);
      }
      var wdef=RACES[b2.race].units.worker;var wi=getIcon('unit','worker',b2.race,b2.team);
      this.addAction(box,wi,roleName('worker'),wdef.costGold+'💰',function(){self.queueUnit(b2,'worker');});
    } else if(b2.completed){
      var thLvl=g.getTownhallLevel(g.playerTeam);var roles=[];
      for(i=0;i<ALL_TRAINABLE.length;i++){var role=ALL_TRAINABLE[i];var cfg=UNIT_UNLOCK[role];if(!cfg) continue;if(cfg.building!==b2.kind) continue;if(cfg.thLevel>thLvl) continue;roles.push(role);}
      if(b2.kind==='forge'){
        for(var ui=0;ui<UPGRADE_ROLES.length;ui++){
          (function(role){
            var up=g.getUnitUpgrades(g.playerTeam,role);var rdef=RACES[b2.race].units[role];if(!rdef) return;
            var icW=getIcon('unit',role,b2.race,b2.team);
            if(up.weapon<3){var cw=UPGRADE_COST[up.weapon];var canW=g.getRes(g.playerTeam).gold>=cw.gold;
              self.addAction(box,icW,'⚔'+roleName(role),cw.gold+'💰',function(){self.upgradeUnitStat(role,'weapon');},false,!canW);}
            if(up.armor<3){var ca=UPGRADE_COST[up.armor];var canA=g.getRes(g.playerTeam).gold>=ca.gold;
              self.addAction(box,icW,'🛡'+roleName(role),ca.gold+'💰',function(){self.upgradeUnitStat(role,'armor');},false,!canA);}
          })(UPGRADE_ROLES[ui]);
        }
      }
      if(roles.length){
        for(i=0;i<roles.length;i++){
          (function(r){
            var def=RACES[b2.race].units[r];if(!def) return;
            if(r==='hero'){
              var alive=0;for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===g.playerTeam&&hu.owner==='player'&&!hu.dying) alive++;}
              if(alive>=1){return;}
              var hIcon=getIcon('unit','hero',b2.race,b2.team);
              self.addAction(box,hIcon,heroName(b2.race),def.costGold+'💰',function(){self.queueUnit(b2,'hero');});
            }
            else{var ic2=getIcon('unit',r,b2.race,b2.team);var price=def.costGold+'💰';self.addAction(box,ic2,roleName(r),price,function(){self.queueUnit(b2,r);});}
          })(roles[i]);
        }
      }
    }
    if(b2.queue.length>0){
      var ci=getIcon('cancel');
      this.addAction(box,ci,t('cancel'),null,function(){b2.queue.shift();self.renderActions(true);});
    }
    var dIcon2=getIcon('deselect');this.addAction(box,dIcon2,t('deselect'),null,function(){g.deselectAll();});
  }
};
UISys.prototype.showBuildMenu=function(){
  var box=this.$('actions');box.innerHTML='';box.dataset.menu='build';if(!Game_) return;
  var g=Game_;var self=this;var race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var rdef=RACES[race];if(!rdef) return;
  var thLvl=g.getTownhallLevel(g.playerTeam);var unlocked=BUILDING_UNLOCK_BY_TH[thLvl]||BUILDING_UNLOCK_BY_TH[1];
  for(var k=0;k<unlocked.length;k++){
    (function(kind){var def=rdef.buildings[kind];if(!def) return;var ic=getIcon('building',kind,race,g.playerTeam);var price=def.costGold+'💰 '+def.costWood+'🪵';self.addAction(box,ic,kindName(kind),price,function(){self.startPlacement(kind);});})(unlocked[k]);
  }
  var back=document.createElement('button');back.className='act-btn';back.innerHTML='<div class="ico">↩</div><div class="lbl">'+t('btn_back')+'</div>';
  back.onclick=function(){Audio.sfx('click');box.dataset.menu='';self.renderActions(true);};box.appendChild(back);
};
UISys.prototype.startPlacement=function(kind){
  if(!Game_) return;
  var g=Game_;var race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var def=RACES[race].buildings[kind];if(!def) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.costGold){g.notify(t('not_enough_gold'));return;}
  if(res.wood<def.costWood){g.notify(t('not_enough_wood'));return;}
  this._placingKind=kind;this._placingRace=race;this.$('place-name').textContent=kindName(kind);this.$('placement-bar').classList.add('show');
  var box=this.$('actions');box.innerHTML='';
  var cancel=document.createElement('button');cancel.className='act-btn';cancel.innerHTML='<div class="ico">✖</div><div class="lbl">'+t('cancel')+'</div>';
  cancel.onclick=function(){Audio.sfx('click');UI.cancelPlacement();};
  box.appendChild(cancel);box.dataset.menu='placing';
};
UISys.prototype.cancelPlacement=function(){this._placingKind=null;this._placingRace=null;this.$('placement-bar').classList.remove('show');var box=this.$('actions');if(box.dataset.menu==='placing'){box.dataset.menu='';this.renderActions(true);}};
UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;var g=Game_;var size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  var i;
  for(i=0;i<g.buildings.length;i++){var ob=g.buildings[i];var dx=ob.x-x,dy=ob.y-y;var rr=ob.radius+size+8;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var rr2=g.resources[i];if(rr2.dead) continue;var dx2=rr2.x-x,dy2=rr2.y-y;var r2=rr2.radius+size-6;if(dx2*dx2+dy2*dy2<r2*r2) return false;}
  var near=false;
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team!==g.playerTeam||b.owner!=='player') continue;var d=Math.hypot(b.x-x,b.y-y);if(d<700){near=true;break;}}
  return near;
};
UISys.prototype.tryPlaceAt=function(x,y){
  if(!this._placingKind||!Game_) return;
  var g=Game_;var kind=this._placingKind;var race=this._placingRace;
  if(!race) return;
  var def=RACES[race].buildings[kind];if(!def){this.cancelPlacement();return;}
  if(!this.canPlaceAt(x,y,def)){g.notify(t('cannot_build_here'));return;}
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.costGold){g.notify(t('not_enough_gold'));this.cancelPlacement();return;}
  if(res.wood<def.costWood){g.notify(t('not_enough_wood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.team===g.playerTeam&&u2.owner==='player'&&u2.role==='worker'&&!u2.dying&&!u2.buildTarget&&!u2.gatherTarget&&!u2.carrying&&!u2.repairTarget){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.team===g.playerTeam&&u3.owner==='player'&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t('no_free_worker'));this.cancelPlacement();return;}
  g.subRes(g.playerTeam,def.costGold,def.costWood);
  var b=new Building(x,y,g.playerTeam,def,race);b.completed=false;b.buildProgress=0;b.owner='player';b.spawnT=0.5;
  g.buildings.push(b);
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.carrying=null;w.carryAmount=0;w.target=null;w._stuckTimer=0;
  Audio.sfx('build');
  this.cancelPlacement();g.notify(t('building_done')+' '+kindName(kind));
};
UISys.prototype.demolish=function(b){
  var g=Game_;if(!g||!b) return;
  if(b.kind==='townhall') return;
  if(!confirm(t('demolish_confirm')+' '+kindName(b.kind)+'?')) return;
  g.addRes(g.playerTeam,Math.floor(b.costGold*0.3),Math.floor(b.costWood*0.3));
  for(var ui=0;ui<g.units.length;ui++){var u=g.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;}
  b.dead=true;Audio.sfx('demolish');this.refreshSelection();
};
UISys.prototype.upgradeTownhall=function(b){
  var g=Game_;if(!g||!b) return;
  if(b.upgrading||(b.level||1)>=3) return;
  var cost=TH_UPGRADE_COST[b.level||1];if(!cost) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t('not_enough_gold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);
  b.upgrading=true;b.upgradeNeeded=cost.time;b.upgradeTimeLeft=cost.time;
  Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.upgradeUnitStat=function(role,stat){
  var g=Game_;if(!g) return;
  var up=g.getUnitUpgrades(g.playerTeam,role);if(up[stat]>=3) return;
  var cost=UPGRADE_COST[up[stat]];var res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t('not_enough_gold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);up[stat]++;
  Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.queueUnit=function(b,role){
  var g=Game_;if(!g||!b) return;var race=RACES[b.race];if(!race) return;var def=race.units[role];if(!def) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.costGold){g.notify(t('not_enough_gold'));return;}
  if(res.wood<def.costWood){g.notify(t('not_enough_wood'));return;}
  if(res.pop>=res.maxPop&&role!=='worker'){g.notify(t('need_house'));return;}
  if(role==='hero'){var alive=0;for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===g.playerTeam&&hu.owner==='player'&&!hu.dying) alive++;}if(alive>=1){g.notify(t('hero_exists'));return;}}
  g.subRes(g.playerTeam,def.costGold,def.costWood);
  b.queue.push({role:role,race:b.race,timeLeft:def.buildTime,timeTotal:def.buildTime});
  Audio.sfx('click');this.renderActions(true);
};
UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerTeam);
    this.$('h-gold').textContent=Math.floor(res.gold);this.$('h-wood').textContent=Math.floor(res.wood);
    this.$('h-pop').textContent=res.pop+'/'+res.maxPop;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
    }
    this.updateQueuePanel();
    this.drawMinimap();
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var go=this.$('gameover');
      this.$('go-title').textContent=g.result==='win'?t('victory'):t('defeat');
      this.$('go-sub').textContent=g.result==='win'?t('victory_sub'):t('defeat_sub');
      go.classList.add('active');
      Audio.sfx(g.result==='win'?'victory':'defeat');
    }
  }catch(e){ERR('UI.update',e);}
};
UISys.prototype.updateQueuePanel=function(){
  if(!Game_) return;
  var g=Game_;var selB=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.sel&&b.team===g.playerTeam&&b.owner==='player'&&b.queue.length>0) selB.push(b);}
  var panel=this.$('queue-panel'),list=this.$('queue-list');
  if(!selB.length){panel.classList.remove('show');return;}
  panel.classList.add('show');var b=selB[0];
  if(list.childElementCount!==b.queue.length){
    list.innerHTML='';
    for(var qi=0;qi<b.queue.length;qi++){
      var q=b.queue[qi];
      var item=document.createElement('div');item.className='q-item';
      var ic=getIcon('unit',q.role,b.race,b.team);
      var cv=makeCv(24,24);var cx=cv.getContext('2d');if(ic) cx.drawImage(ic,0,0,24,24);else{cx.fillStyle='#333';cx.fillRect(0,0,24,24);}
      item.appendChild(cv);
      var info=document.createElement('div');info.className='q-info';
      var name=document.createElement('div');name.className='q-name';name.textContent=(q.role==='hero'?heroName(b.race):roleName(q.role))+' ×'+(qi+1);
      var barBg=document.createElement('div');barBg.className='q-bar-bg';
      var barF=document.createElement('div');barF.className='q-bar-fill';barF.style.width='0%';
      barBg.appendChild(barF);info.appendChild(name);info.appendChild(barBg);item.appendChild(info);
      var timeSpan=document.createElement('div');timeSpan.className='q-time';timeSpan.textContent=Math.ceil(q.timeLeft)+'s';item.appendChild(timeSpan);
      list.appendChild(item);
    }
  }
  var items=list.children;
  for(var qi2=0;qi2<Math.min(items.length,b.queue.length);qi2++){
    var q2=b.queue[qi2];var it=items[qi2];
    var bar=it.querySelector('.q-bar-fill');if(bar){var pct=Math.max(0,Math.min(100,(1-q2.timeLeft/q2.timeTotal)*100));bar.style.width=pct+'%';}
    var timeEl=it.querySelector('.q-time');if(timeEl) timeEl.textContent=Math.max(0,Math.ceil(q2.timeLeft))+'s';
  }
};
UISys.prototype.pushNotif=function(text){var el=document.createElement('div');el.className='notif';el.textContent=text;this.$('notifications').appendChild(el);setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},3200);};
UISys.prototype.drawMinimap=function(){
  var g=Game_;if(!g||!Renderer_) return;
  var cv=this.$('minimap');var ctx=cv.getContext('2d');var W=cv.width,H=cv.height,sx=W/g.W,sy=H/g.H;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
  var cs=g.fogCellSize;var i,j;
  for(i=0;i<g.fogCols;i++) for(j=0;j<g.fogRows;j++){var f=g.fog[i+j*g.fogCols];if(f===2) continue;ctx.fillStyle=f===1?'rgba(0,0,0,.55)':'rgba(0,0,0,.92)';ctx.fillRect(i*cs*sx,j*cs*sy,cs*sx+.5,cs*sy+.5);}
  for(i=0;i<g.paths.length;i++){var path=g.paths[i];ctx.strokeStyle='rgba(150,120,80,0.55)';ctx.lineWidth=2;ctx.lineCap='round';
    for(var pi=0;pi<path.points.length-1;pi++){var a=path.points[pi],b=path.points[pi+1];var aE=g.isExplored(a.x,a.y),bE=g.isExplored(b.x,b.y);if(!aE&&!bE) continue;ctx.beginPath();ctx.moveTo(a.x*sx,a.y*sy);ctx.lineTo(b.x*sx,b.y*sy);ctx.stroke();}}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||!g.isExplored(r.x,r.y)) continue;ctx.fillStyle=r.kind==='gold'?'#ffe066':'#2d5a2d';var s=r.kind==='gold'?5:3;ctx.fillRect(r.x*sx-s/2,r.y*sy-s/2,s,s);}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.dead) continue;if(b.team!==g.playerTeam&&!g.isVisible(b.x,b.y)) continue;ctx.fillStyle=b.completed?teamColor(b.team):'#a08040';ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);}
  for(i=0;i<g.units.length;i++){var u=g.units[i];if(u.dead||u.dying) continue;if(u.team!==g.playerTeam&&!g.isVisible(u.x,u.y)) continue;ctx.fillStyle=u.isHero?'#ffe9a8':teamColor(u.team);var s2=u.isHero?4:3;ctx.fillRect(u.x*sx-s2/2,u.y*sy-s2/2,s2,s2);}
  var cam=g.camera;var vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;
  var vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy;
  ctx.strokeStyle='#e6c67a';ctx.lineWidth=2;ctx.strokeRect(vx,vy,vw,vh);
};

var UI=null;var lastT=0;
function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;if(!isFinite(dt)||dt<0) dt=.016;dt=Math.min(.1,dt);lastT=now;
  try{if(Game_&&!Game_.paused){Input.updateCamera(dt);Game_.update(dt);}}catch(e){ERR('update',e);}
  try{if(Renderer_&&Game_) Renderer_.draw();}catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded',function(){
  try{Tooltip.init();applyLang();
    UI=new UISys();Input.init(document.getElementById('game'));
    UI.showScreen('menu');requestAnimationFrame(loop);
  }catch(e){ERR('DOMContentLoaded',e);alert('Load error: '+e.message);}
});
window.addEventListener('error',function(e){ERR('Global',e.message,e.filename,e.lineno);});
</script>
