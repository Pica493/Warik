      var isCombat=(role!=='worker');

        u.spd=Math.round(u.spd*bal.spdMul);

      var rs=roleStats[role];
      u.armor = rs ? rs.armor : (bal.armor||1.0);
      u.raceRegen = rs ? rs.regen : (isCombat ? (bal.regenOutCombat||1.0) : 0.3);
    }
  }
})();

Game.prototype.getBuildingHpBonus=function(pid){
  var best=0;

    var b=this.buildings[i];
    if(b.dead||b.pid!==pid||b.kind!=='lumber') continue;
    var lvl=b.sawmillLevel||0;
    if(lvl>best) best=lvl;

};

  this.paths=[];var ts=this.tileSize;

  var basePts=this.map.bases.map(function(b){return {x:b.x*ts,y:b.y*ts};});

    for(var j=0;j<goldPts.length;j++){var gp=goldPts[j];sorted.push({x:gp.x,y:gp.y,d:Math.hypot(gp.x-bp.x,gp.y-bp.y)});}

    for(var k=0;k<Math.min(2,sorted.length);k++){var g=sorted[k];this.paths.push({points:[{x:bp.x,y:bp.y},{x:g.x,y:g.y}],width:60});}
  }
};

Game.prototype._tryPlaceTree=function(x,y){

Game.prototype.spawnResources=function(){

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){

  for(var ri0=this.resources.length-1;ri0>=0;ri0--){
    var r0=this.resources[ri0];

    if(Math.hypot(r0.x-x,r0.y-y) < th.radius+320){this.resources.splice(ri0,1);}
  }
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);

  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);
  var attempts=0;
  while(attempts<12){
    var tooClose=false;
    for(var rr=0;rr<this.resources.length;rr++){
      var r0b=this.resources[rr];
      if(r0b.kind!=='gold') continue;
      if(Math.hypot(r0b.x-gx,r0b.y-gy)<450){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;
    gx=cl(gx+Math.cos(wa)*160,80,this.W-80);
    gy=cl(gy+Math.sin(wa)*160,80,this.H-80);
    attempts++;
  }
  var anyMineNear=false;
  for(var rr2=0;rr2<this.resources.length;rr2++){
    var r02=this.resources[rr2];
    if(r02.kind!=='gold') continue;
    if(Math.hypot(r02.x-gx,r02.y-gy)<280){anyMineNear=true;break;}
  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=580+((i%2)*80);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);
    this._tryPlaceTree(tx,ty);
  }
  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j],r2=660;
    var tx2=x+Math.cos(a2)*r2,ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);
    this._tryPlaceTree(tx2,ty2);
  }
  for(var wi=0;wi<3;wi++){
    var aw=(wi/3)*TAU+0.5;
    var wx=x+Math.cos(aw)*200, wy=y+Math.sin(aw)*200;
    var tries=0;
    while(tries<14){
      var hit=false;
      for(var bi=0;bi<this.buildings.length;bi++){var bb=this.buildings[bi];if(Math.hypot(bb.x-wx,bb.y-wy)<bb.radius+56){hit=true;break;}}
      if(!hit) for(var ri2=0;ri2<this.resources.length;ri2++){var rr=this.resources[ri2];if(Math.hypot(rr.x-wx,rr.y-wy)<rr.radius+56){hit=true;break;}}
      if(!hit) break;
      aw+=0.55;tries++;wx=x+Math.cos(aw)*220;wy=y+Math.sin(aw)*220;
    }
    var u=new Unit(wx,wy,team,race.units.worker,race.id);
    u.owner=owner;u.pid=pid;u.spawnT=0;this.units.push(u);
  }
};

Game.prototype.initFog=function(){
  var cs=this.fogCellSize,c=Math.ceil(this.W/cs),r=Math.ceil(this.H/cs);
  this.fogCols=c;this.fogRows=r;

    else for(var i=0;i<this.teamVis[t].length;i++) this.teamVis[t][i]=0;
    if(!this.teamFog[t]||this.teamFog[t].length!==c*r) this.teamFog[t]=new Uint8Array(c*r);
    else for(var j=0;j<this.teamFog[t].length;j++) this.teamFog[t][j]=0;

Game.prototype.updateFog=function(){
  var cs=this.fogCellSize,c=this.fogCols,r=this.fogRows;
  var self=this;
  for(var t in this.teamVis){for(var i=0;i<this.teamVis[t].length;i++) this.teamVis[t][i]=0;}
  function rev(team,cx,cy,rad){
    var arr=self.teamVis[team];if(!arr) return;
    var x0=Math.max(0,cx-rad),x1=Math.min(c-1,cx+rad);
    var y0=Math.max(0,cy-rad),y1=Math.min(r-1,cy+rad);
    var fog=self.teamFog[team];
    for(var x=x0;x<=x1;x++){
      for(var y=y0;y<=y1;y++){
        var idx=x+y*c;arr[idx]=1;fog[idx]=2;
      }
    }
  }
  var i;
  for(i=0;i<this.units.length;i++){
    var u=this.units[i];if(u.dying) continue;
    var vr=Math.ceil((u.vision||200)/cs);
    rev(u.team,Math.floor(u.x/cs),Math.floor(u.y/cs),vr);
  }
  for(i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    rev(b.team,Math.floor(b.x/cs),Math.floor(b.y/cs),b.kind==='townhall'?9:6);
  }
  for(var tt in this.teamFog){
    var src=this.teamFog[tt];
    for(i=0;i<src.length;i++){if(!this.teamVis[tt][i]&&src[i]===2) src[i]=1;}
  }
  var pvis=this.teamVis[this.playerTeam]||new Uint8Array(c*r);
  var pfog=this.teamFog[this.playerTeam]||new Uint8Array(c*r);

};

Game.prototype.updateAuras=function(){

Game.prototype.markNavDirty=function(){ this.navDirty=true; };
Game.prototype.buildNavGrid=function(){
  var ts=this.tileSize;
  var cols=Math.ceil(this.W/ts),rows=Math.ceil(this.H/ts);
  this.navCols=cols;this.navRows=rows;
  var grid=new Uint8Array(cols*rows);
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.dying) continue;
    var r=b.radius*1.75;
    var minX=Math.max(0,Math.floor((b.x-r)/ts));
    var maxX=Math.min(cols-1,Math.floor((b.x+r)/ts));
    var minY=Math.max(0,Math.floor((b.y-r)/ts));
    var maxY=Math.min(rows-1,Math.floor((b.y+r)/ts));
    for(var y=minY;y<=maxY;y++) for(var x=minX;x<=maxX;x++) grid[y*cols+x]=1;
  }
  for(var ri=0;ri<this.resources.length;ri++){
    var rr=this.resources[ri];if(rr.dead||rr.falling) continue;
    var rr2=(rr.kind==='gold')?rr.radius*0.75:34;
    var minX2=Math.max(0,Math.floor((rr.x-rr2)/ts));
    var maxX2=Math.min(cols-1,Math.floor((rr.x+rr2)/ts));
    var minY2=Math.max(0,Math.floor((rr.y-rr2)/ts));
    var maxY2=Math.min(rows-1,Math.floor((rr.y+rr2)/ts));
    for(var y2=minY2;y2<=maxY2;y2++) for(var x2=minX2;x2<=maxX2;x2++) grid[y2*cols+x2]=1;
  }
  this.navGrid=grid;this.navDirty=false;

Game.prototype.findPath=function(sx,sy,tx,ty){
  if(this.navDirty) this.buildNavGrid();
  var ts=this.tileSize,cols=this.navCols,rows=this.navRows,grid=this.navGrid;
  if(!grid||cols===0||rows===0){this.buildNavGrid();grid=this.navGrid;cols=this.navCols;rows=this.navRows;}
  var startCx=cl(Math.floor(sx/ts),0,cols-1),startCy=cl(Math.floor(sy/ts),0,rows-1);
  var endCx=cl(Math.floor(tx/ts),0,cols-1),endCy=cl(Math.floor(ty/ts),0,rows-1);
  if(grid[endCy*cols+endCx]===1){
    var f1=false;
    for(var r1=1;r1<=4&&!f1;r1++){
      for(var ddx=-r1;ddx<=r1&&!f1;ddx++) for(var ddy=-r1;ddy<=r1&&!f1;ddy++){
        var ncx=endCx+ddx,ncy=endCy+ddy;
        if(ncx<0||ncy<0||ncx>=cols||ncy>=rows) continue;
        if(grid[ncy*cols+ncx]===0){endCx=ncx;endCy=ncy;f1=true;}
      }
    }
    if(!f1) return null;
  }
  if(grid[startCy*cols+startCx]===1){
    var f2=false;
    for(var r2=1;r2<=4&&!f2;r2++){
      for(var ddx2=-r2;ddx2<=r2&&!f2;ddx2++) for(var ddy2=-r2;ddy2<=r2&&!f2;ddy2++){
        var ncx2=startCx+ddx2,ncy2=startCy+ddy2;
        if(ncx2<0||ncy2<0||ncx2>=cols||ncy2>=rows) continue;
        if(grid[ncy2*cols+ncx2]===0){startCx=ncx2;startCy=ncy2;f2=true;}
      }
    }
    if(!f2) return null;
  }
  var startI=startCy*cols+startCx,endI=endCy*cols+endCx;
  if(startI===endI) return [{x:tx,y:ty}];
  var total=cols*rows;
  if(!this._pfVisited||this._pfVisited.length!==total){
    this._pfVisited=new Uint8Array(total);
    this._pfParent=new Int32Array(total);
    this._pfQueue=new Int32Array(total);
  }
  var visited=this._pfVisited,parent=this._pfParent,queue=this._pfQueue;
  for(var k=0;k<total;k++){visited[k]=0;parent[k]=-1;}
  queue[0]=startI;visited[startI]=1;var head=0,qLen=1;
  var DX=[-1,0,1,-1,1,-1,0,1],DY=[-1,-1,-1,0,0,1,1,1];
  var found=false;
  while(head<qLen){
    var cur=queue[head++];
    if(cur===endI){found=true;break;}
    var cx=cur%cols,cy=(cur/cols)|0;
    for(var d=0;d<8;d++){
      var nx=cx+DX[d],ny=cy+DY[d];
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      var ni=ny*cols+nx;
      if(visited[ni]||grid[ni]===1) continue;
      visited[ni]=1;parent[ni]=cur;
      if(qLen<total) queue[qLen++]=ni;
    }
  }
  if(!found) return null;
  var path=[];
  var cur2=endI,safety=0;
  while(cur2!==-1&&safety<20000){
    var cx2=cur2%cols,cy2=(cur2/cols)|0;
    path.unshift({x:cx2*ts+ts/2,y:cy2*ts+ts/2});
    cur2=parent[cur2];safety++;
  }
  if(path.length>0) path[path.length-1]={x:tx,y:ty};
  return path;
};
function compactArr(arr){var w=0;for(var i=0;i<arr.length;i++){if(!arr[i].dead){arr[w++]=arr[i];}}arr.length=w;}
Game.prototype._hasLineOfSight=function(x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);

Game.prototype.snapToFree=function(x,y,radius){

  for(var r=30;r<=220;r+=20){
    for(var a=0;a<TAU;a+=Math.PI/8){

Game.prototype._wouldHitResource=function(x,y,radius,ignore){

    Game.prototype.update=function(dt){

        }
      } else if(ft<1.15){
        var nt=(ft-0.4)/0.75;
        var eased=nt*nt*(3-2*nt);
        r.fallAngle=eased*(Math.PI/2)*fDir;
        if(Math.random()<0.85){
          var la=Math.random()*TAU,ls=40+Math.random()*80;

        }

        if(Math.random()<0.5){
          var sa=Math.random()*TAU,ss=60+Math.random()*100;
          this.particles.spawn(r.x+(Math.random()-0.5)*60,r.y-20,Math.cos(sa)*ss,Math.sin(sa)*ss-40,1.2,'#8a5a30',2+Math.random()*2);
        }

    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;p.age+=dt;}

  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}

Game.prototype.updateWeather=function(dt){

Game.prototype.ejectFromBuildings=function(u){

Game.prototype._smartMove=function(u,dx,dy,spd){
  var d=Math.hypot(dx,dy);if(d<0.01) return false;
  var _mw=(u.role==='worker'&&u.gatherTarget);
  var _wpid=u.pid;
  var _bh=function(x,y,ig){return this._wouldHitBuilding(x,y,u.radius,ig,_mw,_wpid);}.bind(this);
  var nx=u.x+dx/d*spd,ny=u.y+dy/d*spd;

  if(!blockedB&&!blockedR){
    u.x=this.clampX(nx);u.y=this.clampY(ny);return true;
  }
  var slideTarget=blockedB||blockedR;
  if(slideTarget){
    var bb=slideTarget;
    var bdx=u.x-bb.x,bdy=u.y-bb.y,bd=Math.hypot(bdx,bdy);
    var minD=(bb.radius||24)+u.radius+8;

      var s1=(u.id%2)?1:-1;
      var tx=u.x+Math.cos(tan)*s1*spd, ty=u.y+Math.sin(tan)*s1*spd;
      if(!_bh(tx,ty,null)&&!this._wouldHitResource(tx,ty,u.radius,u.gatherTarget)){
        u.x=this.clampX(tx);u.y=this.clampY(ty);return true;
      }
      var tx2=u.x+Math.cos(tan)*-s1*spd, ty2=u.y+Math.sin(tan)*-s1*spd;
      if(!_bh(tx2,ty2,null)&&!this._wouldHitResource(tx2,ty2,u.radius,u.gatherTarget)){
        u.x=this.clampX(tx2);u.y=this.clampY(ty2);return true;
      }
    }
  }
  var nx1=u.x+dx/d*spd,ny1=u.y;
  if(!_bh(nx1,ny1,null)&&!this._wouldHitResource(nx1,ny1,u.radius,u.gatherTarget)){u.x=this.clampX(nx1);return true;}
  var nx2=u.x,ny2=u.y+dy/d*spd;
  if(!_bh(nx2,ny2,null)&&!this._wouldHitResource(nx2,ny2,u.radius,u.gatherTarget)){u.y=this.clampY(ny2);return true;}
  var perp=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
  var sx=u.x+Math.cos(perp)*side*spd,sy=u.y+Math.sin(perp)*side*spd;
  if(!_bh(sx,sy,null)&&!this._wouldHitResource(sx,sy,u.radius,u.gatherTarget)){u.x=this.clampX(sx);u.y=this.clampY(sy);return true;}
  var baseAng=Math.atan2(dy,dx);
  for(var step=0.18;step<Math.PI;step+=0.18){
    var a1=baseAng+step;
    var sx1=u.x+Math.cos(a1)*spd,sy1=u.y+Math.sin(a1)*spd;
    if(!_bh(sx1,sy1,null)&&!this._wouldHitResource(sx1,sy1,u.radius,u.gatherTarget)){u.x=this.clampX(sx1);u.y=this.clampY(sy1);return true;}
    var a2=baseAng-step;
    var sx2=u.x+Math.cos(a2)*spd,sy2=u.y+Math.sin(a2)*spd;
    if(!_bh(sx2,sy2,null)&&!this._wouldHitResource(sx2,sy2,u.radius,u.gatherTarget)){u.x=this.clampX(sx2);u.y=this.clampY(sy2);return true;}
  }
  return false;
};

      for(var _ei6=0;_ei6<this.creeps.length;_ei6++){
        var _ec6=this.creeps[_ei6];
        if(_ec6.dying) continue;
        var _dE4=(_ec6.x-u.x)*(_ec6.x-u.x)+(_ec6.y-u.y)*(_ec6.y-u.y);
        if(_dE4<_bdE){_bdE=_dE4;_bestE=_ec6;}

  if(u.target&&(u.target.dead||u.target.hp<=0)){u.target=null;}

    if(u.lastAttacker && !u.lastAttacker.dead && !u.lastAttacker.dying) u.target=u.lastAttacker;
  }
  if(!u.target && !u.moveTo && !u.attackMoveTo && !u.patrolRoute && u.stance!=='hold' && u.role!=='worker' && !u._retreating){
    var nearBase=this.findEnemyBaseNear(u,900);
    if(nearBase){

  if(u.stance!=='hold'&&!u.target&&!u._retreating){

    if(isIdleCombat){

          if(low) u.target=low;

        if(!u.target){
          var _he=this.findEnemy(u,u.vision||280);
          if(_he) u.target=_he;
          else{var _hc=this.findNearestCreep(u,u.vision||280);if(_hc) u.target=_hc;}
        }
      } else {
        var e=this.findEnemy(u,u.vision||280);
        if(e) u.target=e;
        else{var c=this.findNearestCreep(u,u.vision||280);if(c) u.target=c;}
      }
    } else if(isIdleWorker&&!isPlayerUnit){

  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;

  }
  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);

};
Game.prototype.doMove=function(u,dt){
  /* PATCH: если цель движения теперь внутри нового здания — снапим к ближайшей свободной точке */
  if(u.moveTo){
    u._moveToCheckT=(u._moveToCheckT||0)-dt;
    if(u._moveToCheckT<=0){
      u._moveToCheckT=0.5;
      var _blk=this._wouldHitBuilding(u.moveTo.x,u.moveTo.y,u.radius,null,false,-1);
      if(_blk){
        var _sn=this.snapToFree(u.moveTo.x,u.moveTo.y,u.radius+6);
        u.moveTo={x:_sn.x,y:_sn.y};
        u._path=null;u._pathIdx=0;u._stuckTimer=0;
      }
    }
  }
  if(u.role!=='worker'&&!u.target&&u.atkCd<=0&&u.stance!=='hold'&&!u._retreating){
    var attacker=u.lastAttacker;
    if(attacker && !attacker.dead && !attacker.dying && Math.hypot(attacker.x-u.x,attacker.y-u.y)<u.range+40){
      u.atkCd=u.cdBase;u.attackT=1;this.performAttack(u,attacker);
    }
  }
  if(u.role==='worker'){
    if(u._insideMine){u._insideMine=false;u._mineSlot=-1;}
    if(u._waitingForMine) u._waitingForMine=false;
    if(u._assignedMine){
      var dAm=Math.hypot(u._assignedMine.x-u.moveTo.x, u._assignedMine.y-u.moveTo.y);
      if(dAm>60) u._assignedMine=null;
    }
  }
  if(!u.moveTo){ u._path=null; return; }
  if(u.moveTo && (!u._lastMoveTo || u._lastMoveTo.x!==u.moveTo.x || u._lastMoveTo.y!==u.moveTo.y)){
    u._lastMoveTo={x:u.moveTo.x,y:u.moveTo.y};
    var sn=this.snapToFree(u.moveTo.x,u.moveTo.y,u.radius+4);
    if(sn.x!==u.moveTo.x||sn.y!==u.moveTo.y){
      u.moveTo={x:sn.x,y:sn.y};
      u._lastMoveTo={x:sn.x,y:sn.y};
      u._path=null;u._pathIdx=0;
    }
  }
  var dxGoal=u.moveTo.x-u.x, dyGoal=u.moveTo.y-u.y;
  var dGoal=Math.hypot(dxGoal,dyGoal);
  if(dGoal<12){ u.moveTo=null; u._path=null; u._pathIdx=0; return; }
  if(!u._path){
    var nowT=this.time;
    if(u._pathFailT && nowT-u._pathFailT<0.5){ u._stuckTimer=0; }
    else {
      var path=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path&&path.length>0){ u._path=path; u._pathIdx=0; u._pathFailT=0; }
      else { u._path=null; u._pathFailT=nowT; }
    }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];
    var dxT=t.x-u.x, dyT=t.y-u.y, dT=Math.hypot(dxT,dyT);
    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){ u._path=null; u._pathIdx=0; u.moveTo=null; return; }
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y; dT=Math.hypot(dxT,dyT);
    }
    var spd=u.spd*(u.slowMul||1)*dt;
    var moved=this._smartMove(u,dxT,dyT,spd);
    if(!moved){
      u._stuckTimer=(u._stuckTimer||0)+dt;
      if(u._stuckTimer>0.4){
        u._stuckTimer=0;
        u._path=null;u._pathIdx=0;
        var _esc=Math.random()*TAU;
        var _enx=u.x+Math.cos(_esc)*20,_eny=u.y+Math.sin(_esc)*20;
        if(!this._wouldHitBuilding(_enx,_eny,u.radius,null,false,-1)&&!this._wouldHitResource(_enx,_eny,u.radius,null)){
          u.x=this.clampX(_enx);u.y=this.clampY(_eny);
        }
      }
    } else u._stuckTimer=0;
    if(Math.abs(dxT)>Math.abs(dyT)) u.dir=dxT>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dyT>=0?DIR.DOWN:DIR.UP;
    u.moving=true;
    this.separate(u);
    return;
  }
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  var spd2=u.spd*(u.slowMul||1)*dt;
  var moved2=this._smartMove(u,dx,dy,spd2);
  if(!moved2){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>0.4){
      u._stuckTimer=0;
      var path2=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path2&&path2.length>0){ u._path=path2; u._pathIdx=0; }
      else { u.moveTo=null; }
    }
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  if(u.attackMoveTo && (!u._lastAttackMoveTo || u._lastAttackMoveTo.x!==u.attackMoveTo.x || u._lastAttackMoveTo.y!==u.attackMoveTo.y)){
    u._lastAttackMoveTo={x:u.attackMoveTo.x,y:u.attackMoveTo.y};
    var _sn2=this.snapToFree(u.attackMoveTo.x,u.attackMoveTo.y,u.radius+4);
    if(_sn2.x!==u.attackMoveTo.x||_sn2.y!==u.attackMoveTo.y){
      u.attackMoveTo={x:_sn2.x,y:_sn2.y};
      u._lastAttackMoveTo={x:_sn2.x,y:_sn2.y};
      u._path=null;u._pathIdx=0;
      dest=u.attackMoveTo;
    }
  }
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  if(!u._path){
    var path=this.findPath(u.x,u.y,dest.x,dest.y);
    if(path&&path.length>0){ u._path=path; u._pathIdx=0; }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];
    var dxT=t.x-u.x, dyT=t.y-u.y, dT=Math.hypot(dxT,dyT);
    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){u._path=null;u._pathIdx=0;}
    }
    if(u._path){
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y;
    }
  }
  var spd=u.spd*(u.slowMul||1)*dt;
  var moved=this._smartMove(u,dx,dy,spd);
  if(!moved){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>1.5){u.attackMoveTo=null;u.patrolRoute=null;u._stuckTimer=0;u._path=null;u._pathIdx=0;return;}
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};

    Game.prototype.updateCreep=function(c,dt){
  c._prevX=c.x;c._prevY=c.y;
  if(c.stunT>0) c.stunT-=dt;
  if(c.bleedT>0){c.bleedT-=dt;c.hp-=(c.bleedDmg||0)*dt;if(c.bleedT<=0)c.bleedDmg=0;}
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;c.deathDir=(c.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(c.x,c.y,'#8a3020',12);
    Audio.sfx('death',c.x,c.y);
    if(c.lastAttacker){
      if(CampaignRuntime&&CampaignRuntime._killsCounter){
        CampaignRuntime._killsCounter.kill5=(CampaignRuntime._killsCounter.kill5||0)+1;
      }
      var reward=c.goldReward;if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.pid!=='undefined'&&this.teams[c.lastAttacker.pid]){
        this.addRes(c.lastAttacker.pid,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(this.stats[c.lastAttacker.pid]) this.stats[c.lastAttacker.pid].creepsKilled++;
        if(c.isBoss&&c.lastAttacker.owner==='player') this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.pid!=='undefined'){
        for(var i=0;i<this.units.length;i++){
          var h=this.units[i];
          if(h.isHero&&h.pid===c.lastAttacker.pid&&!h.dying){
            if(Math.hypot(h.x-c.x,h.y-c.y)<450){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}
          }
        }
      }
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0)c.hitFlash-=dt;if(c.atkCd>0)c.atkCd-=dt;
  if(c.attackT>0){c.attackT-=dt*2.5;if(c.attackT<0)c.attackT=0;}
  c.moving=false;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=c.aggroR*c.aggroR;
    for(var ui=0;ui<this.units.length;ui++){
      var u=this.units[ui];
      if(u.dead||u.dying||u.team<0) continue;
      var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);
      if(d2<bd){bd=d2;best=u;}
    }
    if(best) c.target=best;
    else {
      for(var bi=0;bi<this.buildings.length;bi++){
        var b=this.buildings[bi];
        if(b.dead||b.dying||b.team<0) continue;
        var db2=(b.x-c.x)*(b.x-c.x)+(b.y-c.y)*(b.y-c.y);
        var rr=b.radius+c.aggroR;
        if(db2<rr*rr&&db2<bd){bd=db2;c.target=b;}
      }
    }
  }
  if(c.target){
    var distHome=Math.hypot(c.x-c.homeX,c.y-c.homeY);
    if(distHome>c.leashR){ c.target=null; c.moveTo={x:c.homeX,y:c.homeY}; }
  }
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){
      var nx=c.x+dx/d*c.spd*dt,ny=c.y+dy/d*c.spd*dt;
      if(!this._wouldHitBuilding(nx,ny,c.radius)){c.x=this.clampX(nx);c.y=this.clampY(ny);}
      else{
        var ang3=Math.atan2(dy,dx)+Math.PI/2;
        var sx2=c.x+Math.cos(ang3)*c.spd*dt,sy2=c.y+Math.sin(ang3)*c.spd*dt;
        if(!this._wouldHitBuilding(sx2,sy2,c.radius)){c.x=this.clampX(sx2);c.y=this.clampY(sy2);}
      }
      c.moving=true;c.walkPhase+=dt*8;
    } else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      var dmg=c.dmg;
      if(c.target.isUnit&&c.target.armor&&c.target.armor<1) dmg=dmg*c.target.armor;
      dmg=Math.round(dmg);
      c.target.hp-=dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+dmg,'#ff6060'));
      Audio.sfx('sword',c.x,c.y);
      if(c.target.isUnit&&!c.target.target&&c.target.role!=='worker') c.target.target=c;
      if(c.poison && c.target.isUnit && !c.target.dying){
        c.target.bleedT=Math.max(c.target.bleedT||0,2);
        c.target.bleedDmg=Math.max(c.target.bleedDmg||0,3);
      }
    }
  } else if(c.moveTo){
    var dxm=c.moveTo.x-c.x,dym=c.moveTo.y-c.y,dm=Math.hypot(dxm,dym);
    if(dm<12){c.moveTo=null;}
    else{
      c.x+=dxm/dm*c.spd*0.6*dt;c.y+=dym/dm*c.spd*0.6*dt;
      if(Math.abs(dxm)>Math.abs(dym)) c.dir=dxm>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dym>=0?DIR.DOWN:DIR.UP;
      c.walkPhase+=dt*6;c.moving=true;
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){
      c.wanderT=2.5+Math.random()*3.5;
      var a=Math.random()*TAU,r=30+Math.random()*90;
      c.wanderTarget={x:this.clampX(c.homeX+Math.cos(a)*r),y:this.clampY(c.homeY+Math.sin(a)*r)};
    }
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){
        c.x+=dxw/dw*c.spd*0.35*dt;c.y+=dyw/dw*c.spd*0.35*dt;
        if(Math.abs(dxw)>Math.abs(dyw)) c.dir=dxw>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dyw>=0?DIR.DOWN:DIR.UP;
        c.walkPhase+=dt*5;c.moving=true;
      }
    }
  }
};
Game.prototype.grantXP=function(hero,xp){

  }
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+(u.role==='heal'?40:8);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*(u.slowMul||1)*dt;
    if(u.activeBuffT>0&&(u.buffType==='rage'||u.buffType==='speed')) spd*=1.3;
    if(u._path&&u._path.length>0){
      var t2=u._path[u._pathIdx||0];
      if(t2){
        var _dx2=t2.x-u.x,_dy2=t2.y-u.y,_d2=Math.hypot(_dx2,_dy2);
        if(_d2<16){u._pathIdx=(u._pathIdx||0)+1;if(u._pathIdx>=u._path.length){u._path=null;u._pathIdx=0;}}
        else{
          var _moved=this._smartMove(u,_dx2,_dy2,spd);
          if(_moved){u.moving=true;this.separate(u);}
        }
      }
    } else {
      var moved=this._smartMove(u,dx,dy,spd);
      if(moved){u.moving=true;this.separate(u);u._stuckCounter=0;}
      else{
        u._stuckCounter=(u._stuckCounter||0)+dt;

    Game.prototype.findEnemy=function(ent,range){

Game.prototype.findNearestResource=function(x,y,kind,pid){

Game.prototype.separate=function(u){
  if(u._insideMine||u._waitingForMine) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  var pushMul=(u.moving||u.target||u.moveTo)?1.5:0.8;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      if(o._insideMine) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius+1;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.55*pushMul;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>6) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var _isMiningWorker=(u.role==='worker'&&u.gatherTarget&&!u._insideMine);
    if(_isMiningWorker&&b.pid===u.pid) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var _mulB=_isMiningWorker?0.92:1.12;
    var minBD=u.radius+b.radius*_mulB;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2);
      var pushB=(minBD-bd)*1.0+0.3;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      if(u.role==='worker'&&(u.gatherTarget||u._waitingForMine)) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.25:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};

UISys.prototype._showWc3Tooltip=function(btn,text){
  var tip=this.$('wc3-tooltip');if(!tip||!text) return;

    html+='<div class="tt-stat"><span class="k">'+stats[s].k+':</span><span class="v">'+_img+_v+'</span></div>';
  }

UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;
  var g=Game_,size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  for(var i=0;i<g.buildings.length;i++){var ob=g.buildings[i],dx=ob.x-x,dy=ob.y-y,rr=ob.radius+size+40;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead) continue;var dx2=r.x-x,dy2=r.y-y,rr2=r.radius+size-6;if(dx2*dx2+dy2*dy2<rr2*rr2) return false;}
  if(def.kind==='townhall'){
    var thCount=0;
    for(var ti=0;ti<g.buildings.length;ti++){
      var tb=g.buildings[ti];
      if(tb.pid===g.playerPid&&tb.kind==='townhall'&&!tb.dead&&tb.completed) thCount++;
    }
    if(thCount>=MAX_TH_PER_PLAYER) return false;
    return true;
  }
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.pid!==g.playerPid) continue;if(Math.hypot(b.x-x,b.y-y)<700) return true;}
  return false;
};
UISys.prototype.tryPlaceAt=function(x,y){

  if(!race){this.cancelPlacement();return;}
  var def=RACES[race].buildings[kind];if(!def){this.cancelPlacement();return;}
  if(!this.canPlaceAt(x,y,def)){g.notify(t_('cantBuild'));return;}
  var res=g.getRes(g.playerPid);
  if(res.gold<def.gold){g.notify(t_('nGold'));this.cancelPlacement();return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.pid===g.playerPid&&u2.role==='worker'&&!u2.dying){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.pid===g.playerPid&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t_('noWorker'));this.cancelPlacement();return;}
  var newRad=(def.size||3)*22+24;
  for(var mv=0;mv<g.units.length;mv++){

    if(mu.pid!==g.playerPid||mu.dying) continue;
    var mdx=mu.x-x,mdy=mu.y-y,md=Math.hypot(mdx,mdy);
    if(md<newRad){
      var mvAng=md>0.01?Math.atan2(mdy,mdx):Math.random()*TAU;
      mu.moveTo={x:g.clampX(x+Math.cos(mvAng)*(newRad+50)),y:g.clampY(y+Math.sin(mvAng)*(newRad+50))};
      mu._path=null;mu._pathIdx=0;
    }
  }
  g.subRes(g.playerPid,def.gold,def.wood);
  var b=new Building(x,y,g.playerTeam,def,race);
  b.completed=false;b.buildProgress=0;b.owner='player';b.pid=g.playerPid;
  g.buildings.push(b);g.navDirty=true;
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.demolishTarget=null;w.carrying=null;w.carryAmt=0;w.target=null;w.lockedTarget=null;w.gatherAnimT=0;w.attackMoveTo=null;w.patrolRoute=null;w._stuckTimer=0;w._insideMine=false;w._mineSlot=-1;w._waitingForMine=false;w._path=null;w._pathIdx=0;
  Audio.sfx('build');this.cancelPlacement();
};

UISys.prototype.queueUnit=function(b,role){

  }
  var _nonSummon=0;

    _queuedCount+=_qb.queue.length;

  if(role==='hero'){

    for(var _hi=0;_hi<g.units.length;_hi++){var _hu=g.units[_hi];if(_hu.isHero&&_hu.pid===g.playerPid&&!_hu.dying&&_hu.heroType===_wantHT) _alive++;}
    if(_alive>=1){g.notify(t_('heroExists'));return;}
    var _inQ=false;
    for(var _hq=0;_hq<g.buildings.length;_hq++){
      var _hqb=g.buildings[_hq];
      if(_hqb.pid!==g.playerPid||_hqb.dead) continue;
      for(var _qqi=0;_qqi<_hqb.queue.length;_qqi++){if(_hqb.queue[_qqi].role==='hero'&&_hqb.queue[_qqi].heroType===_wantHT){_inQ=true;break;}}
      if(_hqb.reviveQueue&&_hqb.reviveQueue.length>0){for(var _rqi=0;_rqi<_hqb.reviveQueue.length;_rqi++){if(_hqb.reviveQueue[_rqi].reviveData&&_hqb.reviveQueue[_rqi].reviveData.heroType===_wantHT){_inQ=true;break;}}}
      if(_inQ) break;

    if(g.deadHeroes&&g.deadHeroes[g.playerPid+'_'+_wantHT]){g.notify('Используйте Воскресить');return;}
    g.subRes(g.playerPid,def.gold,def.wood);
    b.queue.push({role:'hero',heroType:_wantHT,race:b.race,timeLeft:def.time,timeTotal:def.time});
    Audio.sfx('click');this.renderActions(true);
    return;
  }
  g.subRes(g.playerPid,def.gold,def.wood);
  b.queue.push({role:role,race:b.race,timeLeft:def.time,timeTotal:def.time});
  Audio.sfx('click');this.renderActions(true);

UISys.prototype._updateAbilityButtons=function(){
  if(!this._abilityButtons||!this._abilityButtons.length||!Game_) return;
  var hero=null;
  for(var _ai=0;_ai<this._abilityButtons.length;_ai++){
    var _btn=this._abilityButtons[_ai];
    if(!_btn||!_btn.isConnected) continue;
    var _hid=parseInt(_btn.dataset.heroId);
    if(!hero){
      for(var ui=0;ui<Game_.units.length;ui++){if(Game_.units[ui].id===_hid){hero=Game_.units[ui];break;}}
      if(!hero) return;
    }
    var _stunnedHero=(hero.stunT>0||hero.rootT>0);
    var abId=_btn.dataset.abId;
    var abIdx=parseInt(_btn.dataset.abIdx);
    var ab=null;
    for(var a=0;a<hero.heroAbilities.length;a++){if(hero.heroAbilities[a].id===abId){ab=hero.heroAbilities[a];break;}}
    if(!ab){continue;}
    var lvl=hero.abilityLevels[abId]||0;
    var cd=0;
    if(ab.type==='passive') cd=0;
    else if(abIdx===0) cd=hero.cdA1;
    else if(abIdx===1) cd=hero.cdA2;
    else if(abIdx===2) cd=hero.cdA3;
    else if(ab.type==='ultimate') cd=hero.cdUlt;
    var isPassive=(ab.type==='passive');
    var canLvlUp=false;
    if(hero.skillPoints>0&&lvl<3){
      if(ab.type==='ultimate'){var _needLvl=6+lvl*2;canLvlUp=(hero.level>=_needLvl);}
      else canLvlUp=true;
    }
    var hasMana=(hero.mana||0)>=(ab.mana||0);
    var canUse=!isPassive&&lvl>0&&cd<=0&&(ab.type!=='ultimate'||hero.ultUnlocked)&&hasMana&&!_stunnedHero;
    if(canLvlUp) _btn.classList.add('can-level'); else _btn.classList.remove('can-level');
    var lblEl=_btn.querySelector('.lbl');
    if(lblEl){
      var key=abIdx===0?'[Q] ':abIdx===1?'[W] ':ab.type==='ultimate'?'[R] ':'[E] ';
      var newLbl=key+t_(ab.k)+(lvl>0?' '+lvl+'/3':'');
      if(ab.type==='ultimate'){
        if(!hero.ultUnlocked) newLbl+=' (X)';
        else if(lvl<3&&!canLvlUp){newLbl+=' (ур.'+(6+lvl*2)+')';}
      }
      if(canLvlUp) newLbl+=' +';
      if(lblEl.textContent!==newLbl) lblEl.textContent=newLbl;
    }
    var priceEl=_btn.querySelector('.price');
    if(priceEl){
      var newPrice='';
      if(cd>0) newPrice+=Math.ceil(cd)+'с';
      if(!isPassive) newPrice+=(newPrice?' ':'')+(ab.mana||35)+'маны';
      if(priceEl.textContent!==newPrice) priceEl.textContent=newPrice;
    }
    var wantDis=(!(canLvlUp||canUse))||(_stunnedHero&&!isPassive&&lvl>0);
    if(wantDis!==_btn.disabled){_btn.disabled=wantDis;}
  }
};
UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerPid);
    this.$('h-gold').textContent=Math.floor(res.gold);
    this.$('h-wood').textContent=Math.floor(res.wood);
    var popText=res.food+'/'+res.maxFood;
    if(res.maxFood>=MAX_FOOD) popText+=' (макс)';
    this.$('h-pop').textContent=popText;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
      else {this._updateAbilityButtons();this._updateActionDisabledStates();}
    }
    this.updateQueuePanel();
    this._mmTimer=(this._mmTimer||0)+1;
    if(this._mmTimer>=2){this._mmTimer=0;this.drawMinimap();}
    this._infoTimer=(this._infoTimer||0)+1;
    if(this._infoTimer>=3){this._infoTimer=0;this.refreshInfoOnly();this._refreshPortraitBars();}
    if(!Settings._isMobile && Input.mouseInside) this._showUnitHoverTip();
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var self=this;
      var _isCampaign=!!CampaignRuntime;
      var _missionWon=(g.result==='win');
      setTimeout(function(){
        var _isFinalMission=(_isCampaign&&CampaignRuntime&&CampaignRuntime.mission.id===10&&_missionWon);
        if(_isFinalMission){
          self.showCampaignFinale();
          Audio.sfx('victory');
          return;
        }
        var go=self.$('gameover');
        self.$('go-title').textContent=g.result==='win'?t_('victory'):t_('defeat');
        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        self._goTab='players';
        var tabs=document.querySelectorAll('.go-tab');
        for(var _ti=0;_ti<tabs.length;_ti++){tabs[_ti].classList.toggle('active',tabs[_ti].dataset.tab==='players');}
        if(_isCampaign){
          self.$('go-stats').innerHTML='<div style="text-align:center;padding:20px;font-size:13px;color:#c8d5e8">'+
            (_missionWon?'Миссия пройдена! Следующая глава разблокирована.':'Попробуйте снова. Уровень перезапустится.')+
            '</div>';
        } else {
          self.renderGameOverStats();
        }
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
      },1200);
      g.shake=2;
    }

    var visU=(u.pid===g.playerPid)||(u.team===g.playerTeam)||g.isVisible(u.x,u.y);

  var cam=g.camera,vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy,vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;

UISys.prototype.showCampaignSelect=function(){

  }

  if(prog) prog.textContent='Пройдено: '+completed+' / '+CAMPAIGN_MISSIONS.length;

    (function(m){
      var tile=document.createElement('div');

      tile.className='campaign-tile'+(done?' completed':'')+(!unlocked?' locked':'');
      var cv=document.createElement('canvas');cv.width=160;cv.height=80;
      UI._drawCampaignTile(cv,m);tile.appendChild(cv);

  var map=null;for(var i=0;i<MAPS.length;i++)if(MAPS[i].id===m.mapId){map=MAPS[i];break;}
  var biome=map?(BIOMES[map.biome]||BIOMES.grassland):BIOMES.grassland;
  var gr=ctx.createLinearGradient(0,0,0,cv.height);
  gr.addColorStop(0,'rgb('+biome.alt[0]+','+biome.alt[1]+','+biome.alt[2]+')');
  gr.addColorStop(1,'rgb('+biome.base[0]+','+biome.base[1]+','+biome.base[2]+')');
  ctx.fillStyle=gr;ctx.fillRect(0,0,cv.width,cv.height);
  if(map){
    for(var fi=0;fi<map.forests.length;fi++){
      var f=map.forests[fi];
      ctx.fillStyle='rgba(30,60,30,0.5)';
      ctx.beginPath();ctx.arc(f.cx/map.size*cv.width,f.cy/map.size*cv.height,f.r/map.size*cv.width,0,TAU);ctx.fill();
    }
    for(var gi=0;gi<map.gold.length;gi++){
      var g=map.gold[gi];
      ctx.fillStyle='#ffe066';
      ctx.beginPath();ctx.arc(g.x/map.size*cv.width,g.y/map.size*cv.height,3,0,TAU);ctx.fill();
    }
    for(var bi=0;bi<Math.min(map.bases.length,4);bi++){
      var b=map.bases[bi];
      ctx.fillStyle=bi===0?'#3a7adf':(bi===1?'#d03a3a':'#8a3030');
      ctx.fillRect(b.x/map.size*cv.width-4,b.y/map.size*cv.height-4,8,8);
    }
  }
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,cv.height-20,cv.width,20);
  ctx.fillStyle='#e6c67a';ctx.font='bold 10px Arial';ctx.textAlign='center';
  ctx.fillText(map?map.name:'—',cv.width/2,cv.height-6);
};

  for(var fi=0;fi<map.forests.length;fi++){var f=map.forests[fi];ctx.fillStyle='rgba(45,90,45,0.75)';ctx.beginPath();ctx.arc(f.cx/sz*W,f.cy/sz*H,f.r/sz*W,0,TAU);ctx.fill();}
  for(var gi=0;gi<map.gold.length;gi++){var g=map.gold[gi];ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(g.x/sz*W,g.y/sz*H,W/36,0,TAU);ctx.fill();}

    function CampaignMissionRuntime(mission,game){
  this.mission=mission;
  this.g=game;
  this.time=0;
  this.objectives={};
  this._firedTriggers={};
  this._dialogQueue=[];
  this._dialogActive=false;
  this._dialogLineIdx=0;
  this._dialogCurrent=null;
  this._chronicleShown=false;
  this._missionUnits={};
  this._killsCounter={kill5:0};
  this._waveSpawned={};
  this._customDone={};
  this._dialogFired={};
  this._heroSelected=false;
  this._moveIssued=false;
  this._gameEnded=false;
  for(var i=0;i<mission.objectives.length;i++){
    var o=mission.objectives[i];
    this.objectives[o.id]={
      id:o.id,text:o.text,type:o.type,done:false,failed:false,
      progress:0,target:o.target||0,btnText:o.btnText||'Выполнить',
      kind:o.kind||null,heroType:o.heroType||null,

CampaignMissionRuntime.prototype._buildMissionWorld=function(){
  var g=this.g,m=this.mission,sp=m.spawn||{};
  g.units=[];g.buildings=[];g.creeps=[];g.projectiles=[];
  g.floaters=[];g.decals=[];g.weapons=[];
  g.particles.clear();
  g.time=0;
  g._destroyedBuildingsLog=[];
  var slot=g.config.slots[0];
  var race=slot.race,pid=0;
  var base=g.map.bases[0];
  var baseX=base.x*g.tileSize,baseY=base.y*g.tileSize;
  var thDef=RACES[race].buildings.townhall;
  var th=new Building(baseX,baseY,0,thDef,race);
  th.completed=true;th.owner='player';th.pid=0;
  if(sp.playerBuildings&&sp.playerBuildings.length){
    var pb0=sp.playerBuildings[0];
    if(pb0.level) th.level=pb0.level;
  }
  g.buildings.push(th);
  g.teams[0]={gold:500,wood:300};
  var pu=sp.playerUnits||[];
  var angStart=0;
  for(var ui=0;ui<pu.length;ui++){
    var _pu=pu[ui];
    var def=RACES[race].units[_pu.role];
    if(!def) continue;
    for(var k=0;k<_pu.count;k++){
      var a=angStart+k*0.7,r=180+Math.random()*60;
      var ux=baseX+Math.cos(a)*r,uy=baseY+Math.sin(a)*r;
      var u=new Unit(ux,uy,0,def,race);
      u.owner='player';u.pid=0;u.spawnT=0;
      g.units.push(u);
    }
    angStart+=1.2;
  }
  if(sp.playerHero){
    var hv=getHeroVariant(race,sp.playerHero);
    if(hv){
      var hx=baseX+Math.cos(1.5)*160,hy=baseY+Math.sin(1.5)*160;
      var hero=new Unit(hx,hy,0,hv,race);
      hero.owner='player';hero.pid=0;hero.spawnT=0;
      hero.heroType=sp.playerHero;
      if(hv.abilities&&hv.abilities.length){
        hero.abilityLevels[hv.abilities[0].id]=1;
      }
      hero.skillPoints=0;
      hero._recalc();
      g.units.push(hero);
      this._missionUnits.playerHero=hero;
    }
  }
  if(sp.scriptedBuildings){
    for(var _sbi=0;_sbi<sp.scriptedBuildings.length;_sbi++){
      var _sb=sp.scriptedBuildings[_sbi];
      var _sbRace=RACES[_sb.race];if(!_sbRace) continue;
      var _sbDef=_sbRace.buildings[_sb.kind];if(!_sbDef) continue;
      var _sbTeam=(typeof _sb.team==='number')?_sb.team:1;
      var _sbB=new Building(g.clampX(_sb.x),g.clampY(_sb.y),_sbTeam,_sbDef,_sb.race);
      _sbB.completed=true;_sbB.owner='bot';_sbB.pid=_sbTeam;
      g.buildings.push(_sbB);
    }
  }
  if(sp.allyNPCs){
    for(var _ani=0;_ani<sp.allyNPCs.length;_ani++){
      var _an2=sp.allyNPCs[_ani];
      var _ar2=RACES[_an2.race];
      if(!_ar2) continue;
      var _adef2=_an2.heroType?getHeroVariant(_an2.race,_an2.heroType):_ar2.units[_an2.unitRole||'melee'];
      if(!_adef2) continue;
      var _au2=new Unit(g.clampX(_an2.x),g.clampY(_an2.y),0,_adef2,_an2.race);
      _au2.owner='player';_au2.pid=0;_au2.spawnT=0;
      _au2._isAllyNPC=true;
      if(_an2.heroType){
        _au2.heroType=_an2.heroType;
        _au2.level=_an2.level||6;
        _au2.maxHp=_adef2.hp+70*(_au2.level-1);_au2.hp=_au2.maxHp;
        _au2.dmg=_adef2.dmg+5*(_au2.level-1);
        _au2.maxMana=100+20*(_au2.level-1);_au2.mana=_au2.maxMana;
        if(_adef2.abilities&&_adef2.abilities.length) _au2.abilityLevels[_adef2.abilities[0].id]=1;
        _au2._recalc();
      }
      g.units.push(_au2);
      if(_an2.tag) this._missionUnits[_an2.tag]=_au2;
    }
  }
  if(m.enemyRaces&&m.enemyRaces.length>0){
    var _baseIdx=0;
    for(var _bsi=0;_bsi<g.config.slots.length;_bsi++){
      var _slot=g.config.slots[_bsi];
      var _bpos=g.map.bases[_baseIdx++];
      if(!_bpos) break;
      if(_slot.type!=='bot') continue;
      var _bx=_bpos.x*g.tileSize,_by=_bpos.y*g.tileSize;
      var _thDef2=RACES[_slot.race].buildings.townhall;
      var _bth=new Building(_bx,_by,_slot.team,_thDef2,_slot.race);
      _bth.completed=true;_bth.owner='bot';_bth.pid=_bsi;
      g.buildings.push(_bth);
      for(var _bw=0;_bw<3;_bw++){
        var _bwa=_bw/3*TAU+0.4;
        var _bwx=g.clampX(_bx+Math.cos(_bwa)*180);
        var _bwy=g.clampY(_by+Math.sin(_bwa)*180);
        var _bwu=new Unit(_bwx,_bwy,_slot.team,RACES[_slot.race].units.worker,_slot.race);
        _bwu.owner='bot';_bwu.pid=_bsi;g.units.push(_bwu);
      }
      g.getRes(_bsi);
      g.teams[_bsi].gold=600;
      g.teams[_bsi].wood=400;
    }
    try{g.spawnAI();}catch(_ae){ERR('campaign spawnAI',_ae);}
  }
  var waves=sp.enemyWaves||[];
  for(var wi=0;wi<waves.length;wi++){
    var w=waves[wi];
    if(w.spawnOnTrigger) continue;
    this._spawnWave(w);
  }
  if(sp.boss){
    this._spawnBoss(sp.boss);
  }
  g.camera.x=baseX;g.camera.y=baseY;
  g.camera.zoom=Math.max(getMinZoom(),Math.min(1,Renderer_.w/1500));
  clampCam();
  var self=this;
  if(m.chronicle&&m.chronicle.length){
    UI.showChronicler(m.chapterFull,m.chronicle,function(){
      self._startTrigger('start');
    });
  } else {
    self._startTrigger('start');
  }
};
CampaignMissionRuntime.prototype._spawnWave=function(w){
  var g=this.g;
  if(this._waveSpawned[w.tag]) return;
  this._waveSpawned[w.tag]=true;
  if(w.spawnAsUnits&&w.unitRace&&w.unitRole){
    var race=RACES[w.unitRace];
    if(!race) return;
    var def;
    if(w.unitRole==='hero'&&w.heroType){
      def=getHeroVariant(w.unitRace,w.heroType);
    } else {
      def=race.units[w.unitRole];
    }
    if(!def) return;
    for(var i=0;i<w.count;i++){
      var a=(i/w.count)*TAU+Math.random()*0.6;
      var r=60+Math.random()*100;
      var x=g.clampX(w.x+Math.cos(a)*r),y=g.clampY(w.y+Math.sin(a)*r);
      var _wt=w.team!==undefined?w.team:1;
      var u=new Unit(x,y,_wt,def,w.unitRace);
      u.owner='bot';u.pid=_wt;u.spawnT=0;
      if(w.unitRole==='hero'&&w.heroType){
        u.heroType=w.heroType;
        u.level=w.level||6;
        u.maxHp=def.hp+70*(u.level-1);u.hp=u.maxHp;
        u.dmg=def.dmg+5*(u.level-1);
        u.maxMana=100+20*(u.level-1);u.mana=u.maxMana;
        if(def.abilities&&def.abilities.length) u.abilityLevels[def.abilities[0].id]=1;
        u._recalc();
      }
      u._missionTag=w.tag;
      g.units.push(u);
      this._missionUnits['wave_'+w.tag+'_'+i]=u;
      if(w.isBoss) this._missionUnits[w.tag]=u;
    }
  } else {
    for(var i2=0;i2<w.count;i2++){
      var a2=(i2/w.count)*TAU+Math.random()*0.5;
      var r2=60+Math.random()*100;
      var x2=g.clampX(w.x+Math.cos(a2)*r2),y2=g.clampY(w.y+Math.sin(a2)*r2);
      var c=new Creep(x2,y2,w.kind,w.level||1,!!w.isBoss);
      c._missionTag=w.tag;
      g.creeps.push(c);
      if(w.isBoss) this._missionUnits[w.tag]=c;
    }
  }
};
CampaignMissionRuntime.prototype._spawnBoss=function(b){
  var g=this.g;
  var x=g.clampX(b.x),y=g.clampY(b.y);
  var c=new Creep(x,y,b.kind,b.level||1,true);
  c._missionTag=b.tag;
  c._missionBossName=b.name||null;
  g.creeps.push(c);
  this._missionUnits[b.tag]=c;
  this._waveSpawned[b.tag]=true;
};
CampaignMissionRuntime.prototype._startTrigger=function(triggerId){
  var m=this.mission;
  for(var i=0;i<m.dialogues.length;i++){
    if(m.dialogues[i].trigger===triggerId){
      this._showDialog(m.dialogues[i].lines);
      return;
    }
  }
};
CampaignMissionRuntime.prototype._showDialog=function(lines){
  if(!lines||!lines.length) return;
  var self=this;
  if(this._dialogActive){this._dialogQueue.push({lines:lines});return;}
  this._dialogActive=true;
  this._dialogCurrent=lines;
  this._dialogLineIdx=0;
  this._renderDialogLine();
  var _next=function(){
    self._dialogLineIdx++;
    if(self._dialogLineIdx>=self._dialogCurrent.length){
      self._dialogActive=false;
      self._dialogCurrent=null;
      UI.$('dialog-panel').classList.remove('show');
      if(self._dialogQueue.length){
        var q=self._dialogQueue.shift();
        self._showDialog(q.lines);
      }
    } else self._renderDialogLine();
  };
  UI._dialogNextFn=_next;
};
CampaignMissionRuntime.prototype._renderDialogLine=function(){
  if(!this._dialogCurrent) return;
  var l=this._dialogCurrent[this._dialogLineIdx];
  UI.showDialogPanel(l.speaker,l.text);
};
CampaignMissionRuntime.prototype._completeObjective=function(id){
  var o=this.objectives[id];
  if(!o||o.done) return;
  o.done=true;
  this._updateObjectivesPanel();
  Audio.sfx('notify');
  var m=this.mission;
  if(!this._dialogFired[id]){
    var _idSuffix=id.replace(/^(kill|destroy|build|accept|repel|survive)/i,'');
    var _cands=['after'+_idSuffix,'after_'+id,'after'+id.charAt(0).toUpperCase()+id.slice(1),'after'+id,id];
    for(var di=0;di<m.dialogues.length;di++){
      var dg=m.dialogues[di];
      if(_cands.indexOf(dg.trigger)>=0){
        this._dialogFired[id]=true;
        this._showDialog(dg.lines);
        break;
      }
    }
  }
  for(var i=0;i<m.triggers.length;i++){
    var t=m.triggers[i];
    if(t.when&&t.when.type==='objectiveDone'&&t.when.id===id){
      this._fireTrigger(t);
    }
  }
  this._checkWinCondition();
};
CampaignMissionRuntime.prototype._failObjective=function(id){
  var o=this.objectives[id];
  if(!o||o.failed||o.done) return;
  o.failed=true;
  this._updateObjectivesPanel();
};
CampaignMissionRuntime.prototype._updateObjectivesPanel=function(){
  var list=document.getElementById('objectives-list');
  var panel=document.getElementById('objectives-panel');
  if(!list||!panel) return;
  panel.classList.add('show');
  var html='';
  for(var id in this.objectives){
    var o=this.objectives[id];
    var marker=o.done?'✓':(o.failed?'✗':'○');
    var cls=o.done?'done':(o.failed?'failed':'active');
    var btn='';
    if(o.type==='action'&&!o.done&&!o.failed){
      btn=' <button class="obj-action-btn" data-action="'+id+'">'+o.btnText+'</button>';
    }
    html+='<div class="obj '+cls+'"><span class="obj-marker">'+marker+'</span><span>'+o.text;
    if(o.type==='counter'&&o.target) html+=' ('+Math.min(o.progress,o.target)+'/'+o.target+')';
    if(o.type==='builtN'&&o.target) html+=' ('+Math.min(o.progress,o.target)+'/'+o.target+')';
    if(o.type==='destroyBuildings'&&o.target) html+=' ('+Math.min(o.progress,o.target)+'/'+o.target+')';
    if(o.type==='destroyKind'&&o.target) html+=' ('+Math.min(o.progress,o.target)+'/'+o.target+')';
    html+=btn+'</span></div>';
  }
  list.innerHTML=html;
  var btns=list.querySelectorAll('.obj-action-btn');
  for(var i=0;i<btns.length;i++){
    (function(btn){
      btn.onclick=function(e){
        e.stopPropagation();
        Audio.sfx('click');
        if(CampaignRuntime) CampaignRuntime.doAction(btn.dataset.action);
      };
    })(btns[i]);
  }
};
CampaignMissionRuntime.prototype.doAction=function(actionId){
  var g=this.g;
  var o=this.objectives[actionId];
  if(!o||o.done||o.failed) return;
  var th=null;
  for(var i=0;i<g.buildings.length;i++){
    if(g.buildings[i].pid===0&&g.buildings[i].kind==='townhall'&&!g.buildings[i].dead){th=g.buildings[i];break;}
  }
  if(!th){g.notify('Нет ратуши');return;}
  if(actionId==='hireMercs'){
    if(!g.teams[0]||g.teams[0].gold<300){g.notify('Нужно 300 золота');return;}
    g.subRes(0,300,0);
    var def=RACES['gromborn'].units.melee;
    for(var j=0;j<4;j++){
      var a=j/4*TAU+0.5;
      var u=new Unit(g.clampX(th.x+Math.cos(a)*180),g.clampY(th.y+Math.sin(a)*180),0,def,'gromborn');
      u.owner='player';u.pid=0;u._isAllyNPC=true;u.spawnT=0;
      g.units.push(u);
    }
    this._completeObjective(actionId);
    this._startTrigger('valinHired');
  }
  else if(actionId==='payKrell'){
    if(!g.teams[0]||g.teams[0].gold<500){g.notify('Нужно 500 золота');return;}
    g.subRes(0,500,0);
    var def2=RACES['gromborn'].units.elite;
    for(var j2=0;j2<6;j2++){
      var a2=j2/6*TAU;
      var u2=new Unit(g.clampX(th.x+Math.cos(a2)*200),g.clampY(th.y+Math.sin(a2)*200),0,def2,'gromborn');
      u2.owner='player';u2.pid=0;u2._isAllyNPC=true;u2.spawnT=0;
      g.units.push(u2);
    }
    this._completeObjective(actionId);
    this._startTrigger('krellHired');
  }
  else if(actionId==='acceptBetrayalHelp'||actionId==='acceptBetrayal'){
    this._completeObjective(actionId);
    this._startTrigger('betrayalIncoming');
  }
};
CampaignMissionRuntime.prototype._fireTrigger=function(t){
  var key=JSON.stringify(t.when);
  if(this._firedTriggers[key]&&!t.repeat) return;
  this._firedTriggers[key]=true;
  for(var i=0;i<t.do.length;i++){
    var a=t.do[i];
    if(a.dialog) this._startTrigger(a.dialog);
    if(a.completeObj) this._completeObjective(a.completeObj);
    if(a.failObj) this._failObjective(a.failObj);
    if(a.spawnWave){
      var m=this.mission,sp=m.spawn||{};
      var w=(sp.enemyWaves||[]).find(function(x){return x.tag===a.spawnWave;});
      if(w) this._spawnWave(w);
    }
    if(a.addRes&&this.g.teams[0]) this.g.addRes(0,a.addRes.gold||0,a.addRes.wood||0);
    if(a.notify) UI.pushNotif(a.notify);
    if(a.camTo){var g=this.g;g.camera.x=a.camTo.x;g.camera.y=a.camTo.y;clampCam();}
    if(a.win) this._win();
    if(a.lose) this._lose();
    if(a.completeCustom){this._customDone[a.completeCustom]=true;this._completeObjective(a.completeCustom);}
    if(a.betrayAllies){
      for(var _bi=0;_bi<this.g.units.length;_bi++){
        var _bu=this.g.units[_bi];
        if(_bu._isAllyNPC){
          _bu._isAllyNPC=false;
          _bu.team=1;
          _bu.pid=1;
          _bu.owner='bot';
          _bu.target=null;
          _bu.lockedTarget=null;
          if(!_bu.stance) _bu.stance='aggressive';
        }
      }
    }
    if(a.spawnAllyNPC){
      var _an=a.spawnAllyNPC;
      var _ar=RACES[_an.race];
      if(_ar){
        var _adef=_an.heroType?getHeroVariant(_an.race,_an.heroType):_ar.units[_an.unitRole||'melee'];
        if(_adef){
          var _au=new Unit(this.g.clampX(_an.x),this.g.clampY(_an.y),0,_adef,_an.race);
          _au.owner='player';_au.pid=0;_au.spawnT=0;
          _au._isAllyNPC=true;
          if(_an.heroType){
            _au.heroType=_an.heroType;
            _au.level=_an.level||6;
            _au.maxHp=_adef.hp+70*(_au.level-1);_au.hp=_au.maxHp;
            _au.dmg=_adef.dmg+5*(_au.level-1);
            _au.maxMana=100+20*(_au.level-1);_au.mana=_au.maxMana;
            if(_adef.abilities&&_adef.abilities.length) _au.abilityLevels[_adef.abilities[0].id]=1;
            _au._recalc();
          }
          this.g.units.push(_au);
          if(_an.tag) this._missionUnits[_an.tag]=_au;
        }
      }
    }
  }
};
CampaignMissionRuntime.prototype._checkWinCondition=function(){
  if(this._gameEnded) return;
  var allDone=true;
  for(var id in this.objectives){if(!this.objectives[id].done){allDone=false;break;}}
  if(allDone&&this.mission.winCondition==='allObjectives'){this._win();return;}
};
CampaignMissionRuntime.prototype._checkObjectiveProgress=function(){
  var self=this,m=this.mission,g=this.g;
  for(var id in this.objectives){
    var o=this.objectives[id];
    if(o.done||o.failed) continue;
    var objDef=null;
    for(var i=0;i<m.objectives.length;i++){if(m.objectives[i].id===id){objDef=m.objectives[i];break;}}
    if(!objDef) continue;
    if(objDef.type==='built'){
      for(var bi=0;bi<g.buildings.length;bi++){
        var b=g.buildings[bi];
        if(b.pid===0&&b.kind===objDef.kind&&b.completed){this._completeObjective(id);break;}
      }
    } else if(objDef.type==='builtN'){
      var cnt=0;
      for(var bi2=0;bi2<g.buildings.length;bi2++){
        var b2=g.buildings[bi2];
        if(b2.pid===0&&b2.kind===objDef.kind&&b2.completed) cnt++;
      }
      o.progress=cnt;
      if(cnt>=objDef.target) this._completeObjective(id);
      else this._updateObjectivesPanel();
    } else if(objDef.type==='heroCount'){
      var hc=0;
      for(var hi=0;hi<g.units.length;hi++){
        var u=g.units[hi];
        if(u.pid===0&&u.isHero&&!u.dying&&u.heroType===objDef.heroType) hc++;
      }
      if(hc>=1) this._completeObjective(id);
    } else if(objDef.type==='army'){
      var melee=0,ranged=0;
      for(var ai=0;ai<g.units.length;ai++){
        var au=g.units[ai];
        if(au.pid!==0||au.dying) continue;
        if(au.role==='melee') melee++;
        else if(au.role==='ranged') ranged++;
      }
      if(melee>=objDef.melee&&ranged>=objDef.ranged) this._completeObjective(id);
    } else if(objDef.type==='counter'){
      o.progress=this._killsCounter[id]||0;
      if(o.progress>=objDef.target) this._completeObjective(id);
      else this._updateObjectivesPanel();
    } else if(objDef.type==='tag'){
      var tag=objDef.tag||objDef.id;
      var _wasSpawned=!!this._waveSpawned[tag];
      if(!_wasSpawned){
        for(var _bsi=0;_bsi<g.creeps.length;_bsi++){if(g.creeps[_bsi]._missionTag===tag){_wasSpawned=true;break;}}
      }
      if(!_wasSpawned){
        for(var _bsi2=0;_bsi2<g.units.length;_bsi2++){if(g.units[_bsi2]._missionTag===tag){_wasSpawned=true;break;}}
      }
      if(!_wasSpawned) continue;
      var anyAlive=false;
      for(var ci=0;ci<g.creeps.length;ci++){
        var cr=g.creeps[ci];
        if(cr.dying||cr.dead) continue;
        if(cr._missionTag===tag){anyAlive=true;break;}
      }
      if(!anyAlive){
        for(var ui5=0;ui5<g.units.length;ui5++){
          var uu5=g.units[ui5];
          if(uu5.dying||uu5.dead) continue;
          if(uu5._missionTag===tag){anyAlive=true;break;}
        }
      }
      if(!anyAlive) this._completeObjective(id);
    } else if(objDef.type==='action'){
      /* выполняется через doAction */
    } else if(objDef.type==='trigger'){
      if(id==='selectHero'&&this._heroSelected){this._completeObjective(id);}
      if(id==='learnMove'&&this._moveIssued){this._completeObjective(id);}
    } else if(objDef.type==='destroyBuildings'){
      var _dCnt=0;
      for(var _dbi=0;_dbi<g._destroyedBuildingsLog.length;_dbi++){
        var _dbe=g._destroyedBuildingsLog[_dbi];
        if(objDef.teamFilter&&_dbe.team!==objDef.teamFilter) continue;
        _dCnt++;
      }
      o.progress=_dCnt;
      if(_dCnt>=objDef.target) this._completeObjective(id);
      else this._updateObjectivesPanel();
    } else if(objDef.type==='destroyKind'){
      var _kCnt=0;
      for(var _kbi=0;_kbi<g._destroyedBuildingsLog.length;_kbi++){
        var _kbe=g._destroyedBuildingsLog[_kbi];
        if(_kbe.kind!==objDef.kind) continue;
        if(objDef.teamFilter&&_kbe.team!==objDef.teamFilter) continue;
        _kCnt++;
      }
      o.progress=_kCnt;
      if(_kCnt>=objDef.target) this._completeObjective(id);
      else this._updateObjectivesPanel();
    } else if(objDef.type==='custom'){
      if(this._customDone[id]) this._completeObjective(id);
    }
  }
};
CampaignMissionRuntime.prototype._win=function(){
  if(this._gameEnded) return;
  this._gameEnded=true;
  var mid=this.mission.id;
  CampaignState.markComplete(mid);
  var g=this.g;
  g.gameOver=true;g.result='win';
};
CampaignMissionRuntime.prototype._lose=function(){
  if(this._gameEnded) return;
  this._gameEnded=true;
  var g=this.g;
  g.gameOver=true;g.result='lose';
};
CampaignMissionRuntime.prototype.update=function(dt){
  if(this._gameEnded) return;
  this.time+=dt;
  if(this.mission.loseCondition==='heroDied'){
    var anyHeroAlive=false;
    for(var i=0;i<this.g.units.length;i++){
      var u=this.g.units[i];
      if(u.pid===0&&u.isHero&&!u.dying&&!u.dead){anyHeroAlive=true;break;}
    }
    if(!anyHeroAlive&&this._missionUnits.playerHero&&(this._missionUnits.playerHero.dead||this._missionUnits.playerHero.dying)){
      this._lose();return;
    }
  }
  if(this.mission.loseCondition==='townhallLost'){
    var hasTH=false;
    for(var bi=0;bi<this.g.buildings.length;bi++){
      var b=this.g.buildings[bi];
      if(b.pid===0&&b.kind==='townhall'&&!b.dead) hasTH=true;
    }
    if(!hasTH){this._lose();return;}
  }
  var m=this.mission;
  for(var ti=0;ti<m.triggers.length;ti++){
    var t=m.triggers[ti];
    if(!t.when) continue;
    if(t.when.type==='missionTime'&&this.time>=t.when.at){
      this._fireTrigger(t);
    }
    if(t.when.type==='unitDeath'&&t.when.tag){
      var _mu=this._missionUnits[t.when.tag];
      if(_mu&&(_mu.dead||_mu.dying)) this._fireTrigger(t);
    }
  }
  this._checkObjectiveProgress();
};
CampaignMissionRuntime.prototype.markCustomComplete=function(id){
  this._customDone[id]=true;
};

var _lastUpdateTime=0;
function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  if(!isFinite(dt)||dt<0) dt=0.016;
  dt=Math.min(0.1,dt);
  lastT=now;
  try{
    if(Game_&&!Game_.paused){
      Input.updateCamera(dt);
      Game_.update(dt);
      if(CampaignRuntime&&!Game_.gameOver){
        try{CampaignRuntime.update(dt);}catch(e){ERR('campaign',e);}
      }
      _lastUpdateTime=now;
      if(Game_.camera) Audio.setEar(Game_.camera.x,Game_.camera.y,Game_.camera.zoom);
    }
  }catch(e){ERR('update',e);}
  try{
    if(Renderer_&&Game_){
      if(Renderer_.setFrameAlpha) Renderer_.setFrameAlpha(0.5);
      Renderer_.draw();
    }
  }catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  requestAnimationFrame(loop);
}
function boot(){
  try{
    UI=new UISys();
    UI.applyLangUI();
    Input.init(document.getElementById('game'));
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){Audio.pauseAll();}
      else{Audio.resume();lastT=0;}
    });
    window.addEventListener('blur',function(){Audio.pauseAll();});
    window.addEventListener('focus',function(){Audio.resume();lastT=0;});
    UI.showScreen('menu');
    requestAnimationFrame(loop);
  }catch(e){ERR('boot',e);showError('Load: '+e.message);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
