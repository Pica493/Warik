  init:function(){if(this.ctx) return;try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;this.ctx=new AC();

  upd:function(){if(!this.ctx) return;this.master.gain.value=Settings.volume;this.musG.gain.value=Settings.music;},
  tone:function(dest,f,dur,vol,type,endF){if(!this.ctx||!dest) return;try{var t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(endF) o.frequency.exponentialRampToValueAtTime(Math.max(20,endF),t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+0.05);}catch(e){}},
  noise:function(dest,dur,vol,ff,q){if(!this.ctx||!this.noiseBuf||!dest) return;try{var t=this.ctx.currentTime,s=this.ctx.createBufferSource();s.buffer=this.noiseBuf;var bf=this.ctx.createBiquadFilter();bf.type='bandpass';bf.frequency.value=ff||400;bf.Q.value=q||1;var g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(bf);bf.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+0.05);}catch(e){}},

function makeCv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}

  /* ================================================================
   МОДЕЛИ ЮНИТОВ — расовые особенности
   Люминиты = люди (стальные шлемы, светлая кожа)
   Громорождённые = орки (зелёная кожа, клыки, чёрные волосы)
   Сильваниды = эльфы (остроконечные уши, бледная кожа, венок)
   ================================================================ */
function bakeUnit(race,role,team,dir){
  var key='u_'+race+'_'+role+'_'+team+'_'+dir;
  if(SPRITES[key]) return SPRITES[key];
  var isHero=role==='hero';
  var W=role==='cav'?120:role==='siege'?100:(isHero?70:56);
  var H=role==='cav'?120:role==='siege'?100:(isHero?90:74);
  var cv=makeCv(W,H),ctx=cv.getContext('2d');
  var color=teamColor(team),dark=teamDark(team),cx=W/2;
  var pal=RACE_PAL[race]||RACE_PAL.luminite;
  var skinPal=RACE_SKIN[race]||RACE_SKIN.luminite;
  var isBack=(dir===DIR.UP);
  if(role==='cav'){drawCavalry(ctx,W,H,race,team,dir);SPRITES[key]=cv;return cv;}
  if(role==='siege'){drawSiege(ctx,W,H,race,team,dir);SPRITES[key]=cv;return cv;}
  if(role==='fly'){drawFlyer(ctx,W,H,race,team,dir);SPRITES[key]=cv;return cv;}
  var legDef=getLeg(role),legH=legDef?legDef.h:14;
  var bodyBaseY=H-legH;
  var bw,bh,headY;
  if(role==='worker'){bw=16;bh=20;headY=bodyBaseY-bh-6;}
  else if(role==='hero'){bw=22;bh=26;headY=bodyBaseY-bh-10;}
  else if(role==='elite'){bw=21;bh=25;headY=bodyBaseY-bh-8;}
  else if(role==='spear'){bw=16;bh=24;headY=bodyBaseY-bh-7;}
  else if(role==='ranged'){bw=17;bh=21;headY=bodyBaseY-bh-6;}
  else if(role==='heal'){bw=18;bh=26;headY=bodyBaseY-bh-7;}
  else{bw=19;bh=22;headY=bodyBaseY-bh-6;}
  if(race==='gromborn'){bw=Math.round(bw*1.12);bh=Math.round(bh*1.05);headY=bodyBaseY-bh-(role==='hero'?10:role==='elite'?8:7);}
  else if(race==='sylvanid'){bw=Math.round(bw*0.92);bh=Math.round(bh*1.02);}

  if(!isBack){
    if(role==='elite'){
      var capeG=ctx.createLinearGradient(0,headY,0,bodyBaseY);
      capeG.addColorStop(0,shade(color,0.1));capeG.addColorStop(1,shade(color,-0.5));
      ctx.fillStyle=capeG;
      ctx.beginPath();ctx.moveTo(cx-bw*0.7,headY+6);
      ctx.quadraticCurveTo(cx-bw*0.9,bodyBaseY+8,cx-bw*0.5,bodyBaseY+12);
      ctx.lineTo(cx+bw*0.5,bodyBaseY+12);
      ctx.quadraticCurveTo(cx+bw*0.9,bodyBaseY+8,cx+bw*0.7,headY+6);
      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();
    }
    if(role==='melee'){
      ctx.save();
      var sx=cx-bw/2-5,sy=bodyBaseY-bh*0.55;
      var sg=ctx.createRadialGradient(sx-3,sy-3,1,sx,sy,11);
      sg.addColorStop(0,shade(color,0.35));sg.addColorStop(0.6,shade(color,-0.1));sg.addColorStop(1,shade(color,-0.55));
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,11,0,TAU);ctx.fill();
      ctx.strokeStyle='#2a1a0a';ctx.lineWidth=1.6;ctx.stroke();
      ctx.strokeStyle=pal.trim;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(sx,sy,6,0,TAU);ctx.stroke();
      ctx.fillStyle=pal.trim;ctx.beginPath();ctx.arc(sx,sy,2.2,0,TAU);ctx.fill();
      ctx.restore();
    }
    if(role==='ranged'){
      ctx.save();
      ctx.translate(cx-bw/2+2,bodyBaseY-bh*0.7);ctx.rotate(-0.3);
      ctx.fillStyle=pal.wood;ctx.fillRect(-4,-14,8,18);
      ctx.strokeStyle='#2a1808';ctx.lineWidth=1.2;ctx.strokeRect(-4,-14,8,18);
      ctx.strokeStyle='#c8b880';ctx.lineWidth=1;
      for(var qi=0;qi<3;qi++){ctx.beginPath();ctx.moveTo(-2+qi*2,-14);ctx.lineTo(-2+qi*2,-20);ctx.stroke();}
      ctx.fillStyle='#e0d0a0';
      for(var qi2=0;qi2<3;qi2++){ctx.beginPath();ctx.moveTo(-3.5+qi2*2,-20);ctx.lineTo(-0.5+qi2*2,-20);ctx.lineTo(-2+qi2*2,-24);ctx.closePath();ctx.fill();}
      ctx.restore();
    }
  }

  var bodyGrad=ctx.createLinearGradient(cx-bw/2,0,cx+bw/2,0);
  if(race==='gromborn'){bodyGrad.addColorStop(0,shade(dark,-0.1));bodyGrad.addColorStop(0.5,shade(color,0.05));bodyGrad.addColorStop(1,shade(dark,-0.1));}
  else if(race==='sylvanid'){bodyGrad.addColorStop(0,shade(color,0.1));bodyGrad.addColorStop(0.5,shade(color,0.25));bodyGrad.addColorStop(1,shade(color,-0.05));}
  else{bodyGrad.addColorStop(0,dark);bodyGrad.addColorStop(0.5,color);bodyGrad.addColorStop(1,dark);}
  ctx.fillStyle=bodyGrad;roundRect(ctx,cx-bw/2,bodyBaseY-bh,bw,bh,4);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1.4;ctx.stroke();

  if(!isBack){
    ctx.fillStyle='rgba(255,255,255,0.18)';
    ctx.fillRect(cx-bw/2+2,bodyBaseY-bh+3,bw*0.35,bh-6);
    ctx.fillStyle='#3a2010';ctx.fillRect(cx-bw/2,bodyBaseY-3,bw,4);
    ctx.strokeStyle='#1a0a04';ctx.lineWidth=0.8;ctx.strokeRect(cx-bw/2,bodyBaseY-3,bw,4);
    ctx.fillStyle=pal.trim;ctx.fillRect(cx-2,bodyBaseY-2,4,3);
  }

  /* Расовые детали на теле */
  if(race==='gromborn'&&!isBack){
    /* Кожаный ремень через грудь + костяной амулет */
    ctx.strokeStyle='#3a2010';ctx.lineWidth=2.2;
    ctx.beginPath();ctx.moveTo(cx-bw/2+2,bodyBaseY-bh+4);ctx.lineTo(cx+bw/2-2,bodyBaseY-bh*0.5);ctx.stroke();
    ctx.strokeStyle='#1a0a04';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx-bw/2+2,bodyBaseY-bh+4);ctx.lineTo(cx+bw/2-2,bodyBaseY-bh*0.5);ctx.stroke();
    ctx.fillStyle='#f0e8d0';
    ctx.beginPath();ctx.arc(cx-1,bodyBaseY-bh*0.65,1.8,0,TAU);ctx.fill();
    ctx.strokeStyle='#3a2010';ctx.lineWidth=0.6;ctx.stroke();
  } else if(race==='sylvanid'&&!isBack){
    /* Природная накидка из виноградной лозы + светящиеся листья */
    ctx.strokeStyle='#3a7a30';ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(cx-bw/2+1,bodyBaseY-bh*0.7);ctx.quadraticCurveTo(cx,bodyBaseY-bh*0.5,cx+bw/2-1,bodyBaseY-bh*0.7);ctx.stroke();
    ctx.fillStyle='#5adf5a';
    ctx.beginPath();ctx.ellipse(cx-3,bodyBaseY-bh*0.62,2,1.2,-0.3,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+3,bodyBaseY-bh*0.62,2,1.2,0.3,0,TAU);ctx.fill();
  }

  if(role==='elite'&&!isBack){
    ctx.fillStyle=pal.metal;ctx.strokeStyle='#3a3a3a';ctx.lineWidth=1.1;
    ctx.beginPath();ctx.ellipse(cx-bw/2-1,bodyBaseY-bh+4,6,5,0.15,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(cx+bw/2+1,bodyBaseY-bh+4,6,5,-0.15,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-bw*0.4,bodyBaseY-bh+2);ctx.lineTo(cx,bodyBaseY-bh*0.45);ctx.lineTo(cx+bw*0.4,bodyBaseY-bh+2);ctx.stroke();
    if(race==='gromborn'){
      ctx.fillStyle='#3a3a3a';
      ctx.beginPath();ctx.moveTo(cx-bw/2-5,bodyBaseY-bh+1);ctx.lineTo(cx-bw/2-3,bodyBaseY-bh-5);ctx.lineTo(cx-bw/2-1,bodyBaseY-bh+1);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(cx+bw/2+5,bodyBaseY-bh+1);ctx.lineTo(cx+bw/2+3,bodyBaseY-bh-5);ctx.lineTo(cx+bw/2+1,bodyBaseY-bh+1);ctx.closePath();ctx.fill();
    }
  }
  if(role==='heal'&&!isBack){
    ctx.fillStyle=pal.trim;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.moveTo(cx-bw/2-2,bodyBaseY-bh*0.35);
    ctx.lineTo(cx,bodyBaseY+2);ctx.lineTo(cx+bw/2+2,bodyBaseY-bh*0.35);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
  }
  if(isHero&&!isBack){
    ctx.fillStyle=race==='luminite'?'#e6c67a':race==='gromborn'?'#8a5020':'#5ac050';
    ctx.beginPath();ctx.arc(cx,bodyBaseY-bh*0.55,5,0,TAU);ctx.fill();
    ctx.strokeStyle='#3a2010';ctx.lineWidth=1.2;ctx.stroke();
    if(race==='sylvanid'){
      ctx.fillStyle='rgba(160,255,120,0.5)';
      ctx.beginPath();ctx.arc(cx,bodyBaseY-bh*0.55,7,0,TAU);ctx.fill();
    }
    if(race==='gromborn'){
      ctx.fillStyle='#e0d0a0';
      ctx.beginPath();ctx.arc(cx,bodyBaseY-bh*0.55,3,0,TAU);ctx.fill();
      ctx.strokeStyle='#3a2010';ctx.lineWidth=0.6;ctx.stroke();
    }
  }

  /* Шея */
  ctx.fillStyle=skinPal.skinD;ctx.fillRect(cx-3,headY+8,6,4);
  ctx.strokeStyle='#3a2010';ctx.lineWidth=0.8;ctx.strokeRect(cx-3,headY+8,6,4);
  var headR=role==='hero'?10:8;
  if(race==='gromborn') headR+=1;
  if(race==='sylvanid') headR-=1;

  /* Эльфийские уши рисуем ДО головы */
  if(race==='sylvanid'){
    ctx.fillStyle=skinPal.skin;
    ctx.strokeStyle=skinPal.skinD;ctx.lineWidth=0.8;
    ctx.beginPath();
    ctx.moveTo(cx-headR+1,headY-1);
    ctx.quadraticCurveTo(cx-headR-5,headY-5,cx-headR-9,headY-9);
    ctx.quadraticCurveTo(cx-headR-5,headY-1,cx-headR+1,headY+3);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+headR-1,headY-1);
    ctx.quadraticCurveTo(cx+headR+5,headY-5,cx+headR+9,headY-9);
    ctx.quadraticCurveTo(cx+headR+5,headY-1,cx+headR-1,headY+3);
    ctx.closePath();ctx.fill();ctx.stroke();
  }

  var headGrad=ctx.createRadialGradient(cx-2,headY-2,1,cx,headY,headR);
  headGrad.addColorStop(0,skinPal.skinL);headGrad.addColorStop(0.7,skinPal.skin);headGrad.addColorStop(1,skinPal.skinD);
  ctx.fillStyle=headGrad;ctx.beginPath();ctx.arc(cx,headY,headR,0,TAU);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1.3;ctx.stroke();

  if(race==='luminite'){
    var helmGrad=ctx.createLinearGradient(0,headY-headR-3,0,headY+headR);
    helmGrad.addColorStop(0,'#f0f4f8');helmGrad.addColorStop(0.5,'#c8d0d8');helmGrad.addColorStop(1,'#7a8a98');
    ctx.fillStyle=helmGrad;
    ctx.beginPath();
    ctx.arc(cx,headY-1,headR+2,Math.PI,TAU,false);
    ctx.lineTo(cx+headR+1,headY-1);
    ctx.lineTo(cx-headR-1,headY-1);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#3a4a58';ctx.lineWidth=1.4;ctx.stroke();
    if(!isBack){
      ctx.fillStyle='#8a9aa8';ctx.fillRect(cx-1.2,headY-headR-1,2.4,headR*0.6);
      ctx.strokeStyle='#2a3a48';ctx.lineWidth=0.7;ctx.strokeRect(cx-1.2,headY-headR-1,2.4,headR*0.6);
    }
    if(isHero){
      var capeGrad=ctx.createLinearGradient(0,headY,0,bodyBaseY);
      capeGrad.addColorStop(0,color);capeGrad.addColorStop(1,dark);
      ctx.fillStyle=capeGrad;
      ctx.beginPath();ctx.moveTo(cx-15,headY+6);
      ctx.quadraticCurveTo(cx-18,bodyBaseY+6,cx-12,bodyBaseY+10);
      ctx.lineTo(cx+12,bodyBaseY+10);
      ctx.quadraticCurveTo(cx+18,bodyBaseY+6,cx+15,headY+6);

};

Game.prototype.spawnResources=function(){
  for(var i=0;i<this.map.gold.length;i++){
    var g=this.map.gold[i];
    var gx=g.x*this.tileSize,gy=g.y*this.tileSize;
    var skip=false;
    for(var j=0;j<this.resources.length;j++){
      var r0=this.resources[j];
      if(r0.kind!=='gold') continue;
      if(Math.hypot(r0.x-gx,r0.y-gy)<320){skip=true;break;}
    }
    if(!skip) this.resources.push(new Resource(gx,gy,'gold',12500));
  }
  for(var fi=0;fi<this.map.forests.length;fi++){
    var f=this.map.forests[fi];
    for(var dx=-f.r;dx<=f.r;dx++) for(var dy=-f.r;dy<=f.r;dy++){
      if(dx*dx+dy*dy>f.r*f.r) continue;
      if(((dx*3+dy*7+fi*11)%8+8)%8===0) continue;
      var tx=(f.cx+dx)*this.tileSize,ty=(f.cy+dy)*this.tileSize;
      this._tryPlaceTree(tx,ty);

  }
};

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){
  var th=new Building(x,y,team,race.buildings.townhall,race.id);th.owner=owner;th.pid=pid;this.buildings.push(th);
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);
  var gx=x+Math.cos(toCenter)*360,gy=y+Math.sin(toCenter)*360;
  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);
  var attempts=0;
  while(attempts<12){
    var tooClose=false;
    for(var rr=0;rr<this.resources.length;rr++){
      var r0=this.resources[rr];
      if(r0.kind!=='gold') continue;
      if(Math.hypot(r0.x-gx,r0.y-gy)<420){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;
    gx=cl(gx+Math.cos(wa)*160,80,this.W-80);
    gy=cl(gy+Math.sin(wa)*160,80,this.H-80);
    attempts++;
  }
  var anyMineNear=false;
  for(var rr2=0;rr2<this.resources.length;rr2++){
    var r02=this.resources[rr2];
    if(r02.kind!=='gold') continue;
    if(Math.hypot(r02.x-gx,r02.y-gy)<280){anyMineNear=true;break;}
  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=250+((i%2)*40);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);
    this._tryPlaceTree(tx,ty);
  }
  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j],r2=280;
    var tx2=x+Math.cos(a2)*r2,ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);
    this._tryPlaceTree(tx2,ty2);
  }
  for(var wi=0;wi<3;wi++){
    var aw=(wi/3)*TAU+0.5;
    var u=new Unit(x+Math.cos(aw)*180,y+Math.sin(aw)*180,team,race.units.worker,race.id);
    u.owner=owner;u.pid=pid;u.spawnT=0;this.units.push(u);
  }
};

/* ФИКС: туман войны раскрывается у союзников по team, а не только у playerPid */
Game.prototype.updateFog=function(){
  var cs=this.fogCellSize,c=this.fogCols,r=this.fogRows;
  for(var i=0;i<this.vis.length;i++) this.vis[i]=0;
  var self=this;
  function rev(cx,cy,rad){
    for(var dx=-rad;dx<=rad;dx++){var x=cx+dx;if(x<0||x>=c) continue;
      for(var dy=-rad;dy<=rad;dy++){var y=cy+dy;if(y<0||y>=r) continue;
        if(dx*dx+dy*dy<=rad*rad){var idx=x+y*c;self.vis[idx]=1;self.fog[idx]=2;}}}
  }
  for(i=0;i<this.units.length;i++){
    var u=this.units[i];if(u.dying) continue;
    if(u.pid===this.playerPid || u.team===this.playerTeam)
      rev(Math.floor(u.x/cs),Math.floor(u.y/cs),4);
  }
  for(i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.pid===this.playerPid || b.team===this.playerTeam)
      rev(Math.floor(b.x/cs),Math.floor(b.y/cs),b.kind==='townhall'?9:6);
  }
  for(i=0;i<c*r;i++){if(!this.vis[i]&&this.fog[i]===2) this.fog[i]=1;}
};

Game.prototype.buildSpatialGrid=function(){
  this.spatialGrid={};this.resourceGrid={};var cs=this.spatialCell;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;
    var k=(u.x/cs|0)+','+(u.y/cs|0);if(!this.spatialGrid[k]) this.spatialGrid[k]=[];this.spatialGrid[k].push(u);}

Game.prototype.updateAuras=function(){
  this.auraCache.dmg={};this.auraCache.hp={};this.auraCache.blessing={};
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(!b.completed||b.dead) continue;
    if(b.kind==='forge'){var r=b.radius+260;for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.dead||u.team!==b.team||u.role==='worker') continue;if((u.x-b.x)*(u.x-b.x)+(u.y-b.y)*(u.y-b.y)<r*r) this.auraCache.dmg[u.id]=true;}}
    if(b.kind==='magic'){var r2=b.radius+260;for(var ui2=0;ui2<this.units.length;ui2++){var u2=this.units[ui2];if(u2.dead||u2.team!==b.team||u2.role==='worker') continue;if((u2.x-b.x)*(u2.x-b.x)+(u2.y-b.y)*(u2.y-b.y)<r2*r2) this.auraCache.hp[u2.id]=true;}}
  }

        var a=this.units[j];if(a.dead||a.team!==h.team||a.role==='worker'||a===h) continue;
        if((a.x-h.x)*(a.x-h.x)+(a.y-h.y)*(a.y-h.y)<180*180) this.auraCache.blessing[a.id]=true;
      }

  }
};

Game.prototype.update=function(dt){
  if(this.gameOver||this.paused) return;
  this.time+=dt;this._lastDt=dt;
  if(this.shake>0) this.shake-=dt*3;
  this.buildSpatialGrid();
  this.auraTimer-=dt;if(this.auraTimer<=0){this.auraTimer=1.5;this.updateAuras();}
  this.updateWeather(dt);
  var i;
  for(i=0;i<this.units.length;i++){try{if(!this.units[i].dead) this.updateUnit(this.units[i],dt);}catch(e){ERR('updateUnit',e);}}
  for(i=0;i<this.creeps.length;i++){try{if(!this.creeps[i].dead) this.updateCreep(this.creeps[i],dt);}catch(e){ERR('updateCreep',e);}}
  for(i=0;i<this.buildings.length;i++){try{if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);}catch(e){ERR('updateBuilding',e);}}
  for(i=0;i<this.resources.length;i++){var r=this.resources[i];if(r.dead) continue;if(r.falling){r.fallT+=dt;r.fallAngle=Math.min(Math.PI/2,r.fallT*(Math.PI/2/0.6));if(r.fallT>1.5) r.dead=true;}}
  for(i=0;i<this.projectiles.length;i++){var p=this.projectiles[i];if(p.dead) continue;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.14;
    var baseCnt=wx==='snow'?2:wx==='sand'?2:1;
    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200,h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};
Game.prototype.updateUnit=function(u,dt){
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2;
  if(u.chopT>0) u.chopT-=dt*1.5;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){u.holyStrikeT-=dt;if(u.holyStrikeT<=0&&u.holyStrikeBuff){u.holyStrikeBuff=false;}}
  if(u.isHero&&u.regenPassive&&!u.dying) u.hp=Math.min(u.maxHp,u.hp+u.regenPassive*dt);
  if(u.moving && !u.dying && !u._insideMine){
    u._stuckCheckTimer=(u._stuckCheckTimer||0)+dt;
    if(u._stuckCheckTimer>=1.2){
      var mdx=u.x-(u._lastStuckX||u.x),mdy=u.y-(u._lastStuckY||u.y);
      if(mdx*mdx+mdy*mdy<9){
        u.moveTo=null;u._stuckTimer=0;
        var escAng=Math.random()*TAU;
        u.x=this.clampX(u.x+Math.cos(escAng)*22);
        u.y=this.clampY(u.y+Math.sin(escAng)*22);
      }
      u._stuckCheckTimer=0;
      u._lastStuckX=u.x;u._lastStuckY=u.y;
    }
  }
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(u.owner==='player') Audio.sfx('death');
    this.decals.push(new Decal(u.x,u.y+4,u.radius*1.4));
    if(u.role!=='fly'&&u.role!=='worker'&&!u._isSummon){var vx=(Math.random()-0.5)*80,vy=-60-Math.random()*60;this.weapons.push(new WeaponDrop(u.x+(Math.random()-0.5)*20,u.y-10,u.role,u.race,u.team,vx,vy));}
    if(u.isHero){
      if(u.owner==='player') this.notify(t_('heroDied'));
      this.deadHeroes[u.pid]={race:u.race,level:u.level,exp:u.exp,
        abilityLevels:JSON.parse(JSON.stringify(u.abilityLevels||{})),
        skillPoints:u.skillPoints||0,ultUnlocked:!!u.ultUnlocked};
      var la=u.lastAttacker;
      if(la&&typeof la.pid!=='undefined'&&la.team!==u.team&&this.teams[la.pid]){
        this.addRes(la.pid,BOUNTY_HERO,0);
        this.floaters.push(new Floater(u.x,u.y-65,'+'+BOUNTY_HERO,'#ffe066'));
        if(la.owner==='player') this.notify(t_('bountyHero'));
      }
    }
    return;
  }
  u.animT+=dt;if(u.hitFlash>0) u.hitFlash-=dt;if(u.atkCd>0) u.atkCd-=dt;if(u.attackT>0) u.attackT-=dt*3;
  if(u.stunT>0){u.moving=false;return;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;
  var hasOrder=!!(u.attackMoveTo||u.patrolRoute);
  var isIdleWorker=u.role==='worker'&&!u.gatherTarget&&!u.buildTarget&&!u.repairTarget&&!u.moveTo&&!u.carrying&&!hasOrder&&!u.demolishTarget;
  var shouldSearch=((u.role!=='worker'&&!u.target&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder))||isIdleWorker;
  if(shouldSearch&&!u.target){
    var sr=u.role==='worker'?90:(u.range>120?320:200);
    var e=this.findEnemy(u,sr);
    if(e) u.target=e;
    else {var c=this.findNearestCreep(u,sr);if(c) u.target=c;}
  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;
    if(dxh*dxh+dyh*dyh>40000) u.moveTo={x:u.originX,y:u.originY};
  }
  u.moving=false;
  if(u.role==='worker'){
    if(u.demolishTarget&&!u.demolishTarget.dead){this.doDemolish(u,dt);if(u.moving) u.walkPhase+=dt*10;return;}
    if(u.moveTo) this.doMove(u,dt);
    else if(u.repairTarget&&!u.repairTarget.dead) this.doRepair(u,dt);
    else if(u.buildTarget&&!u.buildTarget.dead) this.doBuild(u,dt);
    else if(u.target) this.doAttack(u,dt);
    else if(u.carrying&&u.carryAmt>=10) this.returnRes(u,dt);
    else if(u.gatherTarget&&!u.gatherTarget.dead){if(u.gatherTarget.amount<=0||u.gatherTarget.falling) u.gatherTarget=null;else this.doGather(u,dt);}
    else if(hasOrder) this.doAttackMove(u,dt);
    if(u.moving) u.walkPhase+=dt*10;
    return;
  }
  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);
  else if(hasOrder) this.doAttackMove(u,dt);
  if(u.moving) u.walkPhase+=dt*10;
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.updateCreep=function(c,dt){
  if(c.stunT>0) c.stunT-=dt;
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;this.spawnParticles(c.x,c.y,'#8a3020',12);
    if(c.lastAttacker){
      var reward=c.goldReward;if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.pid!=='undefined'&&this.teams[c.lastAttacker.pid]){
        this.addRes(c.lastAttacker.pid,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(c.isBoss&&c.lastAttacker.owner==='player') this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.pid!=='undefined'){for(var i=0;i<this.units.length;i++){var h=this.units[i];if(h.isHero&&h.pid===c.lastAttacker.pid&&!h.dying){if(Math.hypot(h.x-c.x,h.y-c.y)<400){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}}}}
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0) c.hitFlash-=dt;if(c.atkCd>0) c.atkCd-=dt;if(c.attackT>0) c.attackT-=dt*3;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=180*180;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);if(d2<bd){bd=d2;best=u;}}
    if(best) c.target=best;
  }
  c.moving=false;
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){c.x+=dx/d*c.spd*dt;c.y+=dy/d*c.spd*dt;c.moving=true;c.walkPhase+=dt*8;}
    else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      c.target.hp-=c.dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+c.dmg,'#ff6060'));
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){c.wanderT=2+Math.random()*3;var a=Math.random()*TAU,r=40+Math.random()*100;c.wanderTarget={x:c.homeX+Math.cos(a)*r,y:c.homeY+Math.sin(a)*r};}
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){c.x+=dxw/dw*c.spd*0.4*dt;c.y+=dyw/dw*c.spd*0.4*dt;c.walkPhase+=dt*6;c.moving=true;}
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=Math.min(hero.maxHp,hero.hp+70);hero.dmg+=5;hero.skillPoints++;
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup');
    if(hero.level>=6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doMove=function(u,dt){
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  if(d<12){u.moveTo=null;return;}
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+8;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
    u.moving=true;this.separate(u);
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.pid,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.pid,t.role);dmg=dmg*(1-0.08*upD.a);}
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    this.projectiles.push(new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,a.pid,'#ffe080'));
    Audio.sfx('arrow');
    if(a.isHero) t.lastAttacker=a;
    if(a.isHero&&t.hp<=dmg) this.grantXP(a,20);
    return;
  }
  if(a.role==='heal'){
    if(t.team===a.team) t.hp=Math.min(t.maxHp,t.hp+dmg*4);
    return;
  }
  Audio.sfx('sword');
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  if(t.isUnit||t.isCreep){
    var ang=Math.atan2(t.y-a.y,t.x-a.x),kb=a.isHero?9:5;
    t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  }
  this.spawnParticles(t.x,t.y,'#ffc040',5);
  this.floaters.push(new Floater(t.x,t.y-25,'-'+dmg,a.isHero?'#ffe9a8':'#ff6060'));
  this.shake=Math.min(0.3,this.shake+0.06);
  if(t.isUnit&&!t.target&&t.role!=='worker'&&!t.isBuilding) t.target=a;
  if(a.isHero&&a.bloodthirstHeal>0){var h=Math.round(dmg*a.bloodthirstHeal);if(h>0){a.hp=Math.min(a.maxHp,a.hp+h);this.floaters.push(new Floater(a.x,a.y-35,'+'+h,'#ff8080'));}}
  if(a.isHero&&t.hp<=0) this.grantXP(a,20);
};
Game.prototype.applyProj=function(p){
  var best=null,bd=40*40;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying||u.team===p.team) continue;var d2=(u.x-p.x)*(u.x-p.x)+(u.y-p.y)*(u.y-p.y);if(d2<bd){bd=d2;best=u;}}
  if(!best) for(var ci=0;ci<this.creeps.length;ci++){var c=this.creeps[ci];if(c.dead) continue;var d2c=(c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);if(d2c<bd){bd=d2c;best=c;}}
  if(!best) for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.dead||b.team===p.team) continue;var d2b=(b.x-p.x)*(b.x-p.x)+(b.y-p.y)*(b.y-p.y),r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
  if(best){if(best.invulT>0) return;best.hp-=p.dmg;best.hitFlash=0.2;this.spawnParticles(p.x,p.y,'#ffd060',4);}
};
Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){u.gatherTarget=null;u._insideMine=false;if(u.carrying) this.returnRes(u,dt);return;}
  if(u.carrying&&u.carryAmt>=10){u._insideMine=false;this.returnRes(u,dt);return;}
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    u._insideMine=false;
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>4){u._stuckTimer=0;var nr=this.findNearestResource(u.x,u.y,g.kind);if(nr&&nr!==g) u.gatherTarget=nr;else u.gatherTarget=null;}
  } else {
    u.moving=false;
    if(g.kind==='gold'){
      u._insideMine=true;
      var slot=0;
      for(var mi=0;mi<this.units.length;mi++){
        var mu=this.units[mi];
        if(mu===u) break;
        if(mu.gatherTarget===g) slot++;
      }
      if(slot>=MAX_GATHER_PER_MINE) slot=MAX_GATHER_PER_MINE-1;
      var ang=(slot/MAX_GATHER_PER_MINE)*TAU - Math.PI/2;
      u.x=g.x+Math.cos(ang)*22;
      u.y=g.y-14+Math.sin(ang)*12;
      u.dir=DIR.DOWN;
    } else {
      u._insideMine=false;
      if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    }
    u.gatherProgress+=dt;u._stuckTimer=0;
    var cycle=(g.kind==='gold')?2.5:5.0;
    if(g.kind==='tree'){
      for(var li=0;li<this.buildings.length;li++){
        var lb=this.buildings[li];
        if(lb.dead||!lb.completed||lb.kind!=='lumber'||lb.pid!==u.pid) continue;
        var ldx=lb.x-g.x,ldy=lb.y-g.y;
        if(ldx*ldx+ldy*ldy<220*220){cycle*=0.75;break;}
      }
    }
    u.chopT=Math.sin(Math.PI*(u.gatherProgress/cycle));
    if(u.gatherProgress>=cycle){
      u.gatherProgress=0;
      var amt=Math.min(10,g.amount);g.amount-=amt;
      if(g.amount<=0){if(g.kind==='tree'&&!g.falling){g.falling=true;g.fallT=0;g.fallDir=(u.x>=g.x)?-1:1;Audio.sfx('treefall');}else if(g.kind==='gold') g.dead=true;}
      u.carrying=g.kind;u.carryAmt=amt;
      Audio.sfx(g.kind==='gold'?'gold':'wood');
      if(g.kind==='gold'){u.x=g.x;u.y=g.y+10;}
      u._insideMine=false;
      this.returnRes(u,dt);
      return;
    }
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.7;if(g.kind==='tree') Audio.sfx('chop');else if(g.kind==='gold') Audio.sfx('mine');if(g.kind!=='gold'){var ipx=g.x+(u.x-g.x)*0.4,ipy=g.y-20;this.spawnParticles(ipx,ipy,'#a08050',3);}}
  }
};
Game.prototype.returnRes=function(u,dt){
  u._insideMine=false;
  var th=null,bd=Infinity;
  for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.pid!==u.pid||b.kind!=='townhall'||b.dead) continue;var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);if(d<bd){bd=d;th=b;}}
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>5){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}
  } else {
    var cary=u.carrying;
    if(cary==='gold'){this.addRes(u.pid,u.carryAmt,0);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));}
    else if(cary==='tree'){this.addRes(u.pid,0,u.carryAmt);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));}
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    var nr=this.findNearestResource(u.x,u.y,cary==='gold'?'gold':'tree');
    if(nr&&Math.hypot(nr.x-u.x,nr.y-u.y)<1200){
      var cnt=this.countGatherers(nr);
      if(cary==='gold'&&cnt>=MAX_GATHER_PER_MINE) u.gatherTarget=null;
      else u.gatherTarget=nr;
    } else u.gatherTarget=null;
  }
};
Game.prototype.doBuild=function(u,dt){
  var b=u.buildTarget;if(!b||b.dead){u.buildTarget=null;return;}

    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.chopT=0;u.gatherAnimT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;

    u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));u._stuckTimer=0;
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.6;Audio.sfx('build');var ipx=b.x+(u.x-b.x)*0.4,ipy=b.y-20;this.spawnParticles(ipx,ipy,'#ffd060',3);}
    if(!b.completed){b.buildProgress+=dt;if(b.buildProgress>=b.buildTime){b.completed=true;u.buildTarget=null;if(b.owner==='player') this.notify(t_('built')+' '+t_(b.kind));}}
    else u.buildTarget=null;

};

Game.prototype.doDemolish=function(u,dt){

Game.prototype.updateBuilding=function(b,dt){
  b.pulse=(b.pulse||0)+dt;
  if(b.hp<=0){b.dead=true;this.spawnParticles(b.x,b.y,'#ff8040',20);for(var i=0;i<15;i++){var a=Math.random()*TAU;this.particles.spawn(b.x,b.y-20,Math.cos(a)*180,Math.sin(a)*180-80,1.2,'#8a6a3a',3);}for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;if(u.demolishTarget===b) u.demolishTarget=null;}return;}
  if(b.hitFlash>0) b.hitFlash-=dt;
  if(!b.completed) return;
  if(b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+0.8*dt);
  if(b.atk>0){b.atkCd-=dt;if(b.atkCd<=0){var e=this.findEnemy(b,b.rng);if(!e) e=this.findNearestCreep(b,b.rng);if(e){b.atkCd=b.atkCdBase;this.projectiles.push(new Projectile(b.x,b.y-25,e.x,e.y,b.atk,b.team,b.pid,'#ffa040'));}}}
  if(b.queue.length>0){
    var q=b.queue[0];q.timeLeft-=dt;
    if(q.timeLeft<=0){
      var race=RACES[q.race],def=race&&race.units[q.role];
      if(def&&this.units.length<300){
        var res=this.getRes(b.pid);
        var foodCost=FOOD_COST[q.role]||1;
        var reserved=this.getReservedPop(b.pid)-foodCost;
        var canSpawn=(res.food+reserved+foodCost)<=res.maxFood;
        if(canSpawn){
          var sx=cl(b.x+(Math.random()-0.5)*60,30,this.W-30);
          var sy=cl(b.y+b.radius+50,30,this.H-30);
          var u2=new Unit(sx,sy,b.team,def,q.race);
          u2.owner=b.owner;u2.pid=b.pid;u2.spawnT=0;
          this.units.push(u2);
          this.spawnParticles(sx,sy,'#ffe9a8',12);
          if(b.owner==='player'){this.notify(t_('trained')+' '+t_(q.role));Audio.sfx(q.role==='hero'?'hero':'notify');}
          b.queue.shift();
        } else q.timeLeft=0.5;
      } else b.queue.shift();
    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.owner==='player'){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade');}}}
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};
Game.prototype.findNearestResource=function(x,y,kind){
  var best=null,bd=Infinity;
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(kind&&r.kind!==kind) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);
    if(d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.separate=function(u){
  if(u._insideMine) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.5;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>4) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var minBD=u.radius+b.radius*0.95;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2),pushB=(minBD-bd)*1.05;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.55:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};

};
Game.prototype.castAbility=function(hero,abilId){

    setCd();this.floaters.push(new Floater(hero.x,hero.y-45,'Духи','#a080ff'));Audio.sfx('ability');

    else{this.notify(t_('noTarget'));setCd();Audio.sfx('error');}

    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.14;
    var baseCnt=wx==='snow'?2:wx==='sand'?2:1;
    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200,h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};
Game.prototype.updateUnit=function(u,dt){
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2;
  if(u.chopT>0) u.chopT-=dt*1.5;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){u.holyStrikeT-=dt;if(u.holyStrikeT<=0&&u.holyStrikeBuff){u.holyStrikeBuff=false;}}
  if(u.isHero&&u.regenPassive&&!u.dying) u.hp=Math.min(u.maxHp,u.hp+u.regenPassive*dt);
  if(u.moving && !u.dying && !u._insideMine){
    u._stuckCheckTimer=(u._stuckCheckTimer||0)+dt;
    if(u._stuckCheckTimer>=1.2){
      var mdx=u.x-(u._lastStuckX||u.x),mdy=u.y-(u._lastStuckY||u.y);
      if(mdx*mdx+mdy*mdy<9){
        u.moveTo=null;u._stuckTimer=0;
        var escAng=Math.random()*TAU;
        u.x=this.clampX(u.x+Math.cos(escAng)*22);
        u.y=this.clampY(u.y+Math.sin(escAng)*22);
      }
      u._stuckCheckTimer=0;
      u._lastStuckX=u.x;u._lastStuckY=u.y;
    }
  }
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(u.owner==='player') Audio.sfx('death');
    this.decals.push(new Decal(u.x,u.y+4,u.radius*1.4));
    if(u.role!=='fly'&&u.role!=='worker'&&!u._isSummon){var vx=(Math.random()-0.5)*80,vy=-60-Math.random()*60;this.weapons.push(new WeaponDrop(u.x+(Math.random()-0.5)*20,u.y-10,u.role,u.race,u.team,vx,vy));}
    if(u.isHero){
      if(u.owner==='player') this.notify(t_('heroDied'));
      this.deadHeroes[u.pid]={race:u.race,level:u.level,exp:u.exp,
        abilityLevels:JSON.parse(JSON.stringify(u.abilityLevels||{})),
        skillPoints:u.skillPoints||0,ultUnlocked:!!u.ultUnlocked};
      var la=u.lastAttacker;
      if(la&&typeof la.pid!=='undefined'&&la.team!==u.team&&this.teams[la.pid]){
        this.addRes(la.pid,BOUNTY_HERO,0);
        this.floaters.push(new Floater(u.x,u.y-65,'+'+BOUNTY_HERO,'#ffe066'));
        if(la.owner==='player') this.notify(t_('bountyHero'));
      }
    }
    return;
  }
  u.animT+=dt;if(u.hitFlash>0) u.hitFlash-=dt;if(u.atkCd>0) u.atkCd-=dt;if(u.attackT>0) u.attackT-=dt*3;
  if(u.stunT>0){u.moving=false;return;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;
  var hasOrder=!!(u.attackMoveTo||u.patrolRoute);
  var isIdleWorker=u.role==='worker'&&!u.gatherTarget&&!u.buildTarget&&!u.repairTarget&&!u.moveTo&&!u.carrying&&!hasOrder&&!u.demolishTarget;
  var shouldSearch=((u.role!=='worker'&&!u.target&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder))||isIdleWorker;
  if(shouldSearch&&!u.target){
    var sr=u.role==='worker'?90:(u.range>120?320:200);
    var e=this.findEnemy(u,sr);
    if(e) u.target=e;
    else {var c=this.findNearestCreep(u,sr);if(c) u.target=c;}
  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;
    if(dxh*dxh+dyh*dyh>40000) u.moveTo={x:u.originX,y:u.originY};
  }
  u.moving=false;
  if(u.role==='worker'){
    if(u.demolishTarget&&!u.demolishTarget.dead){this.doDemolish(u,dt);if(u.moving) u.walkPhase+=dt*10;return;}
    if(u.moveTo) this.doMove(u,dt);
    else if(u.repairTarget&&!u.repairTarget.dead) this.doRepair(u,dt);
    else if(u.buildTarget&&!u.buildTarget.dead) this.doBuild(u,dt);
    else if(u.target) this.doAttack(u,dt);
    else if(u.carrying&&u.carryAmt>=10) this.returnRes(u,dt);
    else if(u.gatherTarget&&!u.gatherTarget.dead){if(u.gatherTarget.amount<=0||u.gatherTarget.falling) u.gatherTarget=null;else this.doGather(u,dt);}
    else if(hasOrder) this.doAttackMove(u,dt);
    if(u.moving) u.walkPhase+=dt*10;
    return;
  }
  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);
  else if(hasOrder) this.doAttackMove(u,dt);
  if(u.moving) u.walkPhase+=dt*10;
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.updateCreep=function(c,dt){
  if(c.stunT>0) c.stunT-=dt;
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;this.spawnParticles(c.x,c.y,'#8a3020',12);
    if(c.lastAttacker){
      var reward=c.goldReward;if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.pid!=='undefined'&&this.teams[c.lastAttacker.pid]){
        this.addRes(c.lastAttacker.pid,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(c.isBoss&&c.lastAttacker.owner==='player') this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.pid!=='undefined'){for(var i=0;i<this.units.length;i++){var h=this.units[i];if(h.isHero&&h.pid===c.lastAttacker.pid&&!h.dying){if(Math.hypot(h.x-c.x,h.y-c.y)<400){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}}}}
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0) c.hitFlash-=dt;if(c.atkCd>0) c.atkCd-=dt;if(c.attackT>0) c.attackT-=dt*3;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=180*180;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);if(d2<bd){bd=d2;best=u;}}
    if(best) c.target=best;
  }
  c.moving=false;
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){c.x+=dx/d*c.spd*dt;c.y+=dy/d*c.spd*dt;c.moving=true;c.walkPhase+=dt*8;}
    else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      c.target.hp-=c.dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+c.dmg,'#ff6060'));
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){c.wanderT=2+Math.random()*3;var a=Math.random()*TAU,r=40+Math.random()*100;c.wanderTarget={x:c.homeX+Math.cos(a)*r,y:c.homeY+Math.sin(a)*r};}
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){c.x+=dxw/dw*c.spd*0.4*dt;c.y+=dyw/dw*c.spd*0.4*dt;c.walkPhase+=dt*6;c.moving=true;}
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=Math.min(hero.maxHp,hero.hp+70);hero.dmg+=5;hero.skillPoints++;
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup');
    if(hero.level>=6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doMove=function(u,dt){
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  if(d<12){u.moveTo=null;return;}
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+8;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
    u.moving=true;this.separate(u);
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.pid,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.pid,t.role);dmg=dmg*(1-0.08*upD.a);}
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    this.projectiles.push(new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,a.pid,'#ffe080'));
    Audio.sfx('arrow');
    if(a.isHero) t.lastAttacker=a;
    if(a.isHero&&t.hp<=dmg) this.grantXP(a,20);
    return;
  }
  if(a.role==='heal'){
    if(t.team===a.team) t.hp=Math.min(t.maxHp,t.hp+dmg*4);
    return;
  }
  Audio.sfx('sword');
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  if(t.isUnit||t.isCreep){
    var ang=Math.atan2(t.y-a.y,t.x-a.x),kb=a.isHero?9:5;
    t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  }
  this.spawnParticles(t.x,t.y,'#ffc040',5);
  this.floaters.push(new Floater(t.x,t.y-25,'-'+dmg,a.isHero?'#ffe9a8':'#ff6060'));
  this.shake=Math.min(0.3,this.shake+0.06);
  if(t.isUnit&&!t.target&&t.role!=='worker'&&!t.isBuilding) t.target=a;
  if(a.isHero&&a.bloodthirstHeal>0){var h=Math.round(dmg*a.bloodthirstHeal);if(h>0){a.hp=Math.min(a.maxHp,a.hp+h);this.floaters.push(new Floater(a.x,a.y-35,'+'+h,'#ff8080'));}}
  if(a.isHero&&t.hp<=0) this.grantXP(a,20);
};
Game.prototype.applyProj=function(p){
  var best=null,bd=40*40;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying||u.team===p.team) continue;var d2=(u.x-p.x)*(u.x-p.x)+(u.y-p.y)*(u.y-p.y);if(d2<bd){bd=d2;best=u;}}
  if(!best) for(var ci=0;ci<this.creeps.length;ci++){var c=this.creeps[ci];if(c.dead) continue;var d2c=(c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);if(d2c<bd){bd=d2c;best=c;}}
  if(!best) for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.dead||b.team===p.team) continue;var d2b=(b.x-p.x)*(b.x-p.x)+(b.y-p.y)*(b.y-p.y),r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
  if(best){if(best.invulT>0) return;best.hp-=p.dmg;best.hitFlash=0.2;this.spawnParticles(p.x,p.y,'#ffd060',4);}
};
Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){u.gatherTarget=null;u._insideMine=false;if(u.carrying) this.returnRes(u,dt);return;}
  if(u.carrying&&u.carryAmt>=10){u._insideMine=false;this.returnRes(u,dt);return;}
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    u._insideMine=false;
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>4){u._stuckTimer=0;var nr=this.findNearestResource(u.x,u.y,g.kind);if(nr&&nr!==g) u.gatherTarget=nr;else u.gatherTarget=null;}
  } else {
    u.moving=false;
    if(g.kind==='gold'){
      u._insideMine=true;
      var slot=0;
      for(var mi=0;mi<this.units.length;mi++){
        var mu=this.units[mi];
        if(mu===u) break;
        if(mu.gatherTarget===g) slot++;
      }
      if(slot>=MAX_GATHER_PER_MINE) slot=MAX_GATHER_PER_MINE-1;
      var ang=(slot/MAX_GATHER_PER_MINE)*TAU - Math.PI/2;
      u.x=g.x+Math.cos(ang)*22;
      u.y=g.y-14+Math.sin(ang)*12;
      u.dir=DIR.DOWN;
    } else {
      u._insideMine=false;
      if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    }
    u.gatherProgress+=dt;u._stuckTimer=0;
    var cycle=(g.kind==='gold')?2.5:5.0;
    if(g.kind==='tree'){
      for(var li=0;li<this.buildings.length;li++){
        var lb=this.buildings[li];
        if(lb.dead||!lb.completed||lb.kind!=='lumber'||lb.pid!==u.pid) continue;
        var ldx=lb.x-g.x,ldy=lb.y-g.y;
        if(ldx*ldx+ldy*ldy<220*220){cycle*=0.75;break;}
      }
    }
    u.chopT=Math.sin(Math.PI*(u.gatherProgress/cycle));
    if(u.gatherProgress>=cycle){
      u.gatherProgress=0;
      var amt=Math.min(10,g.amount);g.amount-=amt;
      if(g.amount<=0){if(g.kind==='tree'&&!g.falling){g.falling=true;g.fallT=0;g.fallDir=(u.x>=g.x)?-1:1;Audio.sfx('treefall');}else if(g.kind==='gold') g.dead=true;}
      u.carrying=g.kind;u.carryAmt=amt;
      Audio.sfx(g.kind==='gold'?'gold':'wood');
      if(g.kind==='gold'){u.x=g.x;u.y=g.y+10;}
      u._insideMine=false;
      this.returnRes(u,dt);
      return;
    }
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.7;if(g.kind==='tree') Audio.sfx('chop');else if(g.kind==='gold') Audio.sfx('mine');if(g.kind!=='gold'){var ipx=g.x+(u.x-g.x)*0.4,ipy=g.y-20;this.spawnParticles(ipx,ipy,'#a08050',3);}}
  }
};
Game.prototype.returnRes=function(u,dt){
  u._insideMine=false;
  var th=null,bd=Infinity;
  for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.pid!==u.pid||b.kind!=='townhall'||b.dead) continue;var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);if(d<bd){bd=d;th=b;}}
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>5){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}
  } else {
    var cary=u.carrying;
    if(cary==='gold'){this.addRes(u.pid,u.carryAmt,0);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));}
    else if(cary==='tree'){this.addRes(u.pid,0,u.carryAmt);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));}
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    var nr=this.findNearestResource(u.x,u.y,cary==='gold'?'gold':'tree');
    if(nr&&Math.hypot(nr.x-u.x,nr.y-u.y)<1200){
      var cnt=this.countGatherers(nr);
      if(cary==='gold'&&cnt>=MAX_GATHER_PER_MINE) u.gatherTarget=null;
      else u.gatherTarget=nr;
    } else u.gatherTarget=null;
  }
};
Game.prototype.doBuild=function(u,dt){
  var b=u.buildTarget;if(!b||b.dead){u.buildTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;

    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.chopT=0;u.gatherAnimT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>3){u._stuckTimer=0;u.x=this.clampX(u.x+dx/d*60);u.y=this.clampY(u.y+dy/d*60);}
  } else {
    u.moving=false;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));u._stuckTimer=0;
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.6;Audio.sfx('build');var ipx=b.x+(u.x-b.x)*0.4,ipy=b.y-20;this.spawnParticles(ipx,ipy,'#ffd060',3);}
    if(!b.completed){b.buildProgress+=dt;if(b.buildProgress>=b.buildTime){b.completed=true;u.buildTarget=null;if(b.owner==='player') this.notify(t_('built')+' '+t_(b.kind));}}
    else u.buildTarget=null;

};

    if(u.repairAccum>=0.5){u.repairAccum=0;var team=this.teams[u.pid],gc=1,wc=1;if(!team||team.gold<gc||team.wood<wc){u.repairTarget=null;return;}this.subRes(u.pid,gc,wc);b.hp=Math.min(b.maxHp,b.hp+25);Audio.sfx('repair');if(b.hp>=b.maxHp) u.repairTarget=null;}

Game.prototype.doDemolish=function(u,dt){

        for(var ui=0;ui<this.units.length;ui++){var uu=this.units[ui];if(uu.buildTarget===b) uu.buildTarget=null;if(uu.repairTarget===b) uu.repairTarget=null;if(uu.demolishTarget===b) uu.demolishTarget=null;}
        u.demolishTarget=null;Audio.sfx('demolish');

Game.prototype.updateBuilding=function(b,dt){
  b.pulse=(b.pulse||0)+dt;
  if(b.hp<=0){b.dead=true;this.spawnParticles(b.x,b.y,'#ff8040',20);for(var i=0;i<15;i++){var a=Math.random()*TAU;this.particles.spawn(b.x,b.y-20,Math.cos(a)*180,Math.sin(a)*180-80,1.2,'#8a6a3a',3);}for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;if(u.demolishTarget===b) u.demolishTarget=null;}return;}
  if(b.hitFlash>0) b.hitFlash-=dt;
  if(!b.completed) return;
  if(b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+0.8*dt);
  if(b.atk>0){b.atkCd-=dt;if(b.atkCd<=0){var e=this.findEnemy(b,b.rng);if(!e) e=this.findNearestCreep(b,b.rng);if(e){b.atkCd=b.atkCdBase;this.projectiles.push(new Projectile(b.x,b.y-25,e.x,e.y,b.atk,b.team,b.pid,'#ffa040'));}}}
  if(b.queue.length>0){
    var q=b.queue[0];q.timeLeft-=dt;
    if(q.timeLeft<=0){
      var race=RACES[q.race],def=race&&race.units[q.role];
      if(def&&this.units.length<300){
        var res=this.getRes(b.pid);
        var foodCost=FOOD_COST[q.role]||1;
        var reserved=this.getReservedPop(b.pid)-foodCost;
        var canSpawn=(res.food+reserved+foodCost)<=res.maxFood;
        if(canSpawn){
          var sx=cl(b.x+(Math.random()-0.5)*60,30,this.W-30);
          var sy=cl(b.y+b.radius+50,30,this.H-30);
          var u2=new Unit(sx,sy,b.team,def,q.race);
          u2.owner=b.owner;u2.pid=b.pid;u2.spawnT=0;
          this.units.push(u2);
          this.spawnParticles(sx,sy,'#ffe9a8',12);
          if(b.owner==='player'){this.notify(t_('trained')+' '+t_(q.role));Audio.sfx(q.role==='hero'?'hero':'notify');}
          b.queue.shift();
        } else q.timeLeft=0.5;
      } else b.queue.shift();
    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.owner==='player'){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade');}}}
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};
Game.prototype.findNearestResource=function(x,y,kind){
  var best=null,bd=Infinity;
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(kind&&r.kind!==kind) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);
    if(d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.separate=function(u){
  if(u._insideMine) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.5;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>4) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var minBD=u.radius+b.radius*0.95;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2),pushB=(minBD-bd)*1.05;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.55:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};

Game.prototype.checkVictory=function(){
  var teams={};for(var i=0;i<this.config.slots.length;i++){var s=this.config.slots[i];if(s.type!=='empty') teams[s.team]=true;}
  var cnt=0;for(var k in teams) cnt++;if(cnt<2) return;
  var hasTH={};for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.kind==='townhall'&&!b.dead) hasTH[b.team]=true;}
  if(!hasTH[this.playerTeam]){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='lose';return;}
  var enemies=0;for(var k2 in teams){var t2=parseInt(k2);if(t2!==this.playerTeam&&hasTH[t2]) enemies++;}

};
Game.prototype.castAbility=function(hero,abilId){

    if(low){var amt=80+40*lvl;low.hp=Math.min(low.maxHp,low.hp+amt);this.floaters.push(new Floater(low.x,low.y-30,'+'+amt,'#80ff80'));this.spawnParticles(low.x,low.y-15,'#80ff80',8);setCd();Audio.sfx('cast');}

    for(i=0;i<this.creeps.length;i++){var cr=this.creeps[i];if(cr.dying) continue;if(Math.hypot(cr.x-hero.x,cr.y-hero.y)<ab.aoe) cr.stunT=1.5;}
    setCd();this.spawnParticles(hero.x,hero.y-20,'#ffb060',20);Audio.sfx('ability');
  }
  else if(abilId==='spirits'){
    for(i=0;i<3;i++){var a=(i/3)*TAU;var sd={role:'melee',hp:180,dmg:22,range:50,spd:200,cd:1,cdBase:1,gold:0,wood:0,time:1};var sp=new Unit(hero.x+Math.cos(a)*60,hero.y+Math.sin(a)*60,hero.team,sd,hero.race);sp.owner=hero.owner;sp.pid=hero.pid;sp.spawnT=0;sp._isSummon=true;sp._summonT=30;this.units.push(sp);}
    setCd();this.floaters.push(new Floater(hero.x,hero.y-45,'Духи','#a080ff'));Audio.sfx('ability');
  }
  else if(abilId==='moonfire'){
    var bst=null,bd=ab.range*ab.range;
    for(i=0;i<this.units.length;i++){var en2=this.units[i];if(en2.team===hero.team||en2.dying) continue;var d2=Math.hypot(en2.x-hero.x,en2.y-hero.y);if(d2*d2<bd){bd=d2*d2;bst=en2;}}

    if(bst){var dmg=60+40*lvl;bst.hp-=dmg;bst.hitFlash=0.3;bst.lastAttacker=hero;this.projectiles.push(new Projectile(hero.x,hero.y-22,bst.x,bst.y-22,dmg,hero.team,hero.pid,'#a0d0ff'));this.floaters.push(new Floater(bst.x,bst.y-25,'-'+dmg,'#a0d0ff'));setCd();Audio.sfx('cast');}
    else{this.notify(t_('noTarget'));setCd();Audio.sfx('error');}
  }
  else if(abilId==='entangle'){
    var bst2=null,bd2=ab.range*ab.range;
    for(i=0;i<this.units.length;i++){var en3=this.units[i];if(en3.team===hero.team||en3.dying) continue;var d3=Math.hypot(en3.x-hero.x,en3.y-hero.y);if(d3*d3<bd2){bd2=d3*d3;bst2=en3;}}

UISys.prototype.startGame=function(){
  try{
    var map=null;for(var i=0;i<MAPS.length;i++) if(MAPS[i].id===this.selectedMap){map=MAPS[i];break;}
    if(!map){alert('Карта не найдена');return;}
    var slots=[];
    for(var k=0;k<this.slotConfig.length;k++){var cfg=this.slotConfig[k];if(cfg.type==='empty') continue;slots.push({type:cfg.type==='player'?'player':'bot',race:cfg.race,team:cfg.team});}
    var hasPlayer=false;for(var pi=0;pi<slots.length;pi++) if(slots[pi].type==='player'){hasPlayer=true;break;}
    if(!hasPlayer){alert('Нужен игрок в первом слоте');return;}
    if(slots.length<2){alert('Нужно 2+ участника');return;}
    var teamsSet={};for(var ti=0;ti<slots.length;ti++) teamsSet[slots[ti].team]=true;
    var teamCount=0;for(var tk in teamsSet) teamCount++;
    if(teamCount<2){alert('Все в одной команде');return;}
    Audio.stopMusic();Input.keys={};Input.pendingOrder=null;this.hideOrderBar();
    if(Renderer_) Renderer_.destroy();
    Game_=new Game(map,{slots:slots});
    Renderer_=new Renderer(this.$('game'),Game_);
    for(var si=0;si<slots.length;si++){
      if(slots[si].type==='empty') continue;
      var pid=si;
      Game_.getRes(pid);
      Game_.teams[pid].gold=350;Game_.teams[pid].wood=200;
    }
    this.showScreen(null);
    this.$('hud').classList.add('active');
    this.$('gameover').classList.remove('active');

    this.refreshSelection();

    centerCam();

UISys.prototype.drawPortrait=function(ent){
  var cv=this.$('portrait-canvas'),info=this.$('portrait-info');
  if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var bgGrad=ctx.createLinearGradient(0,0,0,cv.height);
  bgGrad.addColorStop(0,'#1a2438');bgGrad.addColorStop(1,'#050810');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cv.width,cv.height);
  if(!ent){info.innerHTML='<div class="pname">—</div>';return;}
  try{
    if(ent.isUnit){
      var sp=bakeUnit(ent.race,ent.role,ent.team,DIR.DOWN);
      var pad=14;
      var s=Math.min((cv.width-pad*2)/sp.width,(cv.height-pad*2)/sp.height);
      var dw=sp.width*s,dh=sp.height*s,dx=(cv.width-dw)/2,dy=(cv.height-dh)/2;
      var legDef=getLeg(ent.role);
      if(legDef&&ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'){
        var legW=legDef.w*s*0.9,legH=legDef.h*s*0.85,legSpread=legDef.spread*s*0.8;
        var legBottomY=dy+dh,legTopY=legBottomY-legH,pcx=cv.width/2;
        ctx.fillStyle='#3a2010';ctx.strokeStyle='#0a0504';ctx.lineWidth=Math.max(0.5,s*0.6);
        ctx.fillRect(pcx-legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx-legSpread-legW/2,legTopY,legW,legH);
        ctx.fillRect(pcx+legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx+legSpread-legW/2,legTopY,legW,legH);
      }
      ctx.drawImage(sp,dx,dy,dw,dh);
      if(ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'&&Renderer_){
        var tempU={role:ent.role,race:ent.race,isHero:ent.isHero,team:ent.team,walkPhase:0,walkOffset:0,moving:false,attackT:0,chopT:0,castT:0,animT:0,x:0,y:0};
        var pObj={x:cv.width/2,y:dy+dh};
        var hand=Renderer_._armsCtx(ctx,tempU,pObj,s,false,1);
        if(hand){
          ctx.save();ctx.translate(hand.x,hand.y);
          Renderer_._mainW(ctx,ent.role,ent.race,0,0,0,s);
          ctx.restore();
        }
      }
      var name=ent.isHero?('⭐ '+t_('hero_'+ent.race)):t_(ent.role);
      var extra=ent.isHero?(' Ур.'+ent.level):'';
      info.innerHTML='<div class="pname">'+name+extra+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    } else {
      var sp2=bakeBuilding(ent.race,ent.kind,ent.team);
      var s2=Math.min((cv.width-16)/sp2.width,(cv.height-16)/sp2.height);
      ctx.drawImage(sp2,(cv.width-sp2.width*s2)/2,(cv.height-sp2.height*s2)/2,sp2.width*s2,sp2.height*s2);
      info.innerHTML='<div class="pname">'+t_(ent.kind)+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    }
  }catch(e){ERR('drawPortrait',e);}
};

  for(var bi=0;bi<g.buildings.length;bi++){var b=g.buildings[bi];if(b.sel&&b.pid===g.playerPid) selB.push(b);}
  var self=this;

        if(iconName==='forest_wrath') iconName='forest';

        if(ab.type==='ultimate'&&!hero.ultUnlocked) tip='Ультимейт откроется на 6 ур.';
        self.addAction(box,toolIconImg(iconName),label,price,function(){

    this.addAction(box,toolIconImg('workers'),t_('workersAll'),null,function(){g.selectWorkers();});
    this.addAction(box,toolIconImg('deselect'),t_('deselect'),null,function(){g.deselectAll();});
  } else if(sel.length){
    var workers=[],fighters=[];
    for(i=0;i<sel.length;i++){if(sel[i].role==='worker') workers.push(sel[i]);else fighters.push(sel[i]);}
    if(workers.length){

      var hasUnfinished=false;
      for(i=0;i<g.buildings.length;i++){var bu=g.buildings[i];if(bu.pid===g.playerPid&&!bu.completed&&!bu.dead){hasUnfinished=true;break;}}
      if(hasUnfinished){

          for(var bi2=0;bi2<g.buildings.length;bi2++){var bb=g.buildings[bi2];if(bb.pid!==g.playerPid||bb.completed||bb.dead) continue;var d=(bb.x-workers[0].x)*(bb.x-workers[0].x)+(bb.y-workers[0].y)*(bb.y-workers[0].y);if(d<bd){bd=d;target=bb;}}

UISys.prototype.resurrectHero=function(b){
  var g=Game_;if(!g||!b) return;

  g.spawnParticles(sx,sy,'#ffe9a8',24);

};

UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;
  var g=Game_,size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  for(var i=0;i<g.buildings.length;i++){var ob=g.buildings[i],dx=ob.x-x,dy=ob.y-y,rr=ob.radius+size+8;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead) continue;var dx2=r.x-x,dy2=r.y-y,rr2=r.radius+size-6;if(dx2*dx2+dy2*dy2<rr2*rr2) return false;}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.pid!==g.playerPid) continue;if(Math.hypot(b.x-x,b.y-y)<700) return true;}
  return false;
};
UISys.prototype.tryPlaceAt=function(x,y){

  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.pid===g.playerPid&&u2.role==='worker'&&!u2.dying&&!u2.buildTarget&&!u2.gatherTarget&&!u2.carrying){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.pid===g.playerPid&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t_('noWorker'));this.cancelPlacement();return;}

UISys.prototype.queueUnit=function(b,role){
  var g=Game_;if(!g||!b) return;
  var race=RACES[b.race];if(!race) return;
  var def=race.units[role];if(!def) return;
  var res=g.getRes(g.playerPid),reserved=g.getReservedPop(g.playerPid);
  if(b.queue.length>=10){g.notify(t_('queueFull'));return;}
  if(res.gold<def.gold){g.notify(t_('nGold'));return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  var foodCost=FOOD_COST[role]||1;
  if((res.food+reserved+foodCost)>res.maxFood){g.notify(t_('needHouse'));return;}
  if(role==='hero'){
    var alive=0;
    for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.pid===g.playerPid&&!hu.dying) alive++;}
    if(alive>=1){g.notify(t_('heroExists'));return;}
    var heroInQueue=false;
    for(var hq=0;hq<g.buildings.length;hq++){
      var hqb=g.buildings[hq];
      if(hqb.pid!==g.playerPid||hqb.dead) continue;
      for(var qqi=0;qqi<hqb.queue.length;qqi++){if(hqb.queue[qqi].role==='hero'){heroInQueue=true;break;}}
      if(heroInQueue) break;
    }
    if(heroInQueue){g.notify(t_('heroExists'));return;}
    if(g.deadHeroes&&g.deadHeroes[g.playerPid]&&g.deadHeroes[g.playerPid].race===b.race){g.notify('Используйте Воскресить');return;}
  }
  g.subRes(g.playerPid,def.gold,def.wood);
  b.queue.push({role:role,race:b.race,timeLeft:def.time,timeTotal:def.time});
  Audio.sfx('click');this.renderActions(true);
};

        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
