*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}

canvas#game{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}

h3{color:#e6c67a;font-size:17px;margin-bottom:14px;text-align:center}
.btn{padding:13px 26px;margin:5px;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#2e3f5c,#1a2437);border:2px solid #6a7a9a;border-radius:8px;color:#e8e8e8;min-width:180px;text-align:center;font-weight:700}
.btn:hover,.btn:active{background:linear-gradient(180deg,#42577d,#243149);border-color:#e6c67a}
.btn.primary{border-color:#e6c67a;color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010)}
.btn.small{min-width:auto;padding:9px 15px;font-size:14px;margin:3px}

.panel{background:linear-gradient(180deg,rgba(20,28,42,.98),rgba(12,18,28,.98));border:2px solid #557096;border-radius:12px;padding:20px;max-width:min(94vw,780px);margin:auto;pointer-events:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;flex-wrap:wrap}
.row label{flex:1;font-size:14px;color:#b8c5d6;min-width:110px}

.map-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.map-item{padding:8px;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.map-item canvas{width:90px;height:90px;border-radius:4px;background:#000;display:block}
.map-item.selected{border-color:#e6c67a;background:#2a3a52;color:#ffe9a8}
.map-item .mname{font-size:11px;color:#e6c67a}
.slot-row{display:flex;gap:6px;align-items:center;background:#0d1420;padding:6px;border-radius:6px;font-size:12px;margin-bottom:6px}
.slot-row .num{width:28px;height:28px;line-height:28px;text-align:center;border-radius:6px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;flex-shrink:0;border:1px solid #000}
.slot-row select{flex:1;padding:6px 8px;background:#080d15;border:1px solid #3d4c68;color:#e8e8e8;border-radius:5px;font-size:12px;min-width:0}
.slot-row .team-sel{flex:0 0 68px;display:flex;align-items:center;gap:4px;padding:2px 4px;background:#080d15;border:1px solid #3d4c68;border-radius:5px}
.slot-row .team-sel .sw{width:14px;height:14px;border-radius:3px;border:1px solid #000;flex-shrink:0}
.slot-row .team-sel select{flex:1;padding:3px 0;background:transparent;border:none;min-width:0;font-size:12px}
.slot-row.player{background:#1a2438;border:1px solid #557096}
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5;overflow:hidden}
#hud.active{display:block}
#topbar{position:absolute;top:6px;left:6px;display:flex;gap:14px;padding:8px 14px;background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;font-size:14px;font-weight:700;max-width:calc(100vw - 300px);flex-wrap:wrap}
#topbar>div{display:flex;gap:6px;align-items:center}
#topbar span.val{color:#e6c67a;font-weight:800}
#topbar .res-ico{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;box-sizing:border-box}
#topbar .res-ico.gold{background:radial-gradient(circle at 30% 30%,#fff8c0,#ffe066 55%,#8a6a1a);border:1px solid #3a2a10}
#topbar .res-ico.wood{background:linear-gradient(90deg,#6a4a2a,#8a5a30 50%,#6a4a2a);border:1px solid #2a1508}
#topbar .res-ico.pop{border-radius:50% 50% 42% 42%;background:radial-gradient(circle at 50% 32%,#f0cfa0 0%,#f0cfa0 28%,#3a7adf 30%,#3a7adf 100%);border:1px solid #1a3a7f}
#topbar .res-ico.time{border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 30%,#e0e0e0 40%,#777 65%,#333 100%);border:1px solid #222}
#selinfo{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;padding:6px 12px;font-size:12px;display:none;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#selinfo.show{display:block}
#minimap{position:absolute;right:6px;top:6px;width:120px;height:120px;background:#000;border:2px solid #557096;border-radius:6px;pointer-events:auto;cursor:pointer}
#cmdpanel{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:7px;display:none;padding:4px;gap:4px;pointer-events:auto;flex-wrap:wrap;max-height:130px}
#cmdpanel.show{display:flex}
#portrait-wrap{width:80px;flex-shrink:0;background:#0d1420;border:1px solid #3d4c68;border-radius:4px;overflow:hidden}
#portrait-canvas{width:100%;height:60px;display:block;background:linear-gradient(180deg,#1a2438,#050810)}
#portrait-info{padding:1px 3px;font-size:9px;text-align:center}
#portrait-info .pname{color:#e6c67a;font-weight:700;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#portrait-info .pstat{color:#9ab;font-size:8px}
#actions{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:2px;align-content:start;overflow-y:auto;max-height:110px;min-width:0}
.act-btn{background:linear-gradient(180deg,#2a3a55,#16202f);border:2px solid #4d6180;border-radius:5px;color:#e8e8e8;font-size:9px;cursor:pointer;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;min-height:46px;overflow:hidden}
.act-btn:hover{background:linear-gradient(180deg,#3a5078,#1a2438);border-color:#e6c67a}
.act-btn.active{border-color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010);box-shadow:0 0 8px #e6c67a88 inset}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-btn .ico{font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;min-height:22px}
.act-btn .ico img{width:22px;height:22px;image-rendering:pixelated;display:block}
.act-btn .lbl{font-size:8px;text-align:center;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.act-btn .price{font-size:8px;color:#e6c67a}
.act-btn.ability{border-color:#7a5fbf;background:linear-gradient(180deg,#3a2f60,#1a1430)}
#queue-panel{position:absolute;bottom:140px;left:6px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:6px;padding:6px;display:none;max-width:260px;pointer-events:auto;z-index:6}
#queue-panel.show{display:block}
#queue-panel .qtitle{color:#e6c67a;font-size:11px;font-weight:800;margin-bottom:4px}
.q-item{display:flex;gap:6px;align-items:center;margin-bottom:4px;background:#0d1420;padding:3px 5px;border-radius:4px}
.q-name{font-size:10px;color:#e8e8e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-bar-bg{height:5px;background:#000;border-radius:2px;margin-top:2px;overflow:hidden}
.q-bar-fill{height:100%;background:linear-gradient(90deg,#8a6a1a,#ffe9a8);border-radius:2px}
.q-time{font-size:9px;color:#9ab}
#controls{position:absolute;right:6px;top:190px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
#controls button{width:38px;height:38px;background:rgba(20,30,45,.95);border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;font-size:17px;font-weight:800;cursor:pointer}
#hud-menu{position:absolute;top:142px;right:6px;padding:6px 10px;background:#243250;border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;cursor:pointer;pointer-events:auto;font-size:16px;font-weight:800}
#notifications{position:absolute;bottom:150px;left:6px;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none;overflow:hidden}
.notif{background:rgba(10,16,28,.94);border-left:3px solid #e6c67a;padding:8px 12px;font-size:12px;border-radius:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:13px;color:#ffe9a8;display:none;max-width:min(90vw,600px);text-align:center;font-weight:700}
#hint.show{display:block}
#placement-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:14px;color:#ffe9a8;display:none;font-weight:700;gap:10px;align-items:center;pointer-events:auto}
#placement-bar.show{display:flex}
#order-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(120,30,30,.95);border:2px solid #ff6060;border-radius:8px;padding:10px 18px;font-size:14px;color:#ffd0d0;display:none;font-weight:700;pointer-events:auto;text-align:center}
#order-bar.show{display:block}
#pausemenu,#settings,#gameover,#alert,#saves{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);pointer-events:auto;z-index:60;padding:16px;overflow-y:auto;touch-action:pan-y}
#pausemenu.active,#settings.active,#gameover.active,#alert.active,#saves.active{display:flex}
.save-slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin:6px 0;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;font-size:13px;flex-wrap:wrap}
.save-slot .meta{flex:1;color:#9ab;font-size:12px;min-width:120px}
.save-slot .title{color:#e6c67a;font-weight:800;font-size:14px}
.save-slot .actions{display:flex;gap:4px}
#error-box{position:fixed;top:10px;left:10px;right:10px;background:#3a0000;border:2px solid #ff4040;color:#fff;padding:10px;font-size:12px;font-family:monospace;z-index:9999;display:none;max-height:200px;overflow:auto;white-space:pre-wrap}

  this.hp=d.hp;this.maxHp=d.hp;this.dmg=d.dmg;this.range=d.rng;this.spd=d.spd;this.cd=1.4;this.cdBase=1.4;
  this.goldReward=d.gold;this.xpReward=d.xp;this.radius=d.radius;
  this.isBoss=(kind==='bear');
  this.bounty=this.isBoss?BOUNTY_BOSS:0;
  this.dir=DIR.DOWN;this.moving=false;this.walkPhase=0;this.target=null;this.moveTo=null;this.atkCd=0;this.hitFlash=0;this.animT=Math.random()*10;
  this.homeX=x;this.homeY=y;this.wanderT=0;this.wanderTarget=null;this.attackT=0;this.lastAttacker=null;this.sel=false;this.stunT=0;
  this._visFade=1;
}
function Projectile(x,y,tx,ty,dmg,team,color){this.x=x;this.y=y;this.tx=tx;this.ty=ty;this.dmg=dmg;this.team=team;this.color=color;this.spd=650;this.ttl=2.5;this.dead=false;}
function Floater(x,y,text,color){this.x=x;this.y=y;this.text=text;this.color=color||'#fff';this.life=1.3;this.maxLife=1.3;this.dead=false;}
function Decal(x,y,size){this.x=x;this.y=y;this.size=size;this.life=15;this.maxLife=15;this.dead=false;}
function WeaponDrop(x,y,role,race,team,vx,vy){this.x=x;this.y=y;this.role=role;this.race=race;this.team=team;this.vx=vx;this.vy=vy;this.rot=0;this.rotV=(Math.random()-0.5)*10;this.life=20;this.dead=false;}

/* === GAME === */
function Game(mapDef,config,noSpawn){
  this.map=mapDef;this.config=config;this.biome=mapDef.biome||'grassland';this.biomeData=BIOMES[this.biome]||BIOMES.grassland;
  this.tileSize=64;this.W=mapDef.size*this.tileSize;this.H=mapDef.size*this.tileSize;
  this.units=[];this.buildings=[];this.resources=[];this.projectiles=[];this.creeps=[];this.floaters=[];this.decals=[];this.weapons=[];
  this.particles=new ParticlePool(400);
  this.teams={};this.time=0;this.gameOver=false;this.result=null;this.notifications=[];
  this.camera={x:0,y:0,zoom:1};this.paused=false;this.fog=[];this.vis=[];this.decor=[];this.shake=0;
  this.weather=[];this.weatherTimer=0;this.fogCellSize=48;this.fogTimer=0;
  this.paths=[];this.spatialGrid={};this.spatialCell=160;this.unitUpgrades={};
  this.auraCache={dmg:{},hp:{},blessing:{}};this.auraTimer=0;
  this._lastDt=0.016;
  this.playerTeam=0;
  for(var si=0;si<config.slots.length;si++){if(config.slots[si].type==='player'){this.playerTeam=config.slots[si].team;break;}}
  this.ai=[];
  if(!noSpawn){
    this.generatePaths();this.spawnResources();this.spawnBases();this.spawnAI();this.spawnCreeps();this.generateDecor();
    var th=null;
    for(var bi=0;bi<this.buildings.length;bi++){if(this.buildings[bi].team===this.playerTeam&&this.buildings[bi].kind==='townhall'){th=this.buildings[bi];break;}}
    if(th){this.camera.x=th.x;this.camera.y=th.y;}
  }
  this.initFog();this.updateFog();
}
Game.prototype.getRes=function(team){
  if(!this.teams[team]) this.teams[team]={gold:0,wood:0};
  var pop=0,maxPop=0;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.team===team&&!u.dead&&!u.dying) pop++;}
  for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.team===team&&b.completed){if(b.kind==='house') maxPop+=8;if(b.kind==='townhall') maxPop+=10;}}
  return {gold:this.teams[team].gold,wood:this.teams[team].wood,pop:pop,maxPop:maxPop};
};
Game.prototype.addRes=function(team,g,w){if(!this.teams[team]) this.teams[team]={gold:0,wood:0};if(g) this.teams[team].gold+=g;if(w) this.teams[team].wood+=w;};
Game.prototype.subRes=function(team,g,w){if(!this.teams[team]) this.teams[team]={gold:0,wood:0};this.teams[team].gold=Math.max(0,this.teams[team].gold-g);this.teams[team].wood=Math.max(0,this.teams[team].wood-w);};
Game.prototype.getUnitUpgrades=function(team,role){
  if(!role) return {w:0,a:0};
  if(!this.unitUpgrades[team]) this.unitUpgrades[team]={};
  if(!this.unitUpgrades[team][role]) this.unitUpgrades[team][role]={w:0,a:0};
  return this.unitUpgrades[team][role];
};
Game.prototype.getTHLevel=function(team){
  var maxLvl=1;
  for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team===team&&b.kind==='townhall'&&!b.dead){var l=b.level||1;if(l>maxLvl) maxLvl=l;}}
  return maxLvl;
};
Game.prototype.clampX=function(x){return cl(x,20,this.W-20);};
Game.prototype.clampY=function(y){return cl(y,20,this.H-20);};

Game.prototype.generatePaths=function(){
  this.paths=[];var ts=this.tileSize;
  var goldPts=this.map.gold.map(function(g){return {x:g.x*ts,y:g.y*ts};});
  var basePts=this.map.bases.map(function(b){return {x:b.x*ts,y:b.y*ts};});
  for(var i=0;i<basePts.length;i++){
    var bp=basePts[i];
    var sorted=[];
    for(var j=0;j<goldPts.length;j++){var gp=goldPts[j];sorted.push({x:gp.x,y:gp.y,d:Math.hypot(gp.x-bp.x,gp.y-bp.y)});}
    sorted.sort(function(a,b){return a.d-b.d;});
    for(var k=0;k<Math.min(2,sorted.length);k++){
      var g=sorted[k];
      this.paths.push({points:[{x:bp.x,y:bp.y},{x:g.x,y:g.y}],width:60});
    }
  }
};
Game.prototype.pointToSeg=function(px,py,x1,y1,x2,y2){var dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(l2===0) return Math.hypot(px-x1,py-y1);var t=cl(((px-x1)*dx+(py-y1)*dy)/l2,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));};
Game.prototype.isOnPath=function(x,y,tol){tol=tol||70;for(var i=0;i<this.paths.length;i++){var p=this.paths[i];for(var j=0;j<p.points.length-1;j++){var a=p.points[j],b=p.points[j+1];if(this.pointToSeg(x,y,a.x,a.y,b.x,b.y)<tol) return true;}}return false;};
Game.prototype.generateDecor=function(){var rand=mb(hs(this.map.id+'_decor'));this.decor=[];for(var i=0;i<250;i++){this.decor.push({x:rand()*this.W,y:rand()*this.H,size:0.8+rand()*0.6});}};

Game.prototype.spawnResources=function(){
  for(var i=0;i<this.map.gold.length;i++){
    var g=this.map.gold[i];
    this.resources.push(new Resource(g.x*this.tileSize,g.y*this.tileSize,'gold',12500));
  }
  for(var fi=0;fi<this.map.forests.length;fi++){
    var f=this.map.forests[fi];
    for(var dx=-f.r;dx<=f.r;dx++) for(var dy=-f.r;dy<=f.r;dy++){
      if(dx*dx+dy*dy>f.r*f.r) continue;
      if(((dx*3+dy*7+fi*11)%5+5)%5===0) continue;
      var tx=(f.cx+dx)*this.tileSize;
      var ty=(f.cy+dy)*this.tileSize;
      this.resources.push(new Resource(tx,ty,'tree',150));
    }
  }
};
Game.prototype.spawnCreeps=function(){
  for(var i=0;i<this.map.camps.length;i++){
    var c=this.map.camps[i];
    if(!c||!c.kind) continue;
    if(typeof c.x!=='number'||typeof c.y!=='number'){ERR('Bad camp',i,c);continue;}
    this.creeps.push(new Creep(c.x*this.tileSize,c.y*this.tileSize,c.kind));
  }
};
Game.prototype.spawnBases=function(){
  var coords=this.map.bases,ci=0;
  for(var si=0;si<this.config.slots.length;si++){
    var slot=this.config.slots[si];if(slot.type==='empty') continue;
    if(ci>=coords.length) break;
    var base=coords[ci++];
    if(!RACES[slot.race]) continue;
    var owner=slot.type==='player'?'player':'bot';
    this.spawnBase(base.x*this.tileSize,base.y*this.tileSize,slot.team,RACES[slot.race],owner);
  }
};
Game.prototype.spawnBase=function(x,y,team,race,owner){
  var th=new Building(x,y,team,race.buildings.townhall,race.id);th.owner=owner;this.buildings.push(th);
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);
  var gx=x+Math.cos(toCenter)*200;
  var gy=y+Math.sin(toCenter)*200;
  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);
  this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i];
    var r=250+((i%2)*40);
    var tx=x+Math.cos(a)*r;
    var ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);
    this.resources.push(new Resource(tx,ty,'tree',150));
  }
  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j];
    var r2=260;
    var tx2=x+Math.cos(a2)*r2;
    var ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);
    this.resources.push(new Resource(tx2,ty2,'tree',150));
  }
  for(var wi=0;wi<3;wi++){
    var aw=(wi/3)*TAU+0.5;
    var u=new Unit(x+Math.cos(aw)*180,y+Math.sin(aw)*180,team,race.units.worker,race.id);
    u.owner=owner;u.spawnT=0.4;this.units.push(u);
  }
};
Game.prototype.spawnAI=function(){
  this.ai=[];var coords=this.map.bases,bi=0;
  for(var si=0;si<this.config.slots.length;si++){
    var s=this.config.slots[si];if(s.type==='empty') continue;
    var base=coords[bi++];if(!base) break;
    if(s.type!=='bot') continue;
    try{this.ai.push(new AIController(this,s.team,RACES[s.race],base.x*this.tileSize,base.y*this.tileSize));}catch(e){ERR('spawnAI',e);}
  }
};
Game.prototype.initFog=function(){var cs=this.fogCellSize,c=Math.ceil(this.W/cs),r=Math.ceil(this.H/cs);this.fogCols=c;this.fogRows=r;this.fog=new Uint8Array(c*r);this.vis=new Uint8Array(c*r);};
Game.prototype.updateFog=function(){
  var cs=this.fogCellSize,c=this.fogCols,r=this.fogRows;
  for(var i=0;i<this.vis.length;i++) this.vis[i]=0;
  var self=this;
  function rev(cx,cy,rad){
    for(var dx=-rad;dx<=rad;dx++){var x=cx+dx;if(x<0||x>=c) continue;
      for(var dy=-rad;dy<=rad;dy++){var y=cy+dy;if(y<0||y>=r) continue;
        if(dx*dx+dy*dy<=rad*rad){var idx=x+y*c;self.vis[idx]=1;self.fog[idx]=2;}}}
  }
  for(i=0;i<this.units.length;i++){var u=this.units[i];if(u.team===this.playerTeam&&!u.dying) rev(Math.floor(u.x/cs),Math.floor(u.y/cs),4);}
  for(i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team===this.playerTeam) rev(Math.floor(b.x/cs),Math.floor(b.y/cs),6);}
  for(i=0;i<c*r;i++){if(!this.vis[i]&&this.fog[i]===2) this.fog[i]=1;}
};
Game.prototype.isVisible=function(x,y){var cs=this.fogCellSize,cx=Math.floor(x/cs),cy=Math.floor(y/cs);if(cx<0||cy<0||cx>=this.fogCols||cy>=this.fogRows) return false;return this.vis[cx+cy*this.fogCols]===1;};
Game.prototype.isExplored=function(x,y){var cs=this.fogCellSize,cx=Math.floor(x/cs),cy=Math.floor(y/cs);if(cx<0||cy<0||cx>=this.fogCols||cy>=this.fogRows) return false;return this.fog[cx+cy*this.fogCols]>0;};
Game.prototype.buildSpatialGrid=function(){this.spatialGrid={};var cs=this.spatialCell;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;
    var k=(u.x/cs|0)+','+(u.y/cs|0);if(!this.spatialGrid[k]) this.spatialGrid[k]=[];this.spatialGrid[k].push(u);}};

Game.prototype.updateAuras=function(){
  this.auraCache.dmg={};this.auraCache.hp={};this.auraCache.blessing={};
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(!b.completed||b.dead) continue;
    if(b.kind==='forge'){var r=b.radius+260;for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.dead||u.team!==b.team||u.role==='worker') continue;if((u.x-b.x)*(u.x-b.x)+(u.y-b.y)*(u.y-b.y)<r*r) this.auraCache.dmg[u.id]=true;}}
    if(b.kind==='magic'){var r2=b.radius+260;for(var ui2=0;ui2<this.units.length;ui2++){var u2=this.units[ui2];if(u2.dead||u2.team!==b.team||u2.role==='worker') continue;if((u2.x-b.x)*(u2.x-b.x)+(u2.y-b.y)*(u2.y-b.y)<r2*r2) this.auraCache.hp[u2.id]=true;}}
  }
  for(var i=0;i<this.units.length;i++){
    var h=this.units[i];if(!h.isHero||h.dying) continue;
    if(h.abilityLevels['blessing']){
      for(var j=0;j<this.units.length;j++){
        var a=this.units[j];if(a.dead||a.team!==h.team||a.role==='worker'||a===h) continue;
        if((a.x-h.x)*(a.x-h.x)+(a.y-h.y)*(a.y-h.y)<180*180) this.auraCache.blessing[a.id]=true;
      }
    }
  }
};

function compactArr(arr){var w=0;for(var i=0;i<arr.length;i++){if(!arr[i].dead){arr[w++]=arr[i];}}arr.length=w;}

Game.prototype.update=function(dt){
  if(this.gameOver||this.paused) return;
  this.time+=dt;this._lastDt=dt;
  if(this.shake>0) this.shake-=dt*3;
  this.buildSpatialGrid();
  this.auraTimer-=dt;if(this.auraTimer<=0){this.auraTimer=1.5;this.updateAuras();}
  this.updateWeather(dt);
  var i;
  for(i=0;i<this.units.length;i++) if(!this.units[i].dead) this.updateUnit(this.units[i],dt);
  for(i=0;i<this.creeps.length;i++) if(!this.creeps[i].dead) this.updateCreep(this.creeps[i],dt);
  for(i=0;i<this.buildings.length;i++) if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);
  for(i=0;i<this.resources.length;i++){var r=this.resources[i];if(r.dead) continue;if(r.falling){r.fallT+=dt;r.fallAngle=Math.min(Math.PI/2,r.fallT*(Math.PI/2/0.6));if(r.fallT>1.5) r.dead=true;}}
  for(i=0;i<this.projectiles.length;i++){var p=this.projectiles[i];if(p.dead) continue;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.12;
    var baseCnt=wx==='snow'?3:wx==='sand'?2:1;
    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200;
      var h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};
Game.prototype.updateUnit=function(u,dt){
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2;
  if(u.chopT>0) u.chopT-=dt*1.5;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){
    u.holyStrikeT-=dt;
    if(u.holyStrikeT<=0&&u.holyStrikeBuff){
      u.holyStrikeBuff=false;
      if(u.team===this.playerTeam) this.floaters.push(new Floater(u.x,u.y-55,'Святой удар истёк','#ffe9a8'));
    }
  }
  if(u.isHero&&u.regenPassive&&!u.dying) u.hp=Math.min(u.maxHp,u.hp+u.regenPassive*dt);
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(u.team===this.playerTeam) Audio.sfx('death');
    this.decals.push(new Decal(u.x,u.y+4,u.radius*1.4));
    if(u.role!=='fly'&&u.role!=='worker'&&!u._isSummon){
      var vx=(Math.random()-0.5)*80,vy=-60-Math.random()*60;
      this.weapons.push(new WeaponDrop(u.x+(Math.random()-0.5)*20,u.y-10,u.role,u.race,u.team,vx,vy));
    }
    // Bounty for hero kill
    if(u.isHero){
      if(u.team===this.playerTeam) this.notify(t_('heroDied'));
      var la=u.lastAttacker;
      if(la&&typeof la.team==='number'&&la.team>=0&&la.team!==u.team&&this.teams[la.team]){
        this.addRes(la.team,BOUNTY_HERO,0);
        this.floaters.push(new Floater(u.x,u.y-65,'+'+BOUNTY_HERO,'#ffe066'));
        if(la.team===this.playerTeam) this.notify(t_('bountyHero'));
      }
    }
    return;
  }
  u.animT+=dt;if(u.hitFlash>0) u.hitFlash-=dt;if(u.atkCd>0) u.atkCd-=dt;if(u.attackT>0) u.attackT-=dt*3;
  if(u.stunT>0){u.moving=false;return;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;
  var hasOrder=!!(u.attackMoveTo||u.patrolRoute);
  var isIdleWorker=u.role==='worker'&&!u.gatherTarget&&!u.buildTarget&&!u.repairTarget&&!u.moveTo&&!u.carrying&&!hasOrder;
  var shouldSearch=((u.role!=='worker'&&!u.target&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder))||isIdleWorker;
  if(shouldSearch&&!u.target){
    var sr=u.role==='worker'?90:(u.range>120?320:200);
    var e=this.findEnemy(u,sr);
    if(e) u.target=e;
    else {var c=this.findNearestCreep(u,sr);if(c) u.target=c;}
  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;
    if(dxh*dxh+dyh*dyh>40000) u.moveTo={x:u.originX,y:u.originY};
  }
  u.moving=false;
  if(u.role==='worker'){
    if(u.target) this.doAttack(u,dt);
    else if(u.repairTarget&&!u.repairTarget.dead) this.doRepair(u,dt);
    else if(u.buildTarget&&!u.buildTarget.dead) this.doBuild(u,dt);
    else if(u.carrying&&u.carryAmt>=10) this.returnRes(u,dt);
    else if(u.gatherTarget&&!u.gatherTarget.dead){if(u.gatherTarget.amount<=0||u.gatherTarget.falling) u.gatherTarget=null;else this.doGather(u,dt);}
    else if(hasOrder) this.doAttackMove(u,dt);
    else if(u.moveTo) this.doMove(u,dt);
    if(u.moving) u.walkPhase+=dt*10;
    return;
  }
  if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);
  else if(hasOrder) this.doAttackMove(u,dt);
  else if(u.moveTo) this.doMove(u,dt);
  if(u.moving) u.walkPhase+=dt*10;
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){
    if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}
    else{u.attackMoveTo=null;}
    return;
  }
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);
  u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;
  else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.updateCreep=function(c,dt){
  if(c.stunT>0) c.stunT-=dt;
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;this.spawnParticles(c.x,c.y,'#8a3020',12);
    if(c.lastAttacker){
      var reward=c.goldReward;
      if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.team==='number'&&c.lastAttacker.team>=0&&this.teams[c.lastAttacker.team]){
        this.addRes(c.lastAttacker.team,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(c.isBoss&&c.lastAttacker.team===this.playerTeam) this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.team==='number'){for(var i=0;i<this.units.length;i++){var h=this.units[i];if(h.isHero&&h.team===c.lastAttacker.team&&!h.dying){if(Math.hypot(h.x-c.x,h.y-c.y)<400){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}}}}
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0) c.hitFlash-=dt;if(c.atkCd>0) c.atkCd-=dt;if(c.attackT>0) c.attackT-=dt*3;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=180*180;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);if(d2<bd){bd=d2;best=u;}}
    if(best) c.target=best;
  }
  c.moving=false;
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){c.x+=dx/d*c.spd*dt;c.y+=dy/d*c.spd*dt;c.moving=true;c.walkPhase+=dt*8;}
    else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      c.target.hp-=c.dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+c.dmg,'#ff6060'));
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){c.wanderT=2+Math.random()*3;var a=Math.random()*TAU,r=40+Math.random()*100;c.wanderTarget={x:c.homeX+Math.cos(a)*r,y:c.homeY+Math.sin(a)*r};}
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){c.x+=dxw/dw*c.spd*0.4*dt;c.y+=dyw/dw*c.spd*0.4*dt;c.walkPhase+=dt*6;c.moving=true;}
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=Math.min(hero.maxHp,hero.hp+70);hero.dmg+=5;hero.skillPoints++;
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup');
    if(hero.level===6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doMove=function(u,dt){
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  if(d<12){u.moveTo=null;return;}
  var spd=u.spd*dt;
  u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+8;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    u.x=this.clampX(u.x+dx/d*spd);u.y=this.clampY(u.y+dy/d*spd);
    u.moving=true;this.separate(u);
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.team,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;this.floaters.push(new Floater(a.x,a.y-50,'Удар!','#ffe9a8'));}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.team,t.role);dmg=dmg*(1-0.08*upD.a);}
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    this.projectiles.push(new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,'#ffe080'));
    Audio.sfx('arrow');
    if(a.isHero) t.lastAttacker=a;
    if(a.isHero&&t.hp<=dmg) this.grantXP(a,20);
    return;
  }
  if(a.role==='heal'){if(t.team===a.team) t.hp=Math.min(t.maxHp,t.hp+dmg*4);return;}
  Audio.sfx('sword');
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  var ang=Math.atan2(t.y-a.y,t.x-a.x);
  var kb=a.isHero?9:5;
  t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  this.spawnParticles(t.x,t.y,'#ffc040',5);
  this.floaters.push(new Floater(t.x,t.y-25,'-'+dmg,a.isHero?'#ffe9a8':'#ff6060'));
  this.shake=Math.min(0.3,this.shake+0.06);
  if(t.isUnit&&!t.target&&t.role!=='worker'&&!t.isBuilding) t.target=a;
  if(a.isHero&&a.bloodthirstHeal>0){
    var h=Math.round(dmg*a.bloodthirstHeal);
    if(h>0){a.hp=Math.min(a.maxHp,a.hp+h);this.floaters.push(new Floater(a.x,a.y-35,'+'+h,'#ff8080'));}
  }
  if(a.isHero&&t.hp<=0) this.grantXP(a,20);
};
Game.prototype.applyProj=function(p){
  var best=null,bd=40*40;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying||u.team===p.team) continue;var d2=(u.x-p.x)*(u.x-p.x)+(u.y-p.y)*(u.y-p.y);if(d2<bd){bd=d2;best=u;}}
  if(!best) for(var ci=0;ci<this.creeps.length;ci++){var c=this.creeps[ci];if(c.dead||c.team===p.team) continue;var d2c=(c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);if(d2c<bd){bd=d2c;best=c;}}
  if(!best) for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.dead||b.team===p.team) continue;var d2b=(b.x-p.x)*(b.x-p.x)+(b.y-p.y)*(b.y-p.y);var r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
  if(best){
    if(best.invulT>0) return;
    best.hp-=p.dmg;best.hitFlash=0.2;
    if(best.team!==p.team) best.lastAttacker={team:p.team,isHero:false,dying:false,x:best.x,y:best.y};
    this.spawnParticles(p.x,p.y,'#ffd060',4);
  }
};
Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){u.gatherTarget=null;if(u.carrying) this.returnRes(u,dt);return;}
  if(u.carrying&&u.carryAmt>=10){this.returnRes(u,dt);return;}
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>4){
      u._stuckTimer=0;
      var nr=this.findNearestResource(u.x,u.y,g.kind);
      if(nr&&nr!==g) u.gatherTarget=nr;else u.gatherTarget=null;
    }
  } else {
    u.moving=false;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.gatherProgress+=dt;u._stuckTimer=0;
    var cycle=2.5;
    u.chopT=Math.sin(Math.PI*(u.gatherProgress/cycle));
    if(u.gatherProgress>=cycle){
      u.gatherProgress=0;
      var amt=Math.min(10,g.amount);g.amount-=amt;
      if(g.amount<=0){
        if(g.kind==='tree'&&!g.falling){g.falling=true;g.fallT=0;g.fallDir=(u.x>=g.x)?-1:1;Audio.sfx('treefall');}
        else if(g.kind==='gold') g.dead=true;
      }
      u.carrying=g.kind;u.carryAmt=amt;
      Audio.sfx(g.kind==='gold'?'gold':'wood');
      this.returnRes(u,dt);
      return;
    }
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){
      u._sfxTimer=0.7;
      if(g.kind==='tree') Audio.sfx('chop');
      else if(g.kind==='gold') Audio.sfx('mine');
      var ipx=g.x+(u.x-g.x)*0.4,ipy=g.y-20;
      this.spawnParticles(ipx,ipy,g.kind==='gold'?'#ffe066':'#a08050',3);
    }
  }
};
Game.prototype.returnRes=function(u,dt){
  var th=null,bd=Infinity;
  for(var i=0;i<this.buildings.length;i++){var b=this.buildings[i];if(b.team!==u.team||b.kind!=='townhall'||b.dead) continue;var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);if(d<bd){bd=d;th=b;}}
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>5){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}
  } else {
    var cary=u.carrying;
    if(cary==='gold'){this.addRes(u.team,u.carryAmt,0);if(u.team===this.playerTeam) this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));}
    else if(cary==='tree'){this.addRes(u.team,0,u.carryAmt);if(u.team===this.playerTeam) this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));}
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    var nr=this.findNearestResource(u.x,u.y,cary==='gold'?'gold':'tree');
    if(nr&&Math.hypot(nr.x-u.x,nr.y-u.y)<1200) u.gatherTarget=nr;else u.gatherTarget=null;
  }
};
Game.prototype.doBuild=function(u,dt){
  var b=u.buildTarget;if(!b||b.dead){u.buildTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.chopT=0;u.gatherAnimT=0;
  } else {
    u.moving=false;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.gatherAnimT=(u.gatherAnimT+dt)%1.2;
    u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.6;Audio.sfx('build');var ipx=b.x+(u.x-b.x)*0.4,ipy=b.y-20;this.spawnParticles(ipx,ipy,'#ffd060',3);}
    if(!b.completed){b.buildProgress+=dt;
      if(b.buildProgress>=b.buildTime){b.completed=true;u.buildTarget=null;if(b.team===this.playerTeam) this.notify(t_('built')+' '+t_(b.kind));}}
    else u.buildTarget=null;
  }
};
Game.prototype.doRepair=function(u,dt){
  var b=u.repairTarget;if(!b||b.dead||b.hp>=b.maxHp){u.repairTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;
  if(d>reach){var step=Math.min(u.spd*dt,d-reach+2);u.x=this.clampX(u.x+dx/d*step);u.y=this.clampY(u.y+dy/d*step);u.moving=true;u.chopT=0;u.gatherAnimT=0;}
  else{u.moving=false;u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));u.repairAccum=(u.repairAccum||0)+dt;
    if(u.repairAccum>=0.5){u.repairAccum=0;var team=this.teams[u.team];var gc=3,wc=2;if(!team||team.gold<gc||team.wood<wc){u.repairTarget=null;return;}this.subRes(u.team,gc,wc);b.hp=Math.min(b.maxHp,b.hp+20);Audio.sfx('repair');if(b.hp>=b.maxHp) u.repairTarget=null;}}
};
Game.prototype.updateBuilding=function(b,dt){
  b.pulse=(b.pulse||0)+dt;
  if(b.hp<=0){b.dead=true;this.spawnParticles(b.x,b.y,'#ff8040',20);for(var i=0;i<15;i++){var a=Math.random()*TAU;this.particles.spawn(b.x,b.y-20,Math.cos(a)*180,Math.sin(a)*180-80,1.2,'#8a6a3a',3);}
    for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;}return;}
  if(b.hitFlash>0) b.hitFlash-=dt;
  if(!b.completed) return;
  if(b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+0.8*dt);
  if(b.atk>0){b.atkCd-=dt;if(b.atkCd<=0){var e=this.findEnemy(b,b.rng);if(!e) e=this.findNearestCreep(b,b.rng);if(e){b.atkCd=b.atkCdBase;this.projectiles.push(new Projectile(b.x,b.y-25,e.x,e.y,b.atk,b.team,'#ffa040'));}}}
  if(b.queue.length>0){
    var q=b.queue[0];q.timeLeft-=dt;
    if(q.timeLeft<=0){
      var race=RACES[q.race],def=race&&race.units[q.role];
      if(def&&this.units.length<300){
        var res=this.getRes(b.team);
        if(q.role==='worker'||res.pop<res.maxPop){
          var sx=b.x+(Math.random()-0.5)*60,sy=b.y+b.radius+50;
          var u2=new Unit(sx,sy,b.team,def,q.race);
          u2.owner=b.owner;u2.spawnT=0.8;
          this.units.push(u2);
          this.spawnParticles(sx,sy,'#ffe9a8',12);
          if(b.team===this.playerTeam){this.notify(t_('trained')+' '+t_(q.role));Audio.sfx(q.role==='hero'?'hero':'notify');}
        }
      }
      b.queue.shift();
    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.team===this.playerTeam){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade');}}}
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];
    if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};
Game.prototype.findNearestResource=function(x,y,kind){var best=null,bd=Infinity;for(var i=0;i<this.resources.length;i++){var r=this.resources[i];if(r.dead||r.amount<=0||r.falling) continue;if(kind&&r.kind!==kind) continue;var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);if(d<bd){bd=d;best=r;}}return best;};
Game.prototype.separate=function(u){
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){
        var d=Math.sqrt(d2),push=(minD-d)*0.5;
        px+=ddx/d*push;py+=ddy/d*push;
        if(++cnt>4) break outer;
      }
    }
  }
  u.x+=px;u.y+=py;
};
Game.prototype.spawnParticles=function(x,y,color,n){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=40+Math.random()*100;this.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,0.4+Math.random()*0.3,color,2+Math.random()*3);}};
Game.prototype.notify=function(text){this.notifications.push({text:text,t:3.5});};
Game.prototype.stopSelected=function(){
  var count=0;
  for(var i=0;i<this.units.length;i++){
    var u=this.units[i];
    if(u.sel&&u.team===this.playerTeam&&u.owner==='player'&&!u.dying){
      u.target=null;u.moveTo=null;u.attackMoveTo=null;u.patrolRoute=null;u.moving=false;
      count++;
    }
  }
  return count;
};
Game.prototype.checkVictory=function(){
  var teams={};for(var i=0;i<this.config.slots.length;i++){var s=this.config.slots[i];if(s.type!=='empty') teams[s.team]=true;}
  var cnt=0;for(var k in teams) cnt++;if(cnt<2) return;
  var hasTH={};for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.kind==='townhall'&&!b.dead) hasTH[b.team]=true;}
  if(!hasTH[this.playerTeam]){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='lose';return;}
  var enemies=0;for(var k2 in teams){var t2=parseInt(k2);if(t2!==this.playerTeam&&hasTH[t2]) enemies++;}
  if(enemies===0){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='win';}
};

Game.prototype.castAbility=function(hero,abilId){
  if(!hero.isHero||hero.dying) return;
  var list=hero.heroAbilities,ab=null,idx=-1;
  for(var i=0;i<list.length;i++) if(list[i].id===abilId){ab=list[i];idx=i;break;}
  if(!ab) return;
  var lvl=hero.abilityLevels[abilId]||0;
  if(lvl<=0||ab.type==='passive') return;
  if(ab.type==='ultimate'&&!hero.ultUnlocked) return;
  if(idx===0&&hero.cdA1>0) return;
  if(idx===1&&hero.cdA2>0) return;
  if(ab.type==='ultimate'&&hero.cdUlt>0) return;
  var cd=ab.cd*(1-0.1*lvl);
  function setCd(){if(ab.type==='ultimate') hero.cdUlt=ab.cd;else if(idx===0) hero.cdA1=cd;else if(idx===1) hero.cdA2=cd;}
  hero.castT=1;
  if(abilId==='holy_strike'){hero.holyStrikeBuff=true;hero.holyStrikeT=8;setCd();this.floaters.push(new Floater(hero.x,hero.y-45,t_('e_holy'),'#ffe9a8'));Audio.sfx('ability');}
  else if(abilId==='heal'){
    var low=null,ratio=1;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.team!==hero.team||u.dying) continue;if(Math.hypot(u.x-hero.x,u.y-hero.y)>ab.range) continue;var rt=u.hp/u.maxHp;if(rt<ratio){ratio=rt;low=u;}}
    if(low){var amt=80+40*lvl;low.hp=Math.min(low.maxHp,low.hp+amt);this.floaters.push(new Floater(low.x,low.y-30,'+'+amt,'#80ff80'));this.spawnParticles(low.x,low.y-15,'#80ff80',8);setCd();Audio.sfx('cast');}
    else{this.notify(t_('noTarget'));setCd();Audio.sfx('error');}
  }
  else if(abilId==='divine_shield'){hero.invulT=3;setCd();this.floaters.push(new Floater(hero.x,hero.y-45,'Щит','#ffe9a8'));Audio.sfx('ability');}
  else if(abilId==='rage'){hero.activeBuffT=5;hero.buffType='rage';setCd();this.floaters.push(new Floater(hero.x,hero.y-45,t_('e_rage'),'#ff5030'));Audio.sfx('ability');}
  else if(abilId==='warcry'){
    for(var i=0;i<this.units.length;i++){var en=this.units[i];if(en.team===hero.team||en.dying) continue;if(Math.hypot(en.x-hero.x,en.y-hero.y)<ab.aoe){en.stunT=1.5;this.floaters.push(new Floater(en.x,en.y-25,'STUN','#ffff60'));}}
    for(i=0;i<this.creeps.length;i++){var cr=this.creeps[i];if(cr.dying) continue;if(Math.hypot(cr.x-hero.x,cr.y-hero.y)<ab.aoe) cr.stunT=1.5;}
    setCd();this.spawnParticles(hero.x,hero.y-20,'#ffb060',20);Audio.sfx('ability');
  }
  else if(abilId==='spirits'){
    for(i=0;i<3;i++){var a=(i/3)*TAU;var sd={role:'melee',hp:180,dmg:22,range:50,spd:200,cd:1,cdBase:1,gold:0,wood:0,time:1};
      var sp=new Unit(hero.x+Math.cos(a)*60,hero.y+Math.sin(a)*60,hero.team,sd,hero.race);
      sp.owner=hero.owner;sp.spawnT=0.5;sp._isSummon=true;sp._summonT=30;this.units.push(sp);}
    setCd();this.floaters.push(new Floater(hero.x,hero.y-45,'Духи','#a080ff'));Audio.sfx('ability');
  }
  else if(abilId==='moonfire'){
    var bst=null,bd=ab.range*ab.range;
    for(i=0;i<this.units.length;i++){var en2=this.units[i];if(en2.team===hero.team||en2.dying) continue;var d2=Math.hypot(en2.x-hero.x,en2.y-hero.y);if(d2*d2<bd){bd=d2*d2;bst=en2;}}
    if(!bst) for(i=0;i<this.creeps.length;i++){var cr2=this.creeps[i];if(cr2.dying) continue;var dc=Math.hypot(cr2.x-hero.x,cr2.y-hero.y);if(dc*dc<bd){bd=dc*dc;bst=cr2;}}
    if(bst){var dmg=60+40*lvl;bst.hp-=dmg;bst.hitFlash=0.3;bst.lastAttacker=hero;this.projectiles.push(new Projectile(hero.x,hero.y-22,bst.x,bst.y-22,dmg,hero.team,'#a0d0ff'));this.floaters.push(new Floater(bst.x,bst.y-25,'-'+dmg,'#a0d0ff'));setCd();Audio.sfx('cast');}
    else{this.notify(t_('noTarget'));setCd();Audio.sfx('error');}
  }
  else if(abilId==='entangle'){
    var bst2=null,bd2=ab.range*ab.range;
    for(i=0;i<this.units.length;i++){var en3=this.units[i];if(en3.team===hero.team||en3.dying) continue;var d3=Math.hypot(en3.x-hero.x,en3.y-hero.y);if(d3*d3<bd2){bd2=d3*d3;bst2=en3;}}
    if(bst2){bst2.rootT=3;this.floaters.push(new Floater(bst2.x,bst2.y-25,'ROOT','#40a040'));this.spawnParticles(bst2.x,bst2.y,'#40a040',10);setCd();Audio.sfx('cast');}
    else{this.notify(t_('noTarget'));setCd();Audio.sfx('error');}
  }
  else if(abilId==='forest_wrath'){
    for(i=0;i<2;i++){var a3=(i/2)*TAU;var td={role:'elite',hp:350,dmg:32,range:55,spd:110,cd:1.3,cdBase:1.3,gold:0,wood:0,time:1};
      var tr=new Unit(hero.x+Math.cos(a3)*70,hero.y+Math.sin(a3)*70,hero.team,td,hero.race);
      tr.owner=hero.owner;tr.spawnT=0.5;tr._isSummon=true;tr._summonT=45;this.units.push(tr);}
    setCd();this.floaters.push(new Floater(hero.x,hero.y-45,'Лес','#40ff40'));Audio.sfx('ability');
  }
};

/* === AI === */
function AIController(game,team,race,homeX,homeY){
  this.g=game;this.team=team;this.race=race;this.raceId=race.id;
  this.atkTimer=20;this.buildTimer=4;this.trainTimer=2;this.workerTimer=2;this.upgTimer=10;
  this.homeX=homeX;this.homeY=homeY;
  this.underAttack=false;this.attackResponse=0;this.threatTimer=0;
  this.difficulty=Settings.difficulty||'normal';
  this.trainRate=this.difficulty==='easy'?0.3:this.difficulty==='hard'?0.9:0.6;
}
AIController.prototype.update=function(dt){
  var g=this.g;if(!g||g.gameOver) return;
  this.threatTimer-=dt;if(this.threatTimer<=0){this.threatTimer=1;this.detectThreats();}
  if(this.underAttack&&this.attackResponse>0) this.attackResponse-=dt;else if(this.attackResponse<=0) this.underAttack=false;
  this.workerTimer-=dt;if(this.workerTimer<=0){this.workerTimer=2;this.assignWorkers();}
  this.buildTimer-=dt;if(this.buildTimer<=0){this.buildTimer=4;this.tryBuild();}
  this.trainTimer-=dt;if(this.trainTimer<=0){this.trainTimer=3;this.tryTrain();}
  this.upgTimer-=dt;if(this.upgTimer<=0){this.upgTimer=12;this.tryUpgradeTH();}
  if(this.underAttack) this.defend();
  this.atkTimer-=dt;if(this.atkTimer<=0){this.atkTimer=45;this.tryAttack();}
};
AIController.prototype.detectThreats=function(){
  var threats=0;
  for(var i=0;i<this.g.units.length;i++){var u=this.g.units[i];if(u.team===this.team||u.dying) continue;var dx=u.x-this.homeX,dy=u.y-this.homeY;if(dx*dx+dy*dy<800*800) threats++;}
  if(threats>=2){this.underAttack=true;this.attackResponse=20;}
};
AIController.prototype.pickFocusTarget=function(cx,cy,radius){
  var g=this.g;
  cx=(typeof cx==='number')?cx:this.homeX;
  cy=(typeof cy==='number')?cy:this.homeY;
  radius=radius||2000;
  var best=null,bestScore=-1e9;
  var r2=radius*radius;
  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];
    if(u.team===this.team||u.dead||u.dying) continue;
    var d2=(u.x-cx)*(u.x-cx)+(u.y-cy)*(u.y-cy);
    if(d2>r2) continue;
    var d=Math.sqrt(d2);
    var hpPct=u.hp/u.maxHp;
    var score=(1-hpPct)*120 - d*0.05;
    if(u.isHero) score+=45;
    if(u.role==='heal') score+=35;
    if(u.role==='siege') score+=20;
    if(u.role==='worker') score-=25;
    if(score>bestScore){bestScore=score;best=u;}
  }
  if(best) return best;
  for(var bi=0;bi<g.buildings.length;bi++){
    var b=g.buildings[bi];
    if(b.team===this.team||b.dead) continue;
    var d2b=(b.x-cx)*(b.x-cx)+(b.y-cy)*(b.y-cy);
    if(d2b>r2) continue;
    var db=Math.sqrt(d2b);
    var hpPctB=b.hp/b.maxHp;
    var scoreB=(1-hpPctB)*80 - db*0.05;
    if(b.kind==='townhall') scoreB+=30;
    if(b.kind==='tower') scoreB+=10;
    if(scoreB>bestScore){bestScore=scoreB;best=b;}
  }
  return best;
};
AIController.prototype.assignWorkers=function(){
  var g=this.g;
  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];if(u.team!==this.team||u.owner!=='bot'||u.role!=='worker'||u.dying) continue;
    if(u.buildTarget||u.repairTarget) continue;
    if(u.gatherTarget&&!u.gatherTarget.dead&&u.gatherTarget.amount>0) continue;
    if(u.carrying&&u.carryAmt>=10) continue;
    var best=null,bs=-1;
    for(var j=0;j<g.resources.length;j++){
      var r=g.resources[j];if(r.dead||r.amount<=0||r.falling) continue;
      var dh=(r.x-this.homeX)*(r.x-this.homeX)+(r.y-this.homeY)*(r.y-this.homeY);
      if(dh>1500*1500) continue;
      var d=Math.hypot(r.x-u.x,r.y-u.y);if(d>1200) continue;
      var sc=1000-d;if(sc>bs){bs=sc;best=r;}
    }
    if(best) u.gatherTarget=best;
  }
};
AIController.prototype.tryBuild=function(){
  var g=this.g,res=g.getRes(this.team);
  var th=null;
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team&&b.kind==='townhall'&&b.owner==='bot'&&!b.dead){th=b;break;}}
  if(!th) return;
  var mine=[];
  for(i=0;i<g.buildings.length;i++){var b2=g.buildings[i];if(b2.team===this.team&&b2.owner==='bot'&&!b2.dead) mine.push(b2);}
  var has={};
  for(var j=0;j<mine.length;j++){has[mine[j].kind]=(has[mine[j].kind]||0)+1;}
  var thLvl=g.getTHLevel(this.team);
  var want=null;
  if(!has.barracks) want='barracks';
  else if(!has.lumber) want='lumber';
  else if(!has.house||has.house<2) want='house';
  else if(thLvl>=2&&!has.altar&&res.gold>=500) want='altar';
  else if(thLvl>=2&&!has.forge&&res.gold>=500) want='forge';
  else if(thLvl>=3&&!has.magic&&res.gold>=400) want='magic';
  else if((has.house||0)<3&&res.gold>=200) want='house';
  if(!want) return;
  var def=this.race.buildings[want];if(!def) return;
  if(res.gold<def.gold||res.wood<def.wood) return;
  var w=null;
  for(var k=0;k<g.units.length;k++){var u=g.units[k];if(u.team===this.team&&u.owner==='bot'&&u.role==='worker'&&!u.buildTarget&&!u.repairTarget&&!u.dying){w=u;break;}}
  if(!w) return;
  for(var a=0;a<16;a++){
    var ang=Math.random()*TAU,r=200+Math.random()*120;
    var bx=th.x+Math.cos(ang)*r,by=th.y+Math.sin(ang)*r;
    if(bx<50||by<50||bx>g.W-50||by>g.H-50) continue;
    if(g.isOnPath(bx,by,90)) continue;
    var ok=true;
    for(var ob=0;ob<g.buildings.length;ob++){var bb=g.buildings[ob];var ddx=bb.x-bx,ddy=bb.y-by,rr=bb.radius+70;if(ddx*ddx+ddy*ddy<rr*rr){ok=false;break;}}
    if(!ok) continue;
    var nb=new Building(bx,by,this.team,def,this.raceId);
    nb.completed=false;nb.buildProgress=0;nb.owner='bot';
    g.buildings.push(nb);g.subRes(this.team,def.gold,def.wood);
    w.buildTarget=nb;w.gatherTarget=null;w.moveTo=null;
    return;
  }
};
AIController.prototype.tryTrain=function(){
  var g=this.g,res=g.getRes(this.team);
  var buildings=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team&&b.owner==='bot'&&b.completed) buildings.push(b);}
  if(res.pop>=res.maxPop) return;
  var hasHero=false;
  for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===this.team&&!hu.dying) hasHero=true;}
  if(!hasHero){
    for(var bi=0;bi<buildings.length;bi++){
      if(buildings[bi].kind==='altar'&&buildings[bi].queue.length===0){
        var hd=this.race.units.hero;
        if(res.gold>=hd.gold&&res.wood>=hd.wood){
          g.subRes(this.team,hd.gold,hd.wood);
          buildings[bi].queue.push({role:'hero',race:this.raceId,timeLeft:hd.time,timeTotal:hd.time});
          return;
        }
      }
    }
  }
  var thLvl=g.getTHLevel(this.team);
  var roles=['worker','worker','melee','melee','ranged','ranged','spear'];
  if(thLvl>=2) roles.push('cav','siege');
  if(thLvl>=3) roles.push('elite','heal','fly');
  for(var ri=0;ri<roles.length;ri++){
    var role=roles[ri];
    var cfg=UNIT_UNLOCK[role];if(!cfg||cfg.th>thLvl) continue;
    var bld=null;
    for(var bj=0;bj<buildings.length;bj++) if(buildings[bj].kind===cfg.b&&buildings[bj].queue.length<3){bld=buildings[bj];break;}
    if(!bld) continue;
    var def=this.race.units[role];if(!def) continue;
    if(res.gold<def.gold||res.wood<def.wood) continue;
    if(Math.random()<this.trainRate){g.subRes(this.team,def.gold,def.wood);bld.queue.push({role:role,race:this.raceId,timeLeft:def.time,timeTotal:def.time});return;}
  }
};
AIController.prototype.tryUpgradeTH=function(){
  var g=this.g,res=g.getRes(this.team);
  var th=null;
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team===this.team&&b.kind==='townhall'&&b.owner==='bot'&&!b.dead){th=b;break;}}
  if(!th||th.upgrading||th.level>=3) return;
  var cost=TH_UPG[th.level];if(!cost) return;
  if(res.gold<cost.gold+150||res.wood<cost.wood+100) return;
  g.subRes(this.team,cost.gold,cost.wood);
  th.upgrading=true;th.upgradeTimeLeft=cost.time;
};
AIController.prototype.defend=function(){
  var g=this.g;
  var target=this.pickFocusTarget(this.homeX,this.homeY,900);
  if(!target) return;
  for(var j=0;j<g.units.length;j++){
    var u2=g.units[j];
    if(u2.team!==this.team||u2.owner!=='bot'||u2.role==='worker'||u2.dying) continue;
    if(u2.target&&!u2.target.dead&&u2.target.team!==this.team) continue;
    u2.target=target;u2.stance='aggressive';
  }
};
AIController.prototype.tryAttack=function(){
  var g=this.g;if(this.underAttack) return;
  var myF=[];
  var cx=0,cy=0;
  for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.team===this.team&&u.owner==='bot'&&u.role!=='worker'&&!u.dying){myF.push(u);cx+=u.x;cy+=u.y;}}
  if(myF.length<5) return;
  cx/=myF.length;cy/=myF.length;
  var target=this.pickFocusTarget(cx,cy,1500);
  if(!target) return;
  for(var fi=0;fi<myF.length;fi++){
    var m=myF[fi];
    m.target=target;m.stance='aggressive';m.moveTo=null;m.attackMoveTo=null;m.patrolRoute=null;
  }
};

/* === RENDERER === */
function Renderer(canvas,game){
  this.cv=canvas;
  try{this.ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});}
  catch(e){this.ctx=canvas.getContext('2d');}
  this.g=game;
  this.dpr=computeDPR();
  var self=this;this._rh=function(){self.resize();};
  window.addEventListener('resize',this._rh);
  this.resize();
}
function computeDPR(){
  var base=window.devicePixelRatio||1;
  if(Settings.quality==='low') return 1;
  if(Settings.quality==='high') return Math.min(base,2);
  return Math.min(base,1.5);
}
Renderer.prototype.destroy=function(){window.removeEventListener('resize',this._rh);this.g=null;};
Renderer.prototype.resize=function(){
  if(!this.cv) return;
  this.w=this.cv.clientWidth||window.innerWidth;
  this.h=this.cv.clientHeight||window.innerHeight;
  this.cv.width=Math.floor(this.w*this.dpr);
  this.cv.height=Math.floor(this.h*this.dpr);
};
Renderer.prototype.w2s=function(wx,wy){var c=this.g.camera;return{x:(wx-c.x)*c.zoom+this.w/2,y:(wy-c.y)*c.zoom+this.h/2};};
Renderer.prototype.s2w=function(sx,sy){var c=this.g.camera;return{x:(sx-this.w/2)/c.zoom+c.x,y:(sy-this.h/2)/c.zoom+c.y};};
Renderer.prototype._legs=function(u,p,s){
  var def=getLeg(u.role);if(!def) return;
  var ctx=this.ctx,z=this.g.camera.zoom;
  var legW=def.w*s,legH=def.h*s,spread=def.spread*s;
  var cx=p.x,baseY=p.y+2*z,bodyBaseY=baseY-legH;
  var phase=(u.walkPhase||0)+u.walkOffset;

/* === INPUT === */
var Input={
  boxSelect:null,keys:{},mouseX:0,mouseY:0,mouseInside:false,dragging:null,_escDown:false,formation:'box',
  touchStart:null,pinchDist:0,isTouch:false,pinchCenter:null,

  shiftDown:false,
  init:function(canvas){
    var self=this;
    var resume=function(){Audio.resume();};
    canvas.addEventListener('mousedown',resume);
    canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
    canvas.addEventListener('mousedown',function(e){
      var r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
      if(e.button===1){e.preventDefault();self.dragging={x:e.clientX,y:e.clientY};return;}
      if(e.button===0){
        self.mouseX=mx;self.mouseY=my;self.mouseInside=true;
        self.boxSelect={active:true,x1:mx,y1:my,x2:mx,y2:my,add:e.ctrlKey||e.shiftKey};
      } else if(e.button===2){e.preventDefault();if(Game_) Game_.handleRightClick(mx,my);}
    });
    canvas.addEventListener('mousemove',function(e){
      var r=canvas.getBoundingClientRect();
      self.mouseX=e.clientX-r.left;self.mouseY=e.clientY-r.top;self.mouseInside=true;
      if(self.dragging&&Game_){
        var dx=e.clientX-self.dragging.x,dy=e.clientY-self.dragging.y;
        Game_.camera.x-=dx/Game_.camera.zoom;Game_.camera.y-=dy/Game_.camera.zoom;
        clampCam();self.dragging.x=e.clientX;self.dragging.y=e.clientY;
      }
      if(self.boxSelect&&self.boxSelect.active){self.boxSelect.x2=self.mouseX;self.boxSelect.y2=self.mouseY;}
    });
    canvas.addEventListener('mouseleave',function(){self.mouseInside=false;});
    function handleMouseUp(e){
      if(e.button===1){self.dragging=null;return;}
      if(e.button!==0) return;
      if(!self.boxSelect) return;
      var b=self.boxSelect,w=Math.abs(b.x2-b.x1),h=Math.abs(b.y2-b.y1);
      if(UI&&UI._placingKind&&w<8&&h<8){
        var pick=Game_.pickScreen(b.x1,b.y1);
        if(pick.building||pick.unit){UI.cancelPlacement();Game_.handleLeftClick(b.x1,b.y1,b.add);}
        else{var wpt=Renderer_.s2w(b.x1,b.y1);UI.tryPlaceAt(wpt.x,wpt.y);}
        self.boxSelect=null;return;
      }
      if(w<12&&h<12){if(Game_) Game_.handleLeftClick(b.x1,b.y1,b.add);}
      else{if(Game_) Game_.handleBoxSelect(b,b.add);}
      self.boxSelect=null;
    }
    canvas.addEventListener('mouseup',handleMouseUp);
    window.addEventListener('mouseup',function(e){
      if(self.boxSelect&&self.boxSelect.active){
        if(e.target!==canvas) handleMouseUp(e);
      }
      if(self.dragging) self.dragging=null;
    });
    canvas.addEventListener('wheel',function(e){
      e.preventDefault();if(!Game_) return;
      // Shift+wheel rotates formation
      if(e.shiftKey){
        self.formationAngle += (e.deltaY>0?0.2:-0.2);
        self.formationAngle = ((self.formationAngle%TAU)+TAU)%TAU;
        if(UI) UI.showHint('Строй: '+Math.round(self.formationAngle*180/Math.PI)+'°', 1);
        return;
      }
      var f=e.deltaY<0?1.15:0.87,minZ=getMinZoom();
      Game_.camera.zoom=cl(Game_.camera.zoom*f,minZ,3);clampCam();
    },{passive:false});
    window.addEventListener('keydown',function(e){
      if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')) return;
      var k=e.key.toLowerCase();
      if(e.key==='Shift') self.shiftDown=true;
      self.keys[k]=true;
      if(e.key==='Escape'&&Game_&&!self._escDown){
        self._escDown=true;
        if(UI._placingKind) UI.cancelPlacement();
        else if(self.pendingOrder){self.pendingOrder=null;if(UI) UI.hideOrderBar();}
        else Game_.togglePause();
      }
      if(k==='a'&&e.ctrlKey&&Game_){e.preventDefault();Game_.selectAllCombat();return;}
      if(Game_&&!e.ctrlKey){
        // hero abilities
        var sel=[];
        for(var i=0;i<Game_.units.length;i++){
          var u=Game_.units[i];
          if(u.sel&&u.team===Game_.playerTeam&&u.isHero&&u.owner==='player'&&!u.dying) sel.push(u);
        }
        if(sel.length){
          var hero=sel[0];
          if(k==='q'){e.preventDefault();Game_.castAbility(hero,hero.heroAbilities[0].id);return;}
          else if(k==='e'){e.preventDefault();Game_.castAbility(hero,hero.heroAbilities[1].id);return;}
          else if(k==='r'){e.preventDefault();Game_.castAbility(hero,hero.heroAbilities[3].id);return;}
        }
        // RTS commands
        if(k==='a'&&!e.ctrlKey&&!e.shiftKey){
          if(Game_.hasSelectedCombat()){self.pendingOrder='attack';if(UI) UI.showOrderBar(t_('atkMove'));e.preventDefault();}
        } else if(k==='s'&&!e.ctrlKey){
          if(Game_.hasSelectedCombat()){var n=Game_.stopSelected();if(n&&UI) UI.showHint(t_('stopped')+' ×'+n,1);e.preventDefault();}
        } else if(k==='p'&&!e.ctrlKey){
          if(Game_.hasSelectedCombat()){self.pendingOrder='patrol';if(UI) UI.showOrderBar(t_('patrol'));e.preventDefault();}
        }
      }
    });
    window.addEventListener('keyup',function(e){self.keys[e.key.toLowerCase()]=false;if(e.key==='Shift') self.shiftDown=false;if(e.key==='Escape') self._escDown=false;});

    canvas.addEventListener('touchstart',function(e){
      if(!Game_) return;Audio.resume();
      self.isTouch=true;

UISys.prototype.buildSlotList=function(){
  var map=null;
  for(var i=0;i<MAPS.length;i++) if(MAPS[i].id===this.selectedMap){map=MAPS[i];break;}
  if(!map) return;
  var n=Math.min(map.bases.length,6);
  var prev=this.slotConfig||[];this.slotConfig=[];
  for(var k=0;k<n;k++){
    var p=prev[k];
    var defType=(k===0)?'player':'bot';
    var defTeam=k;
    this.slotConfig.push({
      type:p&&p.type?p.type:defType,
      race:p&&p.race?p.race:'luminite',
      team:p&&p.team!=null?p.team:defTeam
    });
  }
  if(this.slotConfig[0]){this.slotConfig[0].type='player';this.slotConfig[0].team=0;}
  this.$('slot-count').textContent=this.slotConfig.length;
  this.renderSlotList();
};
UISys.prototype.renderSlotList=function(){

      typeSel.onchange=function(){s.slotConfig[idx].type=typeSel.value;s.renderSlotList();};
      row.appendChild(typeSel);

      for(var ri=0;ri<races.length;ri++){
        var o2=document.createElement('option');o2.value=races[ri];o2.textContent=t_(races[ri]);raceSel.appendChild(o2);
      }

      row.appendChild(raceSel);
      var teamWrap=document.createElement('div');teamWrap.className='team-sel';

      for(var tm=1;tm<=6;tm++){
        var o3=document.createElement('option');o3.value=tm-1;o3.textContent=tm;teamSel.appendChild(o3);
      }
      teamSel.value=cfg.team;
      if(idx===0) teamSel.disabled=true;

      teamWrap.appendChild(teamSel);

function renderMapPreview(canvas,map){
  var ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
  var biome=BIOMES[map.biome]||BIOMES.grassland;
  ctx.fillStyle='rgb('+biome.base[0]+','+biome.base[1]+','+biome.base[2]+')';ctx.fillRect(0,0,W,H);
  var sz=map.size;
  for(var i=0;i<sz;i+=4) for(var j=0;j<sz;j+=4){
    var base=(i+j)%2===0?biome.base:biome.alt;
    ctx.fillStyle='rgb('+base[0]+','+base[1]+','+base[2]+')';
    ctx.fillRect(i/sz*W,j/sz*H,W*4/sz+1,H*4/sz+1);
  }
  for(var fi=0;fi<map.forests.length;fi++){var f=map.forests[fi];ctx.fillStyle='rgba(45,90,45,0.75)';ctx.beginPath();ctx.arc(f.cx/sz*W,f.cy/sz*H,f.r/sz*W,0,TAU);ctx.fill();}
  for(var gi=0;gi<map.gold.length;gi++){var g=map.gold[gi];ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(g.x/sz*W,g.y/sz*H,W/36,0,TAU);ctx.fill();}
  for(var bi=0;bi<map.bases.length;bi++){var b=map.bases[bi];ctx.fillStyle=teamColor(bi);ctx.fillRect(b.x/sz*W-W/30,b.y/sz*H-W/30,W/15,W/15);}
}
UISys.prototype.startGame=function(){
  try{
    var map=null;
    for(var i=0;i<MAPS.length;i++) if(MAPS[i].id===this.selectedMap){map=MAPS[i];break;}
    if(!map){alert('Карта не найдена');return;}
    var slots=[];
    for(var k=0;k<this.slotConfig.length;k++){
      var cfg=this.slotConfig[k];
      if(cfg.type==='empty') continue;
      slots.push({type:cfg.type==='player'?'player':'bot',race:cfg.race,team:cfg.team});
    }
    var hasPlayer=false;
    for(var pi=0;pi<slots.length;pi++) if(slots[pi].type==='player'){hasPlayer=true;break;}
    if(!hasPlayer){alert('Нужен игрок в первом слоте');return;}
    if(slots.length<2){alert('Нужно 2+ участника');return;}
    var teamsSet={};
    for(var ti=0;ti<slots.length;ti++) teamsSet[slots[ti].team]=true;
    var teamCount=0;for(var tk in teamsSet) teamCount++;
    if(teamCount<2){alert('Все в одной команде');return;}
    Audio.stopMusic();Input.keys={};Input.pendingOrder=null;this.hideOrderBar();
    if(Renderer_) Renderer_.destroy();
    Game_=new Game(map,{slots:slots});
    Renderer_=new Renderer(this.$('game'),Game_);
    for(var si=0;si<slots.length;si++){
      var ss=slots[si];
      Game_.getRes(ss.team);
      Game_.teams[ss.team].gold=350;
      Game_.teams[ss.team].wood=200;
    }
    this.showScreen(null);
    this.$('hud').classList.add('active');
    this.$('gameover').classList.remove('active');
    this.$('pausemenu').classList.remove('active');
    if(Settings.quality!=='low') document.getElementById('vignette').classList.add('active');
    this.refreshSelection();
    this._gameOverShown=false;this._lastActionsHash='';
    centerCam();
    Audio.init();Audio.resume();Audio.startMusic(map.biome);
    this.showHint(t_('startHint')+' · '+t_('cam_hint'),6);
  }catch(e){ERR('startGame',e);alert('Ошибка: '+e.message);}
};
function centerCam(){
  if(!Game_||!Renderer_) return;
  var c=Game_.camera,th=null;
  for(var i=0;i<Game_.buildings.length;i++){var b=Game_.buildings[i];if(b.team===Game_.playerTeam&&b.kind==='townhall'&&b.owner==='player'){th=b;break;}}
  if(!th){for(var i2=0;i2<Game_.buildings.length;i2++){var b2=Game_.buildings[i2];if(b2.team===Game_.playerTeam&&b2.kind==='townhall'){th=b2;break;}}}
  if(!th){c.x=Game_.W/2;c.y=Game_.H/2;c.zoom=getMinZoom();clampCam();return;}
  c.zoom=Math.max(getMinZoom(),Math.min(1,Renderer_.w/1500));
  c.x=th.x;c.y=th.y;clampCam();
}

UISys.prototype.doSave=function(slot){
  if(!Game_) return;
  try{
    var arr=[];
    try{arr=JSON.parse(localStorage.getItem('echo33_saves')||'[]')||[];}catch(e){arr=[];}
    while(arr.length<3) arr.push(null);
    arr[slot]={ts:Date.now(),data:Game_.serialize()};
    localStorage.setItem('echo33_saves',JSON.stringify(arr));
    this.pushNotif(t_('saved'));this.renderSaves();

UISys.prototype.refreshSelection=function(){
  if(!Game_) return;
  var g=Game_,sel=[],selB=[];
  for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.sel&&u.team===g.playerTeam&&u.owner==='player'&&!u.dying) sel.push(u);}
  for(var bi=0;bi<g.buildings.length;bi++){var b=g.buildings[bi];if(b.sel&&b.team===g.playerTeam&&b.owner==='player') selB.push(b);}
  var info=this.$('selinfo');
  if(!sel.length&&!selB.length){
    info.classList.remove('show');
    this.$('actions').innerHTML='';
    this.drawPortrait(null);
    this._lastActionsHash='';
    this.$('cmdpanel').classList.remove('show');
    this.$('queue-panel').classList.remove('show');
    return;
  }
  this.$('cmdpanel').classList.add('show');
  info.classList.add('show');
  if(sel.length===1){
    var f=sel[0];
    if(f.isHero) info.textContent='Герой: '+t_('hero_'+f.race)+' Ур.'+f.level+' | HP '+Math.ceil(f.hp)+'/'+f.maxHp+(f.skillPoints>0?' | Очки: '+f.skillPoints:'');
    else info.textContent=t_(f.role)+' | HP '+Math.ceil(f.hp)+'/'+f.maxHp;
  } else if(sel.length>1) info.textContent='Выбрано: '+sel.length;
  else {var b2=selB[0];info.textContent=t_(b2.kind)+(b2.completed?' Ур.'+b2.level:' ...')+' | '+Math.ceil(b2.hp)+'/'+b2.maxHp;}
  this.drawPortrait(sel[0]||selB[0]);
  this.renderActions(true);
  if(selB.length===1&&selB[0].queue.length>0) this.$('queue-panel').classList.add('show');
  else this.$('queue-panel').classList.remove('show');
};
UISys.prototype.drawPortrait=function(ent){
  var cv=this.$('portrait-canvas'),info=this.$('portrait-info');
  if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var bgGrad=ctx.createLinearGradient(0,0,0,cv.height);
  bgGrad.addColorStop(0,'#1a2438');bgGrad.addColorStop(1,'#050810');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cv.width,cv.height);
  if(!ent){info.innerHTML='<div class="pname">—</div>';return;}
  try{
    if(ent.isUnit){
      drawUnitIntoCanvas(cv,ent.race,ent.role,ent.team,DIR.DOWN,10);
      var name=ent.isHero?'Герой '+t_('hero_'+ent.race):t_(ent.role);
      var extra=ent.isHero?(' Ур.'+ent.level):'';
      info.innerHTML='<div class="pname">'+name+extra+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    } else {
      var sp2=bakeBuilding(ent.race,ent.kind,ent.team);
      var s2=Math.min((cv.width-16)/sp2.width,(cv.height-16)/sp2.height);
      ctx.drawImage(sp2,(cv.width-sp2.width*s2)/2,(cv.height-sp2.height*s2)/2,sp2.width*s2,sp2.height*s2);
      info.innerHTML='<div class="pname">'+t_(ent.kind)+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    }
  }catch(e){}
};
UISys.prototype.addAction=function(box,icon,label,price,fn,active,disabled,tooltip,cls){
