</style>

(function applyRaceBalance(){
  for(var raceId in RACE_BALANCE){
    if(!RACES[raceId]) continue;
    var bal=RACE_BALANCE[raceId];
    var units=RACES[raceId].units;
    for(var role in units){
      var u=units[role];
      if(!u||!u.role) continue;
      var isCombat=(role!=='worker');
      if(isCombat){
        u.hp=Math.round(u.hp*bal.hpMul);
        u.dmg=Math.round(u.dmg*bal.dmgMul);
        u.spd=Math.round(u.spd*bal.spdMul);
        if(u.range>80) u.range=Math.round(u.range*bal.rangeMul);
        u.cd=u.cd*bal.atkSpdMul;
        u.gold=Math.round((u.gold||0)*bal.costGoldMul);
      }
      u.armor=bal.armor;
      u.raceRegen=isCombat?bal.regenOutCombat:0.3;
    }
  }
})();

  ctx.strokeStyle='#3a3a40';ctx.lineWidth=0.7;ctx.strokeRect(cwX-10,cwY-3,20,3);ctx.strokeRect(cwX-10,cwY+3,20,3);

  for(var l=0;l<4;l++){

  }

    var segs=3;

  ctx.strokeStyle='#2a3a20';ctx.lineWidth=1.1;ctx.stroke();
  ctx.fillStyle='#5ac040';
  for(var lf=0;lf<5;lf++){

  }
  ctx.fillStyle='rgba(120,220,80,0.85)';
  ctx.beginPath();ctx.ellipse(cx-20,bodyY-6,3.5,2,-0.4,0,TAU);ctx.fill();

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){

  for(var ri0=this.resources.length-1;ri0>=0;ri0--){

  }
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);

  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);

  while(attempts<12){

      if(Math.hypot(r0b.x-gx,r0b.y-gy)<450){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;

  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=580+((i%2)*80);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;

    var a2=toCenter+angles2[j],r2=660;
    var tx2=x+Math.cos(a2)*r2,ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);

      var hit=false;

      if(!hit) for(var ri2=0;ri2<this.resources.length;ri2++){var rr=this.resources[ri2];if(Math.hypot(rr.x-wx,rr.y-wy)<rr.radius+56){hit=true;break;}}
      if(!hit) break;

    }

    u.owner=owner;u.pid=pid;u.spawnT=0;this.units.push(u);
  }
};

    else for(var i=0;i<this.teamVis[t].length;i++) this.teamVis[t][i]=0;

Game.prototype.updateFog=function(){
  var cs=this.fogCellSize,c=this.fogCols,r=this.fogRows;
  var self=this;
  for(var t in this.teamVis){for(var i=0;i<this.teamVis[t].length;i++) this.teamVis[t][i]=0;}
  function rev(team,cx,cy,rad){
    var arr=self.teamVis[team];if(!arr) return;
    var x0=Math.max(0,cx-rad),x1=Math.min(c-1,cx+rad);
    var y0=Math.max(0,cy-rad),y1=Math.min(r-1,cy+rad);
    var fog=self.teamFog[team];
    for(var x=x0;x<=x1;x++){
      for(var y=y0;y<=y1;y++){
        var idx=x+y*c;arr[idx]=1;fog[idx]=2;
      }
    }
  }
  var i;
  for(i=0;i<this.units.length;i++){
    var u=this.units[i];if(u.dying) continue;
    var vr=Math.ceil((u.vision||200)/cs);
    rev(u.team,Math.floor(u.x/cs),Math.floor(u.y/cs),vr);
  }
  for(i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    rev(b.team,Math.floor(b.x/cs),Math.floor(b.y/cs),b.kind==='townhall'?9:6);
  }
  for(var tt in this.teamFog){
    var src=this.teamFog[tt];
    for(i=0;i<src.length;i++){if(!this.teamVis[tt][i]&&src[i]===2) src[i]=1;}
  }
  var pvis=this.teamVis[this.playerTeam]||new Uint8Array(c*r);

Game.prototype.buildSpatialGrid=function(){

Game.prototype.markNavDirty=function(){ this.navDirty=true; };
Game.prototype.buildNavGrid=function(){
  var ts=this.tileSize;
  var cols=Math.ceil(this.W/ts),rows=Math.ceil(this.H/ts);
  this.navCols=cols;this.navRows=rows;
  var grid=new Uint8Array(cols*rows);
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.dying) continue;
    var r=b.radius*1.55;
    var minX=Math.max(0,Math.floor((b.x-r)/ts));
    var maxX=Math.min(cols-1,Math.floor((b.x+r)/ts));
    var minY=Math.max(0,Math.floor((b.y-r)/ts));
    var maxY=Math.min(rows-1,Math.floor((b.y+r)/ts));
    for(var y=minY;y<=maxY;y++) for(var x=minX;x<=maxX;x++) grid[y*cols+x]=1;
  }
  for(var ri=0;ri<this.resources.length;ri++){
    var rr=this.resources[ri];if(rr.dead||rr.falling) continue;
    var rr2=(rr.kind==='gold')?rr.radius*0.75:28;
    var minX2=Math.max(0,Math.floor((rr.x-rr2)/ts));
    var maxX2=Math.min(cols-1,Math.floor((rr.x+rr2)/ts));
    var minY2=Math.max(0,Math.floor((rr.y-rr2)/ts));
    var maxY2=Math.min(rows-1,Math.floor((rr.y+rr2)/ts));
    for(var y2=minY2;y2<=maxY2;y2++) for(var x2=minX2;x2<=maxX2;x2++) grid[y2*cols+x2]=1;

Game.prototype.findPath=function(sx,sy,tx,ty){
  if(this.navDirty) this.buildNavGrid();
  var ts=this.tileSize,cols=this.navCols,rows=this.navRows,grid=this.navGrid;
  if(!grid||cols===0||rows===0){this.buildNavGrid();grid=this.navGrid;cols=this.navCols;rows=this.navRows;}
  var startCx=cl(Math.floor(sx/ts),0,cols-1),startCy=cl(Math.floor(sy/ts),0,rows-1);
  var endCx=cl(Math.floor(tx/ts),0,cols-1),endCy=cl(Math.floor(ty/ts),0,rows-1);
  if(grid[endCy*cols+endCx]===1){
    var f1=false;
    for(var r1=1;r1<=4&&!f1;r1++){
      for(var ddx=-r1;ddx<=r1&&!f1;ddx++) for(var ddy=-r1;ddy<=r1&&!f1;ddy++){
        var ncx=endCx+ddx,ncy=endCy+ddy;
        if(ncx<0||ncy<0||ncx>=cols||ncy>=rows) continue;
        if(grid[ncy*cols+ncx]===0){endCx=ncx;endCy=ncy;f1=true;}
      }
    }
    if(!f1) return null;
  }
  if(grid[startCy*cols+startCx]===1){
    var f2=false;
    for(var r2=1;r2<=4&&!f2;r2++){
      for(var ddx2=-r2;ddx2<=r2&&!f2;ddx2++) for(var ddy2=-r2;ddy2<=r2&&!f2;ddy2++){
        var ncx2=startCx+ddx2,ncy2=startCy+ddy2;
        if(ncx2<0||ncy2<0||ncx2>=cols||ncy2>=rows) continue;
        if(grid[ncy2*cols+ncx2]===0){startCx=ncx2;startCy=ncy2;f2=true;}
      }
    }
    if(!f2) return null;
  }
  var startI=startCy*cols+startCx,endI=endCy*cols+endCx;
  if(startI===endI) return [{x:tx,y:ty}];
  var total=cols*rows;
  if(!this._pfVisited||this._pfVisited.length!==total){
    this._pfVisited=new Uint8Array(total);
    this._pfParent=new Int32Array(total);
    this._pfQueue=new Int32Array(total);
  }
  var visited=this._pfVisited,parent=this._pfParent,queue=this._pfQueue;
  for(var k=0;k<total;k++){visited[k]=0;parent[k]=-1;}
  queue[0]=startI;visited[startI]=1;var head=0,qLen=1;
  var DX=[-1,0,1,-1,1,-1,0,1],DY=[-1,-1,-1,0,0,1,1,1];
  var found=false;
  while(head<qLen){
    var cur=queue[head++];
    if(cur===endI){found=true;break;}
    var cx=cur%cols,cy=(cur/cols)|0;
    for(var d=0;d<8;d++){
      var nx=cx+DX[d],ny=cy+DY[d];
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      var ni=ny*cols+nx;
      if(visited[ni]||grid[ni]===1) continue;

    }
  }
  if(!found) return null;
  var path=[];
  var cur2=endI,safety=0;
  while(cur2!==-1&&safety<20000){
    var cx2=cur2%cols,cy2=(cur2/cols)|0;
    path.unshift({x:cx2*ts+ts/2,y:cy2*ts+ts/2});
    cur2=parent[cur2];safety++;
  }
  if(path.length>0) path[path.length-1]={x:tx,y:ty};
  return path;
};
function compactArr(arr){var w=0;for(var i=0;i<arr.length;i++){if(!arr[i].dead){arr[w++]=arr[i];}}arr.length=w;}

Game.prototype._hasLineOfSight=function(x1,y1,x2,y2){

Game.prototype.update=function(dt){

  this.buildSpatialGrid();

  var i;

  for(i=0;i<this.creeps.length;i++){try{if(!this.creeps[i].dead) this.updateCreep(this.creeps[i],dt);}catch(e){ERR('updateCreep',e);}}
  for(i=0;i<this.buildings.length;i++){try{if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);}catch(e){ERR('updateBuilding',e);}}

        }
        if(Math.random()<0.4){
          this.particles.spawn(r.x+(Math.random()-0.5)*30,r.y-40-Math.random()*40,(Math.random()-0.5)*20,-20-Math.random()*20,0.8,'#8a5a30',2);
        }
      } else if(ft<1.15){
        var nt=(ft-0.4)/0.75;
        var eased=nt*nt*(3-2*nt);
        r.fallAngle=eased*(Math.PI/2)*fDir;
        if(Math.random()<0.85){
          var la=Math.random()*TAU,ls=40+Math.random()*80;
          this.particles.spawn(r.x+(Math.random()-0.5)*40,r.y-60+Math.random()*40,Math.cos(la)*ls,Math.sin(la)*ls-40,1.4+Math.random()*0.6,Math.random()<0.5?'#3a7a28':'#5aaa40',2.5+Math.random()*1.5);
        }
        if(Math.random()<0.6){
          this.particles.spawn(r.x+(Math.random()-0.5)*70,r.y-15,(Math.random()-0.5)*30,-10-Math.random()*20,1.0,'#8a6a3a',2+Math.random()*2);
        }
      } else if(ft<1.9){

        var bounce=Math.sin(bt*Math.PI*3)*0.18*(1-bt);
        r.fallAngle=((Math.PI/2)+bounce)*fDir;
        if(Math.random()<0.5){
          var sa=Math.random()*TAU,ss=60+Math.random()*100;
          this.particles.spawn(r.x+(Math.random()-0.5)*60,r.y-20,Math.cos(sa)*ss,Math.sin(sa)*ss-40,1.2,'#8a5a30',2+Math.random()*2);
        }
      } else if(ft<3.0){

        if(Math.random()<0.3){

  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}

  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);

Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.14;

    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200,h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};
Game.prototype.ejectFromBuildings=function(u){
  if(u._insideMine||u._isSummon||u._waitingForMine) return;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.dead||b.dying) continue;
    var dx=u.x-b.x,dy=u.y-b.y;
    var minD=u.radius+b.radius*1.02;
    var d2=dx*dx+dy*dy;
    if(d2<minD*minD){
      var d=Math.sqrt(d2);
      if(d<0.01){dx=1;dy=0;d=1;}
      u.x=this.clampX(b.x+dx/d*(minD+2));
      u.y=this.clampY(b.y+dy/d*(minD+2));
      u._path=null;u._pathIdx=0;
    }
  }
};
Game.prototype._wouldHitBuilding=function(x,y,radius,ignore){
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];if(b.dead||b.dying) continue;
    if(b===ignore) continue;
    var dx=x-b.x,dy=y-b.y,minD=radius+b.radius*1.10;
    if(dx*dx+dy*dy<minD*minD) return b;
  }
  return null;
};
Game.prototype._wouldHitResource=function(x,y,radius,ignore){
  var cs=this.spatialCell,gx=(x/cs)|0,gy=(y/cs)|0;
  for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=1;dy++){
    var arr=this.resourceGrid[(gx+dx)+','+(gy+dy)];
    if(!arr) continue;
    for(var i=0;i<arr.length;i++){
      var r=arr[i];
      if(r===ignore||r.dead||r.falling) continue;
      var rr=(r.kind==='gold')?r.radius*0.55:24;
      var ddx=x-r.x,ddy=y-r.y,minD=radius+rr;
      if(ddx*ddx+ddy*ddy<minD*minD) return r;
    }
  }
  return null;
};
Game.prototype._smartMove=function(u,dx,dy,spd){
  var d=Math.hypot(dx,dy);if(d<0.01) return false;
  var nx=u.x+dx/d*spd,ny=u.y+dy/d*spd;
  var blockedB=this._wouldHitBuilding(nx,ny,u.radius);
  var blockedR=this._wouldHitResource(nx,ny,u.radius,u.gatherTarget);
  if(!blockedB&&!blockedR){
    u.x=this.clampX(nx);u.y=this.clampY(ny);return true;
  }
  var nx1=u.x+dx/d*spd,ny1=u.y;
  if(!this._wouldHitBuilding(nx1,ny1,u.radius)&&!this._wouldHitResource(nx1,ny1,u.radius,u.gatherTarget)){u.x=this.clampX(nx1);return true;}
  var nx2=u.x,ny2=u.y+dy/d*spd;
  if(!this._wouldHitBuilding(nx2,ny2,u.radius)&&!this._wouldHitResource(nx2,ny2,u.radius,u.gatherTarget)){u.y=this.clampY(ny2);return true;}
  var perp=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
  var sx=u.x+Math.cos(perp)*side*spd,sy=u.y+Math.sin(perp)*side*spd;
  if(!this._wouldHitBuilding(sx,sy,u.radius)){u.x=this.clampX(sx);u.y=this.clampY(sy);return true;}
  var baseAng=Math.atan2(dy,dx);
  for(var step=0.18;step<Math.PI;step+=0.18){
    var a1=baseAng+step;
    var sx1=u.x+Math.cos(a1)*spd,sy1=u.y+Math.sin(a1)*spd;
    if(!this._wouldHitBuilding(sx1,sy1,u.radius)){u.x=this.clampX(sx1);u.y=this.clampY(sy1);return true;}
    var a2=baseAng-step;
    var sx2=u.x+Math.cos(a2)*spd,sy2=u.y+Math.sin(a2)*spd;
    if(!this._wouldHitBuilding(sx2,sy2,u.radius)){u.x=this.clampX(sx2);u.y=this.clampY(sy2);return true;}
  }
  return false;
};

Game.prototype.updateUnit=function(u,dt){
  if(!u.dying) this.ejectFromBuildings(u);
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2; else u.castT=0;
  if(u.chopT>0) u.chopT-=dt*1.5; else u.chopT=0;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){u.holyStrikeT-=dt;if(u.holyStrikeT<=0&&u.holyStrikeBuff){u.holyStrikeBuff=false;}}
  if(u.slowT>0){u.slowT-=dt;if(u.slowT<=0){u.slowMul=1;u.slowStacks=0;}}
  if(u.bleedT>0){u.bleedT-=dt;u.hp-=(u.bleedDmg||0)*dt;if(u.bleedT<=0)u.bleedDmg=0;}
  if(!u.dying && u.hp<u.maxHp && (!u.target || u.target.dead) && u.stunT<=0){
    var regen=u.raceRegen||0;
    if(u.isHero&&u.regenPassive) regen+=u.regenPassive;
    if(regen>0) u.hp=Math.min(u.maxHp,u.hp+regen*dt);
  }
  if(u.isHero&&!u.dying){u.mana=Math.min(u.maxMana,u.mana+3*dt);}
  if(u.role==='siege'&&u.moving) u.wheelRot+=(u.walkPhase%1)*0.3+dt*6;
  if(u.moving && !u.dying && !u._insideMine){
    u._stuckCheckTimer=(u._stuckCheckTimer||0)+dt;
    if(u._stuckCheckTimer>=1.2){
      var mdx=u.x-(u._lastStuckX||u.x),mdy=u.y-(u._lastStuckY||u.y);
      if(mdx*mdx+mdy*mdy<9){
        u.moveTo=null;u._stuckTimer=0;u._path=null;u._pathIdx=0;
        var escAng=Math.random()*TAU;
        u.x=this.clampX(u.x+Math.cos(escAng)*22);
        u.y=this.clampY(u.y+Math.sin(escAng)*22);
      }
      u._stuckCheckTimer=0;
      u._lastStuckX=u.x;u._lastStuckY=u.y;
    }
  }
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(this.stats[u.pid]) this.stats[u.pid].unitsLost++;
    var _la=u.lastAttacker;
    if(_la && typeof _la.pid!=='undefined' && _la.team!==u.team && this.stats[_la.pid]) this.stats[_la.pid].enemiesKilled++;
    if(u.isHero) Audio.sfx('hero_death',u.x,u.y);
    else Audio.sfx('death',u.x,u.y);
    this.decals.push(new Decal(u.x,u.y+4,u.radius*1.4));
    if(u.role!=='fly'&&u.role!=='worker'&&!u._isSummon){var vx=(Math.random()-0.5)*80,vy=-60-Math.random()*60;this.weapons.push(new WeaponDrop(u.x+(Math.random()-0.5)*20,u.y-10,u.role,u.race,u.team,vx,vy));}
    if(u.isHero){
      if(u.owner==='player') this.notify(t_('heroDied'));
      this.deadHeroes[u.pid]={race:u.race,level:u.level,exp:u.exp,
        abilityLevels:JSON.parse(JSON.stringify(u.abilityLevels||{})),
        skillPoints:u.skillPoints||0,ultUnlocked:!!u.ultUnlocked};
      var la=u.lastAttacker;
      if(la&&typeof la.pid!=='undefined'&&la.team!==u.team&&this.teams[la.pid]){
        this.addRes(la.pid,BOUNTY_HERO,0);
        this.floaters.push(new Floater(u.x,u.y-65,'+'+BOUNTY_HERO,'#ffe066'));
        if(la.owner==='player') this.notify(t_('bountyHero'));
      }
    }
    return;
  }
  u.animT+=dt;
  if(u.hitFlash>0) u.hitFlash-=dt;
  if(u.atkCd>0) u.atkCd-=dt;
  if(u.attackT>0){u.attackT-=dt*3;if(u.attackT<0)u.attackT=0;}
  if(u.stunT>0){u.moving=false;return;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;
  var hasOrder=!!(u.attackMoveTo||u.patrolRoute);
  var isPlayerUnit=(u.pid===this.playerPid);
  if(u.stance!=='hold'&&!u.target){
    if(u.lastAttacker && !u.lastAttacker.dead && !u.lastAttacker.dying) u.target=u.lastAttacker;
  }
  if(u.stance!=='hold'&&!u.target){
    var isIdleWorker=u.role==='worker'&&!u.gatherTarget&&!u.buildTarget&&!u.repairTarget&&!u.moveTo&&!u.carrying&&!hasOrder&&!u.demolishTarget&&!u._waitingForMine&&!u._insideMine;
    var isIdleCombat=u.role!=='worker'&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder;
    if(isIdleCombat){
      if(u.role==='heal'){
        var low=null,ratio=0.95;
        for(var hi=0;hi<this.units.length;hi++){
          var hu=this.units[hi];
          if(hu.team!==u.team||hu.dying||hu.role==='worker') continue;
          if(hu===u) continue;
          var dd=(hu.x-u.x)*(hu.x-u.x)+(hu.y-u.y)*(hu.y-u.y);
          if(dd>(u.vision||320)*(u.vision||320)) continue;
          var r=hu.hp/hu.maxHp;
          if(r<ratio){ratio=r;low=hu;}
        }
        if(low&&ratio<0.95){u.target=low;}
      } else {
        var e=this.findEnemy(u,u.vision||280);
        if(e) u.target=e;
        else{var c=this.findNearestCreep(u,u.vision||280);if(c) u.target=c;}
      }
    } else if(isIdleWorker&&!isPlayerUnit){
      var ew=this.findEnemy(u,u.vision||220);
      if(ew) u.target=ew;
    }
  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;
    if(dxh*dxh+dyh*dyh>40000) u.moveTo={x:u.originX,y:u.originY};
  }
  u.moving=false;
  if(u.role==='worker'){
    if(u.moveTo){
      u.gatherTarget=null;u.repairTarget=null;u.buildTarget=null;u.demolishTarget=null;
      u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
      this.doMove(u,dt);
      if(u.moving) u.walkPhase+=dt*10;
      return;
    }
    if(u.demolishTarget&&!u.demolishTarget.dead){this.doDemolish(u,dt);if(u.moving) u.walkPhase+=dt*10;return;}
    if(u.repairTarget&&!u.repairTarget.dead) this.doRepair(u,dt);
    else if(u.buildTarget&&!u.buildTarget.dead) this.doBuild(u,dt);
    else if(u.target&&!isPlayerUnit) this.doAttack(u,dt);
    else if(u.carrying&&u.carryAmt>=10) this.returnRes(u,dt);
    else if(u.gatherTarget&&!u.gatherTarget.dead){
      if(u.gatherTarget.amount<=0||u.gatherTarget.falling){
        u.gatherTarget=null;u._waitingForMine=false;
        if(u._assignedMine&&!u._assignedMine.dead&&u._assignedMine.amount>0&&!u._assignedMine.falling){
          u.gatherTarget=u._assignedMine;
        } else if(!u._assignedMine){
          var nr=this.findNearestResource(u.x,u.y,'tree',u.pid);
          if(nr) u.gatherTarget=nr;
        }
      } else this.doGather(u,dt);
    }
    else if(hasOrder) this.doAttackMove(u,dt);
    if(u.moving) u.walkPhase+=dt*10;
    return;
  }
  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);
  else if(hasOrder) this.doAttackMove(u,dt);
  if(u.moving) u.walkPhase+=dt*10;
};

Game.prototype.doMove=function(u,dt){
  if(u.role!=='worker'&&!u.target&&u.atkCd<=0&&u.stance!=='hold'){
    var nearE=this.findEnemy(u,u.range+30);
    if(nearE){u.atkCd=u.cdBase;u.attackT=1;this.performAttack(u,nearE);}
  }
  if(u.role==='worker'){
    if(u._insideMine){u._insideMine=false;u._mineSlot=-1;}
    if(u._waitingForMine) u._waitingForMine=false;
    if(u._assignedMine){
      var dAm=Math.hypot(u._assignedMine.x-u.moveTo.x, u._assignedMine.y-u.moveTo.y);
      if(dAm>60) u._assignedMine=null;
    }
  }
  if(!u.moveTo){ u._path=null; return; }
  var dxGoal=u.moveTo.x-u.x, dyGoal=u.moveTo.y-u.y;
  var dGoal=Math.hypot(dxGoal,dyGoal);
  if(dGoal<12){ u.moveTo=null; u._path=null; u._pathIdx=0; return; }
  if(!u._path){
    var nowT=this.time;
    if(u._pathFailT && nowT-u._pathFailT<0.5){ u._stuckTimer=0; }
    else {
      var path=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path&&path.length>0){ u._path=path; u._pathIdx=0; u._pathFailT=0; }
      else { u._path=null; u._pathFailT=nowT; }
    }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];
    var dxT=t.x-u.x, dyT=t.y-u.y, dT=Math.hypot(dxT,dyT);
    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){ u._path=null; u._pathIdx=0; u.moveTo=null; return; }
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y; dT=Math.hypot(dxT,dyT);
    }
    var spd=u.spd*(u.slowMul||1)*dt;
    var moved=this._smartMove(u,dxT,dyT,spd);
    if(!moved){
      u._stuckTimer=(u._stuckTimer||0)+dt;
      if(u._stuckTimer>0.8){
        u._stuckTimer=0;
        u._path=null;u._pathIdx=0;
        this.navDirty=true;
      }
    } else u._stuckTimer=0;
    if(Math.abs(dxT)>Math.abs(dyT)) u.dir=dxT>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dyT>=0?DIR.DOWN:DIR.UP;
    u.moving=true;
    this.separate(u);
    return;
  }
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  var spd2=u.spd*(u.slowMul||1)*dt;
  var moved2=this._smartMove(u,dx,dy,spd2);
  if(!moved2){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>0.8){
      u._stuckTimer=0;
      this.navDirty=true;
      var path2=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path2&&path2.length>0){ u._path=path2; u._pathIdx=0; }
      else { u.moveTo=null; }
    }
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  if(!u._path){
    var path=this.findPath(u.x,u.y,dest.x,dest.y);
    if(path&&path.length>0){ u._path=path; u._pathIdx=0; }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];
    var dxT=t.x-u.x, dyT=t.y-u.y, dT=Math.hypot(dxT,dyT);
    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){u._path=null;u._pathIdx=0;}
    }
    if(u._path){
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y;
    }
  }
  var spd=u.spd*(u.slowMul||1)*dt;
  var moved=this._smartMove(u,dx,dy,spd);
  if(!moved){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>1.5){u.attackMoveTo=null;u.patrolRoute=null;u._stuckTimer=0;u._path=null;u._pathIdx=0;return;}
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.updateCreep=function(c,dt){
  if(c.stunT>0) c.stunT-=dt;
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;this.spawnParticles(c.x,c.y,'#8a3020',12);
    if(c.lastAttacker){
      var reward=c.goldReward;if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.pid!=='undefined'&&this.teams[c.lastAttacker.pid]){
        this.addRes(c.lastAttacker.pid,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(this.stats[c.lastAttacker.pid]) this.stats[c.lastAttacker.pid].creepsKilled++;
        if(c.isBoss&&c.lastAttacker.owner==='player') this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.pid!=='undefined'){for(var i=0;i<this.units.length;i++){var h=this.units[i];if(h.isHero&&h.pid===c.lastAttacker.pid&&!h.dying){if(Math.hypot(h.x-c.x,h.y-c.y)<400){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}}}}
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0) c.hitFlash-=dt;if(c.atkCd>0) c.atkCd-=dt;if(c.attackT>0) c.attackT-=dt*3;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=180*180;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);if(d2<bd){bd=d2;best=u;}}
    if(best) c.target=best;
  }
  c.moving=false;
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){
      var nx=c.x+dx/d*c.spd*dt, ny=c.y+dy/d*c.spd*dt;
      if(!this._wouldHitBuilding(nx,ny,c.radius)){c.x=nx;c.y=ny;}
      else{
        var ang3=Math.atan2(dy,dx)+Math.PI/2;
        var sx2=c.x+Math.cos(ang3)*c.spd*dt, sy2=c.y+Math.sin(ang3)*c.spd*dt;
        if(!this._wouldHitBuilding(sx2,sy2,c.radius)){c.x=sx2;c.y=sy2;}
      }
      c.moving=true;c.walkPhase+=dt*8;
    }
    else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      c.target.hp-=c.dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+c.dmg,'#ff6060'));
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){c.wanderT=2+Math.random()*3;var a=Math.random()*TAU,r=40+Math.random()*100;c.wanderTarget={x:c.homeX+Math.cos(a)*r,y:c.homeY+Math.sin(a)*r};}
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){c.x+=dxw/dw*c.spd*0.4*dt;c.y+=dyw/dw*c.spd*0.4*dt;c.walkPhase+=dt*6;c.moving=true;}
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=hero.maxHp;hero.dmg+=5;hero.skillPoints++;
    if(hero.isHero){hero.maxMana=100+20*(hero.level-1);hero.mana=hero.maxMana;}
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup',hero.x,hero.y);
    if(hero.level>=6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+(u.role==='heal'?40:8);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*(u.slowMul||1)*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    var moved=this._smartMove(u,dx,dy,spd);
    if(moved){u.moving=true;this.separate(u);}
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.pid,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.pid,t.role);dmg=dmg*(1-0.08*upD.a);}
  if(t.isUnit && t.armor && t.armor<1) dmg=dmg*t.armor;
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  if(t.isBuilding&&!t.completed) dmg*=3;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    var projKind=(a.role==='siege')?'stone':(a.role==='fly')?'magic':'arrow';
    var projColor=(a.race==='luminite')?'#ffe9a8':(a.race==='gromborn')?'#ff8040':'#a0ff80';
    this.projectiles.push(new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,a.pid,projColor,a.race,projKind));
    if(a.role==='siege') Audio.sfx('stone_throw',a.x,a.y);
    else if(a.role==='fly') Audio.sfx('fairy_magic',a.x,a.y);
    else if(a.race==='luminite') Audio.sfx('crossbow',a.x,a.y);
    else Audio.sfx('arrow',a.x,a.y);
    if(a.isHero) t.lastAttacker=a;
    return;
  }
  if(a.role==='heal'){
    if(t.team===a.team){
      var healAmt=dmg*4;
      t.hp=Math.min(t.maxHp,t.hp+healAmt);
      var healColor=(a.race==='luminite')?'#ffe9a8':(a.race==='gromborn')?'#a0ff80':'#80ffd0';
      for(var hli=0;hli<8;hli++){
        var ht=hli/8;
        var hx=a.x+(t.x-a.x)*ht;
        var hy=a.y-20+(t.y-a.y)*ht;
        this.particles.spawn(hx,hy,(Math.random()-0.5)*15,(Math.random()-0.5)*15-10,0.6,healColor,3);
      }
      for(var hli2=0;hli2<6;hli2++){
        var ha2=Math.random()*TAU,hs=30+Math.random()*40;
        this.particles.spawn(t.x,t.y-15,Math.cos(ha2)*hs,Math.sin(ha2)*hs-20,0.7,healColor,2.5);
      }
      this.floaters.push(new Floater(t.x,t.y-30,'+'+Math.round(healAmt),healColor));
      Audio.sfx('heal_cast',a.x,a.y);
    }
    return;
  }
  if(a.role==='spear') Audio.sfx('spear_thrust',a.x,a.y);
  else Audio.sfx('sword',a.x,a.y);
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  if(t.isBuilding) Audio.sfx('building_hit',t.x,t.y);
  if(t.isUnit||t.isCreep){
    var ang=Math.atan2(t.y-a.y,t.x-a.x),kb=a.isHero?9:5;
    t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  }
  if(a.race==='luminite'){
    for(var lp=0;lp<5;lp++){
      var la=Math.random()*TAU,ls=50+Math.random()*80;
      this.particles.spawn(t.x,t.y-10,Math.cos(la)*ls,Math.sin(la)*ls-20,0.5,'#ffe9a8',3);
    }

    for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;if(u.demolishTarget===b) u.demolishTarget=null;}
    return;
  }
  if(b.hitFlash>0) b.hitFlash-=dt;
  if(!b.completed) return;
  if(b.atk>0){b.atkCd-=dt;if(b.atkCd<=0){
    var e=this.findEnemy(b,b.rng);if(!e) e=this.findNearestCreep(b,b.rng);
    if(e){
      var canShoot=false;
      if(e.isCreep){canShoot=this.isVisibleForTeam(b.team,e.x,e.y);}
      else if(e.isUnit||e.isBuilding){canShoot=this.isVisibleForTeam(b.team,e.x,e.y);}
      if(canShoot&&this._hasLineOfSight(b.x,b.y,e.x,e.y)){b.atkCd=b.atkCdBase;b.lastAttacker=null;this.projectiles.push(new Projectile(b.x,b.y-25,e.x,e.y,b.atk,b.team,b.pid,'#ffe080',b.race,'arrow'));Audio.sfx('arrow',b.x,b.y);}
    }
  }}
  if(b.queue.length>0){
    var q=b.queue[0];q.timeLeft-=dt;
    if(q.timeLeft<=0){
      var race=RACES[q.race]||RACES[b.race],def=race&&race.units[q.role];
      if(def&&this.units.length<300){
        var res=this.getRes(b.pid);
        var foodCost=FOOD_COST[q.role]||1;
        var reserved=this.getReservedPop(b.pid)-foodCost;
        var canSpawn=(res.food+reserved+foodCost)<=res.maxFood;
        if(canSpawn){
          var spawnR=b.radius+70;
          var spawnAng=Math.random()*TAU;
          var sx=cl(b.x+Math.cos(spawnAng)*spawnR,30,this.W-30);
          var sy=cl(b.y+Math.sin(spawnAng)*spawnR,30,this.H-30);
          for(var attempt=0;attempt<6;attempt++){
            var tooClose=false;
            for(var bj=0;bj<this.buildings.length;bj++){
              var ob=this.buildings[bj];
              if(ob===b||ob.dead) continue;
              if(Math.hypot(ob.x-sx,ob.y-sy)<ob.radius+55){tooClose=true;break;}
            }
            if(!tooClose) break;
            spawnAng+=(attempt+1)*0.7;
            sx=cl(b.x+Math.cos(spawnAng)*spawnR,30,this.W-30);
            sy=cl(b.y+Math.sin(spawnAng)*spawnR,30,this.H-30);
          }
          var spawnRace=q.race||b.race;
          var u2=new Unit(sx,sy,b.team,def,spawnRace);
          u2.owner=b.owner;u2.pid=b.pid;u2.spawnT=0;
          u2.role=def.role;
          if(b.rallyPoint){
            var rj=38;
            u2.moveTo={
              x:b.rallyPoint.x+(Math.random()-0.5)*rj,
              y:b.rallyPoint.y+(Math.random()-0.5)*rj
            };
            u2._path=null;u2._pathIdx=0;
          }
          this.units.push(u2);
          if(this.stats[b.pid]) this.stats[b.pid].unitsCreated++;
          this.spawnParticles(sx,sy,'#ffe9a8',12);
          if(b.owner==='player'){this.notify(t_('trained')+' '+uName(spawnRace,q.role));Audio.sfx(q.role==='hero'?'hero':'unit_ready',b.x,b.y);}
          b.queue.shift();
        } else q.timeLeft=0.5;
      } else b.queue.shift();
    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.owner==='player'){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade',b.x,b.y);}}}
  if(b.techUpgrading){
    b.techUpgrading.timeLeft-=dt;
    if(b.techUpgrading.timeLeft<=0){
      var tr=b.techUpgrading.role,tst=b.techUpgrading.stat;
      var upg=this.getUnitUpgrades(b.pid,tr);
      if(upg[tst]<3) upg[tst]++;
      if(b.owner==='player'){this.notify(uName(b.race,tr)+' — '+t_(tst==='w'?'wUpg':'aUpg')+' ур.'+upg[tst]);Audio.sfx('upgrade',b.x,b.y);}
      b.techUpgrading=null;
    }
  }
  if(b.sawmillUpgrading){
    b.sawmillUpgradeTimeLeft-=dt;
    if(b.sawmillUpgradeTimeLeft<=0){
      b.sawmillUpgrading=false;
      b.sawmillLevel++;
      if(b.owner==='player'){this.notify('Лесопилка ур.'+b.sawmillLevel);Audio.sfx('sawmill_upgrade',b.x,b.y);}
    }
  }
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};
Game.prototype.findNearestResource=function(x,y,kind,pid){
  var best=null,bd=Infinity;
  var team=this.playerTeam;
  if(typeof pid==='number'){
    for(var s=0;s<this.config.slots.length;s++){
      if(s===pid){team=this.config.slots[s].team;break;}
    }
  }
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(!this.isExploredForTeam(team,r.x,r.y)) continue;
    if(kind&&r.kind!==kind) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);
    if(d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.findVisibleResourceForWorker=function(u,kind,radius){
  var best=null,bd=Infinity;
  var team=this.playerTeam;
  for(var s=0;s<this.config.slots.length;s++){
    if(s===u.pid){team=this.config.slots[s].team;break;}
  }
  radius=radius||900;
  var r2=radius*radius;
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(r.kind!==kind) continue;
    if(!this.isVisibleForTeam(team,r.x,r.y)) continue;
    var nearEnemyBase=false;
    for(var bi=0;bi<this.buildings.length;bi++){
      var b=this.buildings[bi];
      if(b.dead||b.team===team) continue;
      if(Math.hypot(b.x-r.x,b.y-r.y)<520){nearEnemyBase=true;break;}
    }
    if(nearEnemyBase) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-u.x)*(r.x-u.x)+(r.y-u.y)*(r.y-u.y);
    if(d<r2&&d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.separate=function(u){
  if(u._insideMine||u._waitingForMine) return;
  if(u._isSummon) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  var pushMul=(u.moving||u.target||u.moveTo)?1.0:0.35;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      if(o._insideMine) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.5*pushMul;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>4) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var minBD=u.radius+b.radius*1.12;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2);
      var pushB=(minBD-bd)*1.0+0.3;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      if(u.role==='worker'&&(u.gatherTarget||u._waitingForMine)) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.25:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};
Game.prototype.spawnParticles=function(x,y,color,n){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=40+Math.random()*100;this.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,0.4+Math.random()*0.3,color,2+Math.random()*3);}};

Game.prototype.stopSelected=function(){
  var count=0;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.sel&&u.pid===this.playerPid&&!u.dying){u.target=null;u.moveTo=null;u.attackMoveTo=null;u.patrolRoute=null;u.demolishTarget=null;u.moving=false;u._path=null;u._pathIdx=0;count++;}}
  return count;
};
Game.prototype.checkVictory=function(){
  var teams={};for(var i=0;i<this.config.slots.length;i++){var s=this.config.slots[i];if(s.type!=='empty') teams[s.team]=true;}
  var cnt=0;for(var k in teams) cnt++;if(cnt<2) return;
  var hasTH={};for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.kind==='townhall'&&!b.dead) hasTH[b.team]=true;}
  if(!hasTH[this.playerTeam]){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='lose';return;}
  var enemies=0;for(var k2 in teams){var t2=parseInt(k2);if(t2!==this.playerTeam&&hasTH[t2]) enemies++;}
  if(enemies===0){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='win';}
};

Game.prototype.castAbility=function(hero,abilId,forcedTarget){
  if(!hero.isHero||hero.dying) return;
  var list=hero.heroAbilities,ab=null,idx=-1;
  for(var i=0;i<list.length;i++) if(list[i].id===abilId){ab=list[i];idx=i;break;}
  if(!ab) return;
  var lvl=hero.abilityLevels[abilId]||0;
  if(lvl<=0||ab.type==='passive') return;
  if(ab.type==='ultimate'&&!hero.ultUnlocked) return;
  if(idx===0&&hero.cdA1>0) return;
  if(idx===1&&hero.cdA2>0) return;
  if(ab.type==='ultimate'&&hero.cdUlt>0) return;
  var cost=ab.mana||35;
  if((hero.mana||0)<cost){this.notify(t_('noMana'));Audio.sfx('error');return;}
  var cd=ab.cd*(1-0.1*lvl);
  function setCd(){if(ab.type==='ultimate') hero.cdUlt=ab.cd;else if(idx===0) hero.cdA1=cd;else if(idx===1) hero.cdA2=cd;}
  hero.mana-=cost;
  hero.castT=1;
  var self=this;
  function burst(x,y,color,n,spd,grav){
    for(var k=0;k<n;k++){
      var a=Math.random()*TAU,s=(spd||120)*(0.4+Math.random());

    }
  }
  if(abilId==='holy_strike'){
    hero.holyStrikeBuff=true;hero.holyStrikeT=8;setCd();
    this.floaters.push(new Floater(hero.x,hero.y-55,t_('e_holy'),'#ffe9a8'));
    burst(hero.x,hero.y-20,'#ffe9a8',36,150,60);

      this.particles.spawn(hero.x+Math.cos(ha)*hr,hero.y-20+Math.sin(ha)*hr,Math.cos(ha)*90,Math.sin(ha)*90-30,1.0,'#fff8d0',4);}
    Audio.sfx('abil_holy',hero.x,hero.y);
  }
  else if(abilId==='heal'){
    var tgt=forcedTarget;
    if(!tgt||tgt.team!==hero.team||tgt.dying){
      var low=null,ratio=1;
      for(var ii=0;ii<this.units.length;ii++){var uu=this.units[ii];if(uu.team!==hero.team||uu.dying) continue;if(Math.hypot(uu.x-hero.x,uu.y-hero.y)>ab.range) continue;var rt=uu.hp/uu.maxHp;if(rt<ratio){ratio=rt;low=uu;}}
      tgt=low;
    }
    if(tgt){
      var amt=80+40*lvl;tgt.hp=Math.min(tgt.maxHp,tgt.hp+amt);

        this.particles.spawn(hero.x,hero.y-20,Math.cos(ha2)*80,Math.sin(ha2)*80-60,0.7,'#c8ffc8',3);}
      burst(tgt.x,tgt.y-15,'#80ff80',24,140,60);
      setCd();Audio.sfx('abil_heal_lum',hero.x,hero.y);
    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}
  }
  else if(abilId==='divine_shield'){

    this.floaters.push(new Floater(hero.x,hero.y-55,'Щит','#ffe9a8'));
    burst(hero.x,hero.y-20,'#ffe9a8',48,180,80);
    for(var ds=0;ds<3;ds++){
      (function(ring){setTimeout(function(){
        for(var kk=0;kk<24;kk++){var a=(kk/24)*TAU;self.particles.spawn(hero.x+Math.cos(a)*12,hero.y-20+Math.sin(a)*12,Math.cos(a)*80,Math.sin(a)*80,0.6,'#fff8d0',3);}
      },ring*110);})(ds);
    }
    Audio.sfx('abil_shield',hero.x,hero.y);
  }
  else if(abilId==='rage'){
    hero.activeBuffT=5;hero.buffType='rage';setCd();
    this.floaters.push(new Floater(hero.x,hero.y-55,t_('e_rage'),'#ff5030'));
    burst(hero.x,hero.y-20,'#ff5030',28,170,50);
    Audio.sfx('abil_rage',hero.x,hero.y);
  }
  else if(abilId==='warcry'){
    for(var wi2=0;wi2<this.units.length;wi2++){var en=this.units[wi2];if(en.team===hero.team||en.dying) continue;if(Math.hypot(en.x-hero.x,en.y-hero.y)<ab.aoe){en.stunT=1.5;this.floaters.push(new Floater(en.x,en.y-25,'STUN','#ffff60'));}}

      for(var mi3=0;mi3<this.units.length;mi3++){var en2=this.units[mi3];if(en2.team===hero.team||en2.dying) continue;var d2=Math.hypot(en2.x-hero.x,en2.y-hero.y);if(d2*d2<bd){bd=d2*d2;bst=en2;}}

    if(bst){
      var dmg=60+40*lvl;

      for(var mk=0;mk<40;mk++){var ma=Math.random()*TAU,ms=120+Math.random()*120;
        this.particles.spawn(bst.x,bst.y-15,Math.cos(ma)*ms,Math.sin(ma)*ms-40,0.9,'#c8e8ff',3);}

    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}
  }
  else if(abilId==='entangle'){
    var bst2=forcedTarget;
    if(!bst2){
      var bd2=ab.range*ab.range;
      for(var ei2=0;ei2<this.units.length;ei2++){var en3=this.units[ei2];if(en3.team===hero.team||en3.dying) continue;var d3=Math.hypot(en3.x-hero.x,en3.y-hero.y);if(d3*d3<bd2){bd2=d3*d3;bst2=en3;}}
    }
    if(bst2){
      bst2.rootT=3;bst2.stunT=3;
      this.floaters.push(new Floater(bst2.x,bst2.y-25,'ROOT','#40a040'));
      for(var ek=0;ek<36;ek++){var ea=Math.random()*TAU,er=40+Math.random()*60;
        this.particles.spawn(bst2.x,bst2.y+6,Math.cos(ea)*er*0.5,Math.sin(ea)*er*0.5-40,1.0,'#40a040',3.5);}
      setCd();Audio.sfx('abil_entangle',hero.x,hero.y);
    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}

  else if(abilId==='forest_wrath'){

AIController.prototype.stageArmy=function(){

  var th=null;
  for(var i=0;i<g.buildings.length;i++){

  if(!th) return;
  var toCenter=Math.atan2(g.H/2-this.homeY,g.W/2-this.homeX);

  var sy=th.y-Math.sin(toCenter)*180;

  }
  var needStage=this.difficulty==='hard'?8:this.difficulty==='easy'?14:10;
  for(var k=0;k<g.units.length;k++){
    var un=g.units[k];

    if(un.target||un.attackMoveTo||un.patrolRoute) continue;
    if(un.moveTo){
      var dTm=Math.hypot(un.moveTo.x-sx,un.moveTo.y-sy);

    var target=this.pickFocusTarget(cx,cy,2200);

    for(var a=0;a<stagedUnits.length;a++){
      stagedUnits[a].target=target;
      stagedUnits[a].stance='aggressive';
      stagedUnits[a].moveTo=null;
      stagedUnits[a].attackMoveTo={x:target.x+(Math.random()-0.5)*80,y:target.y+(Math.random()-0.5)*80};

AIController.prototype.raidParty=function(){

UISys.prototype.drawPortrait=function(ent){
  var cv=this.$('portrait-canvas'),info=this.$('portrait-info');
  if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var bgGrad=ctx.createLinearGradient(0,0,0,cv.height);
  bgGrad.addColorStop(0,'#1a2438');bgGrad.addColorStop(1,'#050810');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cv.width,cv.height);
  if(!ent){info.innerHTML='<div class="pname">—</div>';return;}
  try{
    if(ent.isUnit){
      var sp=bakeUnit(ent.race,ent.role,ent.team,DIR.DOWN);
      var pad=14;
      var s=Math.min((cv.width-pad*2)/sp.width,(cv.height-pad*2)/sp.height);
      var dw=sp.width*s,dh=sp.height*s,dx=(cv.width-dw)/2,dy=(cv.height-dh)/2;
      var legDef=getLeg(ent.role);
      if(legDef&&ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'){
        var legW=legDef.w*s*0.9,legH=legDef.h*s*0.85,legSpread=legDef.spread*s*0.8;
        var legBottomY=dy+dh,legTopY=legBottomY-legH,pcx=cv.width/2;
        ctx.fillStyle='#3a2010';ctx.strokeStyle='#0a0504';ctx.lineWidth=Math.max(0.5,s*0.6);
        ctx.fillRect(pcx-legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx-legSpread-legW/2,legTopY,legW,legH);
        ctx.fillRect(pcx+legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx+legSpread-legW/2,legTopY,legW,legH);
      }
      if(ent.role==='siege'&&ent.race==='gromborn'){
        var btmY2=dy+dh*0.98;
        var wR2=12*s;
        var wheelY2=btmY2-wR2;
        var wheelX1b=cv.width/2-22*s, wheelX2b=cv.width/2+22*s;
        var drawIW=function(wx,wy,r){
          ctx.fillStyle='#2a2a2a';ctx.beginPath();ctx.arc(wx,wy,r,0,TAU);ctx.fill();
          ctx.strokeStyle='#0a0a0a';ctx.lineWidth=2.2*s;ctx.stroke();
          ctx.strokeStyle='#6a6a6a';ctx.lineWidth=1.6*s;
          for(var k=0;k<6;k++){var a=k/6*TAU;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx+Math.cos(a)*r*0.85,wy+Math.sin(a)*r*0.85);ctx.stroke();}
          ctx.fillStyle='#8a8a8a';ctx.beginPath();ctx.arc(wx,wy,r*0.3,0,TAU);ctx.fill();
          ctx.strokeStyle='#2a2a2a';ctx.lineWidth=1.2*s;ctx.stroke();
        };
        drawIW(wheelX1b,wheelY2,wR2);
        drawIW(wheelX2b,wheelY2,wR2);
      }
      ctx.drawImage(sp,dx,dy,dw,dh);
      if(ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'&&Renderer_){
        var tempU={role:ent.role,race:ent.race,isHero:ent.isHero,team:ent.team,walkPhase:0,walkOffset:0,moving:false,attackT:0,chopT:0,castT:0,animT:0,x:0,y:0};
        var pObj={x:cv.width/2,y:dy+dh};
        var hand=Renderer_._armsCtx(ctx,tempU,pObj,s,false,1);
        if(hand){
          ctx.save();ctx.translate(hand.x,hand.y);
          Renderer_._mainW(ctx,ent.role,ent.race,0,0,0,s);
          ctx.restore();
        }
      }
      var name=ent.isHero?('⭐ '+uName(ent.race,'hero')):uName(ent.race,ent.role);
      var extra=ent.isHero?(' Ур.'+ent.level):'';
      info.innerHTML='<div class="pname">'+name+extra+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    } else {
      var sp2=bakeBuilding(ent.race,ent.kind,ent.team);
      var s2=Math.min((cv.width-16)/sp2.width,(cv.height-16)/sp2.height);
      ctx.drawImage(sp2,(cv.width-sp2.width*s2)/2,(cv.height-sp2.height*s2)/2,sp2.width*s2,sp2.height*s2);
      info.innerHTML='<div class="pname">'+t_(ent.kind)+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    }
  }catch(e){ERR('drawPortrait',e);}
};

UISys.prototype.tryPlaceAt=function(x,y){

  if(res.wood<def.wood){g.notify(t_('nWood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.pid===g.playerPid&&u2.role==='worker'&&!u2.dying){w=u2;break;}}

  }

  var b=new Building(x,y,g.playerTeam,def,race);

  g.buildings.push(b);g.navDirty=true;
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.demolishTarget=null;w.carrying=null;w.carryAmt=0;w.target=null;w.gatherAnimT=0;w.attackMoveTo=null;w.patrolRoute=null;w._stuckTimer=0;w._insideMine=false;w._mineSlot=-1;w._waitingForMine=false;w._path=null;w._pathIdx=0;

UISys.prototype.queueUnit=function(b,role){

UISys.prototype.startForgeUpgrade=function(b,role,stat){
  var g=Game_;if(!g||!b||b.kind!=='forge') return;
  if(b.techUpgrading){g.notify(t_('forgeBusy'));return;}
  for(var fi=0;fi<g.buildings.length;fi++){
    var fb=g.buildings[fi];
    if(fb.dead||fb.pid!==g.playerPid||fb.kind!=='forge') continue;
    if(fb.techUpgrading){g.notify(t_('forgeBusy'));return;}
  }
  var up=g.getUnitUpgrades(g.playerPid,role);if(up[stat]>=3) return;
  var cost=UPGRADE_COST[up[stat]],res=g.getRes(g.playerPid);
  if(res.gold<cost.gold){g.notify(t_('nGold'));return;}
  if(res.wood<cost.wood){g.notify(t_('nWood'));return;}
  g.subRes(g.playerPid,cost.gold,cost.wood);
  var tTime=FORGE_UPG_TIME[up[stat]]||30;
  b.techUpgrading={role:role,stat:stat,timeLeft:tTime,timeTotal:tTime};
  Audio.sfx('click');
  this.renderActions(true);
};
UISys.prototype.resurrectHero=function(b){
  var g=Game_;if(!g||!b) return;
  if(g.units.some(function(u){return u.isHero&&u.pid===g.playerPid&&!u.dying;})){g.notify(t_('heroExists'));return;}
  var dh=g.deadHeroes?g.deadHeroes[g.playerPid]:null;
  if(!dh) return;
  var raceDef=RACES[dh.race];if(!raceDef) return;
  var hd=raceDef.units.hero;
  var res=g.getRes(g.playerPid);
  if(res.gold<hd.gold||res.wood<hd.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerPid,hd.gold,hd.wood);
  var sx=cl(b.x,30,g.W-30),sy=cl(b.y+b.radius+60,30,g.H-30);
  var u=new Unit(sx,sy,g.playerTeam,hd,dh.race);
  u.owner='player';u.pid=g.playerPid;u.spawnT=0;
  u.level=dh.level||1;u.exp=dh.exp||0;
  u.maxHp=hd.hp+70*(u.level-1);u.hp=u.maxHp;u.dmg=hd.dmg+5*(u.level-1);
  u.maxMana=100+20*(u.level-1);u.mana=u.maxMana;
  if(dh.abilityLevels) u.abilityLevels=JSON.parse(JSON.stringify(dh.abilityLevels));
  u.skillPoints=dh.skillPoints||0;u.ultUnlocked=!!dh.ultUnlocked;
  u.isHero=true;u._recalc();
  g.units.push(u);
  g.deadHeroes[g.playerPid]=null;
  g.spawnParticles(sx,sy,'#ffe9a8',24);
  g.floaters.push(new Floater(sx,sy-40,'Ур.'+u.level,'#ffe9a8'));
  Audio.sfx('hero');
  this.renderActions(true);
};

  if(!race) return;
  var rdef=RACES[race],thLvl=g.getTHLevel(g.playerPid),list=BUILDING_UNLOCK[thLvl]||BUILDING_UNLOCK[1];
  for(var k=0;k<list.length;k++){
    (function(kind){
      var def=rdef.buildings[kind];if(!def) return;
      var btip=t_(kind)+'\nЗолото: '+def.gold+' · Дерево: '+def.wood+'\nHP: '+def.hp+'\n'+t_('d_'+kind);
      self.addAction(box,buildingIconImg(race,kind),t_(kind),self.costStr(def.gold,def.wood),function(){self.startPlacement(kind);},false,false,btip);
    })(list[k]);
  }
  var back=document.createElement('button');
  back.className='act-btn';
  back.innerHTML='<div class="ico">'+toolIconImg('deselect')+'</div><div class="lbl">'+t_('back')+'</div>';

UISys.prototype.startPlacement=function(kind){
  if(!Game_) return;
  var g=Game_,race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&i===g.playerPid){race=s.race;break;}}
  if(!race) return;

  var res=g.getRes(g.playerPid);

  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  this._placingKind=kind;this._placingRace=race;
  this.$('place-name').textContent=t_(kind);

  cancel.onclick=function(){Audio.sfx('click');UI.cancelPlacement();};

UISys.prototype.cancelPlacement=function(){

UISys.prototype.updateWorldTip=function(){

    for(var k3 in g.stats){var st5=g.stats[k3];for(var f4 in sum2) sum2[f4]+=st5[f4]||0;}

  box.innerHTML=header+rows+'</tbody></table>';

UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerPid);
    this.$('h-gold').textContent=Math.floor(res.gold);
    this.$('h-wood').textContent=Math.floor(res.wood);
    var popText=res.food+'/'+res.maxFood;
    if(res.maxFood>=MAX_FOOD) popText+=' (макс)';
    this.$('h-pop').textContent=popText;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
    }
    this.updateQueuePanel();
    this._mmTimer=(this._mmTimer||0)+1;
    if(this._mmTimer>=2){this._mmTimer=0;this.drawMinimap();}
    this._infoTimer=(this._infoTimer||0)+1;
    if(this._infoTimer>=12){this._infoTimer=0;this.refreshInfoOnly();}
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var self=this;
      setTimeout(function(){
        var go=self.$('gameover');
        self.$('go-title').textContent=g.result==='win'?t_('victory'):t_('defeat');
        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        self._goTab='players';
        var tabs=document.querySelectorAll('.go-tab');
        for(var _ti=0;_ti<tabs.length;_ti++){tabs[_ti].classList.toggle('active',tabs[_ti].dataset.tab==='players');}
        self.renderGameOverStats();
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
      },1200);
      g.shake=2;
    }
  }catch(e){ERR('UI.update',e);}
};
UISys.prototype.updateQueuePanel=function(){
  if(!Game_) return;
  var g=Game_,selB=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.sel&&b.pid===g.playerPid&&b.queue.length>0) selB.push(b);}
  var panel=this.$('queue-panel'),list=this.$('queue-list');
  if(!selB.length){panel.classList.remove('show');return;}
  panel.classList.add('show');
  var b=selB[0];
  if(list.childElementCount!==b.queue.length){
    list.innerHTML='';
    for(var qi=0;qi<b.queue.length;qi++){
      var q=b.queue[qi];
      var item=document.createElement('div');item.className='q-item';
      var nm=document.createElement('div');nm.className='q-name';nm.style.display='flex';nm.style.alignItems='center';nm.style.gap='4px';
      nm.innerHTML=unitIconImg(b.race,q.role)+'<span>'+(q.role==='hero'?uName(b.race,'hero'):uName(b.race,q.role))+'</span>';
      var bar=document.createElement('div');bar.className='q-bar-bg';
      var fill=document.createElement('div');fill.className='q-bar-fill';fill.style.width='0%';
      bar.appendChild(fill);
      var wrap=document.createElement('div');wrap.style.flex='1';wrap.appendChild(nm);wrap.appendChild(bar);
      item.appendChild(wrap);
      var tm=document.createElement('div');tm.className='q-time';tm.textContent=Math.ceil(q.timeLeft)+'с';
      item.appendChild(tm);
      list.appendChild(item);
    }
  }
  var items=list.children;
  for(var qi2=0;qi2<Math.min(items.length,b.queue.length);qi2++){
    var q2=b.queue[qi2],it=items[qi2];
    var fillEl=it.querySelector('.q-bar-fill');
    if(fillEl){var pct=Math.max(0,Math.min(100,(1-q2.timeLeft/q2.timeTotal)*100));fillEl.style.width=pct+'%';}
    var tmEl=it.querySelector('.q-time');
    if(tmEl) tmEl.textContent=Math.max(0,Math.ceil(q2.timeLeft))+'с';
  }
};
UISys.prototype.pushNotif=function(text){
  var el=document.createElement('div');el.className='notif';el.textContent=text;
  this.$('notifications').appendChild(el);
  setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},3200);
};
UISys.prototype.drawMinimap=function(){
  var g=Game_;if(!g||!Renderer_) return;
  var cv=this.$('minimap'),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height,sx=W/g.W,sy=H/g.H;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
  var cs=g.fogCellSize,i,j;
  for(i=0;i<g.fogCols;i++) for(j=0;j<g.fogRows;j++){var f=g.fog[i+j*g.fogCols];if(f===2) continue;ctx.fillStyle=f===1?'rgba(0,0,0,0.55)':'rgba(0,0,0,0.92)';ctx.fillRect(i*cs*sx,j*cs*sy,cs*sx+0.5,cs*sy+0.5);}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||!g.isExplored(r.x,r.y)) continue;ctx.fillStyle=r.kind==='gold'?'#ffe066':'#2d5a2d';var sz=r.kind==='gold'?5:3;ctx.fillRect(r.x*sx-sz/2,r.y*sy-sz/2,sz,sz);}
  for(i=0;i<g.creeps.length;i++){var c=g.creeps[i];if(c.dead||!g.isExplored(c.x,c.y)) continue;ctx.fillStyle=c.isBoss?'#ff6060':'#8a3030';ctx.fillRect(c.x*sx-2,c.y*sy-2,4,4);}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.dead) continue;
    var visB=(b.pid===g.playerPid)||(b.team===g.playerTeam)||g.isVisible(b.x,b.y);
    if(!visB) continue;
    ctx.fillStyle=b.completed?teamColor(b.team):'#a08040';ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);}
  for(i=0;i<g.units.length;i++){var u=g.units[i];if(u.dead||u.dying) continue;
    var visU=(u.pid===g.playerPid)||(u.team===g.playerTeam)||g.isVisible(u.x,u.y);
    if(!visU) continue;
    ctx.fillStyle=u.isHero?'#ffe9a8':teamColor(u.team);var s2=u.isHero?5:3;ctx.fillRect(u.x*sx-s2/2,u.y*sy-s2/2,s2,s2);}
  var cam=g.camera,vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy,vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;
  ctx.strokeStyle='#e6c67a';ctx.lineWidth=2;ctx.strokeRect(vx,vy,vw,vh);
};
function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  if(!isFinite(dt)||dt<0) dt=0.016;
  dt=Math.min(0.1,dt);
  lastT=now;
  try{
    if(Game_&&!Game_.paused){
      Input.updateCamera(dt);
      Game_.update(dt);
      if(Game_.camera) Audio.setEar(Game_.camera.x,Game_.camera.y,Game_.camera.zoom);
    }
  }catch(e){ERR('update',e);}
  try{if(Renderer_&&Game_) Renderer_.draw();}catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  try{if(Game_&&UI) UI.updateWorldTip();}catch(e){ERR('tip',e);}
  requestAnimationFrame(loop);
}
function boot(){
  try{
    UI=new UISys();
    UI.applyLangUI();
    Input.init(document.getElementById('game'));
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){Audio.pauseAll();}
      else{Audio.resume();lastT=0;}
    });
    window.addEventListener('blur',function(){Audio.pauseAll();});
    window.addEventListener('focus',function(){Audio.resume();lastT=0;});
    UI.showScreen('menu');
    requestAnimationFrame(loop);
  }catch(e){ERR('boot',e);showError('Load: '+e.message);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
