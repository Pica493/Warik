    var skip=false;

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){
  var th=new Building(x,y,team,race.buildings.townhall,race.id);th.owner=owner;th.pid=pid;this.buildings.push(th);
  var toCenter=Math.atan2(this.H/2-y,this.W/2-x);
  var gx=x+Math.cos(toCenter)*360,gy=y+Math.sin(toCenter)*360;
  gx=cl(gx,80,this.W-80);gy=cl(gy,80,this.H-80);
  var attempts=0;
  while(attempts<12){
    var tooClose=false;
    for(var rr=0;rr<this.resources.length;rr++){
      var r0=this.resources[rr];
      if(r0.kind!=='gold') continue;
      if(Math.hypot(r0.x-gx,r0.y-gy)<420){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;
    gx=cl(gx+Math.cos(wa)*160,80,this.W-80);
    gy=cl(gy+Math.sin(wa)*160,80,this.H-80);
    attempts++;
  }
  var anyMineNear=false;
  for(var rr2=0;rr2<this.resources.length;rr2++){
    var r02=this.resources[rr2];
    if(r02.kind!=='gold') continue;
    if(Math.hypot(r02.x-gx,r02.y-gy)<280){anyMineNear=true;break;}
  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=320+((i%2)*50);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);
    this._tryPlaceTree(tx,ty);
  }
  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j],r2=380;
    var tx2=x+Math.cos(a2)*r2,ty2=y+Math.sin(a2)*r2;
    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);
    this._tryPlaceTree(tx2,ty2);
  }
  for(var wi=0;wi<3;wi++){
    var aw=(wi/3)*TAU+0.5;
    var wx=x+Math.cos(aw)*200, wy=y+Math.sin(aw)*200;
    var tries=0;
    while(tries<10){
      var hit=false;
      for(var bi=0;bi<this.buildings.length;bi++){var bb=this.buildings[bi];if(Math.hypot(bb.x-wx,bb.y-wy)<bb.radius+34){hit=true;break;}}
      if(!hit) for(var ri2=0;ri2<this.resources.length;ri2++){var rr=this.resources[ri2];if(Math.hypot(rr.x-wx,rr.y-wy)<rr.radius+34){hit=true;break;}}
      if(!hit) break;

    }
    var u=new Unit(wx,wy,team,race.units.worker,race.id);
    u.owner=owner;u.pid=pid;u.spawnT=0;this.units.push(u);
  }
};

  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(!b.completed||b.dead) continue;
    if(b.kind==='forge'){var r=b.radius+260;for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.dead||u.team!==b.team||u.role==='worker') continue;if((u.x-b.x)*(u.x-b.x)+(u.y-b.y)*(u.y-b.y)<r*r) this.auraCache.dmg[u.id]=true;}}
    if(b.kind==='magic'){var r2=b.radius+260;for(var ui2=0;ui2<this.units.length;ui2++){var u2=this.units[ui2];if(u2.dead||u2.team!==b.team||u2.role==='worker') continue;if((u2.x-b.x)*(u2.x-b.x)+(u2.y-b.y)*(u2.y-b.y)<r2*r2) this.auraCache.hp[u2.id]=true;}}
  }
  for(var i=0;i<this.units.length;i++){
    var h=this.units[i];if(!h.isHero||h.dying) continue;
    if(h.abilityLevels['blessing']){
      for(var j=0;j<this.units.length;j++){
        var a=this.units[j];
        if(a.dead||a.team!==h.team||a.role==='worker') continue;
        if((a.x-h.x)*(a.x-h.x)+(a.y-h.y)*(a.y-h.y)<180*180) this.auraCache.blessing[a.id]=true;
      }
    }
  }
};
function compactArr(arr){var w=0;for(var i=0;i<arr.length;i++){if(!arr[i].dead){arr[w++]=arr[i];}}arr.length=w;}

Game.prototype.update=function(dt){
  if(this.gameOver||this.paused) return;
  this.time+=dt;this._lastDt=dt;
  if(this.shake>0) this.shake-=dt*3;
  this.buildSpatialGrid();
  this.auraTimer-=dt;if(this.auraTimer<=0){this.auraTimer=1.5;this.updateAuras();}
  this.updateWeather(dt);
  var i;
  for(i=0;i<this.units.length;i++){try{if(!this.units[i].dead) this.updateUnit(this.units[i],dt);}catch(e){ERR('updateUnit',e);}}
  for(i=0;i<this.creeps.length;i++){try{if(!this.creeps[i].dead) this.updateCreep(this.creeps[i],dt);}catch(e){ERR('updateCreep',e);}}
  for(i=0;i<this.buildings.length;i++){try{if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);}catch(e){ERR('updateBuilding',e);}}
  for(i=0;i<this.resources.length;i++){var r=this.resources[i];if(r.dead) continue;if(r.falling){r.fallT+=dt;r.fallAngle=Math.min(Math.PI/2,r.fallT*(Math.PI/2/0.6));if(r.fallT>1.5) r.dead=true;}}
  for(i=0;i<this.projectiles.length;i++){var p=this.projectiles[i];if(p.dead) continue;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){
  var wx=this.biomeData.weather;if(wx==='none') return;
  this.weatherTimer-=dt;
  if(this.weatherTimer<=0){
    this.weatherTimer=0.14;
    var baseCnt=wx==='snow'?2:wx==='sand'?2:1;
    var vw=Renderer_?Renderer_.w/this.camera.zoom:1200;
    var vh=Renderer_?Renderer_.h/this.camera.zoom:800;
    var areaScale=Math.sqrt((vw*vh)/(1200*800));
    var cnt=Math.max(1,Math.round(baseCnt*areaScale));
    for(var i=0;i<cnt;i++){
      var cam=this.camera;
      var w=(Renderer_)?Renderer_.w/cam.zoom:1200,h=(Renderer_)?Renderer_.h/cam.zoom:800;
      var x=cam.x-w/2+Math.random()*w,y=cam.y-h/2-Math.random()*200;
      if(wx==='snow') this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*30,vy:60+Math.random()*40,life:4,kind:'snow',size:2+Math.random()*2});
      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});
      else this.weather.push({x:x,y:y,vx:(Math.random()-0.5)*20,vy:5+Math.random()*5,life:6,kind:'fog',size:60+Math.random()*60});
    }
  }
  for(var i2=this.weather.length-1;i2>=0;i2--){var w2=this.weather[i2];w2.x+=w2.vx*dt;w2.y+=w2.vy*dt;w2.life-=dt;if(w2.life<=0) this.weather.splice(i2,1);}
};

/* ========== ПАТЧ 1: выталкивание юнитов из зданий ========== */
Game.prototype.ejectFromBuildings=function(u){
  if(u._insideMine||u._isSummon||u._waitingForMine) return;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.dead||b.dying) continue;
    var dx=u.x-b.x,dy=u.y-b.y;
    var minD=u.radius+b.radius*0.98;
    var d2=dx*dx+dy*dy;
    if(d2<minD*minD){
      var d=Math.sqrt(d2);
      if(d<0.01){dx=1;dy=0;d=1;}
      u.x=this.clampX(b.x+dx/d*minD);
      u.y=this.clampY(b.y+dy/d*minD);
    }
  }
};

Game.prototype._wouldHitBuilding=function(x,y,radius,ignore){
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];if(b.dead||b.dying) continue;
    if(b===ignore) continue;
    var dx=x-b.x,dy=y-b.y,minD=radius+b.radius*1.05;
    if(dx*dx+dy*dy<minD*minD) return b;
  }
  return null;
};

/* ========== ПАТЧ 1: круговой поиск обхода зданий ========== */
Game.prototype._smartMove=function(u,dx,dy,spd){
  var d=Math.hypot(dx,dy);if(d<0.01) return false;
  var nx=u.x+dx/d*spd,ny=u.y+dy/d*spd;
  if(!this._wouldHitBuilding(nx,ny,u.radius)){
    u.x=this.clampX(nx);u.y=this.clampY(ny);return true;
  }
  var nx1=u.x+dx/d*spd,ny1=u.y;
  if(!this._wouldHitBuilding(nx1,ny1,u.radius)){u.x=this.clampX(nx1);return true;}
  var nx2=u.x,ny2=u.y+dy/d*spd;
  if(!this._wouldHitBuilding(nx2,ny2,u.radius)){u.y=this.clampY(ny2);return true;}
  var perp=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
  var sx=u.x+Math.cos(perp)*side*spd,sy=u.y+Math.sin(perp)*side*spd;
  if(!this._wouldHitBuilding(sx,sy,u.radius)){u.x=this.clampX(sx);u.y=this.clampY(sy);return true;}
  var baseAng=Math.atan2(dy,dx);
  for(var step=0.26;step<Math.PI;step+=0.26){
    var a1=baseAng+step;
    var sx1=u.x+Math.cos(a1)*spd,sy1=u.y+Math.sin(a1)*spd;
    if(!this._wouldHitBuilding(sx1,sy1,u.radius)){u.x=this.clampX(sx1);u.y=this.clampY(sy1);return true;}
    var a2=baseAng-step;
    var sx2=u.x+Math.cos(a2)*spd,sy2=u.y+Math.sin(a2)*spd;
    if(!this._wouldHitBuilding(sx2,sy2,u.radius)){u.x=this.clampX(sx2);u.y=this.clampY(sy2);return true;}
  }
  return false;
};

/* ========== ПАТЧ 1: выталкивание из зданий ========== */
Game.prototype.updateUnit=function(u,dt){
  if(!u.dying) this.ejectFromBuildings(u);
  if(u.spawnT>0) u.spawnT-=dt;
  if(u.stunT>0) u.stunT-=dt;
  if(u.invulT>0) u.invulT-=dt;
  if(u.rootT>0) u.rootT-=dt;
  if(u.cdA1>0) u.cdA1-=dt;
  if(u.cdA2>0) u.cdA2-=dt;
  if(u.cdUlt>0) u.cdUlt-=dt;
  if(u.castT>0) u.castT-=dt*2;
  if(u.chopT>0) u.chopT-=dt*1.5;
  if(u.activeBuffT>0) u.activeBuffT-=dt;
  if(u.holyStrikeT>0){u.holyStrikeT-=dt;if(u.holyStrikeT<=0&&u.holyStrikeBuff){u.holyStrikeBuff=false;}}
  if(u.isHero&&u.regenPassive&&!u.dying) u.hp=Math.min(u.maxHp,u.hp+u.regenPassive*dt);
  if(u.moving && !u.dying && !u._insideMine){
    u._stuckCheckTimer=(u._stuckCheckTimer||0)+dt;
    if(u._stuckCheckTimer>=1.2){
      var mdx=u.x-(u._lastStuckX||u.x),mdy=u.y-(u._lastStuckY||u.y);
      if(mdx*mdx+mdy*mdy<9){
        u.moveTo=null;u._stuckTimer=0;
        var escAng=Math.random()*TAU;
        u.x=this.clampX(u.x+Math.cos(escAng)*22);
        u.y=this.clampY(u.y+Math.sin(escAng)*22);
      }
      u._stuckCheckTimer=0;
      u._lastStuckX=u.x;u._lastStuckY=u.y;
    }
  }
  if(u.dying){u.deathT+=dt;if(u.deathT>1.6){u.dead=true;this.decals.push(new Decal(u.x,u.y+6,u.radius*1.6));}return;}
  if(u.hp<=0){
    u.dying=true;u.deathT=0;u.deathDir=(u.dir===DIR.LEFT)?-1:1;
    this.spawnParticles(u.x,u.y,'#8a1010',10);
    if(u.owner==='player') Audio.sfx('death');
    this.decals.push(new Decal(u.x,u.y+4,u.radius*1.4));
    if(u.role!=='fly'&&u.role!=='worker'&&!u._isSummon){var vx=(Math.random()-0.5)*80,vy=-60-Math.random()*60;this.weapons.push(new WeaponDrop(u.x+(Math.random()-0.5)*20,u.y-10,u.role,u.race,u.team,vx,vy));}
    if(u.isHero){
      if(u.owner==='player') this.notify(t_('heroDied'));
      this.deadHeroes[u.pid]={race:u.race,level:u.level,exp:u.exp,
        abilityLevels:JSON.parse(JSON.stringify(u.abilityLevels||{})),
        skillPoints:u.skillPoints||0,ultUnlocked:!!u.ultUnlocked};
      var la=u.lastAttacker;
      if(la&&typeof la.pid!=='undefined'&&la.team!==u.team&&this.teams[la.pid]){
        this.addRes(la.pid,BOUNTY_HERO,0);
        this.floaters.push(new Floater(u.x,u.y-65,'+'+BOUNTY_HERO,'#ffe066'));
        if(la.owner==='player') this.notify(t_('bountyHero'));
      }
    }
    return;
  }
  u.animT+=dt;if(u.hitFlash>0) u.hitFlash-=dt;if(u.atkCd>0) u.atkCd-=dt;if(u.attackT>0) u.attackT-=dt*3;
  if(u.stunT>0){u.moving=false;return;}
  if(u.target&&(u.target.dead||u.target.hp<=0)) u.target=null;
  var hasOrder=!!(u.attackMoveTo||u.patrolRoute);
  var isIdleWorker=u.role==='worker'&&!u.gatherTarget&&!u.buildTarget&&!u.repairTarget&&!u.moveTo&&!u.carrying&&!hasOrder&&!u.demolishTarget&&!u._waitingForMine;
  var shouldSearch=((u.role!=='worker'&&!u.target&&!u.moveTo&&!u.buildTarget&&!u.gatherTarget&&!hasOrder))||isIdleWorker;
  if(shouldSearch&&!u.target){
    var sr=u.role==='worker'?90:(u.range>120?320:200);
    var e=this.findEnemy(u,sr);
    if(e) u.target=e;
    else {var c=this.findNearestCreep(u,sr);if(c) u.target=c;}
  }
  if(u.stance==='hold'&&!u.target&&!u.gatherTarget&&!u.buildTarget&&!u.moveTo&&!u.repairTarget&&!hasOrder&&!u.demolishTarget){
    var dxh=u.originX-u.x,dyh=u.originY-u.y;
    if(dxh*dxh+dyh*dyh>40000) u.moveTo={x:u.originX,y:u.originY};
  }
  u.moving=false;
  /* ========== ПАТЧ 3: приоритет moveTo, сброс статуса шахты ========== */
  if(u.role==='worker'){
    if(u.moveTo){
      u.gatherTarget=null;
      u.repairTarget=null;
      u.buildTarget=null;
      u.demolishTarget=null;
      u._insideMine=false;
      u._mineSlot=-1;
      u._waitingForMine=false;
      this.doMove(u,dt);
      if(u.moving) u.walkPhase+=dt*10;
      return;
    }
    if(u.demolishTarget&&!u.demolishTarget.dead){this.doDemolish(u,dt);if(u.moving) u.walkPhase+=dt*10;return;}
    if(u.repairTarget&&!u.repairTarget.dead) this.doRepair(u,dt);
    else if(u.buildTarget&&!u.buildTarget.dead) this.doBuild(u,dt);
    else if(u.target) this.doAttack(u,dt);
    else if(u.carrying&&u.carryAmt>=10) this.returnRes(u,dt);
    else if(u.gatherTarget&&!u.gatherTarget.dead){
      if(u.gatherTarget.amount<=0||u.gatherTarget.falling){
        u.gatherTarget=null;
        u._waitingForMine=false;
        /* ПАТЧ 9: сразу ищем следующий ресурс */
        var nr=this.findNearestResource(u.x,u.y,'tree');
        if(!nr) nr=this.findNearestResource(u.x,u.y,'gold');
        if(nr) u.gatherTarget=nr;
      } else this.doGather(u,dt);
    }
    else if(hasOrder) this.doAttackMove(u,dt);
    if(u.moving) u.walkPhase+=dt*10;
    return;
  }
  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);
  else if(u.gatherTarget) this.doGather(u,dt);
  else if(u.buildTarget) this.doBuild(u,dt);
  else if(hasOrder) this.doAttackMove(u,dt);
  if(u.moving) u.walkPhase+=dt*10;
};

/* ========== ПАТЧ 3: doMove очищает статус шахты ========== */
Game.prototype.doMove=function(u,dt){
  if(u.role==='worker'){
    if(u._insideMine){u._insideMine=false;u._mineSlot=-1;}
    if(u._waitingForMine) u._waitingForMine=false;
  }
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  if(d<12){u.moveTo=null;return;}
  var spd=u.spd*dt;
  var moved=this._smartMove(u,dx,dy,spd);
  if(!moved){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>1.5){
      u.moveTo=null;u._stuckTimer=0;
    }else{
      return;
    }
  }
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  var spd=u.spd*dt;
  var moved=this._smartMove(u,dx,dy,spd);
  if(!moved){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>1.5){u.attackMoveTo=null;u.patrolRoute=null;u._stuckTimer=0;return;}
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};
Game.prototype.updateCreep=function(c,dt){
  if(c.stunT>0) c.stunT-=dt;
  if(c.dying){c.deathT+=dt;if(c.deathT>1.2) c.dead=true;return;}
  if(c.hp<=0){
    c.dying=true;c.deathT=0;this.spawnParticles(c.x,c.y,'#8a3020',12);
    if(c.lastAttacker){
      var reward=c.goldReward;if(c.isBoss) reward+=BOUNTY_BOSS;
      if(typeof c.lastAttacker.pid!=='undefined'&&this.teams[c.lastAttacker.pid]){
        this.addRes(c.lastAttacker.pid,reward,0);
        this.floaters.push(new Floater(c.x,c.y-30,'+'+reward,'#ffe066'));
        if(c.isBoss&&c.lastAttacker.owner==='player') this.notify(t_('bountyBoss'));
      }
      if(c.lastAttacker.isHero&&!c.lastAttacker.dying) this.grantXP(c.lastAttacker,c.xpReward);
      else if(typeof c.lastAttacker.pid!=='undefined'){for(var i=0;i<this.units.length;i++){var h=this.units[i];if(h.isHero&&h.pid===c.lastAttacker.pid&&!h.dying){if(Math.hypot(h.x-c.x,h.y-c.y)<400){this.grantXP(h,Math.floor(c.xpReward*0.5));break;}}}}
    }
    return;
  }
  c.animT+=dt;if(c.hitFlash>0) c.hitFlash-=dt;if(c.atkCd>0) c.atkCd-=dt;if(c.attackT>0) c.attackT-=dt*3;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=180*180;
    for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying) continue;var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);if(d2<bd){bd=d2;best=u;}}
    if(best) c.target=best;
  }
  c.moving=false;
  if(c.target){
    var dx=c.target.x-c.x,dy=c.target.y-c.y,d=Math.hypot(dx,dy);
    var reach=c.range+(c.target.radius||20)+6;
    if(Math.abs(dx)>Math.abs(dy)) c.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dy>=0?DIR.DOWN:DIR.UP;
    if(d>reach){
      var nx=c.x+dx/d*c.spd*dt, ny=c.y+dy/d*c.spd*dt;
      if(!this._wouldHitBuilding(nx,ny,c.radius)){c.x=nx;c.y=ny;}
      else{
        var ang3=Math.atan2(dy,dx)+Math.PI/2;
        var sx2=c.x+Math.cos(ang3)*c.spd*dt, sy2=c.y+Math.sin(ang3)*c.spd*dt;
        if(!this._wouldHitBuilding(sx2,sy2,c.radius)){c.x=sx2;c.y=sy2;}
      }
      c.moving=true;c.walkPhase+=dt*8;
    }
    else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      c.target.hp-=c.dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+c.dmg,'#ff6060'));
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){c.wanderT=2+Math.random()*3;var a=Math.random()*TAU,r=40+Math.random()*100;c.wanderTarget={x:c.homeX+Math.cos(a)*r,y:c.homeY+Math.sin(a)*r};}
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){c.x+=dxw/dw*c.spd*0.4*dt;c.y+=dyw/dw*c.spd*0.4*dt;c.walkPhase+=dt*6;c.moving=true;}
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=Math.min(hero.maxHp,hero.hp+70);hero.dmg+=5;hero.skillPoints++;
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup');
    if(hero.level>=6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+8;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    var moved=this._smartMove(u,dx,dy,spd);
    if(moved){u.moving=true;this.separate(u);}
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.pid,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.pid,t.role);dmg=dmg*(1-0.08*upD.a);}
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    this.projectiles.push(new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,a.pid,'#ffe080'));
    Audio.sfx('arrow');
    if(a.isHero) t.lastAttacker=a;
    if(a.isHero&&t.hp<=dmg) this.grantXP(a,20);
    return;
  }
  if(a.role==='heal'){
    if(t.team===a.team) t.hp=Math.min(t.maxHp,t.hp+dmg*4);
    return;
  }
  Audio.sfx('sword');
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  if(t.isUnit||t.isCreep){
    var ang=Math.atan2(t.y-a.y,t.x-a.x),kb=a.isHero?9:5;
    t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  }
  this.spawnParticles(t.x,t.y,'#ffc040',5);
  this.floaters.push(new Floater(t.x,t.y-25,'-'+dmg,a.isHero?'#ffe9a8':'#ff6060'));
  this.shake=Math.min(0.3,this.shake+0.06);
  if(t.isUnit&&!t.target&&t.role!=='worker'&&!t.isBuilding) t.target=a;
  if(a.isHero&&a.bloodthirstHeal>0){var h=Math.round(dmg*a.bloodthirstHeal);if(h>0){a.hp=Math.min(a.maxHp,a.hp+h);this.floaters.push(new Floater(a.x,a.y-35,'+'+h,'#ff8080'));}}
  if(a.isHero&&t.hp<=0) this.grantXP(a,20);
};
Game.prototype.applyProj=function(p){
  var best=null,bd=40*40;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.dead||u.dying||u.team===p.team) continue;var d2=(u.x-p.x)*(u.x-p.x)+(u.y-p.y)*(u.y-p.y);if(d2<bd){bd=d2;best=u;}}
  if(!best) for(var ci=0;ci<this.creeps.length;ci++){var c=this.creeps[ci];if(c.dead) continue;var d2c=(c.x-p.x)*(c.x-p.x)+(c.y-p.y)*(c.y-p.y);if(d2c<bd){bd=d2c;best=c;}}
  if(!best) for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.dead||b.team===p.team) continue;var d2b=(b.x-p.x)*(b.x-p.x)+(b.y-p.y)*(b.y-p.y),r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
  if(best){if(best.invulT>0) return;best.hp-=p.dmg;best.hitFlash=0.2;this.spawnParticles(p.x,p.y,'#ffd060',4);}
};

/* ========== ПАТЧ 1: лесопилка глобально ==========
   ========== ПАТЧ 2: 5-й рабочий ждёт очереди ==========
   ========== ПАТЧ 8: обход зданий ==========
   ========== ПАТЧ 9: сразу к следующему дереву ========== */
Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){
    u.gatherTarget=null;
    u._insideMine=false;
    u._mineSlot=-1;
    u._waitingForMine=false;
    if(u.carrying) this.returnRes(u,dt);
    return;
  }
  if(u.carrying&&u.carryAmt>=10){
    u._insideMine=false;
    u._mineSlot=-1;
    u._waitingForMine=false;
    this.returnRes(u,dt);
    return;
  }
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    u._insideMine=false;
    u._mineSlot=-1;
    u._waitingForMine=false;
    var step=Math.min(u.spd*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){
      var ang2=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
      if(!this._smartMove(u,Math.cos(ang2)*side,Math.sin(ang2)*side,step)){
        u._stuckTimer=(u._stuckTimer||0)+dt;
        if(u._stuckTimer>3){u._stuckTimer=0;u.gatherTarget=null;return;}
      }
    } else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
  } else {
    u.moving=false;
    if(g.kind==='gold'){
      u._insideMine=true;
      u._waitingForMine=false;
      if(u._mineSlot<0 || u._mineSlot>=MAX_GATHER_PER_MINE){
        var used={};
        for(var mi=0;mi<this.units.length;mi++){
          var mu=this.units[mi];
          if(mu===u||mu.dead||mu.dying) continue;
          if(mu.gatherTarget!==g) continue;
          if(!mu._insideMine) continue;
          if(mu._mineSlot>=0 && mu._mineSlot<MAX_GATHER_PER_MINE) used[mu._mineSlot]=true;
        }
        var freeSlot=-1;
        for(var s=0;s<MAX_GATHER_PER_MINE;s++){ if(!used[s]){freeSlot=s;break;} }
        if(freeSlot<0){
          u._insideMine=false;
          u._waitingForMine=true;
          u._stuckTimer=0;
          u._stuckCheckTimer=0;
          u.moving=false;
          var waitAng=(u.id*0.71)%TAU;
          u.x=g.x+Math.cos(waitAng)*78;
          u.y=g.y+Math.sin(waitAng)*78;
          return;
        }
        u._mineSlot=freeSlot;
      }
      var positions=[[-34,-4],[-17,-16],[0,-22],[17,-16],[34,-4]];
      var pos=positions[u._mineSlot]||positions[0];
      u.x=g.x+pos[0];
      u.y=g.y+pos[1];
      u.dir=DIR.UP;
    } else {
      u._insideMine=false;
      u._mineSlot=-1;
      u._waitingForMine=false;
      if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    }
    u.gatherProgress+=dt;u._stuckTimer=0;
    var cycle=(g.kind==='gold')?2.5:5.0;
    if(g.kind==='tree'){
      for(var li=0;li<this.buildings.length;li++){
        var lb=this.buildings[li];
        if(lb.dead||!lb.completed||lb.kind!=='lumber'||lb.pid!==u.pid) continue;
        cycle*=0.75;break;
      }
    }
    u.chopT=Math.sin(Math.PI*(u.gatherProgress/cycle));
    if(u.gatherProgress>=cycle){
      u.gatherProgress=0;
      var baseAmt=10;
      if(g.kind==='tree'){
        for(var li2=0;li2<this.buildings.length;li2++){
          var lb2=this.buildings[li2];
          if(lb2.dead||!lb2.completed||lb2.kind!=='lumber'||lb2.pid!==u.pid) continue;
          baseAmt = 12 + (Math.random()<0.5?0:1);
          break;
        }
      }
      var amt=Math.min(baseAmt,g.amount);g.amount-=amt;
      if(g.amount<=0){if(g.kind==='tree'&&!g.falling){g.falling=true;g.fallT=0;g.fallDir=(u.x>=g.x)?-1:1;Audio.sfx('treefall');}else if(g.kind==='gold') g.dead=true;}
      u.carrying=g.kind;u.carryAmt=amt;
      Audio.sfx(g.kind==='gold'?'gold':'wood');
      if(g.kind==='gold'){u.x=g.x;u.y=g.y+10;}
      u._insideMine=false;
      u._mineSlot=-1;
      u._waitingForMine=false;
      this.returnRes(u,dt);
      return;
    }
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.7;if(g.kind==='tree') Audio.sfx('chop');else if(g.kind==='gold') Audio.sfx('mine');if(g.kind!=='gold'){var ipx=g.x+(u.x-g.x)*0.4,ipy=g.y-20;this.spawnParticles(ipx,ipy,'#a08050',3);}}
  }
};

/* ========== ПАТЧ 5: рабочий несёт дерево и в лесопилку ==========
   ========== ПАТЧ 9: сразу ищет следующий ресурс ========== */
Game.prototype.returnRes=function(u,dt){
  u._insideMine=false;
  u._mineSlot=-1;
  u._waitingForMine=false;
  var th=null,bd=Infinity;
  var caryKind=u.carrying;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.pid!==u.pid||b.dead) continue;
    var canDrop=(b.kind==='townhall')||(caryKind==='tree'&&b.kind==='lumber'&&b.completed);
    if(!canDrop) continue;
    var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);
    if(d<bd){bd=d;th=b;}
  }
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){
      u._stuckTimer=(u._stuckTimer||0)+dt;
      if(u._stuckTimer>4){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}
    } else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;
  } else {
    var cary=u.carrying;
    if(cary==='gold'){this.addRes(u.pid,u.carryAmt,0);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));}
    else if(cary==='tree'){this.addRes(u.pid,0,u.carryAmt);if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));}
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    var nr=this.findNearestResource(u.x,u.y,cary==='gold'?'gold':'tree');
    if(nr){
      var cnt=this.countGatherers(nr);
      if(cary==='gold'&&cnt>=MAX_GATHER_PER_MINE){
        /* ПАТЧ 2: всё равно идём к шахте — будем ждать очереди */
        u.gatherTarget=nr;
      } else u.gatherTarget=nr;
    } else u.gatherTarget=null;
  }
};

/* ========== ПАТЧ 4: doBuild — телепорт-обход вместо отказа ========== */
Game.prototype.doBuild=function(u,dt){
  var b=u.buildTarget;if(!b||b.dead){u.buildTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    u.moving=true;u.chopT=0;u.gatherAnimT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>3){
      u._stuckTimer=0;
      var ang2=Math.atan2(dy,dx);
      u.x=this.clampX(u.x+Math.cos(ang2)*30);
      u.y=this.clampY(u.y+Math.sin(ang2)*30);
      this.ejectFromBuildings(u);
    }
  } else {
    u.moving=false;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));u._stuckTimer=0;
    u._sfxTimer=(u._sfxTimer||0)-dt;
    if(u._sfxTimer<=0){u._sfxTimer=0.6;Audio.sfx('build');var ipx=b.x+(u.x-b.x)*0.4,ipy=b.y-20;this.spawnParticles(ipx,ipy,'#ffd060',3);}
    if(!b.completed){b.buildProgress+=dt;if(b.buildProgress>=b.buildTime){b.completed=true;u.buildTarget=null;if(b.owner==='player') this.notify(t_('built')+' '+t_(b.kind));}}
    else u.buildTarget=null;
  }
};

/* ========== ПАТЧ 4: doRepair — телепорт-обход вместо отказа ========== */
Game.prototype.doRepair=function(u,dt){
  var b=u.repairTarget;if(!b||b.dead||b.hp>=b.maxHp){u.repairTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    u.moving=true;u.chopT=0;u.gatherAnimT=0;
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>3){
      u._stuckTimer=0;
      var angR=Math.atan2(dy,dx);
      u.x=this.clampX(u.x+Math.cos(angR)*30);
      u.y=this.clampY(u.y+Math.sin(angR)*30);
      this.ejectFromBuildings(u);
    }
  } else {
    u.moving=false;u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));u._stuckTimer=0;
    u.repairAccum=(u.repairAccum||0)+dt;
    if(u.repairAccum>=0.5){
      u.repairAccum=0;
      var team=this.teams[u.pid],gc=1,wc=1;
      if(!team||team.gold<gc||team.wood<wc){u.repairTarget=null;return;}
      this.subRes(u.pid,gc,wc);
      b.hp=Math.min(b.maxHp,b.hp+25);
      Audio.sfx('repair');
      this.spawnParticles(b.x+(u.x-b.x)*0.3,b.y-20,'#a0d0ff',3);
      if(b.hp>=b.maxHp) u.repairTarget=null;
    }
  }
};
Game.prototype.doDemolish=function(u,dt){
  var b=u.demolishTarget;if(!b||b.dead){u.demolishTarget=null;return;}
  var dx=b.x-u.x,dy=b.y-u.y,d=Math.hypot(dx,dy),reach=b.radius+45;
  if(d>reach){
    var step=Math.min(u.spd*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.chopT=0;u.gatherAnimT=0;u._stuckTimer=0;
  } else {
    u.moving=false;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.gatherAnimT=(u.gatherAnimT+dt)%1.2;u.chopT=Math.sin(Math.PI*(u.gatherAnimT/1.2));
    u.repairAccum=(u.repairAccum||0)+dt;
    if(u.repairAccum>=0.6){
      u.repairAccum=0;b.hp-=35;Audio.sfx('demolish');
      this.spawnParticles(b.x+(u.x-b.x)*0.3,b.y-20,'#8a6a3a',4);
      if(b.hp<=0){
        b.dead=true;
        var refund=0.5;
        this.addRes(u.pid,Math.floor((b.costGold||0)*refund),Math.floor((b.costWood||0)*refund));
        for(var ui=0;ui<this.units.length;ui++){var uu=this.units[ui];if(uu.buildTarget===b) uu.buildTarget=null;if(uu.repairTarget===b) uu.repairTarget=null;if(uu.demolishTarget===b) uu.demolishTarget=null;}
        u.demolishTarget=null;Audio.sfx('demolish');
      }
    }
  }
};
Game.prototype.updateBuilding=function(b,dt){
  b.pulse=(b.pulse||0)+dt;
  if(b.hp<=0){b.dead=true;this.spawnParticles(b.x,b.y,'#ff8040',20);for(var i=0;i<15;i++){var a=Math.random()*TAU;this.particles.spawn(b.x,b.y-20,Math.cos(a)*180,Math.sin(a)*180-80,1.2,'#8a6a3a',3);}for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;if(u.demolishTarget===b) u.demolishTarget=null;}return;}
  if(b.hitFlash>0) b.hitFlash-=dt;
  if(!b.completed) return;
  if(b.hp<b.maxHp) b.hp=Math.min(b.maxHp,b.hp+0.8*dt);
  if(b.atk>0){b.atkCd-=dt;if(b.atkCd<=0){var e=this.findEnemy(b,b.rng);if(!e) e=this.findNearestCreep(b,b.rng);if(e){b.atkCd=b.atkCdBase;this.projectiles.push(new Projectile(b.x,b.y-25,e.x,e.y,b.atk,b.team,b.pid,'#ffa040'));}}}
  if(b.queue.length>0){
    var q=b.queue[0];q.timeLeft-=dt;
    if(q.timeLeft<=0){
      var race=RACES[q.race],def=race&&race.units[q.role];
      if(def&&this.units.length<300){
        var res=this.getRes(b.pid);
        var foodCost=FOOD_COST[q.role]||1;
        var reserved=this.getReservedPop(b.pid)-foodCost;
        var canSpawn=(res.food+reserved+foodCost)<=res.maxFood;
        if(canSpawn){
          var sx=cl(b.x+(Math.random()-0.5)*60,30,this.W-30);
          var sy=cl(b.y+b.radius+50,30,this.H-30);
          var u2=new Unit(sx,sy,b.team,def,q.race);
          u2.owner=b.owner;u2.pid=b.pid;u2.spawnT=0;
          this.units.push(u2);
          this.spawnParticles(sx,sy,'#ffe9a8',12);
          if(b.owner==='player'){this.notify(t_('trained')+' '+t_(q.role));Audio.sfx(q.role==='hero'?'hero':'notify');}
          b.queue.shift();
        } else q.timeLeft=0.5;
      } else b.queue.shift();
    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.owner==='player'){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade');}}}
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};

/* ========== ПАТЧ 2: ищем только в разведанной зоне ========== */
Game.prototype.findNearestResource=function(x,y,kind){
  var best=null,bd=Infinity;
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(!this.isExplored(r.x,r.y)) continue;
    if(kind&&r.kind!==kind) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);
    if(d<bd){bd=d;best=r;}
  }
  return best;
};

Game.prototype.separate=function(u){
  if(u._insideMine||u._waitingForMine) return;
  if(u._isSummon) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      if(o._insideMine) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.5;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>4) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var minBD=u.radius+b.radius*1.05;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2),pushB=(minBD-bd)*1.05;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.35:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};

var AI_ID_SEQ=1;
function AIController(game,team,race,homeX,homeY,pid){
  this.aiId=AI_ID_SEQ++;
  this.g=game;this.team=team;this.race=race;this.raceId=race.id;
  this.pid=(typeof pid==='number')?pid:0;
  this.atkTimer=15;this.buildTimer=3;this.trainTimer=1.5;this.workerTimer=1.5;this.upgTimer=10;
  this.homeX=homeX;this.homeY=homeY;
  this.underAttack=false;this.attackResponse=0;this.threatTimer=0;
  this.difficulty=Settings.difficulty||'normal';
  this.trainRate=this.difficulty==='easy'?0.35:this.difficulty==='hard'?1.05:0.65;
  this.heroAbilityTimer=2;
  this.scoutTimer=15;this.expandTimer=150;this.heroLevelTimer=8;this.helpTimer=4;
  this.retreatTimer=1;this.raidTimer=10;
  this._scoutUnit=null;
  /* ПАТЧ 4: таймеры новых проверок */
  this.stuckCheckTimer=3;
  this.workerRaidTimer=30;
}
AIController.prototype.update=function(dt){
  var g=this.g;if(!g||g.gameOver) return;
  this.threatTimer-=dt;if(this.threatTimer<=0){this.threatTimer=1;this.detectThreats();}
  if(this.underAttack&&this.attackResponse>0) this.attackResponse-=dt;else if(this.attackResponse<=0) this.underAttack=false;
  this.workerTimer-=dt;if(this.workerTimer<=0){this.workerTimer=1.6;this.assignWorkers();}
  this.buildTimer-=dt;if(this.buildTimer<=0){this.buildTimer=2;this.tryBuild();}
  this.trainTimer-=dt;if(this.trainTimer<=0){this.trainTimer=1.6;this.tryTrain();}
  this.upgTimer-=dt;if(this.upgTimer<=0){this.upgTimer=10;this.tryUpgradeTH();}
  if(this.underAttack) this.defend();
  this.heroAbilityTimer-=dt;if(this.heroAbilityTimer<=0){this.heroAbilityTimer=2.5;this.useHeroAbilities();}
  this.atkTimer-=dt;if(this.atkTimer<=0){this.atkTimer=this.difficulty==='hard'?14:this.difficulty==='easy'?40:22;this.tryAttack();}
  this.scoutTimer-=dt;if(this.scoutTimer<=0){this.scoutTimer=18;this.doScout();}
  this.expandTimer-=dt;if(this.expandTimer<=0){this.expandTimer=120;this.tryExpand();}
  this.heroLevelTimer-=dt;if(this.heroLevelTimer<=0){this.heroLevelTimer=5;this.heroLevelUp();}
  this.helpTimer-=dt;if(this.helpTimer<=0){this.helpTimer=4;this.helpAllies();}
  this.retreatTimer-=dt;if(this.retreatTimer<=0){this.retreatTimer=1;this.retreatWounded();}
  /* ПАТЧ 4: следим за незанятыми стройками */
  this.stuckCheckTimer-=dt;
  if(this.stuckCheckTimer<=0){this.stuckCheckTimer=3;this.ensureBuilders();}
  this.raidTimer-=dt;if(this.raidTimer<=0){this.raidTimer=14;this.raidParty();}
  /* ПАТЧ 7: рейды на рабочих врага */
  this.workerRaidTimer-=dt;
  if(this.workerRaidTimer<=0){this.workerRaidTimer=30;this.tryWorkerRaid();}
};

/* ========== ПАТЧ 4: достройка брошенных зданий ========== */
AIController.prototype.ensureBuilders=function(){
  var g=this.g;
  for(var bi=0;bi<g.buildings.length;bi++){
    var bld=g.buildings[bi];
    if(bld.pid!==this.pid||bld.completed||bld.dead) continue;
    var hasBuilder=false;
    for(var ui=0;ui<g.units.length;ui++){
      var u=g.units[ui];
      if(u.pid!==this.pid||u.dying) continue;
      if(u.buildTarget===bld){hasBuilder=true;break;}
    }
    if(hasBuilder) continue;
    var w=null;
    for(var wi=0;wi<g.units.length;wi++){
      var wu=g.units[wi];
      if(wu.pid!==this.pid||wu.role!=='worker'||wu.dying) continue;
      if(wu.buildTarget||wu.repairTarget||wu.demolishTarget) continue;
      w=wu;break;
    }
    if(w){
      w.buildTarget=bld;w.gatherTarget=null;w.moveTo=null;
      w._insideMine=false;w._mineSlot=-1;w._waitingForMine=false;
    }
  }
};

/* ========== ПАТЧ 7: определение состава врага ========== */
AIController.prototype.getEnemyComposition=function(){
  var g=this.g;
  var c={cav:0,fly:0,ranged:0,spear:0,melee:0,elite:0,siege:0};
  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];
    if(u.team===this.team||u.dying) continue;
    if(c[u.role]!==undefined) c[u.role]++;
  }
  return c;
};

/* ========== ПАТЧ 7: рейд на рабочих врага ========== */
AIController.prototype.tryWorkerRaid=function(){
  var g=this.g;
  if(g.time<90) return;
  var raid=[];
  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];
    if(u.pid!==this.pid||u.dying) continue;
    if(u.role!=='cav'&&u.role!=='fly') continue;
    if(u.target||u.moveTo||u.attackMoveTo||u.patrolRoute) continue;
    raid.push(u);
  }
  if(raid.length<3) return;
  var target=null,bd=Infinity;
  for(var j=0;j<g.units.length;j++){
    var e=g.units[j];
    if(e.team===this.team||e.dying||e.role!=='worker') continue;
    var d=Math.hypot(e.x-this.homeX,e.y-this.homeY);
    if(d<bd&&d<2000){bd=d;target=e;}
  }
  if(!target) return;
  for(var k=0;k<raid.length;k++){
    raid[k].target=target;
    raid[k].attackMoveTo=null;
    raid[k].moveTo=null;
    raid[k].stance='aggressive';
  }
};

AIController.prototype.detectThreats=function(){
  var threats=0;
  for(var i=0;i<this.g.units.length;i++){var u=this.g.units[i];if(u.team===this.team||u.dying) continue;var dx=u.x-this.homeX,dy=u.y-this.homeY;if(dx*dx+dy*dy<800*800) threats++;}
  if(threats>=2){this.underAttack=true;this.attackResponse=20;}
};
AIController.prototype.pickFocusTarget=function(cx,cy,radius){
