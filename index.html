<!-- ===== ЧАСТЬ 1/15 ===== -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>Эхо Трёх Корон — v51.0.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,Arial,sans-serif;color:#e8e8e8;position:fixed}
canvas#game{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.18) 65%, rgba(0,0,0,0.55) 100%);display:none}
#vignette.active{display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(circle at 50% 40%,#1e2d45,#0a0e18);pointer-events:auto;padding:20px 16px 60px;overflow-y:auto;z-index:50;touch-action:pan-y}
.screen.active{display:flex}
h1{color:#e6c67a;font-size:clamp(28px,7vw,60px);margin-bottom:8px;letter-spacing:4px;text-align:center;text-shadow:0 0 30px #e6c67a99}
h2{color:#8aa;font-size:13px;margin-bottom:24px;letter-spacing:3px}
h3{color:#e6c67a;font-size:17px;margin-bottom:14px;text-align:center}
.btn{padding:13px 26px;margin:5px;font-size:16px;cursor:pointer;background:linear-gradient(180deg,#2e3f5c,#1a2437);border:2px solid #6a7a9a;border-radius:8px;color:#e8e8e8;min-width:180px;text-align:center;font-weight:700}
.btn:hover,.btn:active{background:linear-gradient(180deg,#42577d,#243149);border-color:#e6c67a}
.btn.primary{border-color:#e6c67a;color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010)}
.btn.small{min-width:auto;padding:9px 15px;font-size:14px;margin:3px}
.btn.danger{border-color:#c94040;color:#ffb0b0}
.panel{background:linear-gradient(180deg,rgba(20,28,42,.98),rgba(12,18,28,.98));border:2px solid #557096;border-radius:12px;padding:20px;max-width:min(94vw,780px);margin:auto;pointer-events:auto;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;flex-wrap:wrap}
.row label{flex:1;font-size:14px;color:#b8c5d6;min-width:110px}
.row select,.row input[type=range]{flex:1;max-width:220px}
.row select{padding:8px 12px;background:#0d1420;border:1px solid #3d4c68;color:#e8e8e8;border-radius:6px;font-size:14px}
.map-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.map-item{padding:8px;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:110px}
.map-item canvas{width:90px;height:90px;border-radius:4px;background:#000;display:block}
.map-item.selected{border-color:#e6c67a;background:#2a3a52;color:#ffe9a8}
.map-item .mname{font-size:11px;color:#e6c67a}
.slot-row{display:flex;gap:6px;align-items:center;background:#0d1420;padding:6px;border-radius:6px;font-size:12px;margin-bottom:6px}
.slot-row .num{width:28px;height:28px;line-height:28px;text-align:center;border-radius:6px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;flex-shrink:0;border:1px solid #000}
.slot-row select{flex:1;padding:6px 8px;background:#080d15;border:1px solid #3d4c68;color:#e8e8e8;border-radius:5px;font-size:12px;min-width:0}
.slot-row .team-sel{flex:0 0 68px;display:flex;align-items:center;gap:4px;padding:2px 4px;background:#080d15;border:1px solid #3d4c68;border-radius:5px}
.slot-row .team-sel .sw{width:14px;height:14px;border-radius:3px;border:1px solid #000;flex-shrink:0}
.slot-row .team-sel select{flex:1;padding:3px 0;background:transparent;border:none;min-width:0;font-size:12px}
.slot-row.player{background:#1a2438;border:1px solid #557096}
#hud{position:absolute;inset:0;pointer-events:none;display:none;z-index:5;overflow:hidden}
#hud.active{display:block}
#topbar{position:absolute;top:6px;left:6px;display:flex;gap:14px;padding:8px 14px;background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;font-size:14px;font-weight:700;max-width:calc(100vw - 300px);flex-wrap:wrap}
#topbar>div{display:flex;gap:6px;align-items:center}
#topbar span.val{color:#e6c67a;font-weight:800}
#topbar img.res-ico{width:18px;height:18px}
#selinfo{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.92);border:2px solid #557096;border-radius:8px;padding:6px 12px;font-size:12px;display:none;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
#selinfo.show{display:block}
#minimap{position:absolute;right:6px;top:6px;width:120px;height:120px;background:#000;border:2px solid #557096;border-radius:6px;pointer-events:auto;cursor:pointer}
#cmdpanel{position:absolute;bottom:4px;left:4px;right:4px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:7px;display:none;padding:4px;gap:4px;pointer-events:auto;flex-wrap:wrap;max-height:170px}
#cmdpanel.show{display:flex}
#portrait-wrap{width:96px;flex-shrink:0;background:#0d1420;border:1px solid #3d4c68;border-radius:4px;overflow:hidden}
#portrait-canvas{width:100%;height:72px;display:block;background:linear-gradient(180deg,#1a2438,#050810)}
#portrait-info{padding:2px 4px;font-size:9px;max-height:150px;overflow-y:auto}
#portrait-info .pname{color:#e6c67a;font-weight:700;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#portrait-info .pstat{color:#9ab;font-size:8px}
#portrait-info .pbar{height:9px;background:#000;border-radius:2px;overflow:hidden;margin-top:2px;position:relative;border:1px solid #2a3a52}
#portrait-info .pbar .fill{height:100%;transition:width .15s linear}
#portrait-info .pbar .lbl{position:absolute;inset:0;text-align:center;font-size:7px;line-height:9px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 2px #000;font-weight:700}
#portrait-info .prow{display:flex;justify-content:space-between;font-size:8px;color:#b8c5d6;margin-top:1px}
#portrait-info .prow .v{color:#ffe9a8}
#unit-bar{position:absolute;bottom:180px;left:4px;display:none;gap:3px;pointer-events:auto;overflow-x:auto;overflow-y:hidden;padding:3px;background:rgba(10,16,28,.9);border:2px solid #557096;border-radius:5px;max-width:min(96vw,720px);height:58px;z-index:6}
#unit-bar.show{display:flex}
#unit-bar .ubtn{width:50px;height:50px;flex-shrink:0;background:#0d1420;border:2px solid #3d4c68;border-radius:4px;cursor:pointer;position:relative;overflow:hidden}
#unit-bar .ubtn.active{border-color:#ffe9a8;box-shadow:0 0 8px #e6c67a99 inset}
#unit-bar .ubtn img{width:100%;height:100%;display:block;object-fit:cover}
#unit-bar .ubtn .hp-bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#000}
#unit-bar .ubtn .hp-fill{height:100%;background:#3aa03a}
#unit-bar .ubtn .count{position:absolute;top:1px;right:2px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
#actions{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;align-content:start;overflow-y:auto;max-height:160px;min-width:0}
.act-btn{background:linear-gradient(180deg,#2a3a55,#16202f);border:2px solid #4d6180;border-radius:5px;color:#e8e8e8;font-size:9px;cursor:pointer;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-weight:700;min-height:78px;overflow:hidden;min-width:0;position:relative}
.act-btn:hover{background:linear-gradient(180deg,#3a5078,#1a2438);border-color:#e6c67a}
.act-btn.active{border-color:#ffe9a8;background:linear-gradient(180deg,#5a4a2a,#2a2010);box-shadow:0 0 8px #e6c67a88 inset}
.act-btn:disabled{opacity:.55;cursor:not-allowed}
.act-btn.ability{border-color:#7a5fbf;background:linear-gradient(180deg,#3a2f60,#1a1430)}
.act-btn .ico{font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;min-height:26px;gap:2px;flex-shrink:0;position:relative;z-index:1}
.act-btn .ico img{width:26px;height:26px;display:block}
.act-btn .lbl{font-size:8px;text-align:center;margin:2px 0;overflow:hidden;white-space:normal;word-break:break-word;line-height:1.1;flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:0 1px;min-height:18px;width:100%;position:relative;z-index:1}
.act-btn .price{font-size:8px;color:#e6c67a;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;line-height:1;max-width:100%;flex-shrink:0;padding:1px 0 0;position:relative;z-index:1}
.act-btn .price>div{display:flex;align-items:center;gap:1px;background:rgba(0,0,0,.35);border-radius:3px;padding:0 2px}
.act-btn .price img{width:10px;height:10px;vertical-align:-2px;flex-shrink:0}
.section-sep{grid-column:1/-1;color:#e6c67a;font-size:11px;font-weight:800;letter-spacing:1px;padding:4px 6px 2px;border-top:1px solid #3d4c68;margin-top:4px;text-transform:uppercase}
#queue-panel{position:absolute;bottom:246px;left:6px;background:rgba(10,16,28,.94);border:2px solid #557096;border-radius:6px;padding:6px;display:none;max-width:260px;pointer-events:auto;z-index:6}
#queue-panel.show{display:block}
#queue-panel .qtitle{color:#e6c67a;font-size:11px;font-weight:800;margin-bottom:4px}
.q-item{display:flex;gap:6px;align-items:center;margin-bottom:4px;background:#0d1420;padding:3px 5px;border-radius:4px}
.q-name{font-size:10px;color:#e8e8e8;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-name img{width:18px;height:18px;display:block;flex-shrink:0}
.q-bar-bg{height:5px;background:#000;border-radius:2px;margin-top:2px;overflow:hidden}
.q-bar-fill{height:100%;background:linear-gradient(90deg,#8a6a1a,#ffe9a8);border-radius:2px}
.q-time{font-size:9px;color:#9ab}
#controls{position:absolute;right:6px;top:190px;display:flex;flex-direction:column;gap:4px;pointer-events:auto}
#controls button{width:38px;height:38px;background:rgba(20,30,45,.95);border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;font-size:17px;font-weight:800;cursor:pointer}
#hud-menu{position:absolute;top:142px;right:6px;padding:6px 10px;background:#243250;border:2px solid #6a7a9a;border-radius:6px;color:#e8e8e8;cursor:pointer;pointer-events:auto;font-size:16px;font-weight:800}
#notifications{position:absolute;bottom:320px;left:6px;display:flex;flex-direction:column;gap:4px;max-width:280px;pointer-events:none;overflow:hidden}
.notif{background:rgba(10,16,28,.94);border-left:3px solid #e6c67a;padding:8px 12px;font-size:12px;border-radius:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;bottom:200px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:13px;color:#ffe9a8;display:none;max-width:min(90vw,600px);text-align:center;font-weight:700}
#hint.show{display:block}
#order-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(120,30,30,.95);border:2px solid #ff6060;border-radius:8px;padding:10px 18px;font-size:14px;color:#ffd0d0;display:none;font-weight:700;pointer-events:auto;text-align:center}
#order-bar.show{display:block}
#placement-bar{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(10,16,28,.96);border:2px solid #e6c67a;border-radius:8px;padding:10px 16px;font-size:14px;color:#ffe9a8;display:none;font-weight:700;gap:10px;align-items:center;pointer-events:auto}
#placement-bar.show{display:flex}
#world-tip{position:absolute;pointer-events:none;background:rgba(10,16,28,.96);border:2px solid #557096;border-radius:6px;padding:8px 12px;font-size:12px;color:#e8e8e8;display:none;max-width:280px;z-index:20;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.6)}
#world-tip.show{display:block}
#world-tip .tt-name{color:#e6c67a;font-weight:800;font-size:13px;margin-bottom:4px}
#world-tip .tt-row{display:flex;justify-content:space-between;gap:12px}
#world-tip .tt-row span:last-child{color:#ffe9a8}
#world-tip .tt-desc{margin-top:6px;padding-top:6px;border-top:1px solid #3d4c68;color:#c8d5e8;font-size:11px;line-height:1.35}
#mobile-tip{position:fixed;pointer-events:none;background:rgba(10,16,28,0.98);border:2px solid #e6c67a;border-radius:8px;padding:10px 14px;font-size:12px;color:#e8e8e8;display:none;z-index:200;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,0.8);white-space:pre-line;line-height:1.4;font-weight:600}
#mobile-tip.show{display:block}
#pausemenu{z-index:60}
#saves{z-index:70}
#settings{z-index:72}
#alert{z-index:75}
#gameover{z-index:80}
#pausemenu,#settings,#gameover,#alert,#saves{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.9);pointer-events:auto;padding:16px;overflow-y:auto;touch-action:pan-y}
#pausemenu.active,#settings.active,#gameover.active,#alert.active,#saves.active{display:flex}
.save-slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;margin:6px 0;background:#0d1420;border:2px solid #3d4c68;border-radius:6px;font-size:13px;flex-wrap:wrap}
.save-slot .meta{flex:1;color:#9ab;font-size:12px;min-width:120px}
.save-slot .title{color:#e6c67a;font-weight:800;font-size:14px}
.save-slot .actions{display:flex;gap:4px}
#error-box{position:fixed;top:10px;left:10px;right:10px;background:#3a0000;border:2px solid #ff4040;color:#fff;padding:10px;font-size:12px;font-family:monospace;z-index:9999;display:none;max-height:200px;overflow:auto;white-space:pre-wrap}
.go-tab.active{background:linear-gradient(180deg,#5a4a2a,#2a2010);border-color:#e6c67a;color:#ffe9a8}
#go-stats table{width:100%;border-collapse:collapse}
#go-stats th,#go-stats td{padding:4px 5px;border-bottom:1px solid #2a3a52;text-align:left;white-space:nowrap;font-size:11px}
#go-stats th{color:#e6c67a;font-size:10px;text-transform:uppercase}
#go-stats tr:last-child td{border-bottom:none}
#go-stats>div>div>div{word-break:break-word}
@media (max-width:600px){#minimap{width:80px;height:80px}#hud-menu{top:96px}#controls{top:134px}#topbar{font-size:11px;padding:5px 8px;gap:8px;max-width:calc(100vw - 160px)}#portrait-wrap{width:76px}#portrait-canvas{height:56px}.slot-row .num{width:24px;height:24px;line-height:24px;font-size:11px}.slot-row .team-sel{flex:0 0 58px}#actions{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}#unit-bar{bottom:190px;height:50px}#unit-bar .ubtn{width:42px;height:42px}}
</style>
</head>

<body>
<div id="error-box"></div>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="ui">
<div id="menu" class="screen active">
  <h1>Эхо Трёх Корон</h1>
  <h2>ECHO OF THREE CROWNS · v51.0.0</h2>
  <button class="btn primary" id="m-play">Новая игра</button>
  <button class="btn" id="m-load">Загрузить</button>
  <button class="btn" id="m-settings">Настройки</button>
</div>
<div id="setup" class="screen"><div class="panel">
  <h3 id="setup-title">Настройка матча</h3>
  <div class="row"><label id="lbl-map">Карта</label></div>
  <div class="map-list" id="map-list"></div>
  <div class="row"><label id="lbl-diff">Сложность ботов</label><select id="diff-sel">
    <option value="easy">Лёгкая</option><option value="normal" selected>Обычная</option><option value="hard">Сложная</option>
  </select></div>
  <div class="row">
    <label id="lbl-players">Участники</label>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn small" id="slot-minus">−</button>
      <span id="slot-count" style="color:#e6c67a;font-weight:800;min-width:20px;text-align:center">2</span>
      <button class="btn small" id="slot-plus">+</button>
    </div>
  </div>
  <div id="slot-list"></div>
  <div class="row" style="justify-content:center;margin-top:12px">
    <button class="btn small" id="setup-back">Назад</button>
    <button class="btn small primary" id="setup-start">Начать</button>
  </div>
</div></div>
<div id="settings"><div class="panel">
  <h3 id="settings-title">Настройки</h3>
  <div class="row"><label>Язык</label><select id="q-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <div class="row"><label>Громкость</label><input type="range" id="q-vol" min="0" max="1" step="0.05" value="0.4"><span id="v-vol">40%</span></div>
  <div class="row"><label>Музыка</label><input type="range" id="q-mus" min="0" max="1" step="0.05" value="0.25"><span id="v-mus">25%</span></div>
  <div class="row" id="row-edge"><label>Краевой скролл</label><select id="q-edge"><option value="1" selected>Вкл</option><option value="0">Выкл</option></select></div>
  <div class="row"><label>Графика</label><select id="q-quality">
    <option value="low">Низкая</option><option value="medium" selected>Средняя</option><option value="high">Высокая</option>
  </select></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn small primary" id="settings-close">Закрыть</button></div>
</div></div>
<div id="saves"><div class="panel">
  <h3>Сохранения</h3>
  <div id="saves-list"></div>
  <div class="row" style="justify-content:center;margin-top:12px"><button class="btn small" id="saves-back">Назад</button></div>
</div></div>
<div id="hud">
  <div id="topbar">
    <div><img class="res-ico" id="ic-gold" alt=""><span class="val" id="h-gold">0</span></div>
    <div><img class="res-ico" id="ic-wood" alt=""><span class="val" id="h-wood">0</span></div>
    <div><img class="res-ico" id="ic-pop" alt=""><span class="val" id="h-pop">0/0</span></div>
    <div><img class="res-ico" id="ic-time" alt=""><span class="val" id="h-time">00:00</span></div>
  </div>
  <div id="selinfo"></div>
  <div id="notifications"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="controls"><button id="zoom-in">+</button><button id="zoom-out">−</button></div>
  <button id="hud-menu">☰</button>
  <div id="unit-bar"></div>
  <div id="cmdpanel">
    <div id="portrait-wrap"><canvas id="portrait-canvas" width="270" height="216"></canvas><div id="portrait-info"><div class="pname">—</div><div class="pstat"></div></div></div>
    <div id="actions"></div>
  </div>
  <div id="queue-panel"><div class="qtitle">Очередь</div><div id="queue-list"></div></div>
  <div id="hint"></div>
  <div id="order-bar"></div>
  <div id="placement-bar"><span>Размещение:</span><span id="place-name">—</span><button class="btn small danger" id="place-cancel">Отмена</button></div>
  <div id="world-tip"></div>
  <div id="mobile-tip"></div>
</div>
<div id="pausemenu"><div class="panel" style="text-align:center;max-width:440px">
  <h3>Пауза</h3>
  <button class="btn primary" id="pause-continue" style="width:100%">Продолжить</button>
  <button class="btn" id="pause-settings" style="width:100%">Настройки</button>
  <button class="btn" id="pause-save" style="width:100%">Сохранить</button>
  <button class="btn" id="pause-load" style="width:100%">Загрузить</button>
  <button class="btn danger" id="pause-exit" style="width:100%">В меню</button>
</div></div>
<div id="gameover"><div class="panel" style="text-align:center;max-width:640px">
  <h3 id="go-title" style="font-size:36px"></h3>
  <p id="go-sub" style="margin:14px 0;color:#9ab;font-size:14px"></p>
  <div id="go-tabs" style="display:flex;gap:4px;justify-content:center;margin-bottom:10px;flex-wrap:wrap">
    <button class="btn small go-tab active" data-tab="players">Игроки</button>
    <button class="btn small go-tab" data-tab="teams">Команды</button>
    <button class="btn small go-tab" data-tab="summary">Итог</button>

(function applyRaceBalance(){
  for(var raceId in RACE_BALANCE){
    if(!RACES[raceId]) continue;
    var bal=RACE_BALANCE[raceId];
    var units=RACES[raceId].units;
    for(var role in units){
      var u=units[role];
      if(!u||!u.role) continue;
      var isCombat=(role!=='worker');
      if(isCombat){
        u.hp=Math.round(u.hp*bal.hpMul);
        u.dmg=Math.round(u.dmg*bal.dmgMul);
        u.spd=Math.round(u.spd*bal.spdMul);
        if(u.range>80) u.range=Math.round(u.range*bal.rangeMul);
        u.cd=u.cd*bal.atkSpdMul;
        u.gold=Math.round((u.gold||0)*bal.costGoldMul);
      }
      u.armor=bal.armor;
      u.raceRegen=isCombat?bal.regenOutCombat:0.3;
    }
  }
})();

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

  var isHero=role==='hero';
  var W=role==='cav'?100:role==='siege'?100:role==='fly'?(race==='gromborn'?120:90):(isHero?70:56);

    SPRITES[key]=cv;return cv;
  }
  if(role==='fly'){
    drawFlyer(ctx,W,H,race,team,dir,frame);

  }
  var legDef=getLeg(role),legH=legDef?legDef.h:14;
  var bodyBaseY=H-legH;

  else if(race==='sylvanid'){bw=Math.round(bw*0.92);bh=Math.round(bh*1.02);}

  var isShaman=(race==='gromborn'&&role==='heal');

      ctx.beginPath();ctx.moveTo(cx-bw*0.7,headY+6);

      ctx.closePath();ctx.fill();
      ctx.strokeStyle='#000';ctx.lineWidth=1.2;ctx.stroke();

  }

Game.prototype.spawnBase=function(x,y,team,race,owner,pid){
  var th=new Building(x,y,team,race.buildings.townhall,race.id);th.owner=owner;th.pid=pid;this.buildings.push(th);

  }

  while(attempts<12){

      if(Math.hypot(r0b.x-gx,r0b.y-gy)<450){tooClose=true;break;}
    }
    if(!tooClose) break;
    var wa=Math.random()*TAU;
    gx=cl(gx+Math.cos(wa)*160,80,this.W-80);
    gy=cl(gy+Math.sin(wa)*160,80,this.H-80);

  }
  if(!anyMineNear) this.resources.push(new Resource(gx,gy,'gold',12500));
  var angles=[-1.2,-0.7,-0.25,0.25,0.7,1.2];
  for(var i=0;i<angles.length;i++){
    var a=toCenter+angles[i],r=580+((i%2)*80);
    var tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;
    tx=cl(tx,60,this.W-60);ty=cl(ty,60,this.H-60);

  var angles2=[Math.PI-0.6,Math.PI-0.2,Math.PI+0.2,Math.PI+0.6];
  for(var j=0;j<angles2.length;j++){
    var a2=toCenter+angles2[j],r2=660;

    tx2=cl(tx2,60,this.W-60);ty2=cl(ty2,60,this.H-60);

  for(var wi=0;wi<3;wi++){

    var tries=0;
    while(tries<14){
      var hit=false;
      for(var bi=0;bi<this.buildings.length;bi++){var bb=this.buildings[bi];if(Math.hypot(bb.x-wx,bb.y-wy)<bb.radius+56){hit=true;break;}}
      if(!hit) for(var ri2=0;ri2<this.resources.length;ri2++){var rr=this.resources[ri2];if(Math.hypot(rr.x-wx,rr.y-wy)<rr.radius+56){hit=true;break;}}
      if(!hit) break;
      aw+=0.55;tries++;wx=x+Math.cos(aw)*220;wy=y+Math.sin(aw)*220;
    }
    var u=new Unit(wx,wy,team,race.units.worker,race.id);

  }
};

Game.prototype.updateFog=function(){
  var cs=this.fogCellSize,c=this.fogCols,r=this.fogRows;
  var self=this;
  for(var t in this.teamVis){for(var i=0;i<this.teamVis[t].length;i++) this.teamVis[t][i]=0;}
  function rev(team,cx,cy,rad){
    var arr=self.teamVis[team];if(!arr) return;
    var x0=Math.max(0,cx-rad),x1=Math.min(c-1,cx+rad);
    var y0=Math.max(0,cy-rad),y1=Math.min(r-1,cy+rad);
    var fog=self.teamFog[team];
    for(var x=x0;x<=x1;x++){
      for(var y=y0;y<=y1;y++){
        var idx=x+y*c;arr[idx]=1;fog[idx]=2;
      }
    }
  }
  var i;
  for(i=0;i<this.units.length;i++){
    var u=this.units[i];if(u.dying) continue;
    var vr=Math.ceil((u.vision||200)/cs);
    rev(u.team,Math.floor(u.x/cs),Math.floor(u.y/cs),vr);
  }
  for(i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    rev(b.team,Math.floor(b.x/cs),Math.floor(b.y/cs),b.kind==='townhall'?9:6);
  }
  for(var tt in this.teamFog){
    var src=this.teamFog[tt];
    for(i=0;i<src.length;i++){if(!this.teamVis[tt][i]&&src[i]===2) src[i]=1;}
  }
  var pvis=this.teamVis[this.playerTeam]||new Uint8Array(c*r);
  var pfog=this.teamFog[this.playerTeam]||new Uint8Array(c*r);

};

Game.prototype.buildNavGrid=function(){
  var ts=this.tileSize;
  var cols=Math.ceil(this.W/ts),rows=Math.ceil(this.H/ts);
  this.navCols=cols;this.navRows=rows;
  var grid=new Uint8Array(cols*rows);
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.dying) continue;
    var r=b.radius*1.75;
    var minX=Math.max(0,Math.floor((b.x-r)/ts));
    var maxX=Math.min(cols-1,Math.floor((b.x+r)/ts));
    var minY=Math.max(0,Math.floor((b.y-r)/ts));
    var maxY=Math.min(rows-1,Math.floor((b.y+r)/ts));
    for(var y=minY;y<=maxY;y++) for(var x=minX;x<=maxX;x++) grid[y*cols+x]=1;
  }
  for(var ri=0;ri<this.resources.length;ri++){
    var rr=this.resources[ri];if(rr.dead||rr.falling) continue;
    var rr2=(rr.kind==='gold')?rr.radius*0.75:28;
    var minX2=Math.max(0,Math.floor((rr.x-rr2)/ts));
    var maxX2=Math.min(cols-1,Math.floor((rr.x+rr2)/ts));
    var minY2=Math.max(0,Math.floor((rr.y-rr2)/ts));
    var maxY2=Math.min(rows-1,Math.floor((rr.y+rr2)/ts));
    for(var y2=minY2;y2<=maxY2;y2++) for(var x2=minX2;x2<=maxX2;x2++) grid[y2*cols+x2]=1;
  }
  this.navGrid=grid;this.navDirty=false;
};
Game.prototype.findPath=function(sx,sy,tx,ty){
  if(this.navDirty) this.buildNavGrid();
  var ts=this.tileSize,cols=this.navCols,rows=this.navRows,grid=this.navGrid;
  if(!grid||cols===0||rows===0){this.buildNavGrid();grid=this.navGrid;cols=this.navCols;rows=this.navRows;}
  var startCx=cl(Math.floor(sx/ts),0,cols-1),startCy=cl(Math.floor(sy/ts),0,rows-1);
  var endCx=cl(Math.floor(tx/ts),0,cols-1),endCy=cl(Math.floor(ty/ts),0,rows-1);
  if(grid[endCy*cols+endCx]===1){
    var f1=false;
    for(var r1=1;r1<=4&&!f1;r1++){
      for(var ddx=-r1;ddx<=r1&&!f1;ddx++) for(var ddy=-r1;ddy<=r1&&!f1;ddy++){
        var ncx=endCx+ddx,ncy=endCy+ddy;
        if(ncx<0||ncy<0||ncx>=cols||ncy>=rows) continue;
        if(grid[ncy*cols+ncx]===0){endCx=ncx;endCy=ncy;f1=true;}
      }
    }
    if(!f1) return null;
  }
  if(grid[startCy*cols+startCx]===1){
    var f2=false;
    for(var r2=1;r2<=4&&!f2;r2++){
      for(var ddx2=-r2;ddx2<=r2&&!f2;ddx2++) for(var ddy2=-r2;ddy2<=r2&&!f2;ddy2++){
        var ncx2=startCx+ddx2,ncy2=startCy+ddy2;
        if(ncx2<0||ncy2<0||ncx2>=cols||ncy2>=rows) continue;
        if(grid[ncy2*cols+ncx2]===0){startCx=ncx2;startCy=ncy2;f2=true;}
      }
    }
    if(!f2) return null;
  }
  var startI=startCy*cols+startCx,endI=endCy*cols+endCx;
  if(startI===endI) return [{x:tx,y:ty}];
  var total=cols*rows;
  if(!this._pfVisited||this._pfVisited.length!==total){
    this._pfVisited=new Uint8Array(total);
    this._pfParent=new Int32Array(total);
    this._pfQueue=new Int32Array(total);
  }
  var visited=this._pfVisited,parent=this._pfParent,queue=this._pfQueue;
  for(var k=0;k<total;k++){visited[k]=0;parent[k]=-1;}
  queue[0]=startI;visited[startI]=1;var head=0,qLen=1;
  var DX=[-1,0,1,-1,1,-1,0,1],DY=[-1,-1,-1,0,0,1,1,1];
  var found=false;
  while(head<qLen){
    var cur=queue[head++];
    if(cur===endI){found=true;break;}
    var cx=cur%cols,cy=(cur/cols)|0;
    for(var d=0;d<8;d++){
      var nx=cx+DX[d],ny=cy+DY[d];
      if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
      var ni=ny*cols+nx;
      if(visited[ni]||grid[ni]===1) continue;
      visited[ni]=1;parent[ni]=cur;
      if(qLen<total) queue[qLen++]=ni;
    }
  }
  if(!found) return null;
  var path=[];
  var cur2=endI,safety=0;
  while(cur2!==-1&&safety<20000){
    var cx2=cur2%cols,cy2=(cur2/cols)|0;
    path.unshift({x:cx2*ts+ts/2,y:cy2*ts+ts/2});
    cur2=parent[cur2];safety++;
  }
  if(path.length>0) path[path.length-1]={x:tx,y:ty};
  return path;
};

Game.prototype._hasLineOfSight=function(x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy);

  var steps=Math.ceil(d/24);

  }

};

Game.prototype.update=function(dt){
  if(this.gameOver||this.paused) return;
  this.time+=dt;this._lastDt=dt;
  if(this.shake>0) this.shake-=dt*3;
  this.buildSpatialGrid();
  this.auraTimer-=dt;if(this.auraTimer<=0){this.auraTimer=1.5;this.updateAuras();}
  this.updateWeather(dt);
  var i;
  for(i=0;i<this.units.length;i++){try{if(!this.units[i].dead) this.updateUnit(this.units[i],dt);}catch(e){ERR('updateUnit',e);}}
  for(i=0;i<this.creeps.length;i++){try{if(!this.creeps[i].dead) this.updateCreep(this.creeps[i],dt);}catch(e){ERR('updateCreep',e);}}
  for(i=0;i<this.buildings.length;i++){try{if(!this.buildings[i].dead) this.updateBuilding(this.buildings[i],dt);}catch(e){ERR('updateBuilding',e);}}
  for(i=0;i<this.resources.length;i++){
    var r=this.resources[i];if(r.dead) continue;
    if(r.falling){
      r.fallT+=dt;
      var ft=r.fallT;
      var fDir=r.fallDir||1;
      if(ft<0.4){
        r.fallAngle=Math.sin(ft*55)*0.13*fDir;
        if(Math.random()<0.7){
          var leafAngle=Math.random()*TAU;
          var leafDist=20+Math.random()*30;
          var lx=r.x+Math.cos(leafAngle)*leafDist;
          var ly=r.y-90+Math.sin(leafAngle)*leafDist*0.4;
          this.particles.spawn(lx,ly,(Math.random()-0.5)*30,-30-Math.random()*30,1.2+Math.random()*0.5,'#3a7a28',2.5);
        }
        if(Math.random()<0.4){
          this.particles.spawn(r.x+(Math.random()-0.5)*30,r.y-40-Math.random()*40,(Math.random()-0.5)*20,-20-Math.random()*20,0.8,'#8a5a30',2);
        }
      } else if(ft<1.15){
        var nt=(ft-0.4)/0.75;
        var eased=nt*nt*(3-2*nt);
        r.fallAngle=eased*(Math.PI/2)*fDir;
        if(Math.random()<0.85){
          var la=Math.random()*TAU,ls=40+Math.random()*80;
          this.particles.spawn(r.x+(Math.random()-0.5)*40,r.y-60+Math.random()*40,Math.cos(la)*ls,Math.sin(la)*ls-40,1.4+Math.random()*0.6,Math.random()<0.5?'#3a7a28':'#5aaa40',2.5+Math.random()*1.5);
        }
        if(Math.random()<0.6){
          this.particles.spawn(r.x+(Math.random()-0.5)*70,r.y-15,(Math.random()-0.5)*30,-10-Math.random()*20,1.0,'#8a6a3a',2+Math.random()*2);
        }
      } else if(ft<1.9){
        var bt=(ft-1.15)/0.75;
        var bounce=Math.sin(bt*Math.PI*3)*0.18*(1-bt);
        r.fallAngle=((Math.PI/2)+bounce)*fDir;
        if(Math.random()<0.5){
          var sa=Math.random()*TAU,ss=60+Math.random()*100;
          this.particles.spawn(r.x+(Math.random()-0.5)*60,r.y-20,Math.cos(sa)*ss,Math.sin(sa)*ss-40,1.2,'#8a5a30',2+Math.random()*2);
        }
      } else if(ft<3.0){
        r.fallAngle=(Math.PI/2)*fDir;
        if(Math.random()<0.3){
          this.particles.spawn(r.x+(Math.random()-0.5)*80,r.y-15-Math.random()*20,(Math.random()-0.5)*15,-5-Math.random()*15,1.5,'#6a4a2a',1.5);
        }
        r._fallAlpha=Math.max(0,1-(ft-1.9)/1.0);
      } else {
        r.fallAngle=(Math.PI/2)*fDir;
        r.dead=true;this.navDirty=true;
      }
    }
  }
  for(i=0;i<this.projectiles.length;i++){var p=this.projectiles[i];if(p.dead) continue;
    p._prevX=p.x;p._prevY=p.y;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d<14||p.ttl<=0){this.applyProj(p);p.dead=true;continue;}
    p.x+=dx/d*p.spd*dt;p.y+=dy/d*p.spd*dt;p.ttl-=dt;p.age+=dt;}
  for(i=0;i<this.weapons.length;i++){var w=this.weapons[i];if(w.dead) continue;w.x+=w.vx*dt;w.y+=w.vy*dt;w.vx*=0.94;w.vy*=0.94;w.rot+=w.rotV*dt;w.rotV*=0.95;w.life-=dt;if(w.life<=0) w.dead=true;}
  for(i=0;i<this.floaters.length;i++){var f=this.floaters[i];if(f.dead) continue;f.y-=30*dt;f.life-=dt;if(f.life<=0) f.dead=true;}
  for(i=0;i<this.decals.length;i++){var dd=this.decals[i];dd.life-=dt;if(dd.life<=0) dd.dead=true;}
  for(i=0;i<this.units.length;i++){var su=this.units[i];if(su._isSummon&&su._summonT>0){su._summonT-=dt;if(su._summonT<=0) su.hp=0;}}
  this.particles.update(dt);
  compactArr(this.units);compactArr(this.creeps);compactArr(this.buildings);compactArr(this.resources);
  compactArr(this.projectiles);compactArr(this.weapons);compactArr(this.floaters);
  if(this.decals.length>40) this.decals=this.decals.slice(-40);
  compactArr(this.decals);
  this.fogTimer-=dt;if(this.fogTimer<=0){this.updateFog();this.fogTimer=0.3;}
  for(i=0;i<this.ai.length;i++){try{this.ai[i].update(dt);}catch(e){ERR('ai',e);}}
  this.checkVictory();
  for(i=this.notifications.length-1;i>=0;i--){this.notifications[i].t-=dt;if(this.notifications[i].t<=0) this.notifications.splice(i,1);}
};
Game.prototype.updateWeather=function(dt){

      else if(wx==='sand') this.weather.push({x:x,y:y,vx:200+Math.random()*150,vy:20+Math.random()*30,life:3,kind:'sand',size:1.5+Math.random()*1.5});

Game.prototype.ejectFromBuildings=function(u){
  if(u._insideMine||u._isSummon||u._waitingForMine) return;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.dead||b.dying) continue;
    var dx=u.x-b.x,dy=u.y-b.y;
    var minD=u.radius+b.radius*1.02;
    var d2=dx*dx+dy*dy;
    if(d2<minD*minD){
      var d=Math.sqrt(d2);
      if(d<0.01){dx=1;dy=0;d=1;}
      u.x=this.clampX(b.x+dx/d*(minD+2));
      u.y=this.clampY(b.y+dy/d*(minD+2));
      u._path=null;u._pathIdx=0;
    }
  }
};

    if(b===ignore) continue;

Game.prototype._wouldHitResource=function(x,y,radius,ignore){

      var r=arr[i];
      if(r===ignore||r.dead||r.falling) continue;
      var rr=(r.kind==='gold')?r.radius*0.55:24;
      var ddx=x-r.x,ddy=y-r.y,minD=radius+rr;

};
Game.prototype._smartMove=function(u,dx,dy,spd){
  var d=Math.hypot(dx,dy);if(d<0.01) return false;
  var nx=u.x+dx/d*spd,ny=u.y+dy/d*spd;
  var blockedB=this._wouldHitBuilding(nx,ny,u.radius);
  var blockedR=this._wouldHitResource(nx,ny,u.radius,u.gatherTarget);
  if(!blockedB&&!blockedR){
    u.x=this.clampX(nx);u.y=this.clampY(ny);return true;
  }
  var slideTarget=blockedB||blockedR;
  if(slideTarget){
    var bb=slideTarget;
    var bdx=u.x-bb.x,bdy=u.y-bb.y,bd=Math.hypot(bdx,bdy);
    var minD=(bb.radius||24)+u.radius+8;

      }
    }
  }
  var nx1=u.x+dx/d*spd,ny1=u.y;
  if(!this._wouldHitBuilding(nx1,ny1,u.radius)&&!this._wouldHitResource(nx1,ny1,u.radius,u.gatherTarget)){u.x=this.clampX(nx1);return true;}
  var nx2=u.x,ny2=u.y+dy/d*spd;
  if(!this._wouldHitBuilding(nx2,ny2,u.radius)&&!this._wouldHitResource(nx2,ny2,u.radius,u.gatherTarget)){u.y=this.clampY(ny2);return true;}
  var perp=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
  var sx=u.x+Math.cos(perp)*side*spd,sy=u.y+Math.sin(perp)*side*spd;
  if(!this._wouldHitBuilding(sx,sy,u.radius)&&!this._wouldHitResource(sx,sy,u.radius,u.gatherTarget)){u.x=this.clampX(sx);u.y=this.clampY(sy);return true;}
  var baseAng=Math.atan2(dy,dx);

    var a1=baseAng+step;
    var sx1=u.x+Math.cos(a1)*spd,sy1=u.y+Math.sin(a1)*spd;
    if(!this._wouldHitBuilding(sx1,sy1,u.radius)&&!this._wouldHitResource(sx1,sy1,u.radius,u.gatherTarget)){u.x=this.clampX(sx1);u.y=this.clampY(sy1);return true;}
    var a2=baseAng-step;
    var sx2=u.x+Math.cos(a2)*spd,sy2=u.y+Math.sin(a2)*spd;
    if(!this._wouldHitBuilding(sx2,sy2,u.radius)&&!this._wouldHitResource(sx2,sy2,u.radius,u.gatherTarget)){u.x=this.clampX(sx2);u.y=this.clampY(sy2);return true;}
  }
  return false;
};
Game.prototype.findEnemyBaseNear=function(ent,range){

  if(u.moveTo) this.doMove(u,dt);
  else if(u.target) this.doAttack(u,dt);

Game.prototype.doMove=function(u,dt){
  if(u.role!=='worker'&&!u.target&&u.atkCd<=0&&u.stance!=='hold'){
    var attacker=u.lastAttacker;
    if(attacker && !attacker.dead && !attacker.dying && Math.hypot(attacker.x-u.x,attacker.y-u.y)<u.range+40){
      u.atkCd=u.cdBase;u.attackT=1;this.performAttack(u,attacker);
    }
  }
  if(u.role==='worker'){
    if(u._insideMine){u._insideMine=false;u._mineSlot=-1;}
    if(u._waitingForMine) u._waitingForMine=false;
    if(u._assignedMine){
      var dAm=Math.hypot(u._assignedMine.x-u.moveTo.x, u._assignedMine.y-u.moveTo.y);
      if(dAm>60) u._assignedMine=null;
    }
  }
  if(!u.moveTo){ u._path=null; return; }
  var dxGoal=u.moveTo.x-u.x, dyGoal=u.moveTo.y-u.y;
  var dGoal=Math.hypot(dxGoal,dyGoal);
  if(dGoal<12){ u.moveTo=null; u._path=null; u._pathIdx=0; return; }
  if(!u._path){
    var nowT=this.time;
    if(u._pathFailT && nowT-u._pathFailT<0.5){ u._stuckTimer=0; }
    else {
      var path=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path&&path.length>0){ u._path=path; u._pathIdx=0; u._pathFailT=0; }
      else { u._path=null; u._pathFailT=nowT; }
    }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];
    var dxT=t.x-u.x, dyT=t.y-u.y, dT=Math.hypot(dxT,dyT);
    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){ u._path=null; u._pathIdx=0; u.moveTo=null; return; }
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y; dT=Math.hypot(dxT,dyT);
    }
    var spd=u.spd*(u.slowMul||1)*dt;
    var moved=this._smartMove(u,dxT,dyT,spd);
    if(!moved){
      u._stuckTimer=(u._stuckTimer||0)+dt;
      if(u._stuckTimer>0.8){
        u._stuckTimer=0;
        u._path=null;u._pathIdx=0;
        this.navDirty=true;
      }
    } else u._stuckTimer=0;
    if(Math.abs(dxT)>Math.abs(dyT)) u.dir=dxT>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dyT>=0?DIR.DOWN:DIR.UP;

    this.separate(u);
    return;
  }
  var dx=u.moveTo.x-u.x,dy=u.moveTo.y-u.y,d=Math.hypot(dx,dy);
  var spd2=u.spd*(u.slowMul||1)*dt;
  var moved2=this._smartMove(u,dx,dy,spd2);
  if(!moved2){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>0.8){
      u._stuckTimer=0;
      this.navDirty=true;
      var path2=this.findPath(u.x,u.y,u.moveTo.x,u.moveTo.y);
      if(path2&&path2.length>0){ u._path=path2; u._pathIdx=0; }
      else { u.moveTo=null; }
    }
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  this.separate(u);
};
Game.prototype.doAttackMove=function(u,dt){
  var sr=u.range>120?260:180;
  var e=this.findEnemy(u,sr);
  if(!e) e=this.findNearestCreep(u,sr);
  if(e){u.target=e;return;}
  var dest=null;
  if(u.patrolRoute){dest=(u.patrolIdx===0)?u.patrolRoute.p1:u.patrolRoute.p2;}
  else if(u.attackMoveTo){dest=u.attackMoveTo;}
  if(!dest) return;
  var dx=dest.x-u.x,dy=dest.y-u.y,d=Math.hypot(dx,dy);
  if(d<20){if(u.patrolRoute){u.patrolIdx=1-u.patrolIdx;}else{u.attackMoveTo=null;}return;}
  if(!u._path){
    var path=this.findPath(u.x,u.y,dest.x,dest.y);
    if(path&&path.length>0){ u._path=path; u._pathIdx=0; }
  }
  if(u._path&&u._pathIdx<u._path.length){
    var t=u._path[u._pathIdx];

    if(dT<16){
      u._pathIdx++;
      if(u._pathIdx>=u._path.length){u._path=null;u._pathIdx=0;}

    if(u._path){
      t=u._path[u._pathIdx];
      dxT=t.x-u.x; dyT=t.y-u.y;
    }
  }
  var spd=u.spd*(u.slowMul||1)*dt;
  var moved=this._smartMove(u,dx,dy,spd);
  if(!moved){
    u._stuckTimer=(u._stuckTimer||0)+dt;
    if(u._stuckTimer>1.5){u.attackMoveTo=null;u.patrolRoute=null;u._stuckTimer=0;u._path=null;u._pathIdx=0;return;}
  } else u._stuckTimer=0;
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  u.moving=true;
  if(u.role!=='worker') this.separate(u);
};

          }
        }
      }

  c.moving=false;
  if(c.target&&(c.target.dead||c.target.dying||c.target.hp<=0)) c.target=null;
  if(!c.target){
    var best=null,bd=c.aggroR*c.aggroR;
    for(var ui=0;ui<this.units.length;ui++){
      var u=this.units[ui];
      if(u.dead||u.dying||u.team<0) continue;
      var d2=(u.x-c.x)*(u.x-c.x)+(u.y-c.y)*(u.y-c.y);

    }

      else{
        var ang3=Math.atan2(dy,dx)+Math.PI/2;
        var sx2=c.x+Math.cos(ang3)*c.spd*dt,sy2=c.y+Math.sin(ang3)*c.spd*dt;
        if(!this._wouldHitBuilding(sx2,sy2,c.radius)){c.x=this.clampX(sx2);c.y=this.clampY(sy2);}
      }
      c.moving=true;c.walkPhase+=dt*8;
    } else if(c.atkCd<=0){
      c.atkCd=c.cdBase;c.attackT=1;
      if(c.target.invulT>0) return;
      var dmg=c.dmg;
      if(c.target.isUnit&&c.target.armor&&c.target.armor<1) dmg=dmg*c.target.armor;
      dmg=Math.round(dmg);
      c.target.hp-=dmg;c.target.hitFlash=0.2;c.target.lastAttacker=c;
      this.floaters.push(new Floater(c.target.x,c.target.y-25,'-'+dmg,'#ff6060'));
      Audio.sfx('sword',c.x,c.y);
      if(c.target.isUnit&&!c.target.target&&c.target.role!=='worker') c.target.target=c;
    }
  } else if(c.moveTo){
    var dxm=c.moveTo.x-c.x,dym=c.moveTo.y-c.y,dm=Math.hypot(dxm,dym);
    if(dm<12){c.moveTo=null;}
    else{
      c.x+=dxm/dm*c.spd*0.6*dt;c.y+=dym/dm*c.spd*0.6*dt;
      if(Math.abs(dxm)>Math.abs(dym)) c.dir=dxm>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dym>=0?DIR.DOWN:DIR.UP;
      c.walkPhase+=dt*6;c.moving=true;
    }
  } else {
    c.wanderT-=dt;
    if(c.wanderT<=0||!c.wanderTarget){
      c.wanderT=2.5+Math.random()*3.5;
      var a=Math.random()*TAU,r=30+Math.random()*90;
      c.wanderTarget={x:this.clampX(c.homeX+Math.cos(a)*r),y:this.clampY(c.homeY+Math.sin(a)*r)};
    }
    if(c.wanderTarget){
      var dxw=c.wanderTarget.x-c.x,dyw=c.wanderTarget.y-c.y,dw=Math.hypot(dxw,dyw);
      if(dw>8){
        c.x+=dxw/dw*c.spd*0.35*dt;c.y+=dyw/dw*c.spd*0.35*dt;
        if(Math.abs(dxw)>Math.abs(dyw)) c.dir=dxw>=0?DIR.RIGHT:DIR.LEFT;else c.dir=dyw>=0?DIR.DOWN:DIR.UP;
        c.walkPhase+=dt*5;c.moving=true;
      }
    }
  }
};
Game.prototype.grantXP=function(hero,xp){
  hero.exp+=xp;
  this.floaters.push(new Floater(hero.x,hero.y-45,'+'+xp+' xp','#a0ffa0'));
  while(hero.level<12&&hero.exp>=hero.level*hero.level*30+40){
    hero.level++;hero.maxHp+=70;hero.hp=hero.maxHp;hero.dmg+=5;hero.skillPoints++;
    if(hero.isHero){hero.maxMana=100+20*(hero.level-1);hero.mana=hero.maxMana;}
    this.floaters.push(new Floater(hero.x,hero.y-60,'Ур.'+hero.level,'#ffe9a8'));
    this.spawnParticles(hero.x,hero.y-10,'#ffe9a8',20);
    Audio.sfx('levelup',hero.x,hero.y);
    if(hero.level>=6&&!hero.ultUnlocked){hero.ultUnlocked=true;this.notify(t_('ultUnlocked'));}
  }
};
Game.prototype.doAttack=function(u,dt){
  var t=u.target;if(!t||t.dead){u.target=null;return;}
  var dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);
  var reach=u.range+(t.radius||20)+(u.role==='heal'?40:8);
  if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
  if(d>reach){
    var spd=u.spd*(u.slowMul||1)*dt;
    if(u.activeBuffT>0&&u.buffType==='rage') spd*=1.3;
    var moved=this._smartMove(u,dx,dy,spd);
    if(moved){u.moving=true;this.separate(u);}
  } else if(u.atkCd<=0){
    u.atkCd=u.cdBase;u.attackT=1;
    this.performAttack(u,t);
  }
};
Game.prototype.performAttack=function(a,t){
  if(!t||t.dead) return;
  if(t.invulT>0){this.floaters.push(new Floater(t.x,t.y-25,'MISS','#aaa'));return;}
  if(a.role==='heal' && t.team===a.team && t.role!=='worker' && !t.dying){
    if((a.mana||0)<HEALER_SPELL_COST){
      this.floaters.push(new Floater(a.x,a.y-25,'нет маны','#888'));
      return;
    }
    a.mana-=HEALER_SPELL_COST;
    var baseHeal=a.dmg*4;
    t.hp=Math.min(t.maxHp,t.hp+baseHeal);
    var healColor=(a.race==='luminite')?'#ffe9a8':(a.race==='gromborn')?'#a0ff80':'#80ffd0';
    for(var hli=0;hli<8;hli++){
      var ht=hli/8;
      var hx=a.x+(t.x-a.x)*ht, hy=a.y-20+(t.y-a.y)*ht;
      this.particles.spawn(hx,hy,(Math.random()-0.5)*15,(Math.random()-0.5)*15-10,0.6,healColor,3);
    }
    for(var hli2=0;hli2<6;hli2++){
      var ha2=Math.random()*TAU,hs=30+Math.random()*40;
      this.particles.spawn(t.x,t.y-15,Math.cos(ha2)*hs,Math.sin(ha2)*hs-20,0.7,healColor,2.5);
    }
    this.floaters.push(new Floater(t.x,t.y-30,'+'+Math.round(baseHeal),healColor));
    Audio.sfx('heal_cast',a.x,a.y);
    a.castT=1;
    return;
  }
  var mul=1;
  if(t.isUnit&&this.auraCache.blessing[t.id]) mul=0.9;
  var upA=this.getUnitUpgrades(a.pid,a.role);
  var dmg=a.dmg*(1+0.15*upA.w);
  if(a.isHero&&a.activeBuffT>0&&a.buffType==='rage') dmg*=1.3;
  if(a.isHero&&a.holyStrikeBuff){dmg*=1.6;a.holyStrikeBuff=false;a.holyStrikeT=0;}
  if(t.isUnit){var upD=this.getUnitUpgrades(t.pid,t.role);dmg=dmg*(1-0.08*upD.a);}
  if(t.isUnit && t.armor && t.armor<1) dmg=dmg*t.armor;
  dmg=dmg*mul;
  if(a.role==='spear'&&t.role==='cav') dmg*=2.2;
  if(a.role==='ranged'&&t.role==='fly') dmg*=1.5;
  if(a.role==='siege'&&t.isBuilding) dmg*=2.5;
  if(t.isBuilding&&!t.completed) dmg*=3;
  dmg=Math.round(dmg);
  if(a.role==='ranged'||a.role==='siege'||a.role==='fly'){
    var projKind=(a.role==='siege')?'stone':(a.role==='fly')?'magic':'arrow';
    var projColor=(a.race==='luminite')?'#ffe9a8':(a.race==='gromborn')?'#ff8040':'#a0ff80';
    var proj=new Projectile(a.x,a.y-22,t.x,t.y-22,dmg,a.team,a.pid,projColor,a.race,projKind);
    if(a.role==='siege'){
      proj.effects={splash:{radius:60,edge:0.4}};
    }
    this.projectiles.push(proj);
    if(a.role==='siege') Audio.sfx('stone_throw',a.x,a.y);
    else if(a.role==='fly') Audio.sfx('fairy_magic',a.x,a.y);
    else if(a.race==='luminite') Audio.sfx('crossbow',a.x,a.y);
    else Audio.sfx('arrow',a.x,a.y);
    if(a.isHero) t.lastAttacker=a;
    return;
  }
  if(a.role==='heal'){return;}
  if(a.role==='spear') Audio.sfx('spear_thrust',a.x,a.y);
  else Audio.sfx('sword',a.x,a.y);
  t.hp-=dmg;t.hitFlash=0.2;t.lastAttacker=a;
  if(t.isBuilding) Audio.sfx('building_hit',t.x,t.y);
  if(t.isUnit||t.isCreep){
    var ang=Math.atan2(t.y-a.y,t.x-a.x),kb=a.isHero?9:5;
    t.x+=Math.cos(ang)*kb;t.y+=Math.sin(ang)*kb;
  }
  if(a.race==='luminite'){
    for(var lp=0;lp<5;lp++){
      var la=Math.random()*TAU,ls=50+Math.random()*80;
      this.particles.spawn(t.x,t.y-10,Math.cos(la)*ls,Math.sin(la)*ls-20,0.5,'#ffe9a8',3);
    }
    this.particles.spawn(t.x-8,t.y-10,-30,-50,0.4,'#fff8d0',2.5);
    this.particles.spawn(t.x+8,t.y-10,30,-50,0.4,'#fff8d0',2.5);
    this.particles.spawn(t.x,t.y-16,0,-70,0.4,'#ffffff',3);
  } else if(a.race==='gromborn'){
    for(var gp=0;gp<7;gp++){
      var ga=Math.random()*TAU,gs=60+Math.random()*100;
      this.particles.spawn(t.x,t.y-10,Math.cos(ga)*gs,Math.sin(ga)*gs-30,0.6,'#ff5030',3.5);
    }
    this.particles.spawn(t.x,t.y-12,0,-50,0.5,'#ffd000',3);
    this.particles.spawn(t.x-4,t.y-10,-20,-40,0.4,'#a01010',3);
    this.particles.spawn(t.x+4,t.y-10,20,-40,0.4,'#a01010',3);
  } else {
    for(var sp=0;sp<6;sp++){
      var sa=Math.random()*TAU,ss=40+Math.random()*70;
      this.particles.spawn(t.x,t.y-10,Math.cos(sa)*ss,Math.sin(sa)*ss-25,0.7,'#5ac040',3);
    }
    for(var lp2=0;lp2<3;lp2++){
      var la2=-0.8+lp2*0.8;
      this.particles.spawn(t.x,t.y-12,Math.cos(la2)*40,Math.sin(la2)*40-30,0.8,'#a0ff80',2.5);
    }
  }
  this.floaters.push(new Floater(t.x,t.y-25,'-'+dmg,a.isHero?'#ffe9a8':'#ff6060'));
  this.shake=Math.min(0.3,this.shake+0.06);
  if(t.isUnit&&!t.target&&t.role!=='worker'&&!t.isBuilding) t.target=a;
  if(t.isUnit&&!t.dying){
    if(a.race==='luminite'&&Math.random()<0.10){
      t.stunT=Math.max(t.stunT||0,0.3);
      this.floaters.push(new Floater(t.x,t.y-42,'ОГЛУШЁН','#ffe9a8'));
    } else if(a.race==='gromborn'){
      t.bleedT=Math.max(t.bleedT||0,2);
      t.bleedDmg=3;
    } else if(a.race==='sylvanid'){
      var stacks=Math.min(2,(t.slowStacks||0)+1);
      t.slowStacks=stacks;
      t.slowT=Math.max(t.slowT||0,2);
      t.slowMul=1-stacks*0.15;
    }
  }
  if(a.isHero&&a.bloodthirstHeal>0){var h=Math.round(dmg*a.bloodthirstHeal);if(h>0){a.hp=Math.min(a.maxHp,a.hp+h);this.floaters.push(new Floater(a.x,a.y-35,'+'+h,'#ff8080'));}}
  if(a.isHero&&t.hp<=0) this.grantXP(a,20);
};

Game.prototype.applyProj=function(p){
  var self=this;
  function _findHit(px,py,team){
    var best=null,bd=40*40;
    for(var i=0;i<self.units.length;i++){var u=self.units[i];if(u.dead||u.dying||u.team===team) continue;var d2=(u.x-px)*(u.x-px)+(u.y-py)*(u.y-py);if(d2<bd){bd=d2;best=u;}}
    if(!best) for(var ci=0;ci<self.creeps.length;ci++){var c=self.creeps[ci];if(c.dead) continue;var d2c=(c.x-px)*(c.x-px)+(c.y-py)*(c.y-py);if(d2c<bd){bd=d2c;best=c;}}
    if(!best) for(var bi=0;bi<self.buildings.length;bi++){var b=self.buildings[bi];if(b.dead||b.team===team) continue;var d2b=(b.x-px)*(b.x-px)+(b.y-py)*(b.y-py),r=b.radius;if(d2b<r*r&&d2b<bd){bd=d2b;best=b;}}
    return best;
  }
  var best=_findHit(p.x,p.y,p.team);
  if(!best) return;
  if(best.invulT>0) return;
  var shooter=null,bestShooterD=Infinity;
  if(typeof p.pid!=='undefined'){
    for(var si2=0;si2<this.units.length;si2++){
      var su2=this.units[si2];
      if(su2.pid!==p.pid||su2.dying) continue;
      var ds=(su2.x-p.startX)*(su2.x-p.startX)+(su2.y-p.startY)*(su2.y-p.startY);
      if(ds<bestShooterD){bestShooterD=ds;shooter=su2;}
    }
    if(!shooter){
      for(var bi3=0;bi3<this.buildings.length;bi3++){
        var bb3=this.buildings[bi3];
        if(bb3.pid!==p.pid||bb3.dead) continue;
        if(Math.hypot(bb3.x-p.startX,bb3.y-p.startY)<300){shooter=bb3;break;}
      }
    }
  }
  var _applyDmg=function(target,dmg){
    if(!target||target.dead) return;
    if(target.invulT>0) return;
    var d=dmg;
    if(target.isBuilding&&!target.completed) d*=3;
    var ignoreArmor=p.effects&&p.effects.ignoreArmor;
    if(!ignoreArmor && target.isUnit&&target.armor&&target.armor<1) d*=target.armor;
    if(target.isUnit&&this.auraCache.blessing[target.id]) d*=0.9;
    d=Math.round(d);
    target.hp-=d;target.hitFlash=0.2;
    if(shooter) target.lastAttacker=shooter;
    if(target.hp<=0&&shooter&&shooter.isHero){
      if(target.isCreep) this.grantXP(shooter,target.xpReward||20);
      else if(target.isUnit) this.grantXP(shooter,20);
    }
  }.bind(this);
  var eff=p.effects||{};
  if(eff.splash){
    var rad=eff.splash.radius,edge=eff.splash.edge||0.4;
    _applyDmg(best,p.dmg);
    for(var i=0;i<this.units.length;i++){
      var u=this.units[i];
      if(u===best||u.team===p.team||u.dying) continue;
      var d=Math.hypot(u.x-best.x,u.y-best.y);
      if(d<rad){var mul=1-(1-edge)*(d/rad);_applyDmg(u,p.dmg*mul);}
    }
    for(var ci2=0;ci2<this.creeps.length;ci2++){
      var c2=this.creeps[ci2];
      if(c2===best||c2.dying) continue;
      var d2=Math.hypot(c2.x-best.x,c2.y-best.y);
      if(d2<rad){var mul2=1-(1-edge)*(d2/rad);c2.hp-=p.dmg*mul2;c2.hitFlash=0.2;if(shooter)c2.lastAttacker=shooter;}
    }
    for(var bi4=0;bi4<this.buildings.length;bi4++){
      var b4=this.buildings[bi4];
      if(b4===best||b4.team===p.team||b4.dead) continue;
      var d4=Math.hypot(b4.x-best.x,b4.y-best.y);
      if(d4<rad+b4.radius){var mul4=1-(1-edge)*(d4/rad);if(mul4<0)mul4=0;var dm4=p.dmg*mul4;if(!b4.completed)dm4*=3;b4.hp-=dm4;b4.hitFlash=0.2;if(shooter)b4.lastAttacker=shooter;}
    }
    for(var spl=0;spl<16;spl++){var sa=Math.random()*TAU,ss=80+Math.random()*120;this.particles.spawn(best.x,best.y-15,Math.cos(sa)*ss,Math.sin(sa)*ss-40,0.7,'#ffe080',3.5);}
    Audio.sfx('building_hit',best.x,best.y);
  } else {
    _applyDmg(best,p.dmg);
  }
  if(eff.burn&&best&&!best.dead){
    best.bleedT=Math.max(best.bleedT||0,eff.burn.dur);
    best.bleedDmg=Math.max(best.bleedDmg||0,eff.burn.dmg);
  }
  if(eff.poison&&best&&!best.dead&&best.isUnit){
    var ps=best._poisonStacks||0;
    var maxS=eff.poison.maxStacks||1;
    if(ps<maxS) ps++;
    best._poisonStacks=ps;
    best.bleedT=Math.max(best.bleedT||0,eff.poison.dur);
    best.bleedDmg=Math.max(best.bleedDmg||0,ps*eff.poison.dmg);
  }
  if(eff.healAlly){
    var weakest=null,wr=2;
    for(var hi=0;hi<this.units.length;hi++){
      var hu=this.units[hi];
      if(hu.team!==p.team||hu.dying) continue;
      if(Math.hypot(hu.x-p.startX,hu.y-p.startY)>eff.healAlly.radius) continue;
      var r=hu.hp/hu.maxHp;
      if(r<wr&&r<0.99){wr=r;weakest=hu;}
    }
    if(weakest){
      weakest.hp=Math.min(weakest.maxHp,weakest.hp+eff.healAlly.amt);
      this.floaters.push(new Floater(weakest.x,weakest.y-25,'+'+eff.healAlly.amt,'#ff6060'));
      for(var hk=0;hk<6;hk++){var ha=Math.random()*TAU,hs=30+Math.random()*40;
        this.particles.spawn(weakest.x,weakest.y-15,Math.cos(ha)*hs,Math.sin(ha)*hs-20,0.6,'#ff4040',2.5);}
    }
  }
  if(p.race==='luminite'){
    for(var lp=0;lp<8;lp++){var la=Math.random()*TAU,ls=40+Math.random()*80;this.particles.spawn(p.x,p.y,Math.cos(la)*ls,Math.sin(la)*ls,0.5,'#ffe9a8',3);}
  } else if(p.race==='gromborn'){
    for(var gp=0;gp<10;gp++){var ga=Math.random()*TAU,gs=50+Math.random()*100;this.particles.spawn(p.x,p.y,Math.cos(ga)*gs,Math.sin(ga)*gs,0.6,'#ff8040',3);}
  } else {
    for(var sp=0;sp<9;sp++){var sa2=Math.random()*TAU,ss2=40+Math.random()*70;this.particles.spawn(p.x,p.y,Math.cos(sa2)*ss2,Math.sin(sa2)*ss2,0.7,'#5ac040',3);}
  }
  if(p.race==='sylvanid'&&p.kind==='stone'&&best.isUnit){
    best.slowT=3;best.slowMul=0.98;
  }
  if(best.isUnit&&(best.role==='melee'||best.role==='spear'||best.role==='elite'||best.role==='cav')){
    Audio.sfx('arrow_hit_shield',p.x,p.y);
  }
};

Game.prototype.doGather=function(u,dt){
  var g=u.gatherTarget;
  if(!g||g.dead||g.amount<=0||g.falling){
    u.gatherTarget=null;u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
    if(u.carrying) this.returnRes(u,dt);
    return;
  }
  if(u._waitingForMine){
    var usedW={};
    for(var mw=0;mw<this.units.length;mw++){
      var muw=this.units[mw];
      if(muw===u||muw.dead||muw.dying) continue;
      if(muw.gatherTarget!==g) continue;
      if(muw._mineSlot>=0&&muw._mineSlot<MAX_GATHER_PER_MINE) usedW[muw._mineSlot]=true;
    }
    var freeW=-1;
    for(var sw=0;sw<MAX_GATHER_PER_MINE;sw++){if(!usedW[sw]){freeW=sw;break;}}
    if(freeW>=0){u._waitingForMine=false;u._mineSlot=freeW;u.gatherProgress=0;}
    else return;
  }
  if(u.carrying&&u.carryAmt>=10){u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;this.returnRes(u,dt);return;}
  var dx=g.x-u.x,dy=g.y-u.y,d=Math.hypot(dx,dy),reach=g.radius+30;
  if(d>reach){
    u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
    u._path=null;u._pathIdx=0;
    var step=Math.min(u.spd*(u.slowMul||1)*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){
      var ang2=Math.atan2(dy,dx)+Math.PI/2,side=(u.id%2)?1:-1;
      if(!this._smartMove(u,Math.cos(ang2)*side,Math.sin(ang2)*side,step)){
        u._stuckTimer=(u._stuckTimer||0)+dt;
        if(u._stuckTimer>3){u._stuckTimer=0;u.gatherTarget=null;return;}
      }
    } else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;u.gatherProgress=0;u.gatherAnimT=0;u.chopT=0;
  } else {
    u.moving=false;
    if(g.kind==='gold'){
      u._insideMine=true;u._waitingForMine=false;
      if(u._mineSlot<0 || u._mineSlot>=MAX_GATHER_PER_MINE){
        var used={};
        for(var mi=0;mi<this.units.length;mi++){
          var mu=this.units[mi];
          if(mu===u||mu.dead||mu.dying) continue;
          if(mu.gatherTarget!==g) continue;
          if(mu._mineSlot>=0 && mu._mineSlot<MAX_GATHER_PER_MINE) used[mu._mineSlot]=true;
        }
        var freeSlot=-1;
        for(var s=0;s<MAX_GATHER_PER_MINE;s++){ if(!used[s]){freeSlot=s;break;} }
        if(freeSlot<0){
          u._mineSlot=-1;
          u._insideMine=false;u._waitingForMine=true;u._stuckTimer=0;u._stuckCheckTimer=0;u.moving=false;
          var waitAng=(u.id*0.71)%TAU;
          u.x=g.x+Math.cos(waitAng)*78;
          u.y=g.y+Math.sin(waitAng)*78;
          u.gatherProgress=0;u.chopT=0;
          return;
        }
        u._mineSlot=freeSlot;
      }
      var usedNow={};
      for(var mi2=0;mi2<this.units.length;mi2++){
        var mu2=this.units[mi2];
        if(mu2===u||mu2.dead||mu2.dying) continue;
        if(mu2.gatherTarget!==g||!mu2._insideMine) continue;
        if(mu2._mineSlot>=0&&mu2._mineSlot<MAX_GATHER_PER_MINE) usedNow[mu2._mineSlot]=true;
      }
      if(usedNow[u._mineSlot]&&u._mineSlot!==0){

  }

Game.prototype.returnRes=function(u,dt){
  u._insideMine=false;u._mineSlot=-1;u._waitingForMine=false;
  var th=null,bd=Infinity;
  var caryKind=u.carrying;
  for(var i=0;i<this.buildings.length;i++){
    var b=this.buildings[i];
    if(b.pid!==u.pid||b.dead) continue;
    var canDrop=(b.kind==='townhall')||(caryKind==='tree'&&b.kind==='lumber'&&b.completed);
    if(!canDrop) continue;
    var d=(b.x-u.x)*(b.x-u.x)+(b.y-u.y)*(b.y-u.y);
    if(d<bd){bd=d;th=b;}
  }
  if(!th){u.carrying=null;u.carryAmt=0;return;}
  var dx=th.x-u.x,dy=th.y-u.y,d=Math.sqrt(bd),reach=th.radius+40;
  if(d>reach){
    u._path=null;u._pathIdx=0;
    var step=Math.min(u.spd*(u.slowMul||1)*dt,d-reach+2);
    var moved=this._smartMove(u,dx,dy,step);
    if(!moved){u._stuckTimer=(u._stuckTimer||0)+dt;if(u._stuckTimer>4){u._stuckTimer=0;u.carrying=null;u.carryAmt=0;}} else u._stuckTimer=0;
    if(Math.abs(dx)>Math.abs(dy)) u.dir=dx>=0?DIR.RIGHT:DIR.LEFT;else u.dir=dy>=0?DIR.DOWN:DIR.UP;
    u.moving=true;
  } else {
    var cary=u.carrying;
    if(cary==='gold'){
      this.addRes(u.pid,u.carryAmt,0);
      if(this.stats[u.pid]) this.stats[u.pid].goldMined+=u.carryAmt;
      if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#ffe066'));
    } else if(cary==='tree'){
      this.addRes(u.pid,0,u.carryAmt);
      if(this.stats[u.pid]) this.stats[u.pid].woodMined+=u.carryAmt;
      if(u.owner==='player') this.floaters.push(new Floater(u.x,u.y-30,'+'+u.carryAmt,'#a08050'));
    }
    u.carrying=null;u.carryAmt=0;u._stuckTimer=0;
    if(cary==='gold'){
      var am=u._assignedMine;
      if(am&&!am.dead&&am.amount>0&&!am.falling) u.gatherTarget=am;
      else u.gatherTarget=null;
    } else {
      var nr=this.findNearestResource(u.x,u.y,'tree',u.pid);
      u.gatherTarget=nr||null;
    }
  }
};

Game.prototype.updateBuilding=function(b,dt){

  for(var _si=0;_si<this.buildings.length;_si++){

    Audio.sfx('building_destroy',b.x,b.y);

    for(var ui=0;ui<this.units.length;ui++){var u=this.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;if(u.demolishTarget===b) u.demolishTarget=null;}

    }
  }
  if(b.upgrading){b.upgradeTimeLeft-=dt;if(b.upgradeTimeLeft<=0){b.upgrading=false;b.level++;b.maxHp=Math.round(b.maxHp*1.25);b.hp=b.maxHp;if(b.owner==='player'){this.notify('Ратуша ур.'+b.level);Audio.sfx('upgrade',b.x,b.y);}}}
  if(b.techUpgrading){
    b.techUpgrading.timeLeft-=dt;
    if(b.techUpgrading.timeLeft<=0){
      var tr=b.techUpgrading.role,tst=b.techUpgrading.stat;
      var upg=this.getUnitUpgrades(b.pid,tr);
      if(upg[tst]<3) upg[tst]++;
      if(b.owner==='player'){this.notify(uName(b.race,tr)+' — '+t_(tst==='w'?'wUpg':'aUpg')+' ур.'+upg[tst]);Audio.sfx('upgrade',b.x,b.y);}
      b.techUpgrading=null;
    }
  }
  if(b.sawmillUpgrading){
    b.sawmillUpgradeTimeLeft-=dt;
    if(b.sawmillUpgradeTimeLeft<=0){
      b.sawmillUpgrading=false;
      b.sawmillLevel++;
      if(b.owner==='player'){this.notify('Лесопилка ур.'+b.sawmillLevel);Audio.sfx('sawmill_upgrade',b.x,b.y);}
    }
  }
};
Game.prototype.findEnemy=function(ent,range){
  var best=null,bestD=range*range;
  var cs=this.spatialCell,gx=(ent.x/cs)|0,gy=(ent.y/cs)|0,r=Math.ceil(range/cs);
  for(var dx=-r;dx<=r;dx++) for(var dy=-r;dy<=r;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var i=0;i<arr.length;i++){var u=arr[i];if(u.dead||u.dying||u.team===ent.team) continue;var d2=(u.x-ent.x)*(u.x-ent.x)+(u.y-ent.y)*(u.y-ent.y);if(d2<bestD){bestD=d2;best=u;}}
  }
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];if(b.dead||b.team===ent.team) continue;
    var d2b=(b.x-ent.x)*(b.x-ent.x)+(b.y-ent.y)*(b.y-ent.y),r2=b.radius+range;
    if(d2b<r2*r2&&d2b<bestD){bestD=d2b;best=b;}
  }
  return best;
};
Game.prototype.findNearestCreep=function(ent,range){var best=null,bestD=range*range;for(var i=0;i<this.creeps.length;i++){var c=this.creeps[i];if(c.dead||c.dying) continue;var d2=(c.x-ent.x)*(c.x-ent.x)+(c.y-ent.y)*(c.y-ent.y);if(d2<bestD){bestD=d2;best=c;}}return best;};
Game.prototype.findNearestResource=function(x,y,kind,pid){
  var best=null,bd=Infinity;
  var team=this.playerTeam;
  if(typeof pid==='number'){
    for(var s=0;s<this.config.slots.length;s++){
      if(s===pid){team=this.config.slots[s].team;break;}
    }
  }
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(!this.isExploredForTeam(team,r.x,r.y)) continue;
    if(kind&&r.kind!==kind) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-x)*(r.x-x)+(r.y-y)*(r.y-y);
    if(d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.findVisibleResourceForWorker=function(u,kind,radius){
  var best=null,bd=Infinity;
  var team=this.playerTeam;
  for(var s=0;s<this.config.slots.length;s++){
    if(s===u.pid){team=this.config.slots[s].team;break;}
  }
  radius=radius||900;
  var r2=radius*radius;
  for(var i=0;i<this.resources.length;i++){
    var r=this.resources[i];
    if(r.dead||r.amount<=0||r.falling) continue;
    if(r.kind!==kind) continue;
    if(!this.isVisibleForTeam(team,r.x,r.y)) continue;
    var nearEnemyBase=false;
    for(var bi=0;bi<this.buildings.length;bi++){
      var b=this.buildings[bi];
      if(b.dead||b.team===team) continue;
      if(Math.hypot(b.x-r.x,b.y-r.y)<520){nearEnemyBase=true;break;}
    }
    if(nearEnemyBase) continue;
    if(kind==='gold'&&this.countGatherers(r)>=MAX_GATHER_PER_MINE) continue;
    var d=(r.x-u.x)*(r.x-u.x)+(r.y-u.y)*(r.y-u.y);
    if(d<r2&&d<bd){bd=d;best=r;}
  }
  return best;
};
Game.prototype.separate=function(u){
  if(u._insideMine||u._waitingForMine) return;
  if(u._isSummon) return;
  var cs=this.spatialCell,gx=(u.x/cs)|0,gy=(u.y/cs)|0,px=0,py=0,cnt=0;
  var pushMul=(u.moving||u.target||u.moveTo)?1.0:0.35;
  outer:
  for(var dx=-2;dx<=2;dx++) for(var dy=-2;dy<=2;dy++){
    var arr=this.spatialGrid[(gx+dx)+','+(gy+dy)];if(!arr) continue;
    for(var oi=0;oi<arr.length;oi++){
      var o=arr[oi];if(o===u||o.dead||o.dying) continue;
      if(o._insideMine) continue;
      var ddx=u.x-o.x,ddy=u.y-o.y,d2=ddx*ddx+ddy*ddy,minD=u.radius+o.radius;
      if(d2<minD*minD&&d2>0.01){var d=Math.sqrt(d2),push=(minD-d)*0.5*pushMul;px+=ddx/d*push;py+=ddy/d*push;if(++cnt>4) break outer;}
    }
  }
  u.x+=px;u.y+=py;
  for(var bi=0;bi<this.buildings.length;bi++){
    var b=this.buildings[bi];
    if(b.dead||b.dying) continue;
    var bdx=u.x-b.x,bdy=u.y-b.y,bd2=bdx*bdx+bdy*bdy;
    var minBD=u.radius+b.radius*1.12;
    if(bd2<minBD*minBD&&bd2>0.01){
      var bd=Math.sqrt(bd2);
      var pushB=(minBD-bd)*1.0+0.3;
      u.x+=bdx/bd*pushB;u.y+=bdy/bd*pushB;
    }
  }
  var cs2=this.spatialCell,gx2=(u.x/cs2)|0,gy2=(u.y/cs2)|0;
  for(var rdx=-1;rdx<=1;rdx++) for(var rdy=-1;rdy<=1;rdy++){
    var rarr=this.resourceGrid[(gx2+rdx)+','+(gy2+rdy)];if(!rarr) continue;
    for(var ri2=0;ri2<rarr.length;ri2++){
      var rr2=rarr[ri2];
      if(rr2===u.gatherTarget) continue;
      if(rr2.dead||rr2.falling) continue;
      if(u.role==='worker'&&(u.gatherTarget||u._waitingForMine)) continue;
      var ddx2=u.x-rr2.x,ddy2=u.y-rr2.y,dd2=ddx2*ddx2+ddy2*ddy2;
      var rrad=(rr2.kind==='gold')?rr2.radius*0.25:22;
      var mind=u.radius+rrad;
      if(dd2<mind*mind&&dd2>0.01){
        var dd=Math.sqrt(dd2),push=(mind-dd)*0.9;
        u.x+=ddx2/dd*push;u.y+=ddy2/dd*push;
      }
    }
  }
};
Game.prototype.spawnParticles=function(x,y,color,n){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=40+Math.random()*100;this.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,0.4+Math.random()*0.3,color,2+Math.random()*3);}};
Game.prototype.notify=function(text){this.notifications.push({text:text,t:3.5});};
Game.prototype.stopSelected=function(){
  var count=0;
  for(var i=0;i<this.units.length;i++){var u=this.units[i];if(u.sel&&u.pid===this.playerPid&&!u.dying){u.target=null;u.lockedTarget=null;u.moveTo=null;u.attackMoveTo=null;u.patrolRoute=null;u.demolishTarget=null;u.moving=false;u._path=null;u._pathIdx=0;count++;}}
  return count;
};
Game.prototype.checkVictory=function(){
  var teams={};for(var i=0;i<this.config.slots.length;i++){var s=this.config.slots[i];if(s.type!=='empty') teams[s.team]=true;}
  var cnt=0;for(var k in teams) cnt++;if(cnt<2) return;
  var hasTH={};for(var bi=0;bi<this.buildings.length;bi++){var b=this.buildings[bi];if(b.kind==='townhall'&&!b.dead) hasTH[b.team]=true;}
  if(!hasTH[this.playerTeam]){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='lose';return;}
  var enemies=0;for(var k2 in teams){var t2=parseInt(k2);if(t2!==this.playerTeam&&hasTH[t2]) enemies++;}
  if(enemies===0){if(!this.gameOver){Audio.stopMusic();}this.gameOver=true;this.result='win';}
};

Game.prototype.castAbility=function(hero,abilId,forcedTarget){
  if(!hero.isHero||hero.dying) return;
  var list=hero.heroAbilities,ab=null,idx=-1;
  for(var i=0;i<list.length;i++) if(list[i].id===abilId){ab=list[i];idx=i;break;}
  if(!ab) return;
  var lvl=hero.abilityLevels[abilId]||0;
  if(lvl<=0||ab.type==='passive') return;
  if(ab.type==='ultimate'&&!hero.ultUnlocked) return;
  if(idx===0&&hero.cdA1>0) return;
  if(idx===1&&hero.cdA2>0) return;
  if(ab.type==='ultimate'&&hero.cdUlt>0) return;
  var cost=ab.mana||35;
  if((hero.mana||0)<cost){this.notify(t_('noMana'));Audio.sfx('error');return;}
  var cd=ab.cd*(1-0.1*lvl);
  function setCd(){if(ab.type==='ultimate') hero.cdUlt=ab.cd;else if(idx===0) hero.cdA1=cd;else if(idx===1) hero.cdA2=cd;}
  hero.mana-=cost;
  hero.castT=1;
  var self=this;
  function burst(x,y,color,n,spd,grav){
    for(var k=0;k<n;k++){
      var a=Math.random()*TAU,s=(spd||120)*(0.4+Math.random());
      self.particles.spawn(x,y,Math.cos(a)*s,Math.sin(a)*s-(grav||0),0.7+Math.random()*0.4,color,2.5+Math.random()*3);
    }
  }
  if(abilId==='holy_strike'){
    hero.holyStrikeBuff=true;hero.holyStrikeT=8;setCd();
    this.floaters.push(new Floater(hero.x,hero.y-55,t_('e_holy'),'#ffe9a8'));
    burst(hero.x,hero.y-20,'#ffe9a8',36,150,60);
    for(var hs=0;hs<8;hs++){var ha=(hs/8)*TAU,hr=10;
      this.particles.spawn(hero.x+Math.cos(ha)*hr,hero.y-20+Math.sin(ha)*hr,Math.cos(ha)*90,Math.sin(ha)*90-30,1.0,'#fff8d0',4);}
    Audio.sfx('abil_holy',hero.x,hero.y);
  }
  else if(abilId==='heal'){
    var tgt=forcedTarget;
    if(!tgt||tgt.team!==hero.team||tgt.dying){
      var low=null,ratio=1;
      for(var ii=0;ii<this.units.length;ii++){var uu=this.units[ii];if(uu.team!==hero.team||uu.dying) continue;if(Math.hypot(uu.x-hero.x,uu.y-hero.y)>ab.range) continue;var rt=uu.hp/uu.maxHp;if(rt<ratio){ratio=rt;low=uu;}}
      tgt=low;
    }
    if(tgt){
      var amt=80+40*lvl;tgt.hp=Math.min(tgt.maxHp,tgt.hp+amt);
      this.floaters.push(new Floater(tgt.x,tgt.y-30,'+'+amt,'#80ff80'));
      for(var hi2=0;hi2<28;hi2++){var ha2=Math.random()*TAU,hr2=30+Math.random()*60;
        this.particles.spawn(hero.x,hero.y-20,Math.cos(ha2)*80,Math.sin(ha2)*80-60,0.7,'#c8ffc8',3);}
      burst(tgt.x,tgt.y-15,'#80ff80',24,140,60);
      setCd();Audio.sfx('abil_heal_lum',hero.x,hero.y);
    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}
  }
  else if(abilId==='divine_shield'){
    hero.invulT=3;setCd();
    this.floaters.push(new Floater(hero.x,hero.y-55,'Щит','#ffe9a8'));
    burst(hero.x,hero.y-20,'#ffe9a8',48,180,80);
    for(var ds=0;ds<3;ds++){
      (function(ring){setTimeout(function(){
        for(var kk=0;kk<24;kk++){var a=(kk/24)*TAU;self.particles.spawn(hero.x+Math.cos(a)*12,hero.y-20+Math.sin(a)*12,Math.cos(a)*80,Math.sin(a)*80,0.6,'#fff8d0',3);}
      },ring*110);})(ds);
    }
    Audio.sfx('abil_shield',hero.x,hero.y);
  }
  else if(abilId==='rage'){
    hero.activeBuffT=5;hero.buffType='rage';setCd();
    this.floaters.push(new Floater(hero.x,hero.y-55,t_('e_rage'),'#ff5030'));
    burst(hero.x,hero.y-20,'#ff5030',28,170,50);
    Audio.sfx('abil_rage',hero.x,hero.y);
  }
  else if(abilId==='warcry'){
    for(var wi2=0;wi2<this.units.length;wi2++){var en=this.units[wi2];if(en.team===hero.team||en.dying) continue;if(Math.hypot(en.x-hero.x,en.y-hero.y)<ab.aoe){en.stunT=1.5;this.floaters.push(new Floater(en.x,en.y-25,'STUN','#ffff60'));}}
    for(var wi3=0;wi3<this.creeps.length;wi3++){var cr=this.creeps[wi3];if(cr.dying) continue;if(Math.hypot(cr.x-hero.x,cr.y-hero.y)<ab.aoe) cr.stunT=1.5;}
    setCd();
    for(var wr=0;wr<3;wr++){
      (function(rr){setTimeout(function(){
        for(var kk=0;kk<24;kk++){var a=(kk/24)*TAU,rad=30+rr*60;
          self.particles.spawn(hero.x+Math.cos(a)*rad,hero.y-15+Math.sin(a)*rad*0.4,Math.cos(a)*20,Math.sin(a)*10-10,0.7,'#ffb060',3.5);}
      },rr*100);})(wr);
    }
    Audio.sfx('abil_warcry',hero.x,hero.y);
  }
  else if(abilId==='spirits'){
    for(var si2=0;si2<3;si2++){
      var a4=(si2/3)*TAU;
      var sd={role:'melee',hp:180,dmg:22,range:50,spd:200,cd:1,cdBase:1,gold:0,wood:0,time:1};
      var sp=new Unit(hero.x+Math.cos(a4)*60,hero.y+Math.sin(a4)*60,hero.team,sd,hero.race);
      sp.owner=hero.owner;sp.pid=hero.pid;sp.spawnT=0;sp._isSummon=true;sp._summonT=30;
      this.units.push(sp);
      for(var sk=0;sk<20;sk++){var sa=Math.random()*TAU,sr=30+Math.random()*40;
        this.particles.spawn(hero.x+Math.cos(sa)*sr,hero.y-20+Math.sin(sa)*sr,Math.cos(sa)*40,Math.sin(sa)*40-40,1.0+Math.random()*0.5,'#a080ff',3.5);}
    }
    setCd();this.floaters.push(new Floater(hero.x,hero.y-55,'Духи','#a080ff'));Audio.sfx('abil_spirits',hero.x,hero.y);
  }
  else if(abilId==='moonfire'){
    var bst=forcedTarget;
    if(!bst){
      var bd=ab.range*ab.range;
      for(var mi3=0;mi3<this.units.length;mi3++){var en2=this.units[mi3];if(en2.team===hero.team||en2.dying) continue;var d2=Math.hypot(en2.x-hero.x,en2.y-hero.y);if(d2*d2<bd){bd=d2*d2;bst=en2;}}
      if(!bst) for(var mi4=0;mi4<this.creeps.length;mi4++){var cr2=this.creeps[mi4];if(cr2.dying) continue;var dc=Math.hypot(cr2.x-hero.x,cr2.y-hero.y);if(dc*dc<bd){bd=dc*dc;bst=cr2;}}
    }
    if(bst){
      var dmg=60+40*lvl;
      bst.hp-=dmg;bst.hitFlash=0.3;bst.lastAttacker=hero;
      this.projectiles.push(new Projectile(hero.x,hero.y-22,bst.x,bst.y-22,dmg,hero.team,hero.pid,'#a0d0ff',hero.race,'magic'));
      this.floaters.push(new Floater(bst.x,bst.y-25,'-'+dmg,'#a0d0ff'));
      for(var mk=0;mk<40;mk++){var ma=Math.random()*TAU,ms=120+Math.random()*120;
        this.particles.spawn(bst.x,bst.y-15,Math.cos(ma)*ms,Math.sin(ma)*ms-40,0.9,'#c8e8ff',3);}
      setCd();Audio.sfx('abil_moonfire',hero.x,hero.y);
    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}
  }
  else if(abilId==='entangle'){
    var bst2=forcedTarget;
    if(!bst2){
      var bd2=ab.range*ab.range;
      for(var ei2=0;ei2<this.units.length;ei2++){var en3=this.units[ei2];if(en3.team===hero.team||en3.dying) continue;var d3=Math.hypot(en3.x-hero.x,en3.y-hero.y);if(d3*d3<bd2){bd2=d3*d3;bst2=en3;}}
    }
    if(bst2){
      bst2.rootT=3;bst2.stunT=3;
      this.floaters.push(new Floater(bst2.x,bst2.y-25,'ROOT','#40a040'));
      for(var ek=0;ek<36;ek++){var ea=Math.random()*TAU,er=40+Math.random()*60;
        this.particles.spawn(bst2.x,bst2.y+6,Math.cos(ea)*er*0.5,Math.sin(ea)*er*0.5-40,1.0,'#40a040',3.5);}
      setCd();Audio.sfx('abil_entangle',hero.x,hero.y);
    } else {hero.mana+=cost;this.notify(t_('noTarget'));Audio.sfx('error');}
  }
  else if(abilId==='forest_wrath'){
    for(var fi3=0;fi3<2;fi3++){
      var a5=(fi3/2)*TAU;
      var td={role:'elite',hp:350,dmg:32,range:55,spd:110,cd:1.3,cdBase:1.3,gold:0,wood:0,time:1};
      var tr=new Unit(hero.x+Math.cos(a5)*70,hero.y+Math.sin(a5)*70,hero.team,td,hero.race);
      tr.owner=hero.owner;tr.pid=hero.pid;tr.spawnT=0;tr._isSummon=true;tr._summonT=45;
      this.units.push(tr);
    }
    setCd();this.floaters.push(new Floater(hero.x,hero.y-55,'Лес','#40ff40'));
    burst(hero.x,hero.y-20,'#40a040',30,140,60);Audio.sfx('abil_forest',hero.x,hero.y);
  }
};
