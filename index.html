AIController.prototype.tryTrain=function(){

AIController.prototype.tryAttack=function(){

AIController.prototype.tryExpand=function(){

AIController.prototype.heroLevelUp=function(){

AIController.prototype.helpAllies=function(){

function Renderer(canvas,game){
  this.cv=canvas;
  try{this.ctx=canvas.getContext('2d',{alpha:false});}
  catch(e){this.ctx=canvas.getContext('2d');}
  this.g=game;
  this.dpr=computeDPR();
  var self=this;this._rh=function(){self.resize();};
  window.addEventListener('resize',this._rh);
  this.resize();
  this._renderCamX=0;this._renderCamY=0;
}
function computeDPR(){
  var base=window.devicePixelRatio||1;
  if(Settings.quality==='low') return 1;
  if(Settings.quality==='high') return Math.min(2,Math.max(1,Math.round(base)));
  return 1;
}
Renderer.prototype.destroy=function(){window.removeEventListener('resize',this._rh);this.g=null;};
Renderer.prototype.resize=function(){
  if(!this.cv) return;
  this.w=this.cv.clientWidth||window.innerWidth;
  this.h=this.cv.clientHeight||window.innerHeight;
  this.cv.width=Math.floor(this.w*this.dpr);
  this.cv.height=Math.floor(this.h*this.dpr);
};
Renderer.prototype.w2s=function(wx,wy){
  var c=this.g.camera,rx=this._renderCamX!==undefined?this._renderCamX:c.x,ry=this._renderCamY!==undefined?this._renderCamY:c.y;
  return {x:Math.round((wx-rx)*c.zoom+this.w/2),y:Math.round((wy-ry)*c.zoom+this.h/2)};
};
Renderer.prototype.s2w=function(sx,sy){var c=this.g.camera;return{x:(sx-this.w/2)/c.zoom+c.x,y:(sy-this.h/2)/c.zoom+c.y};};
Renderer.prototype._legs=function(u,p,s){
  var def=getLeg(u.role);if(!def) return;
  var ctx=this.ctx,z=this.g.camera.zoom;
  var legW=def.w*s,legH=def.h*s,spread=def.spread*s;
  var cx=p.x,baseY=p.y+2*z,bodyBaseY=baseY-legH;
  var phase=(u.walkPhase||0)+u.walkOffset;
  var moving=u.moving&&!u.dying;
  var swing=moving?Math.sin(phase*1.6):0;
  if(u.role==='cav'||u.role==='siege'||u.role==='fly') return;

  this._oneLeg(ctx,backX,bodyBaseY,phase*1.6+Math.PI,true,legW,legH,moving);
  this._oneLeg(ctx,frontX,bodyBaseY,phase*1.6,false,legW,legH,moving);

UISys.prototype.drawPortrait=function(ent){
  var cv=this.$('portrait-canvas'),info=this.$('portrait-info');
  if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  var bgGrad=ctx.createLinearGradient(0,0,0,cv.height);
  bgGrad.addColorStop(0,'#1a2438');bgGrad.addColorStop(1,'#050810');
  ctx.fillStyle=bgGrad;ctx.fillRect(0,0,cv.width,cv.height);
  if(!ent){info.innerHTML='<div class="pname">—</div>';return;}
  try{
    if(ent.isUnit){
      var sp=bakeUnit(ent.race,ent.role,ent.team,DIR.DOWN);
      var pad=14;
      var s=Math.min((cv.width-pad*2)/sp.width,(cv.height-pad*2)/sp.height);
      var dw=sp.width*s,dh=sp.height*s,dx=(cv.width-dw)/2,dy=(cv.height-dh)/2;
      var legDef=getLeg(ent.role);
      if(legDef&&ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'){
        var legW=legDef.w*s*0.9,legH=legDef.h*s*0.85,legSpread=legDef.spread*s*0.8;
        var legBottomY=dy+dh,legTopY=legBottomY-legH,pcx=cv.width/2;
        ctx.fillStyle='#3a2010';ctx.strokeStyle='#0a0504';ctx.lineWidth=Math.max(0.5,s*0.6);
        ctx.fillRect(pcx-legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx-legSpread-legW/2,legTopY,legW,legH);
        ctx.fillRect(pcx+legSpread-legW/2,legTopY,legW,legH);ctx.strokeRect(pcx+legSpread-legW/2,legTopY,legW,legH);
      }
      ctx.drawImage(sp,dx,dy,dw,dh);
      if(ent.role!=='cav'&&ent.role!=='siege'&&ent.role!=='fly'&&Renderer_){
        var tempU={role:ent.role,race:ent.race,isHero:ent.isHero,team:ent.team,walkPhase:0,walkOffset:0,moving:false,attackT:0,chopT:0,castT:0,animT:0,x:0,y:0};
        var pObj={x:cv.width/2,y:dy+dh};
        var hand=Renderer_._armsCtx(ctx,tempU,pObj,s,false,1);
        if(hand){
          ctx.save();ctx.translate(hand.x,hand.y);
          Renderer_._mainW(ctx,ent.role,ent.race,0,0,0,s);
          ctx.restore();
        }
      }
      var name=ent.isHero?('⭐ '+t_('hero_'+ent.race)):t_(ent.role);
      var extra=ent.isHero?(' Ур.'+ent.level):'';
      info.innerHTML='<div class="pname">'+name+extra+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    } else {
      var sp2=bakeBuilding(ent.race,ent.kind,ent.team);
      var s2=Math.min((cv.width-16)/sp2.width,(cv.height-16)/sp2.height);
      ctx.drawImage(sp2,(cv.width-sp2.width*s2)/2,(cv.height-sp2.height*s2)/2,sp2.width*s2,sp2.height*s2);
      info.innerHTML='<div class="pname">'+t_(ent.kind)+'</div><div class="pstat">HP '+Math.ceil(ent.hp)+'/'+ent.maxHp+' · '+t_('team')+(ent.team+1)+'</div>';
    }
  }catch(e){ERR('drawPortrait',e);}
};

UISys.prototype.resurrectHero=function(b){

  if(res.gold<hd.gold||res.wood<hd.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerTeam,hd.gold,hd.wood);
  var sx=cl(b.x,30,g.W-30),sy=cl(b.y+b.radius+60,30,g.H-30);
  var u=new Unit(sx,sy,g.playerTeam,hd,dh.race);
  u.owner='player';u.spawnT=0;
  u.level=dh.level||1;u.exp=dh.exp||0;
  u.maxHp=hd.hp+70*(u.level-1);u.hp=u.maxHp;u.dmg=hd.dmg+5*(u.level-1);
  if(dh.abilityLevels) u.abilityLevels=JSON.parse(JSON.stringify(dh.abilityLevels));
  u.skillPoints=dh.skillPoints||0;u.ultUnlocked=!!dh.ultUnlocked;
  u.isHero=true;u._recalc();
  g.units.push(u);
  g.deadHeroes[g.playerTeam]=null;
  g.spawnParticles(sx,sy,'#ffe9a8',24);
  g.floaters.push(new Floater(sx,sy-40,'Ур.'+u.level,'#ffe9a8'));

};
UISys.prototype.showBuildMenu=function(){
  var box=this.$('actions');
  box.innerHTML='';box.dataset.menu='build';
  if(!Game_) return;
  var g=Game_,self=this,race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var rdef=RACES[race],thLvl=g.getTHLevel(g.playerTeam),list=BUILDING_UNLOCK[thLvl]||BUILDING_UNLOCK[1];
  for(var k=0;k<list.length;k++){
    (function(kind){
      var def=rdef.buildings[kind];if(!def) return;
      self.addAction(box,buildingIconImg(race,kind),t_(kind),self.costStr(def.gold,def.wood),function(){self.startPlacement(kind);});
    })(list[k]);
  }
  var back=document.createElement('button');
  back.className='act-btn';
  back.innerHTML='<div class="ico">'+toolIconImg('deselect')+'</div><div class="lbl">'+t_('back')+'</div>';
  back.onclick=function(){Audio.sfx('click');box.dataset.menu='';self.renderActions(true);};
  box.appendChild(back);
};
UISys.prototype.startPlacement=function(kind){
  if(!Game_) return;
  var g=Game_,race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var def=RACES[race].buildings[kind];if(!def) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.gold){g.notify(t_('nGold'));return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  this._placingKind=kind;this._placingRace=race;
  this.$('place-name').textContent=t_(kind);
  this.$('placement-bar').classList.add('show');
  var box=this.$('actions');
  box.innerHTML='';
  var cancel=document.createElement('button');
  cancel.className='act-btn';
  cancel.innerHTML='<div class="ico">'+toolIconImg('deselect')+'</div><div class="lbl">'+t_('cancel')+'</div>';
  cancel.onclick=function(){Audio.sfx('click');UI.cancelPlacement();};
  box.appendChild(cancel);box.dataset.menu='placing';
};
UISys.prototype.cancelPlacement=function(){
  this._placingKind=null;this._placingRace=null;
  var bar=this.$('placement-bar');if(bar) bar.classList.remove('show');
  var box=this.$('actions');
  if(box&&box.dataset.menu==='placing'){box.dataset.menu='';this.renderActions(true);}
};
UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;
  var g=Game_,size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  for(var i=0;i<g.buildings.length;i++){var ob=g.buildings[i],dx=ob.x-x,dy=ob.y-y,rr=ob.radius+size+8;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead) continue;var dx2=r.x-x,dy2=r.y-y,rr2=r.radius+size-6;if(dx2*dx2+dy2*dy2<rr2*rr2) return false;}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team!==g.playerTeam||b.owner!=='player') continue;if(Math.hypot(b.x-x,b.y-y)<700) return true;}
  return false;
};
UISys.prototype.tryPlaceAt=function(x,y){
  if(!this._placingKind||!Game_) return;
  var g=Game_,kind=this._placingKind,race=this._placingRace;
  if(!race){this.cancelPlacement();return;}
  var def=RACES[race].buildings[kind];if(!def){this.cancelPlacement();return;}
  if(!this.canPlaceAt(x,y,def)){g.notify(t_('cantBuild'));return;}
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.gold){g.notify(t_('nGold'));this.cancelPlacement();return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.team===g.playerTeam&&u2.owner==='player'&&u2.role==='worker'&&!u2.dying&&!u2.buildTarget&&!u2.gatherTarget&&!u2.carrying){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.team===g.playerTeam&&u3.owner==='player'&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t_('noWorker'));this.cancelPlacement();return;}
  g.subRes(g.playerTeam,def.gold,def.wood);
  var b=new Building(x,y,g.playerTeam,def,race);
  b.completed=false;b.buildProgress=0;b.owner='player';
  g.buildings.push(b);
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.demolishTarget=null;w.carrying=null;w.carryAmt=0;w.target=null;w.gatherAnimT=0;w.attackMoveTo=null;w.patrolRoute=null;w._stuckTimer=0;w._insideMine=false;
  Audio.sfx('build');this.cancelPlacement();
};
UISys.prototype.demolish=function(b){
  var g=Game_;if(!g||!b||b.kind==='townhall') return;
  if(!confirm('Отправить рабочего снести здание?')) return;
  var w=null;
  for(var ui=0;ui<g.units.length;ui++){var u=g.units[ui];if(u.team===g.playerTeam&&u.owner==='player'&&u.role==='worker'&&!u.dying){w=u;break;}}
  if(!w){g.notify(t_('noWorker'));return;}
  w.demolishTarget=b;w.buildTarget=null;w.repairTarget=null;w.gatherTarget=null;w._insideMine=false;
  this.refreshSelection();
};
UISys.prototype.upgradeTH=function(b){
  var g=Game_;if(!g||!b||b.upgrading||b.level>=3) return;
  var cost=TH_UPG[b.level];if(!cost) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);b.upgrading=true;b.upgradeTimeLeft=cost.time;
  Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.upgradeUnit=function(role,stat){
  var g=Game_;if(!g) return;
  var up=g.getUnitUpgrades(g.playerTeam,role);if(up[stat]>=3) return;
  var cost=UPGRADE_COST[up[stat]],res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);up[stat]++;Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.queueUnit=function(b,role){
  var g=Game_;if(!g||!b) return;
  var race=RACES[b.race];if(!race) return;
  var def=race.units[role];if(!def) return;
  var res=g.getRes(g.playerTeam),reserved=g.getReservedPop(g.playerTeam);
  if(b.queue.length>=10){g.notify(t_('queueFull'));return;}
  if(res.gold<def.gold){g.notify(t_('nGold'));return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  var foodCost=FOOD_COST[role]||1;
  if((res.food+reserved+foodCost)>res.maxFood){g.notify(t_('needHouse'));return;}
  if(role==='hero'){
    var alive=0;
    for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===g.playerTeam&&hu.owner==='player'&&!hu.dying) alive++;}
    if(alive>=1){g.notify(t_('heroExists'));return;}
    if(g.deadHeroes&&g.deadHeroes[g.playerTeam]&&g.deadHeroes[g.playerTeam].race===b.race){g.notify('Используйте Воскресить');return;}
  }
  g.subRes(g.playerTeam,def.gold,def.wood);
  b.queue.push({role:role,race:b.race,timeLeft:def.time,timeTotal:def.time});
  Audio.sfx('click');this.renderActions(true);
};
UISys.prototype.updateWorldTip=function(){
  var tip=this.$('world-tip');
  if(!tip||!Game_||!Renderer_) return;
  var show=Input.mouseInside||this._mobileTip;
  if(!show){tip.classList.remove('show');return;}
  var pick=Game_.pickScreen(Input.mouseX,Input.mouseY);
  var ent=pick.unit||pick.building||pick.resource;
  if(!ent){tip.classList.remove('show');return;}
  tip.classList.add('show');
  var tt='';
  if(pick.unit){
    var u=pick.unit;
    var name=u.isHero?('⭐ '+t_('hero_'+u.race)):t_(u.role);
    tt='<div class="tt-name">'+name+(u.isHero?' Ур.'+u.level:'')+' ('+t_('team')+(u.team+1)+')</div>';
    tt+='<div class="tt-row"><span>'+t_('tt_hp')+'</span><span>'+Math.ceil(u.hp)+'/'+u.maxHp+'</span></div>';
    tt+='<div class="tt-row"><span>'+t_('tt_dmg')+'</span><span>'+u.dmg+'</span></div>';
    tt+='<div class="tt-row"><span>'+t_('tt_range')+'</span><span>'+u.range+'</span></div>';
    tt+='<div class="tt-row"><span>'+t_('tt_spd')+'</span><span>'+u.spd+'</span></div>';
    tt+='<div class="tt-row"><span>'+t_('tt_food')+'</span><span>'+(FOOD_COST[u.role]||1)+'</span></div>';
    if(u.owner==='bot') tt+='<div class="tt-row"><span>Владелец</span><span>'+t_('bot')+'</span></div>';
  } else if(pick.building){
    var b=pick.building;
    tt='<div class="tt-name">'+t_(b.kind)+(b.completed?' Ур.'+b.level:' '+Math.floor((b.buildProgress/b.buildTime)*100)+'%')+'</div>';
    tt+='<div class="tt-row"><span>'+t_('tt_hp')+'</span><span>'+Math.ceil(b.hp)+'/'+b.maxHp+'</span></div>';
    if(b.atk) tt+='<div class="tt-row"><span>'+t_('tt_dmg')+'</span><span>'+b.atk+'</span></div>';
    if(b.rng) tt+='<div class="tt-row"><span>'+t_('tt_range')+'</span><span>'+b.rng+'</span></div>';
    if(b.kind==='house') tt+='<div class="tt-row"><span>'+t_('tt_food')+'</span><span>+8</span></div>';
    if(b.kind==='townhall') tt+='<div class="tt-row"><span>'+t_('tt_food')+'</span><span>+16</span></div>';
  } else if(pick.resource){
    var r=pick.resource;
    tt='<div class="tt-name">'+(r.kind==='gold'?t_('goldMine'):t_('treeRes'))+'</div>';
    tt+='<div class="tt-row"><span>'+t_('remaining')+'</span><span>'+Math.floor(r.amount)+'</span></div>';
  }
  tip.innerHTML=tt;
  var tx=Input.mouseX+16,ty=Input.mouseY+16;
  if(tx+270>Renderer_.w) tx=Input.mouseX-272;
  if(ty+140>Renderer_.h) ty=Input.mouseY-140;
  tip.style.left=tx+'px';tip.style.top=ty+'px';
};
UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerTeam);
    this.$('h-gold').textContent=Math.floor(res.gold);
    this.$('h-wood').textContent=Math.floor(res.wood);
    this.$('h-pop').textContent=res.food+'/'+res.maxFood;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
    }
    this.updateQueuePanel();
    this._mmTimer=(this._mmTimer||0)+1;
    if(this._mmTimer>=4){this._mmTimer=0;this.drawMinimap();}
    this._infoTimer=(this._infoTimer||0)+1;
    if(this._infoTimer>=12){this._infoTimer=0;this.refreshInfoOnly();}
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var self=this;
      setTimeout(function(){
        var go=self.$('gameover');
        self.$('go-title').textContent=g.result==='win'?t_('victory'):t_('defeat');
        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
      },1200);
      g.shake=2;
    }
  }catch(e){ERR('UI.update',e);}
};
UISys.prototype.updateQueuePanel=function(){
  if(!Game_) return;
  var g=Game_,selB=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.sel&&b.team===g.playerTeam&&b.owner==='player'&&b.queue.length>0) selB.push(b);}
  var panel=this.$('queue-panel'),list=this.$('queue-list');
  if(!selB.length){panel.classList.remove('show');return;}
  panel.classList.add('show');
  var b=selB[0];
  if(list.childElementCount!==b.queue.length){
    list.innerHTML='';
    for(var qi=0;qi<b.queue.length;qi++){
      var q=b.queue[qi];
      var item=document.createElement('div');item.className='q-item';
      var nm=document.createElement('div');nm.className='q-name';nm.style.display='flex';nm.style.alignItems='center';nm.style.gap='4px';
      nm.innerHTML=unitIconImg(b.race,q.role)+'<span>'+(q.role==='hero'?'Герой '+t_('hero_'+b.race):t_(q.role))+'</span>';
      var bar=document.createElement('div');bar.className='q-bar-bg';
      var fill=document.createElement('div');fill.className='q-bar-fill';fill.style.width='0%';
      bar.appendChild(fill);
      var wrap=document.createElement('div');wrap.style.flex='1';wrap.appendChild(nm);wrap.appendChild(bar);
      item.appendChild(wrap);
      var tm=document.createElement('div');tm.className='q-time';tm.textContent=Math.ceil(q.timeLeft)+'с';
      item.appendChild(tm);
      list.appendChild(item);
    }
  }
  var items=list.children;
  for(var qi2=0;qi2<Math.min(items.length,b.queue.length);qi2++){
    var q2=b.queue[qi2],it=items[qi2];
    var fillEl=it.querySelector('.q-bar-fill');
    if(fillEl){var pct=Math.max(0,Math.min(100,(1-q2.timeLeft/q2.timeTotal)*100));fillEl.style.width=pct+'%';}
    var tmEl=it.querySelector('.q-time');
    if(tmEl) tmEl.textContent=Math.max(0,Math.ceil(q2.timeLeft))+'с';
  }
};
UISys.prototype.pushNotif=function(text){
  var el=document.createElement('div');el.className='notif';el.textContent=text;
  this.$('notifications').appendChild(el);
  setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},3200);
};
UISys.prototype.drawMinimap=function(){
  var g=Game_;if(!g||!Renderer_) return;
  var cv=this.$('minimap'),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height,sx=W/g.W,sy=H/g.H;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
  var cs=g.fogCellSize,i,j;
  for(i=0;i<g.fogCols;i++) for(j=0;j<g.fogRows;j++){var f=g.fog[i+j*g.fogCols];if(f===2) continue;ctx.fillStyle=f===1?'rgba(0,0,0,0.55)':'rgba(0,0,0,0.92)';ctx.fillRect(i*cs*sx,j*cs*sy,cs*sx+0.5,cs*sy+0.5);}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||!g.isExplored(r.x,r.y)) continue;ctx.fillStyle=r.kind==='gold'?'#ffe066':'#2d5a2d';var sz=r.kind==='gold'?5:3;ctx.fillRect(r.x*sx-sz/2,r.y*sy-sz/2,sz,sz);}
  for(i=0;i<g.creeps.length;i++){var c=g.creeps[i];if(c.dead||!g.isExplored(c.x,c.y)) continue;ctx.fillStyle=c.isBoss?'#ff6060':'#8a3030';ctx.fillRect(c.x*sx-2,c.y*sy-2,4,4);}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.dead) continue;if(b.team!==g.playerTeam&&!g.isVisible(b.x,b.y)) continue;ctx.fillStyle=b.completed?teamColor(b.team):'#a08040';ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);}
  for(i=0;i<g.units.length;i++){var u=g.units[i];if(u.dead||u.dying) continue;if(u.team!==g.playerTeam&&!g.isVisible(u.x,u.y)) continue;ctx.fillStyle=u.isHero?'#ffe9a8':teamColor(u.team);var s2=u.isHero?5:3;ctx.fillRect(u.x*sx-s2/2,u.y*sy-s2/2,s2,s2);}
  var cam=g.camera,vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy,vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;
  ctx.strokeStyle='#e6c67a';ctx.lineWidth=2;ctx.strokeRect(vx,vy,vw,vh);
};

function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  if(!isFinite(dt)||dt<0) dt=0.016;
  dt=Math.min(0.1,dt);
  lastT=now;
  try{if(Game_&&!Game_.paused){Input.updateCamera(dt);Game_.update(dt*(Settings.gameSpeed||1));}}catch(e){ERR('update',e);}
  try{if(Renderer_&&Game_) Renderer_.draw();}catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  try{if(Game_&&UI) UI.updateWorldTip();}catch(e){ERR('tip',e);}
  requestAnimationFrame(loop);
}
function boot(){
  try{
    UI=new UISys();
    UI.applyLangUI();
    Input.init(document.getElementById('game'));
    document.addEventListener('visibilitychange',function(){
      if(document.hidden){Audio.pauseAll();}
      else{Audio.resume();}
    });
    window.addEventListener('blur',function(){Audio.pauseAll();});
    window.addEventListener('focus',function(){Audio.resume();});
    UI.showScreen('menu');
    requestAnimationFrame(loop);
  }catch(e){ERR('boot',e);showError('Load: '+e.message);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
