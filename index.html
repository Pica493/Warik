UISys.prototype.getActionsHash=function(){
  if(!Game_) return '';
  var g=Game_,parts=[];
  for(var i=0;i<g.units.length;i++){
    var u=g.units[i];
    if(u.sel&&u.team===g.playerTeam&&u.owner==='player'&&!u.dying)
      parts.push('u'+u.id+'|'+u.role+'|'+u.level+'|'+u.skillPoints+'|'+Math.floor(u.cdA1/0.5)+'|'+Math.floor(u.cdA2/0.5)+'|'+Math.floor(u.cdUlt/0.5));
  }
  for(var bi=0;bi<g.buildings.length;bi++){
    var b=g.buildings[bi];
    if(b.sel&&b.team===g.playerTeam&&b.owner==='player'){
      var q='';for(var qi=0;qi<b.queue.length;qi++) q+=b.queue[qi].role.charAt(0);
      parts.push('b'+b.id+'|'+b.kind+'|'+b.queue.length+'|'+q+'|'+(b.upgrading?1:0)+'|'+b.level);
    }
  }
  if(!parts.length) return '';
  var res=g.getRes(g.playerTeam);
  parts.push('r:'+Math.floor(res.gold/10)+','+Math.floor(res.wood/10));
  return parts.join(';');
};
UISys.prototype.renderActions=function(force){
  if(!Game_) return;
  var box=this.$('actions');
  if(!force&&(box.dataset.menu==='build'||box.dataset.menu==='placing')) return;
  box.innerHTML='';box.dataset.menu='';
  var g=Game_,sel=[],selB=[];
  for(var i=0;i<g.units.length;i++){var u=g.units[i];if(u.sel&&u.team===g.playerTeam&&u.owner==='player'&&!u.dying) sel.push(u);}
  for(var bi=0;bi<g.buildings.length;bi++){var b=g.buildings[bi];if(b.sel&&b.team===g.playerTeam&&b.owner==='player') selB.push(b);}
  var self=this;
  if(sel.length===1&&sel[0].isHero){
    var hero=sel[0],abils=hero.heroAbilities;
    for(var ai=0;ai<abils.length;ai++){
      (function(ab,abIdx){
        var lvl=hero.abilityLevels[ab.id]||0;
        var cd=0;
        if(ab.type==='passive') cd=0;
        else if(abIdx===0) cd=hero.cdA1;
        else if(abIdx===1) cd=hero.cdA2;
        else if(ab.type==='ultimate') cd=hero.cdUlt;
        var canUse=lvl>0&&cd<=0&&(ab.type!=='ultimate'||hero.ultUnlocked);
        var key=abIdx===0?'[Q] ':abIdx===1?'[E] ':ab.type==='ultimate'?'[R] ':'';
        var label=key+t_(ab.k)+(lvl>0?' '+lvl+'/3':'');
        if(ab.type==='ultimate'&&!hero.ultUnlocked) label+=' (закрыто)';
        var price=cd>0?Math.ceil(cd)+'с':'';
        self.addAction(box,'',label,price,function(){
          if(hero.skillPoints>0&&lvl<3){hero.abilityLevels[ab.id]=lvl+1;hero.skillPoints--;hero._recalc();self.renderActions(true);}
          else if(canUse){g.castAbility(hero,ab.id);self.renderActions(true);}
        },false,false,'',ab.type==='passive'?'ability':'ability');
      })(abils[ai],ai);
    }
    this.addAction(box,'',t_('all'),null,function(){g.selectAllCombat();});
    this.addAction(box,'',t_('workersAll'),null,function(){g.selectWorkers();});
    this.addAction(box,'',t_('deselect'),null,function(){g.deselectAll();});
  }
  else if(sel.length){
    var workers=[],fighters=[];
    for(i=0;i<sel.length;i++){if(sel[i].role==='worker') workers.push(sel[i]);else fighters.push(sel[i]);}
    if(workers.length){
      var race=null;
      for(i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
      if(race) this.addAction(box,'',t_('build'),null,function(){self.showBuildMenu();});
    }
    if(fighters.length){
      this.addAction(box,formationIconImg('attack'),'[A] A-move',null,function(){Input.pendingOrder='attack';self.showOrderBar(t_('atkMove'));},Input.pendingOrder==='attack');
      this.addAction(box,formationIconImg('stop'),'[S] Стоп',null,function(){g.stopSelected();});
      this.addAction(box,formationIconImg('patrol'),'[P] Патруль',null,function(){Input.pendingOrder='patrol';self.showOrderBar(t_('patrol'));},Input.pendingOrder==='patrol');
      this.addAction(box,formationIconImg('line'),t_('line'),null,function(){Input.formation='line';self.showHint(t_('line'),1);},Input.formation==='line');
      this.addAction(box,formationIconImg('column'),t_('column'),null,function(){Input.formation='column';self.showHint(t_('column'),1);},Input.formation==='column');
      this.addAction(box,formationIconImg('box'),t_('box'),null,function(){Input.formation='box';self.showHint(t_('box'),1);},Input.formation==='box'||!Input.formation);
      this.addAction(box,formationIconImg('hold'),t_('hold'),null,function(){g.setStance('hold');},fighters[0].stance==='hold');
    }
    this.addAction(box,'',t_('all'),null,function(){g.selectAllCombat();});
    this.addAction(box,'',t_('workersAll'),null,function(){g.selectWorkers();});
    this.addAction(box,'',t_('deselect'),null,function(){g.deselectAll();});
  }
  if(selB.length){
    var b2=selB[0];
    if(!b2.completed){
      var div=document.createElement('div');
      div.style.cssText='color:#a8c5d6;font-size:11px;padding:8px;text-align:center;grid-column:1/-1';
      div.textContent=Math.floor((b2.buildProgress/b2.buildTime)*100)+'%';
      box.appendChild(div);
    }
    if(b2.kind!=='townhall'&&b2.completed) this.addAction(box,'',t_('demolish'),null,function(){self.demolish(b2);});
    if(b2.completed&&b2.kind==='townhall'){
      var lvl=b2.level||1;
      if(lvl<3&&!b2.upgrading){
        var cost=TH_UPG[lvl],res=g.getRes(g.playerTeam);
        var can=res.gold>=cost.gold&&res.wood>=cost.wood;
        this.addAction(box,'',t_('upgrade')+' Ур.'+(lvl+1),cost.gold+'/'+cost.wood,
          function(){ self.upgradeTH(b2); }, false, !can);
      }
      var wdef=RACES[b2.race].units.worker;
      this.addAction(box,unitIconImg(b2.race,'worker'),t_('worker'),wdef.gold,function(){self.queueUnit(b2,'worker');});
    } else if(b2.completed){
      var thLvl=g.getTHLevel(g.playerTeam);
      var roles=[];
      var keys=Object.keys(UNIT_UNLOCK);
      for(i=0;i<keys.length;i++){
        var r=keys[i];var cfg=UNIT_UNLOCK[r];
        if(cfg.b!==b2.kind) continue;
        if(cfg.th>thLvl) continue;
        roles.push(r);
      }
      if(b2.kind==='forge'){
        for(var ui=0;ui<UPGRADE_ROLES.length;ui++){
          (function(role){
            var up=g.getUnitUpgrades(g.playerTeam,role),rdef=RACES[b2.race].units[role];
            if(!rdef) return;
            if(up.w<3){var cw=UPGRADE_COST[up.w];var canW=g.getRes(g.playerTeam).gold>=cw.gold;
              self.addAction(box,'',t_('wUpg')+' '+t_(role),cw.gold,function(){self.upgradeUnit(role,'w');},false,!canW);}
            if(up.a<3){var ca=UPGRADE_COST[up.a];var canA=g.getRes(g.playerTeam).gold>=ca.gold;
              self.addAction(box,'',t_('aUpg')+' '+t_(role),ca.gold,function(){self.upgradeUnit(role,'a');},false,!canA);}
          })(UPGRADE_ROLES[ui]);
        }
      }
      for(i=0;i<roles.length;i++){
        (function(r){
          var def=RACES[b2.race].units[r];if(!def) return;
          if(r==='hero'){
            var alive=0;
            for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===g.playerTeam&&hu.owner==='player'&&!hu.dying) alive++;}
            if(alive>=1) return;
            self.addAction(box,unitIconImg(b2.race,'hero'),t_('hero_'+b2.race),def.gold,function(){self.queueUnit(b2,'hero');});
          } else {
            var price=def.gold+(def.wood>0?' / '+def.wood:'');
            self.addAction(box,unitIconImg(b2.race,r),t_(r),price,function(){self.queueUnit(b2,r);});
          }
        })(roles[i]);
      }
    }
    if(b2.queue.length>0) this.addAction(box,'',t_('cancel'),b2.queue.length+'',function(){b2.queue.shift();self.renderActions(true);});
    this.addAction(box,'',t_('deselect'),null,function(){g.deselectAll();});
  }
};
UISys.prototype.showBuildMenu=function(){
  var box=this.$('actions');
  box.innerHTML='';box.dataset.menu='build';
  if(!Game_) return;
  var g=Game_,self=this,race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var rdef=RACES[race];
  var thLvl=g.getTHLevel(g.playerTeam);
  var list=BUILDING_UNLOCK[thLvl]||BUILDING_UNLOCK[1];
  for(var k=0;k<list.length;k++){
    (function(kind){
      var def=rdef.buildings[kind];if(!def) return;
      var price=def.gold+' / '+def.wood;
      self.addAction(box,buildingIconImg(race,kind),t_(kind),price,function(){self.startPlacement(kind);});
    })(list[k]);
  }
  var back=document.createElement('button');
  back.className='act-btn';
  back.innerHTML='<div class="ico"></div><div class="lbl">'+t_('back')+'</div>';
  back.onclick=function(){Audio.sfx('click');box.dataset.menu='';self.renderActions(true);};
  box.appendChild(back);
};
UISys.prototype.startPlacement=function(kind){
  if(!Game_) return;
  var g=Game_,race=null;
  for(var i=0;i<g.config.slots.length;i++){var s=g.config.slots[i];if(s.type==='player'&&s.team===g.playerTeam){race=s.race;break;}}
  if(!race) return;
  var def=RACES[race].buildings[kind];if(!def) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.gold){g.notify(t_('nGold'));return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  this._placingKind=kind;this._placingRace=race;
  this.$('place-name').textContent=t_(kind);
  this.$('placement-bar').classList.add('show');
  var box=this.$('actions');
  box.innerHTML='';
  var cancel=document.createElement('button');
  cancel.className='act-btn';
  cancel.innerHTML='<div class="ico"></div><div class="lbl">'+t_('cancel')+'</div>';
  cancel.onclick=function(){Audio.sfx('click');UI.cancelPlacement();};
  box.appendChild(cancel);box.dataset.menu='placing';
};
UISys.prototype.cancelPlacement=function(){
  this._placingKind=null;this._placingRace=null;
  var bar=this.$('placement-bar');if(bar) bar.classList.remove('show');
  var box=this.$('actions');
  if(box&&box.dataset.menu==='placing'){box.dataset.menu='';this.renderActions(true);}
};
UISys.prototype.canPlaceAt=function(x,y,def){
  if(!Game_) return false;
  var g=Game_,size=(def.size||3)*22;
  if(x<size||y<size||x>g.W-size||y>g.H-size) return false;
  for(var i=0;i<g.buildings.length;i++){var ob=g.buildings[i];var dx=ob.x-x,dy=ob.y-y,rr=ob.radius+size+8;if(dx*dx+dy*dy<rr*rr) return false;}
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead) continue;var dx2=r.x-x,dy2=r.y-y,rr2=r.radius+size-6;if(dx2*dx2+dy2*dy2<rr2*rr2) return false;}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.team!==g.playerTeam||b.owner!=='player') continue;if(Math.hypot(b.x-x,b.y-y)<700) return true;}
  return false;
};
UISys.prototype.tryPlaceAt=function(x,y){
  if(!this._placingKind||!Game_) return;
  var g=Game_,kind=this._placingKind,race=this._placingRace;
  if(!race){this.cancelPlacement();return;}
  var def=RACES[race].buildings[kind];if(!def){this.cancelPlacement();return;}
  if(!this.canPlaceAt(x,y,def)){g.notify(t_('cantBuild'));return;}
  var res=g.getRes(g.playerTeam);
  if(res.gold<def.gold){g.notify(t_('nGold'));this.cancelPlacement();return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));this.cancelPlacement();return;}
  var w=null;
  for(var i2=0;i2<g.units.length;i2++){var u2=g.units[i2];if(u2.sel&&u2.team===g.playerTeam&&u2.owner==='player'&&u2.role==='worker'&&!u2.dying&&!u2.buildTarget&&!u2.gatherTarget&&!u2.carrying){w=u2;break;}}
  if(!w){for(var i3=0;i3<g.units.length;i3++){var u3=g.units[i3];if(u3.team===g.playerTeam&&u3.owner==='player'&&u3.role==='worker'&&!u3.dying&&!u3.buildTarget&&!u3.repairTarget){w=u3;break;}}}
  if(!w){g.notify(t_('noWorker'));this.cancelPlacement();return;}
  g.subRes(g.playerTeam,def.gold,def.wood);
  var b=new Building(x,y,g.playerTeam,def,race);
  b.completed=false;b.buildProgress=0;b.owner='player';
  g.buildings.push(b);
  w.buildTarget=b;w.gatherTarget=null;w.moveTo=null;w.repairTarget=null;w.carrying=null;w.carryAmt=0;w.target=null;w.gatherAnimT=0;
  Audio.sfx('build');this.cancelPlacement();
};
UISys.prototype.demolish=function(b){
  var g=Game_;if(!g||!b||b.kind==='townhall') return;
  if(!confirm(t_('demolish')+'?')) return;
  g.addRes(g.playerTeam,Math.floor((b.costGold||0)*0.3),Math.floor((b.costWood||0)*0.3));
  for(var ui=0;ui<g.units.length;ui++){var u=g.units[ui];if(u.buildTarget===b) u.buildTarget=null;if(u.repairTarget===b) u.repairTarget=null;}
  b.dead=true;Audio.sfx('demolish');this.refreshSelection();
};
UISys.prototype.upgradeTH=function(b){
  var g=Game_;if(!g||!b||b.upgrading||b.level>=3) return;
  var cost=TH_UPG[b.level];if(!cost) return;
  var res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);
  b.upgrading=true;b.upgradeTimeLeft=cost.time;
  Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.upgradeUnit=function(role,stat){
  var g=Game_;if(!g) return;
  var up=g.getUnitUpgrades(g.playerTeam,role);
  if(up[stat]>=3) return;
  var cost=UPGRADE_COST[up[stat]],res=g.getRes(g.playerTeam);
  if(res.gold<cost.gold||res.wood<cost.wood){g.notify(t_('nGold'));return;}
  g.subRes(g.playerTeam,cost.gold,cost.wood);
  up[stat]++;Audio.sfx('upgrade');this.renderActions(true);
};
UISys.prototype.queueUnit=function(b,role){
  var g=Game_;if(!g||!b) return;
  var race=RACES[b.race];if(!race) return;
  var def=race.units[role];if(!def) return;
  var res=g.getRes(g.playerTeam);
  // Mixed queue: without shift, if queue has other role, replace; with shift, append
  var shift=!!Input.shiftDown;
  if(!shift&&b.queue.length>0&&b.queue[0].role!==role) b.queue=[];
  if(b.queue.length>=10){g.notify(t_('queueFull'));return;}
  if(res.gold<def.gold){g.notify(t_('nGold'));return;}
  if(res.wood<def.wood){g.notify(t_('nWood'));return;}
  if(res.pop>=res.maxPop&&role!=='worker'){g.notify(t_('needHouse'));return;}
  if(role==='hero'){
    var alive=0;
    for(var hi=0;hi<g.units.length;hi++){var hu=g.units[hi];if(hu.isHero&&hu.team===g.playerTeam&&hu.owner==='player'&&!hu.dying) alive++;}
    if(alive>=1){g.notify(t_('heroExists'));return;}
  }
  g.subRes(g.playerTeam,def.gold,def.wood);
  b.queue.push({role:role,race:b.race,timeLeft:def.time,timeTotal:def.time});
  Audio.sfx('click');this.renderActions(true);
};
UISys.prototype.update=function(){
  var g=Game_;if(!g) return;
  try{
    var res=g.getRes(g.playerTeam);
    this.$('h-gold').textContent=Math.floor(res.gold);
    this.$('h-wood').textContent=Math.floor(res.wood);
    this.$('h-pop').textContent=res.pop+'/'+res.maxPop;
    var mm=Math.floor(g.time/60),ss=Math.floor(g.time%60);
    this.$('h-time').textContent=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    while(g.notifications.length){var n=g.notifications.shift();this.pushNotif(n.text);}
    var box=this.$('actions');
    if(box.dataset.menu!=='build'&&box.dataset.menu!=='placing'){
      var hash=this.getActionsHash();
      if(hash!==this._lastActionsHash){this._lastActionsHash=hash;this.renderActions(true);}
    }
    this.updateQueuePanel();
    this._mmTimer=(this._mmTimer||0)+1;
    if(this._mmTimer>=4){this._mmTimer=0;this.drawMinimap();}
    if(g.gameOver&&!this._gameOverShown){
      this._gameOverShown=true;
      var self=this;
      setTimeout(function(){
        var go=self.$('gameover');
        self.$('go-title').textContent=g.result==='win'?t_('victory'):t_('defeat');
        self.$('go-sub').textContent=g.result==='win'?t_('vsub'):t_('dsub');
        go.classList.add('active');
        Audio.sfx(g.result==='win'?'victory':'defeat');
      },1200);
      g.shake=2;
    }
  }catch(e){ERR('UI.update',e);}
};
UISys.prototype.updateQueuePanel=function(){
  if(!Game_) return;
  var g=Game_,selB=[];
  for(var i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.sel&&b.team===g.playerTeam&&b.owner==='player'&&b.queue.length>0) selB.push(b);}
  var panel=this.$('queue-panel'),list=this.$('queue-list');
  if(!selB.length){panel.classList.remove('show');return;}
  panel.classList.add('show');
  var b=selB[0];
  if(list.childElementCount!==b.queue.length){
    list.innerHTML='';
    for(var qi=0;qi<b.queue.length;qi++){
      var q=b.queue[qi];
      var item=document.createElement('div');item.className='q-item';
      var nm=document.createElement('div');nm.className='q-name';nm.textContent=(q.role==='hero'?'Герой '+t_('hero_'+b.race):t_(q.role));
      var bar=document.createElement('div');bar.className='q-bar-bg';
      var fill=document.createElement('div');fill.className='q-bar-fill';fill.style.width='0%';
      bar.appendChild(fill);
      var wrap=document.createElement('div');wrap.style.flex='1';
      wrap.appendChild(nm);wrap.appendChild(bar);
      item.appendChild(wrap);
      var tm=document.createElement('div');tm.className='q-time';tm.textContent=Math.ceil(q.timeLeft)+'с';
      item.appendChild(tm);
      list.appendChild(item);
    }
  }
  var items=list.children;
  for(var qi2=0;qi2<Math.min(items.length,b.queue.length);qi2++){
    var q2=b.queue[qi2],it=items[qi2];
    var fillEl=it.querySelector('.q-bar-fill');
    if(fillEl){var pct=Math.max(0,Math.min(100,(1-q2.timeLeft/q2.timeTotal)*100));fillEl.style.width=pct+'%';}
    var tmEl=it.querySelector('.q-time');
    if(tmEl) tmEl.textContent=Math.max(0,Math.ceil(q2.timeLeft))+'с';
  }
};
UISys.prototype.pushNotif=function(text){
  var el=document.createElement('div');
  el.className='notif';el.textContent=text;
  this.$('notifications').appendChild(el);
  setTimeout(function(){if(el.parentNode) el.parentNode.removeChild(el);},3200);
};
UISys.prototype.drawMinimap=function(){
  var g=Game_;if(!g||!Renderer_) return;
  var cv=this.$('minimap'),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height,sx=W/g.W,sy=H/g.H;
  ctx.fillStyle='#1a2a1a';ctx.fillRect(0,0,W,H);
  var cs=g.fogCellSize,i,j;
  for(i=0;i<g.fogCols;i++) for(j=0;j<g.fogRows;j++){
    var f=g.fog[i+j*g.fogCols];
    if(f===2) continue;
    ctx.fillStyle=f===1?'rgba(0,0,0,0.55)':'rgba(0,0,0,0.92)';
    ctx.fillRect(i*cs*sx,j*cs*sy,cs*sx+0.5,cs*sy+0.5);
  }
  for(i=0;i<g.resources.length;i++){var r=g.resources[i];if(r.dead||!g.isExplored(r.x,r.y)) continue;ctx.fillStyle=r.kind==='gold'?'#ffe066':'#2d5a2d';var sz=r.kind==='gold'?5:3;ctx.fillRect(r.x*sx-sz/2,r.y*sy-sz/2,sz,sz);}
  for(i=0;i<g.creeps.length;i++){var c=g.creeps[i];if(c.dead||!g.isExplored(c.x,c.y)) continue;ctx.fillStyle=c.isBoss?'#ff6060':'#8a3030';ctx.fillRect(c.x*sx-2,c.y*sy-2,4,4);}
  for(i=0;i<g.buildings.length;i++){var b=g.buildings[i];if(b.dead) continue;if(b.team!==g.playerTeam&&!g.isVisible(b.x,b.y)) continue;ctx.fillStyle=b.completed?teamColor(b.team):'#a08040';ctx.fillRect(b.x*sx-3,b.y*sy-3,6,6);}
  for(i=0;i<g.units.length;i++){var u=g.units[i];if(u.dead||u.dying) continue;if(u.team!==g.playerTeam&&!g.isVisible(u.x,u.y)) continue;ctx.fillStyle=u.isHero?'#ffe9a8':teamColor(u.team);var s2=u.isHero?5:3;ctx.fillRect(u.x*sx-s2/2,u.y*sy-s2/2,s2,s2);}
  var cam=g.camera;
  var vx=(cam.x-Renderer_.w/2/cam.zoom)*sx,vy=(cam.y-Renderer_.h/2/cam.zoom)*sy;
  var vw=Renderer_.w/cam.zoom*sx,vh=Renderer_.h/cam.zoom*sy;
  ctx.strokeStyle='#e6c67a';ctx.lineWidth=2;ctx.strokeRect(vx,vy,vw,vh);
};

/* === BOOT === */
function loop(now){
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  if(!isFinite(dt)||dt<0) dt=0.016;
  dt=Math.min(0.1,dt);
  lastT=now;
  try{if(Game_&&!Game_.paused){Input.updateCamera(dt);Game_.update(dt);}}catch(e){ERR('update',e);}
  try{if(Renderer_&&Game_) Renderer_.draw();}catch(e){ERR('draw',e);}
  try{if(Game_&&UI) UI.update();}catch(e){ERR('UI',e);}
  requestAnimationFrame(loop);
}
function boot(){
  try{
    UI=new UISys();
    UI.applyLangUI();
    Input.init(document.getElementById('game'));
    UI.showScreen('menu');
    requestAnimationFrame(loop);
  }catch(e){ERR('boot',e);showError('Load: '+e.message);}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
</script>
